        <button class="btn ghost" style="flex:1" data-act="import">Import questions</button>
      </div>
    </section>

    <section class="panel">
      <div class="row" style="justify-content:space-between"><div class="label">Readiness by chapter</div><span class="mono" style="font-size:12px;color:var(--dim)">accuracy</span></div>
      <div class="ch-list" style="margin-top:10px">
        ${CHS.map(ch=>{ const o=st.per[ch]; const cov=pct(o.seen,o.total); const acc=o.att?pct(o.c,o.att):null;
          if(!o.total) return `<button class="ch-row missing" data-act="import"><span class="ch-num">${ch}</span><div style="min-width:0"><div class="ch-name">${CH[ch]}</div><div class="note" style="font-size:12px">Not in bank yet. Tap to import questions.</div></div><span class="ch-acc" style="color:var(--amber)">+</span></button>`;
          return `<button class="ch-row" data-act="drill" data-ch="${ch}"><span class="ch-num">${ch}</span><div style="min-width:0"><div class="ch-name">${CH[ch]}</div><div class="ch-bar"><i style="width:${cov}%"></i>${acc!==null?`<b style="width:${Math.round(cov*acc/100)}%;background:${accColor(acc)}"></b>`:""}</div></div><span class="ch-acc" style="color:${acc===null?"var(--faint)":accColor(acc)}">${acc===null?"—":acc+"%"}</span></button>`; }).join("")}
      </div>
      <div class="legend"><span><i style="background:var(--ice);opacity:.35"></i>bank covered</span><span><i style="background:var(--ok)"></i>answered correctly</span></div>
    </section>

    <section class="panel">
      <div class="label">Recent sessions</div>
      <div class="hist" style="margin-top:8px">
        ${histArr.length? histArr.map(h=>`<div class="hist-row"><div><div>${esc(MODES[h.m]?.label||h.m)}</div><div class="m">${new Date(h.ts).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})} · ${h.n} Q · ${fmtT(h.dur)}</div></div><span class="mono" style="color:var(--dim);font-size:13px">${h.c}/${h.n}</span><span class="score-pill ${pillCls(pct(h.c,h.n))}">${pct(h.c,h.n)}%</span></div>`).join("") : `<div class="empty">No sessions yet. A good first step is a Quick Quiz on Chapter 1, then a full mock exam to get a baseline.</div>`}
      </div>
    </section>
  </div>`;
  app.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click", ()=>{
    const a=b.dataset.act;
    if(a==="mock") startSession("mock", pickExam(EXAM_N), EXAM_SEC);
    else if(a==="resume"){ S=lsGet(LS_SESS); render(); ensureTick(); }
    else if(a==="discard"){ lsDel(LS_SESS); render(); }
    else if(a.startsWith("setup-")) go({v:"setup", mode:a.slice(6)});
    else if(a==="drill") go({v:"setup", mode:"drill", ch:+b.dataset.ch});
    else if(a==="stats") go({v:"stats"});
    else if(a==="import") go({v:"import"});
  }));
}

function renderSetup(mode){
  const counts=chCounts(); const avail=CHS.filter(ch=>counts[ch]>0);
  const st = {n: mode==="sprint"?10:10, chs: mode==="drill" ? [route.ch||avail[0]] : avail.slice()};
  const isFix = mode==="fix";
  const titles={quiz:["Quick Quiz","Instant feedback after every answer: the correct option, why each wrong option is wrong, and where to find it in the book."],
    sprint:["Exam-Pace Sprint","A timed block at exam pace (1:30 per question). No feedback until you submit, just like the real exam."],
    fix:["Fix Mistakes","Questions you got wrong the last time you saw them. Get one right and it leaves this list."],
    drill:["Chapter Drill","Work through one chapter with instant feedback. Unseen questions come first."]};
  const draw=()=>{
    const pool = isFix ? mistakes().filter(q=>st.chs.includes(+q.ch)) : poolFor(st.chs);
    const sizes = mode==="sprint" ? [10,20,30,50] : [5,10,20,30];
    const unseenN = pool.filter(q=>!prog[q.id]).length;
    app.innerHTML = `<div class="setup stack">
      <button class="back" data-act="home">‹ Console</button>
      <div><h2>${titles[mode][0]}</h2><p class="sub">${titles[mode][1]}</p></div>
      <div class="panel stack">
        <div class="field"><div class="label">${mode==="drill"?"Chapter":"Chapters"}</div>
          <div class="chips">${CHS.map(ch=>{ const n = isFix ? mistakes().filter(q=>+q.ch===ch).length : counts[ch]; return `<button class="chip" data-ch="${ch}" aria-pressed="${st.chs.includes(ch)}" ${n?"":"disabled"}>Ch ${ch} <span class="n">${n}</span></button>`; }).join("")}</div>
          ${mode!=="drill"?`<div class="row"><button class="toggle-all" data-act="all">Select all</button><button class="toggle-all" data-act="none">Clear</button></div>`:""}
        </div>
        <div class="field"><div class="label">Questions</div>
          <div class="chips">${sizes.map(s=>`<button class="chip" data-n="${s}" aria-pressed="${st.n===s}">${s}${mode==="sprint"?` <span class="n">${fmtT(s*PACE)}</span>`:""}</button>`).join("")}<button class="chip" data-n="999" aria-pressed="${st.n===999}">All <span class="n">${pool.length}</span></button></div>
        </div>
        <div class="callout">${pool.length} questions match · ${unseenN} you haven't seen yet${mode==="sprint"?` · time limit ${fmtT(Math.min(st.n,pool.length)*PACE)}`:""}</div>
        <button class="btn primary wide" data-act="go" ${pool.length?"":"disabled"}>Start ${Math.min(st.n,pool.length)} questions</button>
      </div></div>`;
    app.querySelectorAll("[data-ch]").forEach(b=>b.addEventListener("click",()=>{ const ch=+b.dataset.ch; if(mode==="drill") st.chs=[ch]; else st.chs = st.chs.includes(ch)? st.chs.filter(x=>x!==ch) : st.chs.concat(ch); draw(); }));
    app.querySelectorAll("[data-n]").forEach(b=>b.addEventListener("click",()=>{ st.n=+b.dataset.n; draw(); }));
    app.querySelector("[data-act=home]").addEventListener("click",()=>go({v:"home"}));
    app.querySelector("[data-act=all]")?.addEventListener("click",()=>{ st.chs=CHS.filter(ch=>(isFix?mistakes().some(q=>+q.ch===ch):counts[ch]>0)); draw(); });
    app.querySelector("[data-act=none]")?.addEventListener("click",()=>{ st.chs=[]; draw(); });
    app.querySelector("[data-act=go]").addEventListener("click",()=>{
      const n=Math.min(st.n,pool.length);
      const qs = isFix ? shuffle(pool.slice()).slice(0,n) : shuffle(prioritized(pool).slice(0,n));
      startSession(mode, qs, mode==="sprint" ? n*PACE : null);
    });
  };
  draw();
}

/* ---------- question ---------- */
function optHTML(q, it, reveal, open){
  return `<div class="opts" role="${reveal?"list":"radiogroup"}" aria-label="Answer options">${it.order.map((oi,pos)=>{
    let cls="opt", verdict="";
    if(reveal){
      if(oi===0){ cls+=" ok"; verdict = it.pick===0?"Your answer · correct":"Correct answer"; }
      else if(oi===it.pick){ cls+=" bad"; verdict="Your answer"; }
      else { cls+=" dist"; verdict="Why wrong"; }
      const isOpen = open || oi===0 || oi===it.pick;
      if(isOpen) cls+=" open";
      const label = oi===0 ? "Why this is correct" : "Why this is wrong";
      const why = q.w && q.w[oi] ? q.w[oi] : (oi===0 ? "This is the keyed correct answer." : "Not the keyed answer.");
      return `<div class="${cls}" data-oi="${oi}" role="listitem"><button class="opt-head" data-toggle="${oi}" aria-expanded="${isOpen}"><span class="key">${LET[pos]}</span><span class="otext">${esc(q.o[oi])}</span><span class="verdict">${verdict}</span></button><div class="why" ${isOpen?"":"hidden"}><span class="wlabel">${label}</span>${esc(why)}</div></div>`;
    }
    if(it.pick===oi) cls+=" sel";
    return `<div class="${cls}"><button class="opt-head" role="radio" aria-checked="${it.pick===oi}" data-pick="${oi}"><span class="key">${LET[pos]}</span><span class="otext">${esc(q.o[oi])}</span><span></span></button></div>`;
  }).join("")}</div>`;
}
function refHTML(q){ return `<div class="ref">${ICON.book}<div><b>Find it in the book</b><span>${esc(q.r||("Chapter "+q.ch))}</span></div></div>`; }
function wireOpts(root, it){
  root.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>{
    const box=b.parentElement; const w=box.querySelector(".why"); const open=w.hidden; w.hidden=!open; box.classList.toggle("open",open); b.setAttribute("aria-expanded",open);
  }));
}

function renderQuestion(){
  const it=S.items[S.i]; const q=byId(it.id);
  if(!q){ S.items.splice(S.i,1); if(!S.items.length){ S=null; persistSession(); return go({v:"home"}); } S.i=Math.min(S.i,S.items.length-1); return renderQuestion(); }
  const fb=MODES[S.mode].feedback; const reveal = fb==="instant" && it.checked;
  const total=S.items.length; const last=S.i===total-1;
  const trackCls = (x,k)=>{ if(k===S.i) return "cur"; if(fb==="instant" && x.checked) return x.pick===0?"c":"w"; return x.pick!==null?"a":""; };
  app.innerHTML = `
  <div class="qtop">
    <div class="qbar">
      <div class="qid"><span class="qmode">${MODES[S.mode].label}</span><span class="qcount">Q ${S.i+1} of ${total}</span></div>
      <div class="hud-spacer"></div>
      <span class="timer" id="timer">${S.limit?fmtT(remaining()):fmtT(elapsed())}</span>
      ${fb==="end"?`<button class="iconbtn" id="flag" aria-pressed="${it.flag}" aria-label="Flag for review">${ICON.flag}</button><button class="iconbtn" id="nav" aria-label="All questions">${ICON.grid}</button>`:""}
      <button class="iconbtn" id="quit" aria-label="End session">${ICON.x}</button>
    </div>
    <div class="track">${total<=60?S.items.map((x,k)=>`<i class="${trackCls(x,k)}"></i>`).join(""):`<i class="a" style="flex:${S.i+1}"></i><i style="flex:${total-S.i-1}"></i>`}</div>
    ${S.limit?`<div class="pace" id="pace"></div>`:`<div style="height:8px"></div>`}
  </div>
  <div class="qwrap">
    <div class="qmeta"><span class="tag amber">CH ${q.ch}</span><span class="tag">${esc(CH[q.ch]||"")}</span>${q.custom?`<span class="tag">Imported</span>`:""}${prog[q.id]?`<span class="tag" style="color:var(--dim);border-color:var(--wire-2);background:none">seen ${prog[q.id][0]}×</span>`:""}</div>
    ${reveal?`<div class="result-banner ${it.pick===0?"ok":"bad"}">${it.pick===0?"Correct":"Not quite"} <span class="mono" style="color:var(--dim);font-weight:400;letter-spacing:0;text-transform:none">· tap any option to see why</span></div>`:""}
    <p class="qtext">${esc(q.q)}</p>
    ${optHTML(q,it,reveal,S.openAll)}
    ${reveal?`<button class="toggle-all" id="openall">${S.openAll?"Collapse explanations":"Show every explanation"}</button>${refHTML(q)}`:""}
    <div class="kbd-hint">Keys: 1–4 or A–D to choose · Enter ${fb==="instant"?"to check / continue":"for next"} · ← → move${fb==="end"?" · F flag":""}</div>
  </div>
  <div class="actions"><div class="actions-in">
    ${fb==="end"
      ? `<button class="btn ghost narrow" id="prev" ${S.i===0?"disabled":""}>‹ Prev</button>
         ${last?`<button class="btn primary" id="submit">Submit ${S.mode==="mock"?"exam":"sprint"}</button>`:`<button class="btn ${it.pick!==null?"primary":""}" id="next">Next ›</button>`}`
      : reveal
        ? `<button class="btn primary" id="cont">${last?"See results":"Next question ›"}</button>`
        : `<button class="btn ghost narrow" id="skip">Skip</button><button class="btn primary" id="check" ${it.pick===null?"disabled":""}>Check answer</button>`}
  </div></div>`;
  updatePace();
  app.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.pick)));
  wireOpts(app,it);
  $("#openall")?.addEventListener("click",()=>{ S.openAll=!S.openAll; persistSession(); renderQuestion(); });
  $("#prev")?.addEventListener("click",()=>move(-1));
  $("#next")?.addEventListener("click",()=>move(1));
  $("#submit")?.addEventListener("click",confirmSubmit);
  $("#check")?.addEventListener("click",check);
  $("#cont")?.addEventListener("click",()=> last ? finish(false) : move(1));
  $("#skip")?.addEventListener("click",()=>{ if(last) finish(false); else { S.items.push(S.items.splice(S.i,1)[0]); persistSession(); renderQuestion(); } });
  $("#flag")?.addEventListener("click",()=>{ it.flag=!it.flag; persistSession(); renderQuestion(); });
  $("#nav")?.addEventListener("click",openNav);
  $("#quit").addEventListener("click",confirmLeave);
}
function choose(oi){
  const it=S.items[S.i];
  if(MODES[S.mode].feedback==="instant" && it.checked) return;
  it.pick=oi; persistSession(); renderQuestion();
}
function check(){
  const it=S.items[S.i]; if(it.pick===null||it.checked) return;
  it.checked=true; record(it.id, it.pick===0); saveLocal(); persistSession(); renderQuestion();
  window.scrollTo({top:0,behavior:"smooth"});
}
function move(d){ const n=S.i+d; if(n<0||n>=S.items.length) return; S.i=n; persistSession(); renderQuestion(); window.scrollTo(0,0); }

function modal(html, wire){
  layer.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") layer.innerHTML=""; });
  wire(layer);
  const f=layer.querySelector("button"); f&&f.focus();
}
function openNav(){
  modal(`<h3>All questions</h3><p>Tap a number to jump. Filled = answered, dot = flagged.</p>
    <div class="navgrid">${S.items.map((x,k)=>`<button data-j="${k}" class="${x.pick!==null?"ans":""} ${x.flag?"flg":""} ${k===S.i?"cur":""}">${k+1}</button>`).join("")}</div>
    <button class="btn wide" data-close>Back to question</button>`, l=>{
      l.querySelectorAll("[data-j]").forEach(b=>b.addEventListener("click",()=>{ S.i=+b.dataset.j; layer.innerHTML=""; persistSession(); renderQuestion(); window.scrollTo(0,0); }));
      l.querySelector("[data-close]").addEventListener("click",()=>layer.innerHTML="");
    });
}
function confirmSubmit(){
  const un=S.items.filter(x=>x.pick===null).length, fl=S.items.filter(x=>x.flag).length;
  modal(`<h3>Submit now?</h3><p>${un?`<b style="color:var(--amber)">${un} unanswered</b> (they count as wrong). `:"Every question answered. "}${fl?`${fl} flagged for review. `:""}${S.limit?`Time left ${fmtT(remaining())}.`:""}</p>
    <div class="row"><button class="btn ghost" style="flex:1" data-review>${un||fl?"Review first":"Keep working"}</button><button class="btn primary" style="flex:1" data-go>Submit</button></div>`, l=>{
      l.querySelector("[data-go]").addEventListener("click",()=>{ layer.innerHTML=""; finish(false); });
      l.querySelector("[data-review]").addEventListener("click",()=>{ layer.innerHTML=""; if(un||fl) openNav(); });
    });
}
function confirmLeave(){
  const fb=MODES[S.mode].feedback;
  modal(`<h3>End this session?</h3><p>${fb==="end"?"Submit to grade what you've answered, or discard it without saving.":"Answers you've already checked are saved. Finish now to see your results."}</p>
    <div class="stack"><button class="btn primary wide" data-fin>${fb==="end"?"Submit & grade":"Finish & see results"}</button>
    <button class="btn danger wide" data-discard>Discard session</button><button class="btn ghost wide" data-close>Keep going</button></div>`, l=>{
      l.querySelector("[data-fin]").addEventListener("click",()=>{ layer.innerHTML=""; finish(false); });
      l.querySelector("[data-discard]").addEventListener("click",()=>{ layer.innerHTML=""; clearInterval(tick); S=null; persistSession(); saveLocal(); Sync.flush(); go({v:"home"}); });
      l.querySelector("[data-close]").addEventListener("click",()=>layer.innerHTML="");
    });
}

/* ---------- results ---------- */
function renderResults(){
  const r=S.result; const p=pct(r.c,r.n); const fb=MODES[S.mode].feedback;
  const items = S.items.filter(it=> byId(it.id) && (fb==="end" || it.checked));
  const ch={}; items.forEach(it=>{ const q=byId(it.id); ch[q.ch]=ch[q.ch]||[0,0]; ch[q.ch][1]++; if(it.pick===0) ch[q.ch][0]++; });
  const dur=Math.round((S.end-S.start)/1000);
  const C=2*Math.PI*70, col=accColor(p);
  const filt = S.filter||"all";
  const shown = items.map((it,k)=>({it,k})).filter(({it})=> filt==="all" || (filt==="wrong" && it.pick!==0) || (filt==="flag" && it.flag));
  app.innerHTML = `
  <button class="back" data-act="home">‹ Console</button>
  <div class="res-head">
    <div class="gauge"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="70" stroke="var(--wire)" stroke-width="10" fill="none"/><circle cx="80" cy="80" r="70" stroke="${col}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"/></svg><div class="v"><div><b style="color:${col}">${p}%</b><span>${r.c} of ${r.n} correct</span></div></div></div>
    <div class="stack">
      <div><div class="label">${MODES[S.mode].label}${r.timeout?" · time expired":""}</div><h2 class="disp" style="font-size:1.5rem;margin-top:6px">${p>=80?"Exam-ready on this set":p>=65?"Close. Tighten the weak chapters":"Keep drilling. Review the misses below"}</h2></div>
      <div class="kv"><div><b>${fmtT(dur)}</b><span>Time used</span></div><div><b>${r.n?fmtT(dur/r.n):"—"}</b><span>Per question</span></div><div><b>${r.n-r.c}</b><span>To review</span></div></div>
    </div>
  </div>
  <section class="panel" style="margin-top:16px">
    <div class="label">By chapter</div>
    <div class="ch-list" style="margin-top:8px">${Object.keys(ch).sort((a,b)=>a-b).map(k=>{ const a=pct(ch[k][0],ch[k][1]); return `<div class="ch-row"><span class="ch-num">${k}</span><div style="min-width:0"><div class="ch-name">${CH[k]}</div><div class="ch-bar"><b style="width:${a}%;background:${accColor(a)}"></b></div></div><span class="ch-acc" style="color:${accColor(a)}">${ch[k][0]}/${ch[k][1]}</span></div>`; }).join("")}</div>
  </section>
  <section style="margin-top:20px">
    <div class="row" style="justify-content:space-between"><h2 class="disp" style="font-size:1.2rem">Review</h2></div>
    <div class="tabs">
      <button class="chip" data-f="wrong" aria-pressed="${filt==="wrong"}">Wrong <span class="n">${items.filter(i=>i.pick!==0).length}</span></button>
      ${fb==="end"?`<button class="chip" data-f="flag" aria-pressed="${filt==="flag"}">Flagged <span class="n">${items.filter(i=>i.flag).length}</span></button>`:""}
      <button class="chip" data-f="all" aria-pressed="${filt==="all"}">All <span class="n">${items.length}</span></button>
    </div>
    <div id="rev">${shown.length? shown.map(({it,k})=>{ const q=byId(it.id); const st = it.pick===null?"skip":it.pick===0?"ok":"bad";
      return `<div class="rev-item" data-k="${k}"><button class="rev-q" aria-expanded="false"><span class="n">${k+1}</span><span class="t">${esc(q.q)}</span><span class="dot ${st}" title="${st==="ok"?"Correct":st==="bad"?"Wrong":"Unanswered"}"></span></button><div class="rev-body" hidden></div></div>`; }).join("") : `<div class="empty">Nothing in this filter.</div>`}</div>
  </section>
  <div class="actions"><div class="actions-in"><button class="btn ghost" data-act="home2">Console</button>${items.some(i=>i.pick!==0)?`<button class="btn primary" data-act="retry">Retry the misses</button>`:`<button class="btn primary" data-act="again">Another round</button>`}</div></div>`;
  app.querySelector("[data-act=home]").addEventListener("click",()=>go({v:"home"}));
  app.querySelector("[data-act=home2]").addEventListener("click",()=>go({v:"home"}));
  app.querySelector("[data-act=retry]")?.addEventListener("click",()=>{ const qs=items.filter(i=>i.pick!==0).map(i=>byId(i.id)); S=null; startSession("fix", shuffle(qs)); });
  app.querySelector("[data-act=again]")?.addEventListener("click",()=>{ const m=S.mode; S=null; if(m==="mock") startSession("mock", pickExam(EXAM_N), EXAM_SEC); else go({v:"setup",mode:m==="fix"?"quiz":m}); ensureTick(); });
  app.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{ S.filter=b.dataset.f; renderResults(); }));
  app.querySelectorAll(".rev-item").forEach(el=>{
    const btn=el.querySelector(".rev-q"), body=el.querySelector(".rev-body");
    btn.addEventListener("click",()=>{
      const open=body.hidden; body.hidden=!open; btn.setAttribute("aria-expanded",open);
      if(open && !body.dataset.f){ const it=items[+el.dataset.k]; const q=byId(it.id); body.dataset.f=1;
        body.innerHTML=`<div class="qmeta"><span class="tag amber">CH ${q.ch}</span>${it.pick===null?`<span class="tag" style="color:var(--amber)">Unanswered</span>`:""}${it.flag?`<span class="tag amber">Flagged</span>`:""}</div>${optHTML(q,it,true,false)}${refHTML(q)}`; wireOpts(body,it); }
    });
  });
}

/* ---------- stats ---------- */
function renderStats(){
  const st=stats(); const all=Object.values(hist).sort((a,b)=>b.ts-a.ts);
  const mocks=all.filter(h=>h.m==="mock");
  app.innerHTML = `<div class="setup stack" style="max-width:820px">
    <button class="back" data-act="home">‹ Console</button>
    <div><h2>Progress & history</h2><p class="sub">${Sync.mode==="cloud"?"Synced across every device you open this on.":"Saved in this browser."}</p></div>
    <div class="kv"><div><b>${st.seen}/${st.tot}</b><span>Seen</span></div><div><b>${st.att?pct(st.c,st.att):0}%</b><span>Accuracy</span></div><div><b>${mocks.length}</b><span>Mock exams</span></div></div>
    <section class="panel"><div class="label">Chapters</div>
      <div style="overflow-x:auto;margin-top:8px"><table style="width:100%;border-collapse:collapse;font-size:14px;min-width:420px">
        <thead><tr style="text-align:left;color:var(--dim)"><th style="padding:6px 4px;font-weight:500">Ch</th><th style="padding:6px 4px;font-weight:500">Topic</th><th class="mono" style="padding:6px 4px;font-weight:500;text-align:right">Seen</th><th class="mono" style="padding:6px 4px;font-weight:500;text-align:right">Accuracy</th></tr></thead>
        <tbody>${CHS.map(ch=>{ const o=st.per[ch]; const a=o.att?pct(o.c,o.att):null; return `<tr style="border-top:1px solid var(--wire)"><td class="mono" style="padding:8px 4px;color:var(--amber)">${ch}</td><td style="padding:8px 4px">${CH[ch]}</td><td class="mono" style="padding:8px 4px;text-align:right">${o.seen}/${o.total}</td><td class="mono" style="padding:8px 4px;text-align:right;color:${a===null?"var(--faint)":accColor(a)}">${a===null?"—":a+"%"}</td></tr>`; }).join("")}</tbody></table></div>
    </section>
    <section class="panel"><div class="label">All sessions</div><div class="hist" style="margin-top:8px">
      ${all.length? all.map(h=>`<div class="hist-row"><div><div>${esc(MODES[h.m]?.label||h.m)}</div><div class="m">${new Date(h.ts).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})} · ${fmtT(h.dur)}${h.lim?` of ${fmtT(h.lim)}`:""}</div></div><span class="mono" style="color:var(--dim);font-size:13px">${h.c}/${h.n}</span><span class="score-pill ${pillCls(pct(h.c,h.n))}">${pct(h.c,h.n)}%</span></div>`).join("") : `<div class="empty">No sessions yet.</div>`}
    </div></section>
    <section class="panel stack"><div class="label">Reset</div><p class="note" style="margin:0">Clears which questions you've seen, your accuracy, and session history on every synced device. Imported questions stay.</p><button class="btn danger" data-act="reset">Reset progress</button></section>
  </div>`;
  app.querySelector("[data-act=home]").addEventListener("click",()=>go({v:"home"}));
  app.querySelector("[data-act=reset]").addEventListener("click",()=>modal(`<h3>Reset all progress?</h3><p>This can't be undone. Seen counts, accuracy and history go back to zero.</p><div class="row"><button class="btn ghost" style="flex:1" data-close>Cancel</button><button class="btn danger" style="flex:1" data-yes>Reset</button></div>`, l=>{
    l.querySelector("[data-close]").addEventListener("click",()=>layer.innerHTML="");
    l.querySelector("[data-yes]").addEventListener("click",()=>{ prog={}; hist={}; saveLocal(); Sync.pend.progress={}; Sync.pend.history={}; Sync.replace("progress",{qs:{},v:1}); Sync.replace("history",{att:{},v:1}); layer.innerHTML=""; renderStats(); });
  }));
}

/* ---------- import ---------- */
// One-line question: "Question text A) … B) … C) … * D) … Why C: … Why A: … Ref: …"
// → the multi-line form below. Returns null when the line isn't one.
const TAIL_KEYS="(?:Why(?:\\s[A-D])?|Explanation|Rationale|Answer|Correct|Ref|Section|Source)\\s*:";
function expandInline(l){
  l=l.trim(); const pos=[]; let from=0;
  for(const L of "ABCD"){
    const re=new RegExp("(?:^|\\s)\\(?"+L+"\\)\\s","g"); re.lastIndex=from; const m=re.exec(l);
    if(!m) return null; const p=m.index+(/^\s/.test(m[0])?1:0); pos.push(p); from=p+1;
  }
  if(pos[0]===0) return null;
  const tailRe=new RegExp("\\s(?="+TAIL_KEYS+")","g"); tailRe.lastIndex=pos[3];
  const t=tailRe.exec(l); const endD=t?t.index:l.length;
  const out=["Q: "+l.slice(0,pos[0]).trim().replace(/^(?:Q(?:uestion)?\s*\d*\s*[:.)]|\d+\s*[.)])\s*/i,"")];
  for(let i=0;i<4;i++) out.push(l.slice(pos[i], i<3?pos[i+1]:endD).trim());
  if(t) l.slice(endD).split(new RegExp("\\s(?="+TAIL_KEYS+")")).forEach(s=>{ s=s.trim(); if(s) out.push(s); });
  return out;
}
function parseImport(text, defCh){
  text=text.replace(/\r/g,"").replace(/ /g," ").trim(); const out=[], errs=[];
  if(!text) return {out, errs:["Paste at least one question."]};
  if(text[0]==="["||text[0]==="{"){
    try{ let arr=JSON.parse(text); if(!Array.isArray(arr)) arr=[arr];
      arr.forEach((o,i)=>{ const opts=o.o||o.options; let a=o.a!==undefined?o.a:(o.answer!==undefined?o.answer:o.correct);
        if(typeof a==="string") a="ABCD".indexOf(a.trim().toUpperCase()[0]);
        if(!o.q&&!o.question || !Array.isArray(opts) || opts.length!==4 || !(a>=0&&a<4)){ errs.push(`Item ${i+1}: needs a question, exactly 4 options and a correct answer.`); return; }
        const w=o.w||o.why||o.explanations; out.push(mk(o.q||o.question, opts, a, Array.isArray(w)?w:(w?[w]:null), o.r||o.ref, o.ch||defCh)); });
    }catch(e){ errs.push("That looks like JSON but it didn't parse: "+e.message); }
    return {out, errs};
  }
  // Expand one-line questions, then split on blank lines. A chunk that starts with an option,
  // explanation, answer or ref line belongs to the question above it.
  const all=[]; text.split("\n").forEach(l=>{ const x=expandInline(l); if(x) all.push("", ...x, ""); else all.push(l); });
  const CONT=/^(?:\(?[A-Da-d]\s*[).:]\s|(?:Why(?:\s*[A-Da-d])?|Explanation|Rationale|Answer|Correct|Ans|Ref|Section|Source)\s*[:=.])/i;
  // Questions don't need blank lines between them: once the current question has options, a numbered
  // line (1., Q:) or any plain line whose next option line is "A)" starts the next question.
  const OPT=/^\(?[A-Da-d]\s*[).:]\s/, QSTART=/^(?:Q(?:uestion)?\s*\d*\s*[:.)]\s*|\d+\s*[.)]\s+)\S/i;
  const blocks=[]; let cur=[], hasOpt=false;
  const close=()=>{ if(cur.length){ if(blocks.length && CONT.test(cur[0])) blocks[blocks.length-1].push(...cur); else blocks.push(cur); } cur=[]; hasOpt=false; };
  all.forEach((raw,i)=>{
    const l=raw.trim(); if(!l){ close(); return; }
    if(hasOpt){
      let fresh=QSTART.test(l);
      if(!fresh && !CONT.test(l)){
        for(let j=i+1;j<all.length;j++){ const n=all[j].trim(); if(!n) break; if(CONT.test(n)){ fresh=/^\(?[Aa]\s*[).:]\s/.test(n); break; } }
      }
      if(fresh) close();
    }
    cur.push(l); if(OPT.test(l)) hasOpt=true;
  });
  close();
  let qn=0, skipped=0;
  blocks.forEach(lines=>{
    let q="", opts=[], a=-1, why=[], ref="", per={}, last=null;
    const star=(k,t)=>{ if(/\s*\*\s*$/.test(t)||/^\*\s*/.test(t)){ a=k; t=t.replace(/\s*\*\s*$/,"").replace(/^\*\s*/,""); } return t; };
    lines.forEach(l=>{
      let m;
      if((m=l.match(/^(?:Q(?:uestion)?\s*\d*\s*[:.)]|\d+\s*[.)](?=\s))\s*(.*)$/i)) && !opts.length){ q=m[1]; last="q"; }
      else if(!q && !opts.length && !CONT.test(l)){ q=l; last="q"; }
      else if((m=l.match(/^\(?([A-Da-d])\s*[).:]\s+(.*)$/)) && opts.length<4){ const k="ABCD".indexOf(m[1].toUpperCase()); opts[k]=star(k,m[2]); last=["o",k]; }
      else if((m=l.match(/^(?:Answer|Correct|Ans)\s*[:=]\s*\(?([A-Da-d])/i))){ a="ABCD".indexOf(m[1].toUpperCase()); last=null; }
      else if((m=l.match(/^Why\s*([A-Da-d])\s*[:.]\s*(.*)$/i))){ const k="ABCD".indexOf(m[1].toUpperCase()); per[k]=m[2]; last=["p",k]; }
      else if((m=l.match(/^(?:Why|Explanation|Rationale)\s*[:.]\s*(.*)$/i))){ why.push(m[1]); last="w"; }
      else if((m=l.match(/^(?:Ref|Section|Source)\s*[:.]\s*(.*)$/i))){ ref=m[1]; last="r"; }
      // a line with no label continues whatever came before it (a wrapped question, option or explanation)
      else if(last==="q"){ q+=" "+l; }
      else if(last && last[0]==="o"){ opts[last[1]]=star(last[1], opts[last[1]]+" "+l); }
      else if(last && last[0]==="p"){ per[last[1]]+=" "+l; }
      else if(last==="w"){ why[why.length-1]+=" "+l; }
      else if(last==="r"){ ref+=" "+l; }
    });
    if(!opts.some(Boolean) && a<0){ skipped++; return; }   // a title or note line, not a question
    qn++;
    const filled=[0,1,2,3].every(i=>opts[i]);
    if(!q||!filled||a<0){ errs.push(`Question ${qn}${q?` ("${q.slice(0,40)}…")`:""}: ${!q?"missing the question line":!filled?"needs options A–D":"no correct answer marked (add * or an Answer: line)"}.`); return; }
    const w=[0,1,2,3].map(i=> per[i] || (i===a && why.length ? why.join(" ") : ""));
    out.push(mk(q, opts, a, w.some(Boolean)?w:null, ref, defCh));
  });
  if(!out.length && !errs.length) errs.push("No questions found. Each one needs options A) to D) and a marked answer.");
  return {out, errs, skipped};
  function mk(q, opts, a, w, r, ch){
    // store with the correct option first, matching the built-in bank
    const ord=[a].concat([0,1,2,3].filter(i=>i!==a));
    const ww = w ? ord.map(i=>w[i]||"") : null;
    const fill = ww ? ww.map((x,i)=> x || (i===0?"This is the keyed correct answer.":"Not the keyed answer for this question.")) : ["This is the keyed correct answer from your imported set.","Not the keyed answer for this question.","Not the keyed answer for this question.","Not the keyed answer for this question."];
    let h=0; const s=q+"|"+opts.join("|"); for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; }
    return {id:"u"+(+ch)+"-"+(h>>>0).toString(36), ch:+ch, q:String(q).trim(), o:ord.map(i=>String(opts[i]).trim()), w:fill, r:r?String(r):("Chapter "+ch+" · imported"), custom:1};
  }
}
function renderImport(){
  const byCh={}; liveCustom().forEach(q=>byCh[q.ch]=(byCh[q.ch]||0)+1);
  let parsed=null;
  app.innerHTML = `<div class="setup stack" style="max-width:820px">
    <button class="back" data-act="home">‹ Console</button>
    <div><h2>Import questions</h2><p class="sub">Add your own questions for any chapter, for example Chapter 7 from your course materials. They join mock exams, quizzes, mistake review and stats, and sync to your other devices.</p></div>
    <section class="panel stack">
      <div class="row"><label class="label" for="impch">Chapter</label><select id="impch">${CHS.map(ch=>`<option value="${ch}" ${ch===7?"selected":""}>Ch ${ch} · ${CH[ch]}</option>`).join("")}</select></div>
      <textarea id="imptext" spellcheck="false" placeholder="Paste questions here…"></textarea>
      <div class="row"><button class="btn" id="preview">Check format</button><button class="btn primary" id="save" disabled>Add to bank</button></div>
      <div id="impmsg" class="note"></div>
    </section>
    <section class="panel stack"><div class="label">Format</div>
<pre class="fmt"><b>Q:</b> Which property does a digital signature NOT provide?
<b>A)</b> Source authentication
<b>B)</b> Data integrity
<b>C)</b> Confidentiality <b>*</b>
<b>D)</b> Non-repudiation
<b>Why:</b> The message can still be read by anyone.   (optional)
<b>Why A:</b> Explanation for a specific option.        (optional)
<b>Ref:</b> §2.4 Digital Signature                     (optional)

<b>Q:</b> Next question…</pre>
      <p class="note" style="margin:0">Mark the correct option with <span class="mono">*</span> or add a line <span class="mono">Answer: C</span>. Numbered questions (<span class="mono">1.</span>, <span class="mono">2.</span>) work too, and so does one question per line: <span class="mono">Question A) … B) … C) … * D) … Why C: … Ref: …</span>. Leave a blank line between multi-line questions. Titles and other lines without options are ignored. A JSON array of <span class="mono">{q, o:[4], a, w, r}</span> also works.</p>
    </section>
    <section class="panel stack"><div class="label">Imported so far</div>
      ${Object.keys(byCh).length? `<div class="chips">${Object.keys(byCh).sort().map(ch=>`<span class="chip" aria-pressed="true">Ch ${ch} <span class="n">${byCh[ch]}</span></span>`).join("")}</div><div class="row">${Object.keys(byCh).sort().map(ch=>`<button class="btn danger" data-del="${ch}">Remove Ch ${ch} imports</button>`).join("")}</div>` : `<div class="empty">None yet.</div>`}
    </section></div>`;
  const msg=$("#impmsg"), save=$("#save");
  app.querySelector("[data-act=home]").addEventListener("click",()=>go({v:"home"}));
  // same question + options = same id; a re-import replaces the stored copy when its details changed
  const same=(a,b)=>JSON.stringify([a.ch,a.w,a.r])===JSON.stringify([b.ch,b.w,b.r]);
  const doParse=()=>{ parsed=parseImport($("#imptext").value, +$("#impch").value);
    const fresh=parsed.out.filter(q=>!custom[q.id] && !bankKey(q)), upd=parsed.out.filter(q=>custom[q.id] && !bankKey(q) && !same(custom[q.id],q));
    parsed.todo=fresh.concat(upd); const dup=parsed.out.length-parsed.todo.length;
    msg.className="note "+(parsed.errs.length?"bad":"ok");
    msg.innerHTML = (parsed.out.length?`Ready: <b>${fresh.length}</b> new question${fresh.length===1?"":"s"}${upd.length?`, <b>${upd.length}</b> to update`:""}${dup?` (${dup} already in the bank)`:""}${parsed.skipped?`, ignored ${parsed.skipped} line${parsed.skipped===1?"":"s"} that ${parsed.skipped===1?"isn't a question":"aren't questions"}`:""}. `:"")+(parsed.errs.length?"<br>"+parsed.errs.slice(0,6).map(esc).join("<br>")+(parsed.errs.length>6?`<br>…and ${parsed.errs.length-6} more`:""):"");
    save.disabled=!parsed.todo.length; };
  $("#preview").addEventListener("click",doParse);
  $("#imptext").addEventListener("input",()=>{ save.disabled=true; msg.textContent=""; });
  $("#impch").addEventListener("change",()=>{ if(parsed) doParse(); });
  save.addEventListener("click",()=>{ if(!parsed) return; let n=0, u=0; parsed.todo.forEach(q=>{ if(custom[q.id]) u++; else n++; custom[q.id]=q; Sync.queue("custom", q.id, q); }); saveLocal(); Sync.flush(); renderImport(); const m=$("#impmsg"); m.className="note ok"; m.textContent=`Added ${n} question${n===1?"":"s"}${u?` and updated ${u}`:""}. They're now part of every mode.`; });
  app.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{ const ch=+b.dataset.del; modal(`<h3>Remove Chapter ${ch} imports?</h3><p>${byCh[ch]} imported questions will be deleted on all devices.</p><div class="row"><button class="btn ghost" style="flex:1" data-close>Cancel</button><button class="btn danger" style="flex:1" data-yes>Remove</button></div>`, l=>{
    l.querySelector("[data-close]").addEventListener("click",()=>layer.innerHTML="");
    l.querySelector("[data-yes]").addEventListener("click",()=>{ Object.keys(custom).forEach(k=>{ if(+custom[k].ch===ch) delete custom[k]; }); saveLocal(); Sync.pend.custom={}; Sync.replace("custom",{qs:custom,v:1}); layer.innerHTML=""; renderImport(); });
  }); }));
}

/* ---------- keyboard (Mac) ---------- */
document.addEventListener("keydown",e=>{
  if(!S || S.done || layer.innerHTML || /input|textarea|select/i.test(e.target.tagName) || e.metaKey || e.ctrlKey) return;
  const it=S.items[S.i]; const fb=MODES[S.mode].feedback; const k=e.key.toLowerCase();
  const pos="1234".indexOf(k)>=0?"1234".indexOf(k):"abcd".indexOf(k);
  if(pos>=0 && k.length===1){ e.preventDefault(); choose(it.order[pos]); return; }
  if(k==="enter"){ e.preventDefault(); if(fb==="instant"){ if(it.checked) (S.i===S.items.length-1?finish(false):move(1)); else check(); } else (S.i===S.items.length-1?confirmSubmit():move(1)); }
  else if(k==="arrowright"){ if(fb==="end"||it.checked) move(1); }
  else if(k==="arrowleft"){ if(fb==="end") move(-1); }
  else if(k==="f" && fb==="end"){ it.flag=!it.flag; persistSession(); renderQuestion(); }
});

/* ============ boot ============ */
adoptDupes();
render();
Sync.init();
})();
</script>
