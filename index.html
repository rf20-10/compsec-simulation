abases don't store data in files, so OS file permissions do not apply to them at all", "OS mechanisms are always disabled for databases to improve query performance"], "w": ["Correct. A DBMS typically allows this more detailed access control.", "OSs do authenticate users.", "Databases do use files.", "Not stated."], "r": "\u00a75.2 Database Management Systems"}, {"id": "5-08", "ch": 5, "sec": "5.3", "q": "What is the basic building block of a relational database?", "o": ["A table of data consisting of rows and columns", "A directory tree of files and subdirectories", "A capability ticket listing authorized operations", "A key-value pair stored in a hash table"], "w": ["Correct. It is similar to a spreadsheet, with each column holding a particular type of data.", "A directory tree is a file system structure.", "A capability ticket is an access control structure.", "Not the relational building block."], "r": "\u00a75.3 Relational Databases"}, {"id": "5-09", "ch": 5, "sec": "5.3", "q": "What is a drawback of a flat file (all data in a single two-dimensional table), as in the telephone directory example?", "o": ["Columns may sit blank, and new services require redesigning the table and software", "It cannot store telephone numbers as a unique identifier for each row", "It requires foreign keys in every row to link it to other tables", "It enforces mandatory access control on every column of the table"], "w": ["Correct. The relational structure solves this with multiple tables linked by a unique identifier.", "It can store them.", "Flat files don't use foreign keys.", "Not related."], "r": "\u00a75.3 Relational Databases"}, {"id": "5-10", "ch": 5, "sec": "5.3", "q": "In relational database terminology (Table 5.1), the formal names for a table, a row, and a column are:", "o": ["Relation, tuple, attribute", "File, record, field", "Table, entry, key", "Schema, view, and foreign key"], "w": ["Correct. Common names are table, row, column. 'Also known as' names are file, record, field.", "These are the 'also known as' names.", "Not the formal terms.", "Not the formal terms."], "r": "\u00a75.3 Table 5.1"}, {"id": "5-11", "ch": 5, "sec": "5.3", "q": "A portion of a row used to uniquely identify a row in a table, consisting of one or more column names, is the:", "o": ["Primary key", "Foreign key", "View", "Tuple"], "w": ["Correct. In Figure 5.2, PhoneNumber alone is sufficient.", "A foreign key references another table's primary key.", "A view is a virtual table.", "A tuple is a row."], "r": "\u00a75.3 Elements of a Relational Database System"}, {"id": "5-12", "ch": 5, "sec": "5.3", "q": "What is true of a foreign key?", "o": ["Its value can repeat, giving a one-to-many link to the primary-key row", "Its value must be unique in each row, just like a primary key", "It must always be the first column defined in the table", "It cannot reference a column in another table"], "w": ["Correct. In Figure 5.4a, Did is the primary key in Department and a foreign key in Employee.", "Uniqueness is required of PRIMARY keys.", "No position requirement exists.", "It references another table's primary key by definition."], "r": "\u00a75.3 Elements of a Relational Database System"}, {"id": "5-13", "ch": 5, "sec": "5.3", "q": "A view in a relational database is:", "o": ["A virtual table produced by a query over one or more tables", "A physical copy of a table, stored separately for each user", "An encrypted copy of a table, readable only with the right key", "The DBMS's audit log of queries run against a table"], "w": ["Correct. Views are often used for security, restricting a user to certain rows or columns.", "Views are virtual.", "Not encryption.", "Not an audit log."], "r": "\u00a75.3 Elements of a Relational Database System"}, {"id": "5-14", "ch": 5, "sec": "5.3", "q": "Why are views often used for security purposes?", "o": ["A view can limit a user or application to certain rows or columns", "Views encrypt the selected data automatically before returning it", "Views prevent SQL injection by validating every query", "Views eliminate the need to authenticate database users"], "w": ["Correct. For example, a view of the Employee table with the salary code column deleted.", "Views don't encrypt.", "They don't by themselves stop SQLi.", "Not related."], "r": "\u00a75.3 Elements of a Relational Database System"}, {"id": "5-15", "ch": 5, "sec": "5.3", "q": "Structured Query Language (SQL) is:", "o": ["A standardized language to define schema, manipulate data, and query a relational database", "A procedural programming language used to write the business logic of database applications", "A network protocol used to transfer data between database servers", "A hashing algorithm used to index records in a relational database"], "w": ["Correct. There are several ANSI/ISO versions, all sharing the same base syntax and semantics.", "Query languages are DECLARATIVE.", "Not a protocol.", "Not a hash."], "r": "\u00a75.3 Structured Query Language"}, {"id": "5-16", "ch": 5, "sec": "5.3", "q": "What is the basic SQL command for retrieving information?", "o": ["SELECT", "CREATE TABLE", "GRANT", "INSERT"], "w": ["Correct. For example: SELECT Ename, Eid, Ephone FROM Employee WHERE Did = 15.", "CREATE TABLE defines tables.", "GRANT manages access rights.", "INSERT adds rows."], "r": "\u00a75.3 Structured Query Language"}, {"id": "5-17", "ch": 5, "sec": "5.4", "q": "According to the July 2013 Imperva Web Application Attack Report, how many SQL injection attack requests did a single website receive in one day?", "o": ["94,057", "1,300", "42,000", "9 billion"], "w": ["Correct. Imperva also found SQL attacks ranked first or second across several metrics.", "1,300 is the number of roles in use at Dresdner Bank (Ch 4).", "42,000 is the number of security profiles per day at Dresdner Bank.", "9 billion is the UAE iris comparisons per day (Ch 3)."], "r": "\u00a75.4 SQL Injection Attacks"}, {"id": "5-18", "ch": 5, "sec": "5.4", "q": "The OWASP 2021 report listed injection attacks, including SQL attacks, at which rank?", "o": ["Third highest risk, down from top place in previous reports", "First, ahead of broken access control and cryptographic failures", "Second, behind broken access control", "Tenth, the lowest of the listed risks"], "w": ["Correct. Broken access control was #1 and cryptographic failures was #2.", "First was broken access control.", "Second was cryptographic failures.", "Not tenth."], "r": "\u00a75.4 SQL Injection Attacks"}, {"id": "5-19", "ch": 5, "sec": "5.4", "q": "The Veracode 2016 State of Software Security Report found that the percentage of applications affected by SQL attacks was around:", "o": ["35%", "5%", "75%", "99%"], "w": ["Correct. About 35%.", "Too low.", "Too high.", "Too high."], "r": "\u00a75.4 SQL Injection Attacks"}, {"id": "5-20", "ch": 5, "sec": "5.4", "q": "What is the MOST common attack goal of an SQL injection attack?", "o": ["Bulk extraction of data", "Physical destruction of servers", "Defacing the website's images", "Cracking user passwords offline"], "w": ["Correct. Attackers can dump tables with hundreds of thousands of records. SQLi can also modify or delete data, execute OS commands, or launch DoS.", "Not an SQLi goal.", "Not the most common goal.", "Not the most common goal."], "r": "\u00a75.4 SQL Injection Attacks"}, {"id": "5-21", "ch": 5, "sec": "5.4", "q": "An SQL injection attack is viable when user input is:", "o": ["Not properly filtered for escape characters, or not strongly typed", "Encrypted with AES before it is sent to the Web application server", "Sent over HTTPS rather than over an unencrypted HTTP connection", "Stored in a view rather than directly in a base table"], "w": ["Correct. The attack exploits a vulnerability in the database layer of an application.", "Encryption isn't the factor.", "HTTPS doesn't prevent SQLi.", "Not the factor."], "r": "\u00a75.4 A Typical SQLi Attack"}, {"id": "5-22", "ch": 5, "sec": "5.4", "q": "In the typical SQLi attack of Figure 5.5, why does the injected command reach the database despite a firewall?", "o": ["It is injected into traffic that will be accepted by the firewall", "The firewall is turned off on the Web server during normal business hours", "It travels to the database through a separate out-of-band channel", "It is encrypted end-to-end, so the firewall cannot inspect it"], "w": ["Correct. The command passes through the Web server and Web application server to the database server.", "Not described.", "That's an out-of-band attack type, not this flow.", "Not described."], "r": "\u00a75.4 Figure 5.5"}, {"id": "5-23", "ch": 5, "sec": "5.4", "q": "An SQLi attack typically works by prematurely terminating a text string and appending a new command. Why does the attacker end the injected string with '--'?", "o": ["It is a comment mark, so any text the application appends is ignored", "It encrypts the rest of the query so the database cannot read it", "It duplicates the query so that it runs twice on the server", "It closes the database connection once the command has run"], "w": ["Correct. The semicolon separates commands, and the double dash comments out the rest of the line.", "Not encryption.", "Not the meaning.", "Not the meaning."], "r": "\u00a75.4 The Injection Technique"}, {"id": "5-24", "ch": 5, "sec": "5.4", "q": "In the ShipCity example, the user enters: Redmond'; DROP table OrdersTable-- . What happens?", "o": ["The server selects records where ShipCity is Redmond, then executes DROP, deleting the table", "Only the Redmond records are returned, because the extra text is treated as data", "The query fails with a syntax error and has no effect on the database", "The server returns the database administrator's password with the results"], "w": ["Correct. This is a piggybacked query.", "The DROP also executes.", "It executes.", "Not related."], "r": "\u00a75.4 The Injection Technique"}, {"id": "5-25", "ch": 5, "sec": "5.4", "q": "Attackers forge values placed in HTTP and network headers, which a Web application logs to a database without sanitization. Which SQLi attack avenue is this?", "o": ["Server variables", "Cookies", "Second-order injection", "Physical user input"], "w": ["Correct. When the query to log the server variable is issued, the attack in the forged header triggers.", "Cookies are client-controlled state information.", "Second-order injection uses data already present in the system.", "Physical user input means barcodes, RFID tags, and scanned forms."], "r": "\u00a75.4 SQLi Attack Avenues and Types"}, {"id": "5-26", "ch": 5, "sec": "5.4", "q": "An SQLi attack in which the input that modifies the query comes not from the user directly but from data already present in the system or database is called:", "o": ["Second-order injection", "Tautology", "Blind SQL injection", "Out-of-band attack"], "w": ["Correct. It occurs when prevention mechanisms are incomplete.", "A tautology makes a WHERE clause always true.", "Blind injection asks true/false questions.", "Out-of-band retrieves data via a different channel."], "r": "\u00a75.4 SQLi Attack Avenues and Types"}, {"id": "5-27", "ch": 5, "sec": "5.4", "q": "SQL injection supplied through conventional barcodes, RFID tags, or paper forms scanned with OCR is the avenue called:", "o": ["Physical user input", "Server variables", "Cookies", "User input via HTTP GET/POST"], "w": ["Correct. This constructs an attack outside the realm of Web requests.", "Server variables come from headers.", "Cookies are client-side state.", "GET/POST user input is the most common Web-based avenue."], "r": "\u00a75.4 SQLi Attack Avenues and Types"}, {"id": "5-28", "ch": 5, "sec": "5.4", "q": "SQLi attack types are grouped into which three main categories?", "o": ["Inband, inferential, and out-of-band", "Tautology, comment, piggyback", "User input, cookies, server variables", "Signature, anomaly, code analysis"], "w": ["Correct. These are the three main categories of attack types.", "These are INBAND attack types.", "These are AVENUES.", "These are DETECTION methods."], "r": "\u00a75.4 SQLi Attack Avenues and Types"}, {"id": "5-29", "ch": 5, "sec": "5.4", "q": "An attacker submits ' OR 1=1 -- in the name field so the WHERE clause always evaluates to true, returning all rows. This inband attack is a:", "o": ["Tautology", "Blind SQL injection", "Illegal/logically incorrect query", "Out-of-band attack"], "w": ["Correct. It also uses an end-of-line comment to disable the password check.", "Blind injection infers data from true/false behavior.", "Illegal queries gather information through error messages.", "Out-of-band uses a different channel, such as e-mail."], "r": "\u00a75.4 SQLi Attack Avenues and Types"}, {"id": "5-30", "ch": 5, "sec": "5.4", "q": "An inband attack in which the attacker adds additional queries beyond the intended query, relying on server configurations that allow several queries in one string, is:", "o": ["Piggybacked queries", "Tautology", "End-of-line comment", "Blind SQL injection"], "w": ["Correct. The DROP TABLE example is of this form.", "A tautology makes conditions always true.", "An end-of-line comment nullifies the code that follows.", "Blind injection is inferential."], "r": "\u00a75.4 SQLi Attack Avenues and Types"}, {"id": "5-31", "ch": 5, "sec": "5.4", "q": "With an INFERENTIAL SQLi attack:", "o": ["No data is transferred; the attacker infers it from the site's behavior", "Data is retrieved directly in the application webpage through the same channel used for injection", "Data is retrieved through a different channel, such as an e-mail containing the query results", "The attacker physically accesses the database server to copy the data"], "w": ["Correct. The types are illegal/logically incorrect queries and blind SQL injection.", "That's INBAND.", "That's OUT-OF-BAND.", "Not SQLi."], "r": "\u00a75.4 SQLi Attack Avenues and Types"}, {"id": "5-32", "ch": 5, "sec": "5.4", "q": "Which inferential attack exploits overly descriptive default error pages and is considered a preliminary, information-gathering step?", "o": ["Illegal/logically incorrect queries", "Blind SQL injection (inferential)", "Piggybacked queries", "Tautology"], "w": ["Correct. The mere fact that an error is generated can reveal vulnerable injectable parameters.", "Blind injection works even when NO error information is displayed.", "Piggybacked queries are inband.", "A tautology is inband."], "r": "\u00a75.4 SQLi Attack Avenues and Types"}, {"id": "5-33", "ch": 5, "sec": "5.4", "q": "In blind SQL injection, how does the attacker learn about the data?", "o": ["By asking true/false questions and watching whether the page behaves normally", "By reading the descriptive error messages the application server returns", "By receiving the query results in an e-mail generated by the database", "By viewing the query results displayed directly in the application webpage"], "w": ["Correct. This works even when the system is secure enough not to display erroneous information.", "That's illegal/logically incorrect queries.", "That's out-of-band.", "That's inband."], "r": "\u00a75.4 SQLi Attack Avenues and Types"}, {"id": "5-34", "ch": 5, "sec": "5.4", "q": "An out-of-band SQLi attack is useful when:", "o": ["Retrieval is restricted, but the database server's outbound connectivity is lax", "The webpage displays all query results directly back to the attacker's browser", "The application's default error messages are overly descriptive", "The database server has no outbound network connection at all"], "w": ["Correct. Data is retrieved using a different channel, for example an e-mail with the query results.", "Then inband would be used.", "Then illegal queries would be used.", "Outbound connectivity is required."], "r": "\u00a75.4 SQLi Attack Avenues and Types"}, {"id": "5-35", "ch": 5, "sec": "5.4", "q": "Using the classification in [SHAR13], SQLi countermeasures fall into which three types?", "o": ["Defensive coding, detection, and run-time prevention", "Encryption of data, hashing of passwords, and salting of stored hashes", "Perimeter firewalls, intrusion detection systems, and honeypots", "Discretionary, mandatory, and role-based access control"], "w": ["Correct. A single countermeasure is insufficient, so an integrated set is necessary.", "Not the classification.", "Not the classification.", "These are access control policies."], "r": "\u00a75.4 SQLi Countermeasures"}, {"id": "5-36", "ch": 5, "sec": "5.4", "q": "Checking that inputs that are supposed to be numeric contain no characters other than digits is an example of:", "o": ["Manual defensive coding practices (input type checking)", "Parameterized query insertion, passing values separately from the query", "Anomaly-based detection, learning the normal range of inputs", "Run-time prevention, checking queries against a model of expected queries"], "w": ["Correct. Insufficient input validation is a common vulnerability. Pattern matching is another practice.", "Parameterized queries separate structure from value parameters.", "Anomaly detection learns normal behavior.", "Run-time prevention checks queries against a model."], "r": "\u00a75.4 SQLi Countermeasures"}, {"id": "5-37", "ch": 5, "sec": "5.4", "q": "Which defensive coding approach lets the developer specify the SQL query's structure and pass the value parameters separately, so unsanitary input cannot modify the query structure?", "o": ["Parameterized query insertion", "SQL DOM", "Signature-based detection", "Code analysis"], "w": ["Correct. This is parameterized query insertion.", "SQL DOM is a set of classes enabling type validation and escaping through a type-checked API.", "Signature-based detection matches attack patterns.", "Code analysis uses test suites."], "r": "\u00a75.4 SQLi Countermeasures"}, {"id": "5-38", "ch": 5, "sec": "5.4", "q": "SQL DOM changes the query-building process from:", "o": ["An unregulated one using string concatenation to a systematic one using a type-checked API", "A declarative query language to a procedural programming language", "Encrypted queries to plaintext queries, which are easier for the database server to validate", "Server-side query construction to client-side construction only"], "w": ["Correct. It is a set of classes enabling automated data type validation and escaping [MCCL05].", "Not the change.", "Not the change.", "Not the change."], "r": "\u00a75.4 SQLi Countermeasures"}, {"id": "5-39", "ch": 5, "sec": "5.4", "q": "Which SQLi detection method must be constantly updated and may not work against self-modifying attacks?", "o": ["Signature-based", "Anomaly-based", "Code analysis", "Parameterized queries"], "w": ["Correct. It matches specific attack patterns.", "Anomaly-based learns normal behavior and then detects deviations.", "Code analysis uses test suites to generate attacks.", "Parameterized queries are defensive coding, not detection."], "r": "\u00a75.4 SQLi Countermeasures"}, {"id": "5-40", "ch": 5, "sec": "5.4", "q": "Which SQLi detection approach has a training phase in which the system learns the range of normal behavior, followed by a detection phase?", "o": ["Anomaly-based", "Signature-based", "Code analysis", "SQL DOM"], "w": ["Correct. This is anomaly-based detection.", "Signature-based matches known patterns.", "Code analysis uses a test suite.", "SQL DOM is defensive coding."], "r": "\u00a75.4 SQLi Countermeasures"}, {"id": "5-41", "ch": 5, "sec": "5.4", "q": "SQLi run-time prevention techniques work by:", "o": ["Checking queries at runtime to see if they conform to a model of expected queries", "Rewriting the application's source code to remove string concatenation", "Encrypting all user inputs before they reach the database server", "Training on normal traffic, then flagging behavior outside that range"], "w": ["Correct. Various automated tools are available.", "That's defensive coding.", "Not described.", "That's anomaly detection."], "r": "\u00a75.4 SQLi Countermeasures"}, {"id": "5-42", "ch": 5, "sec": "5.5", "q": "What does a DBMS's access control system assume about users?", "o": ["That the computer system has authenticated each user", "That users are anonymous", "That all users are administrators", "That users authenticate via biometric only"], "w": ["Correct. The overall access control system from Ch 4 may also decide whether the user can access the database at all.", "Not assumed.", "Not assumed.", "Not assumed."], "r": "\u00a75.5 Database Access Control"}, {"id": "5-43", "ch": 5, "sec": "5.5", "q": "Commercial and open-source DBMSs provide which types of access control, according to the textbook?", "o": ["Discretionary or role-based; some specialized DBMSs also provide mandatory", "Only mandatory access control, based on labels and clearances", "Only attribute-based access control, based on user and data attributes", "None; access control is left entirely to the operating system"], "w": ["Correct. DAC or RBAC, plus MAC in some specialized systems.", "Not only MAC.", "Not stated.", "Not correct."], "r": "\u00a75.5 Database Access Control"}, {"id": "5-44", "ch": 5, "sec": "5.5", "q": "In which DBMS administrative policy can the owner of a table grant and revoke access rights AND grant and revoke authorization rights to other users, allowing them to grant and revoke access to the table?", "o": ["Decentralized administration", "Centralized administration", "Ownership-based administration", "Mandatory administration"], "w": ["Correct. This is decentralized administration.", "In centralized administration, a small number of privileged users grant and revoke rights.", "In ownership-based administration, the owner (creator) grants and revokes access rights only.", "Not a listed policy."], "r": "\u00a75.5 Database Access Control"}, {"id": "5-45", "ch": 5, "sec": "5.5", "q": "Some DBMSs allow access rights based on the contents of a table entry. Which example illustrates this?", "o": ["A department manager may only view salary information for employees in their own department", "Access is granted either to the entire database or to none of it", "Access is allowed only during business hours, enforced by the firewall in front of the database", "Access is controlled by OS file permissions on the database files"], "w": ["Correct. Another example is limiting salary visibility up to a certain maximum value.", "That's coarse-grained.", "Not content-based.", "OS permissions can't do this."], "r": "\u00a75.5 Database Access Control"}, {"id": "5-46", "ch": 5, "sec": "5.5", "q": "Which two SQL commands are used for managing access rights?", "o": ["GRANT and REVOKE", "SELECT and INSERT", "CREATE and DROP", "COMMIT and ROLLBACK"], "w": ["Correct. The syntax differs slightly between versions.", "These manipulate data.", "These define and delete structures.", "Transactions are not discussed here."], "r": "\u00a75.5 SQL-Based Access Definition"}, {"id": "5-47", "ch": 5, "sec": "5.5", "q": "In the SQL GRANT command, what does the PUBLIC value in the TO clause indicate?", "o": ["Any user has the specified access rights", "The data will be published to the Web", "Only the owner has rights", "The rights expire immediately"], "w": ["Correct. This is the meaning of PUBLIC.", "Not the meaning.", "Not the meaning.", "Not the meaning."], "r": "\u00a75.5 SQL-Based Access Definition"}, {"id": "5-48", "ch": 5, "sec": "5.5", "q": "In the SQL GRANT command, what does the optional IDENTIFIED BY clause specify?", "o": ["A password that must be used to revoke the access rights of this GRANT command", "The grantee's login password for connecting to the database with these rights", "The encryption key used to protect the table's contents", "The role hierarchy that the grantee is placed into"], "w": ["Correct. This is the meaning of IDENTIFIED BY.", "Not this.", "Not this.", "Not this."], "r": "\u00a75.5 SQL-Based Access Definition"}, {"id": "5-49", "ch": 5, "sec": "5.5", "q": "In SQL, the GRANT OPTION indicates that:", "o": ["The grantee can grant this access right to other users, with or without the grant option", "The right cannot later be revoked by the user who granted it", "The grantee becomes the new owner of the table named in the command, replacing the creator", "The grant applies to every table in the database, not just one"], "w": ["Correct. This enables cascading authorizations.", "Rights can still be revoked.", "Not ownership.", "Not the meaning."], "r": "\u00a75.5 SQL-Based Access Definition"}, {"id": "5-50", "ch": 5, "sec": "5.5", "q": "Which SQL access right allows the grantee to define foreign keys in another table that refer to the specified columns?", "o": ["References", "Select", "Update", "Insert"], "w": ["Correct. This is the References right.", "Select is read.", "Update modifies data.", "Insert adds rows."], "r": "\u00a75.5 SQL-Based Access Definition"}, {"id": "5-51", "ch": 5, "sec": "5.5", "q": "The statement GRANT SELECT ON ANY TABLE TO ricflair enables user ricflair to:", "o": ["Query any table in the database", "Delete any table", "Grant select rights to others", "Create new tables"], "w": ["Correct. REVOKE SELECT ON ANY TABLE FROM ricflair reverses it.", "SELECT doesn't allow deletes.", "No GRANT OPTION was given.", "Not granted."], "r": "\u00a75.5 SQL-Based Access Definition"}, {"id": "5-52", "ch": 5, "sec": "5.5", "q": "In Figure 5.6, Livia grants a right (with grant option) to Teri and Sophia. If Livia revokes the right from both Teri and Sophia, who loses it?", "o": ["Teri, Sophia, David, Aline, Jonas, and Mattias", "Only Teri and Sophia", "Only David", "No one, because the right was cascaded"], "w": ["Correct. Revocation cascades just like granting.", "It cascades further.", "More users are affected.", "Revocation does cascade."], "r": "\u00a75.5 Cascading Authorizations; Figure 5.6"}, {"id": "5-53", "ch": 5, "sec": "5.5", "q": "In Figure 5.6, David received the right from Teri (t=30) and again from Sophia (t=50). He granted it to Aline at t=40 and to Mattias after t=50. If Teri revokes David's right, what happens under most implementations?", "o": ["David keeps the right (from Sophia); Aline and Jonas lose it; Mattias keeps it", "David, Aline, Jonas, and Mattias all lose the right, since David first received it from Teri", "Nothing changes for anyone, because David still holds the right from Sophia", "Only Mattias loses the right, because David granted it to him most recently"], "w": ["Correct. When David granted Aline at t=40, he had the grant option only from Teri. Mattias's grant came after Sophia's grant.", "David still has Sophia's grant.", "Aline's chain traces solely to Teri.", "Mattias's grant is supported by Sophia's."], "r": "\u00a75.5 Cascading Authorizations"}, {"id": "5-54", "ch": 5, "sec": "5.5", "q": "The convention, first proposed in [GRIF76], for revoking cascaded access rights is:", "o": ["Cascaded rights are revoked unless they would exist without A's original grant", "Revocation never cascades; each grantee keeps rights they passed on until revoked directly", "All rights everywhere are revoked, and every user must be granted access again", "Only the direct grants from A are revoked; any cascaded grants made by them remain"], "w": ["Correct. This is the convention followed by most implementations.", "Revocation does cascade.", "This overstates it.", "Cascaded rights traceable solely to A are revoked."], "r": "\u00a75.5 Cascading Authorizations"}, {"id": "5-55", "ch": 5, "sec": "5.5", "q": "Why is RBAC described as a natural fit for database access control?", "o": ["Databases serve many applications, and each task needs its own set of privileges", "Databases usually support only one application, so a single role covers every user", "Databases cannot support discretionary access control, so roles are the only option", "RBAC eliminates the need to authenticate database users before granting access"], "w": ["Correct. Granting users all rights for all tasks would be poor practice. RBAC eases administration and improves security.", "It's the opposite.", "They do support DAC.", "Not stated."], "r": "\u00a75.5 Role-Based Access Control"}, {"id": "5-56", "ch": 5, "sec": "5.5", "q": "In a DAC database environment, an end user who owns database objects (tables, columns, rows) as part of an application is a(n):", "o": ["Application owner", "End user other than application owner", "Administrator", "Data owner"], "w": ["Correct. The application owner may assign roles to end users.", "This user operates on objects via an application but owns none.", "An administrator has administrative responsibility for part or all of the database.", "'Data owner' is a term from the database encryption scheme (5.7)."], "r": "\u00a75.5 Role-Based Access Control"}, {"id": "5-57", "ch": 5, "sec": "5.5", "q": "Which capability must a database RBAC facility provide?", "o": ["Create and delete roles", "Encrypt each row", "Detect SQL injection", "Generate rainbow tables"], "w": ["Correct. The required capabilities are creating and deleting roles, defining permissions for a role, and assigning and canceling users' role assignments.", "Not an RBAC facility requirement.", "Not an RBAC facility requirement.", "Not an RBAC facility requirement."], "r": "\u00a75.5 Role-Based Access Control"}, {"id": "5-58", "ch": 5, "sec": "5.5", "q": "Microsoft SQL Server supports three types of roles. Which two are referred to as fixed roles?", "o": ["Server roles and database roles", "User-defined and application roles", "Standard and application roles", "Owner and group roles"], "w": ["Correct. Fixed roles are preconfigured. Admins can't add, delete, or modify them, only add and remove members.", "These are user-defined role types.", "Standard and application are the two kinds of USER-DEFINED roles.", "Not SQL Server roles."], "r": "\u00a75.5 Role-Based Access Control; Table 5.2"}, {"id": "5-59", "ch": 5, "sec": "5.5", "q": "In Table 5.2, which fixed server role can perform ANY activity in SQL Server and has complete control over all database functions?", "o": ["sysadmin", "serveradmin", "securityadmin", "dbcreator"], "w": ["Correct. sysadmin has complete control.", "serveradmin can set server-wide configuration options and shut down the server.", "securityadmin manages logins and CREATE DATABASE permissions, reads error logs, and changes passwords.", "dbcreator can create, alter, and drop databases."], "r": "\u00a75.5 Table 5.2"}, {"id": "5-60", "ch": 5, "sec": "5.5", "q": "In Table 5.2, which fixed DATABASE role can select all data from any user table in the database?", "o": ["db_datareader", "db_datawriter", "db_owner", "db_denydatareader"], "w": ["Correct. db_datareader can select all data.", "db_datawriter can modify any data in any user table.", "db_owner has all permissions in the database.", "db_denydatareader can DENY permission to select data."], "r": "\u00a75.5 Table 5.2"}, {"id": "5-61", "ch": 5, "sec": "5.5", "q": "Which SQL Server fixed database role can issue all data definition language (DDL) statements?", "o": ["db_ddladmin", "db_accessadmin", "db_backupoperator", "db_securityadmin"], "w": ["Correct. db_ddladmin issues DDL statements.", "db_accessadmin can add or remove user IDs.", "db_backupoperator can issue DBCC, CHECKPOINT, and BACKUP statements.", "db_securityadmin can manage all permissions, object ownerships, roles, and role memberships."], "r": "\u00a75.5 Table 5.2"}, {"id": "5-62", "ch": 5, "sec": "5.5", "q": "In SQL Server, an application role differs from a standard user-defined role in that it:", "o": ["Is associated with an application, requires a password, and is activated when the application runs the right code", "Cannot be assigned any access rights, so it only identifies which application is connecting to the server", "Is one of the fixed server roles, so its permissions cannot be changed", "Is assigned directly to users by the HR department, like Dresdner Bank's roles"], "w": ["Correct. For example, it can allow data access only during specific hours, enforced by application logic.", "It does carry access rights.", "It's user-defined.", "Not described."], "r": "\u00a75.5 Role-Based Access Control"}, {"id": "5-63", "ch": 5, "sec": "5.5", "q": "Which SQL Server fixed database roles are designed to assist a DBA with DELEGATING administrative responsibilities?", "o": ["db_accessadmin and db_securityadmin", "db_datareader and db_datawriter", "sysadmin and bulkadmin", "db_denydatareader and db_denydatawriter"], "w": ["Correct. db_datareader and db_datawriter instead provide blanket permissions for end users.", "These provide blanket end-user permissions.", "These are server roles.", "These deny permissions."], "r": "\u00a75.5 Role-Based Access Control"}, {"id": "5-64", "ch": 5, "sec": "5.6", "q": "Inference, as it relates to database security, is:", "o": ["Performing authorized queries and deducing unauthorized information from the legitimate responses", "Injecting SQL commands into a query to retrieve data the user cannot normally access", "Encrypting database rows so that unauthorized users cannot read them", "Cascading revocation of privileges through users who received them with the grant option"], "w": ["Correct. It arises when a combination of data items is more sensitive than the individual items.", "That's SQLi.", "That's encryption.", "That's cascading authorization."], "r": "\u00a75.6 Inference"}, {"id": "5-65", "ch": 5, "sec": "5.6", "q": "The information transfer path by which unauthorized data are obtained through inference is called a(n):", "o": ["Inference channel", "Covert storage", "Side table", "Foreign key"], "w": ["Correct. This is the inference channel.", "Not the term.", "Not the term.", "Not the term."], "r": "\u00a75.6 Inference; Figure 5.7"}, {"id": "5-66", "ch": 5, "sec": "5.6", "q": "In the context of inference, metadata refers to:", "o": ["Known correlations or dependencies among data items", "The DBMS version number and configuration settings", "The encryption keys used for sensitive columns", "The audit logs recording which queries were run"], "w": ["Correct. The attacker may use nonsensitive data as well as metadata.", "Not the meaning here.", "Not the meaning here.", "Not the meaning here."], "r": "\u00a75.6 Inference"}, {"id": "5-67", "ch": 5, "sec": "5.6", "q": "What are the two inference techniques that can be used to derive additional information?", "o": ["Analyzing functional dependencies between attributes, and merging views with the same constraints", "SQL injection through user input and blind injection through true/false questions", "Brute-force and dictionary attacks against the database's stored passwords", "Encryption of sensitive columns and hashing of primary key values"], "w": ["Correct. Figure 5.8 illustrates merging views.", "Not inference techniques.", "Not inference techniques.", "Not inference techniques."], "r": "\u00a75.6 Inference"}, {"id": "5-68", "ch": 5, "sec": "5.6", "q": "In Figure 5.8, views V1 (Availability, Cost) and V2 (Item, Department) are restricted so that Item and Cost cannot be accessed together. How can a user still infer the Item\u2013Cost relationship?", "o": ["By knowing the Inventory table structure and that the views keep the same row order, then merging the two views", "Through a functional dependency between Item and Cost that lets one attribute's value reveal the other's", "By SQL injection into one of the views to remove the access constraint", "By decrypting the views, which are stored encrypted at the server"], "w": ["Correct. This violates the policy that the Item\u2013Cost relationship must not be disclosed.", "The text says there is NO functional dependency between Item and Cost.", "Not needed.", "No encryption is involved."], "r": "\u00a75.6 Inference; Figure 5.8"}, {"id": "5-69", "ch": 5, "sec": "5.6", "q": "Removing an inference channel by altering the database structure or changing the access control regime, e.g., splitting a table, is:", "o": ["Inference detection during database design", "Inference detection performed at query time", "Parameterized query insertion", "Cascading revocation"], "w": ["Correct. These techniques often result in unnecessarily strict access controls that reduce availability.", "Query-time detection denies or alters queries during execution.", "That's an SQLi defense.", "Not related."], "r": "\u00a75.6 Inference"}, {"id": "5-70", "ch": 5, "sec": "5.6", "q": "What is a known drawback of inference detection during database design?", "o": ["It often results in unnecessarily stricter access controls that reduce availability", "It cannot remove any inference channels, only detect them after the fact", "It requires encryption of every table that could be part of a channel", "It only works at query time, when the inference attempt is already under way"], "w": ["Correct. This is the stated drawback.", "It can remove channels.", "Not required.", "That's the other approach."], "r": "\u00a75.6 Inference"}, {"id": "5-71", "ch": 5, "sec": "5.6", "q": "In the [LUNT89] example, Clerks can see Employees (Emp#, Name, Address) and Salaries (S#, Salary), but only Administrators see Emp-Salary. Adding Start-Date to the SALARIES table creates what problem?", "o": ["Start date is easy to observe, so a Clerk could tie a salary to an employee", "Start date is itself highly sensitive, so Clerks should not see it at all", "The Employees table becomes too large to query efficiently", "Adding the column creates an opening for SQL injection by Clerks"], "w": ["Correct. The fix is to put Start-Date in the Employees table instead.", "Start date isn't sensitive. The issue is inference.", "Not the issue.", "Not related."], "r": "\u00a75.6 Inference"}, {"id": "5-72", "ch": 5, "sec": "5.6", "q": "Why can't the second problem in the [LUNT89] example (start date in Salaries) be detected by analyzing the database alone?", "o": ["Nothing in the database says start date reveals who the employee is", "The DBMS hides start dates from its own inference detection routines", "The start date column is encrypted, so the DBMS cannot analyze it", "Inference is impossible to detect in any relational database"], "w": ["Correct. Inference detection in general relational databases is complex and difficult.", "Not the reason.", "Not the reason.", "Inference is very possible."], "r": "\u00a75.6 Inference"}, {"id": "5-73", "ch": 5, "sec": "5.7", "q": "The textbook describes database encryption as:", "o": ["The last line of defense in database security", "The first line of defense, applied before firewalls and authentication", "A replacement for access control once data is stored encrypted", "Unnecessary for sensitive data protected by database access control"], "w": ["Correct. It sits behind firewalls, authentication, and general and database access control.", "Other layers come first.", "It complements other controls.", "It's warranted for particularly sensitive data."], "r": "\u00a75.7 Database Encryption"}, {"id": "5-74", "ch": 5, "sec": "5.7", "q": "What are the two disadvantages of database encryption?", "o": ["Key management and inflexibility", "Cost and speed", "Availability and integrity", "Hash collisions and salt size"], "w": ["Correct. Providing secure keys to the right users and applications is complex, and encryption makes record searching harder.", "Not the two listed.", "Not the two listed.", "Not relevant."], "r": "\u00a75.7 Database Encryption"}, {"id": "5-75", "ch": 5, "sec": "5.7", "q": "At what levels can encryption be applied to a database?", "o": ["Entire database, record level, attribute (column) level, or individual field", "Only the entire database, since partial encryption breaks queries", "Only individual fields, since rows cannot be encrypted as blocks", "Only the primary key, since it identifies every row"], "w": ["Correct. All four levels are possible.", "There are more options.", "There are more options.", "Not limited this way."], "r": "\u00a75.7 Database Encryption"}, {"id": "5-76", "ch": 5, "sec": "5.7", "q": "In the outsourced database encryption scheme of Figure 5.9, which entity is the front end that transforms user queries into queries on the encrypted data stored on the server?", "o": ["Client", "Server", "Data owner", "User"], "w": ["Correct. The client holds the key and metadata.", "The server receives encrypted data and makes it available, without the key.", "The data owner produces data for controlled release.", "The user presents queries."], "r": "\u00a75.7 Database Encryption; Figure 5.9"}, {"id": "5-77", "ch": 5, "sec": "5.7", "q": "In the simplest encrypted-database arrangement, each data item is encrypted separately with the same key. Why is a query for 'all salaries less than $70K' a problem?", "o": ["The set of encrypted values does not preserve the ordering of the original attribute values", "The server has a copy of the key, so it could decrypt the salaries itself", "Salary values can't be encrypted, because they are numeric attributes", "SQL can't compare numeric values, so range queries are never supported"], "w": ["Correct. This shows the scheme's lack of flexibility.", "The server does NOT have the key.", "They can be encrypted.", "SQL can compare plaintext numbers."], "r": "\u00a75.7 Database Encryption"}, {"id": "5-78", "ch": 5, "sec": "5.7", "q": "In the more flexible scheme (Figure 5.10), each row is encrypted as a block. What assists in data retrieval?", "o": ["Attribute index values assigned to non-overlapping partitions of attribute values", "Storing plaintext copies of selected attributes at the server", "Giving the server a copy of the key so it can decrypt rows on demand", "Hashing every column with SHA-1 so rows can be matched by hash"], "w": ["Correct. For example, eid in [1,1000] is split into five partitions with index values 1 to 5.", "This defeats the purpose.", "The server never gets the key.", "Not the scheme."], "r": "\u00a75.7 Database Encryption; Table 5.3"}, {"id": "5-79", "ch": 5, "sec": "5.7", "q": "In the indexed encrypted database scheme, where are the mapping functions between attribute values and index values (metadata) stored?", "o": ["At the client and data owner locations, but not at the server", "Only at the server, alongside the encrypted rows they describe", "Publicly on the Web, so that any authorized client can retrieve them", "Inside each encrypted row, next to the attribute values they index"], "w": ["Correct. Because the metadata are not at the server, an attacker there can't learn the mapping.", "It's the opposite.", "No.", "No."], "r": "\u00a75.7 Database Encryption"}, {"id": "5-80", "ch": 5, "sec": "5.7", "q": "A user requests all employees with eid < 300 (partitions [1,200]\u21921, [201,400]\u21922). What does the client's query processor do?", "o": ["Requests index 1 and 2 rows, decrypts them, and drops the non-matching ones", "Sends the plaintext query to the server, which filters the rows and returns them", "Downloads only the single row whose index value matches the query exactly", "Asks the server to decrypt the index 1 and 2 rows and return the matching ones"], "w": ["Correct. The server returns candidate rows, and the client filters them precisely.", "The query is transformed first.", "Multiple rows may be returned.", "The server can't decrypt."], "r": "\u00a75.7 Database Encryption"}, {"id": "5-81", "ch": 5, "sec": "5.7", "q": "What information does the basic indexing scheme leak, and how can it be obscured?", "o": ["A rough relative ordering of rows by an attribute; obscured by randomizing the ordering of indexes", "The encryption key is leaked; it is obscured by adding a random salt to each row before encrypting it", "User passwords are leaked; they are obscured by hashing them with Bcrypt", "Nothing is leaked, because all index values are encrypted at the server"], "w": ["Correct. For example, partitions map to 2, 3, 5, 1, 4 instead of 1 to 5.", "Keys are not leaked.", "Not related.", "Some ordering information is leaked."], "r": "\u00a75.7 Database Encryption"}, {"id": "5-82", "ch": 5, "sec": "5.7", "q": "For many small and medium-sized organizations, what is the attractive option discussed in 5.7, and what is its main concern?", "o": ["Outsourcing the database to a service provider; the concern is confidentiality", "Moving the database to flat files; the main concern is query speed", "Eliminating database encryption; the main concern is cost", "Using only views for access; the main concern is SQL injection"], "w": ["Correct. This motivates encrypting the data and withholding the keys from the provider.", "Not discussed.", "Not discussed.", "Not discussed."], "r": "\u00a75.7 Database Encryption"}, {"id": "5-83", "ch": 5, "sec": "5.8", "q": "A data center is defined as:", "o": ["A facility housing large numbers of servers, storage devices, and network equipment", "A single database server dedicated to an organization's most sensitive data", "A cloud-only virtual service with no physical facility behind it", "A wiring closet on each floor that connects workstations to the LAN"], "w": ["Correct. Large data centers can use as much electricity as a small town.", "A data center is much larger.", "Data centers are physical facilities.", "That's part of cabling."], "r": "\u00a75.8 Data Center Security"}, {"id": "5-84", "ch": 5, "sec": "5.8", "q": "In data centers, switches mounted in the rack to interconnect servers are called:", "o": ["Top-of-rack (ToR) switches", "Core routers", "Cross connects", "Zone distribution switches"], "w": ["Correct. ToR has become synonymous with server access switch, even when not physically at the top of the rack.", "Core routers are in the main distribution area.", "A cross connect terminates and interconnects cables.", "Not the term."], "r": "\u00a75.8 Data Center Elements"}, {"id": "5-85", "ch": 5, "sec": "5.8", "q": "Cabling that connects a floor's wiring closet to wall plates in the work areas, typically run along the ceiling or floor, is called:", "o": ["Horizontal cabling", "Backbone cabling", "Cross connect", "Top-of-rack cabling"], "w": ["Correct. This is horizontal cabling.", "Backbone cabling runs between data center rooms or enclosures and the main cross-connect point.", "A cross connect terminates and interconnects cables.", "Not a cabling term."], "r": "\u00a75.8 Data Center Elements"}, {"id": "5-86", "ch": 5, "sec": "5.8", "q": "Why are security risks most acute in large data centers?", "o": ["Huge amounts of data in one place, externally reachable, and the enterprise's biggest asset", "Data centers have no external network connections, so insiders pose the only risk", "Data centers store only public data, so a breach exposes large volumes at once", "Data centers are always cloud facilities that the enterprise does not control"], "w": ["Correct. Once an attacker is past the boundary, a threat is posed to the entire complex.", "They are accessible through external connections.", "Not stated.", "Not stated."], "r": "\u00a75.8 Data Center Security Considerations"}, {"id": "5-87", "ch": 5, "sec": "5.8", "q": "Figure 5.12's data center security model has four layers. Which is correct?", "o": ["Site, physical, network, and data security", "Hardware, software, data, and network security", "Prevention, detection, response, and recovery", "Tier 1, Tier 2, Tier 3, and Tier 4 security"], "w": ["Correct. Site covers the building and redundant utilities, physical covers barriers such as a mantrap, then network, then the data themselves.", "These are asset categories.", "These are implementation actions.", "These are TIA-942 reliability tiers."], "r": "\u00a75.8 Figure 5.12"}, {"id": "5-88", "ch": 5, "sec": "5.8", "q": "A mantrap, mentioned in data center physical security, is:", "o": ["A double-door single-person access control space", "A honeypot server placed to trap intruders", "A fire suppression system for the computer room", "A network IDS at the entrance room"], "w": ["Correct. It is coupled with authentication for physical access.", "Not a mantrap.", "Not a mantrap.", "Not a mantrap."], "r": "\u00a75.8 Data Center Security Considerations"}, {"id": "5-89", "ch": 5, "sec": "5.8", "q": "Which standard specifies the minimum requirements for telecommunications infrastructure of data centers?", "o": ["TIA-942", "FIPS 199", "ISO 27001", "RFC 4949"], "w": ["Correct. It is the Telecommunications Infrastructure Standard for Data Centers.", "FIPS 199 covers security categorization.", "Not cited here.", "RFC 4949 is a security glossary."], "r": "\u00a75.8 TIA-942"}, {"id": "5-90", "ch": 5, "sec": "5.8", "q": "Under TIA-942, which functional area houses external network access provider equipment and provides the interface to enterprise cabling, and is physically separated from the computer room for better security?", "o": ["Entrance room", "Main distribution area", "Equipment distribution area", "Zone distribution area"], "w": ["Correct. This is the entrance room.", "The MDA houses the main cross-connect and core routers and switches for LAN and SAN.", "The EDA holds equipment cabinets and racks.", "The ZDA is an optional interconnection point between HDA and EDA."], "r": "\u00a75.8 TIA-942; Figure 5.13"}, {"id": "5-91", "ch": 5, "sec": "5.8", "q": "Under TIA-942, the centrally located area housing the main cross-connect as well as core routers and switches for LAN and SAN infrastructures is the:", "o": ["Main distribution area (MDA)", "Horizontal distribution area (HDA)", "Entrance room", "Computer room"], "w": ["Correct. This is the MDA.", "The HDA is the distribution point for horizontal cabling.", "The entrance room handles carriers.", "The computer room houses data-processing equipment."], "r": "\u00a75.8 TIA-942"}, {"id": "5-92", "ch": 5, "sec": "5.8", "q": "Which TIA-942 functional area is OPTIONAL and acts as a consolidation point between the HDA and EDA, or houses freestanding equipment such as mainframes?", "o": ["Zone distribution area (ZDA)", "Main distribution area", "Entrance room", "Equipment distribution area"], "w": ["Correct. This is the ZDA.", "The MDA is required.", "The entrance room is required.", "The EDA is where racks and cabinets are."], "r": "\u00a75.8 TIA-942"}, {"id": "5-93", "ch": 5, "sec": "5.8", "q": "According to Table 5.4 (TIA-942 tiers), which tier has 99.995% availability (about 0.4 hours annual downtime) and can sustain at least one worst-case unplanned event with no critical load impact?", "o": ["Tier 4", "Tier 3", "Tier 2", "Tier 1"], "w": ["Correct. Tier 4 has multiple ACTIVE power and cooling paths and takes 15 to 20 months to implement.", "Tier 3: 99.982% (1.6 hours), multiple paths but only one active.", "Tier 2: 99.741% (22.0 hours).", "Tier 1: 99.671% (28.8 hours)."], "r": "\u00a75.8 Table 5.4"}, {"id": "5-94", "ch": 5, "sec": "5.8", "q": "Which TIA-942 tier has a single path for power and cooling with NO redundant components, takes 3 months to implement, and must be shut down completely for preventive maintenance?", "o": ["Tier 1", "Tier 2", "Tier 3", "Tier 4"], "w": ["Correct. Tier 1 has 99.671% availability (28.8 hours downtime).", "Tier 2 includes redundant components and a raised floor, UPS, and generator, taking 3 to 6 months.", "Tier 3 enables planned activity without disruption.", "Tier 4 is fault tolerant."], "r": "\u00a75.8 Table 5.4"}, {"id": "5-95", "ch": 5, "sec": "5.8", "q": "Which TIA-942 tier enables planned activity without disrupting computer hardware, but unplanned events will still cause disruption, with multiple power and cooling paths but only one active?", "o": ["Tier 3", "Tier 2", "Tier 4", "Tier 1"], "w": ["Correct. Tier 3 has 99.982% availability (1.6 hours) and takes 15 to 20 months.", "Tier 2 maintenance requires a processing shutdown.", "In Tier 4, unplanned events have no critical impact and multiple paths are ACTIVE.", "Tier 1 needs a full shutdown for maintenance."], "r": "\u00a75.8 Table 5.4"}, {"id": "5-96", "ch": 5, "sec": "5.8", "q": "Which is listed among the important threats to consider for data centers?", "o": ["Advanced persistent threats from targeted attacks", "Hash collisions in MD5-protected backups", "Rainbow tables built from stolen password files", "Classification creep in multilevel data"], "w": ["Correct. Others are DoS, privacy breaches, application exploits such as SQLi, malware, and physical security threats.", "Not listed for data centers.", "Not listed for data centers.", "That's BLP (Ch 4)."], "r": "\u00a75.8 Data Center Security Considerations"}, {"id": "5-97", "ch": 5, "sec": "5.4", "q": "The 2016 Trustwave Global Security Report listed SQL attacks as:", "o": ["One of the top two intrusion techniques", "The least common attack", "Irrelevant to PII", "Easy to prevent and hard to exploit"], "w": ["Correct. The report notes SQLi can be hard to prevent and relatively easy to exploit.", "Not stated.", "SQLi threatens PII and credit card data.", "It's the reverse."], "r": "\u00a75.4 SQL Injection Attacks"}, {"id": "5-98", "ch": 5, "sec": "5.4", "q": "In most SQLi attacks targeting Web applications, user input typically comes from:", "o": ["Form submissions sent to the Web application via HTTP GET or POST requests", "E-mail attachments opened by the database administrator on the server", "USB drives connected to the database server", "DNS queries made by the Web application"], "w": ["Correct. This is the 'user input' avenue.", "Not the typical source.", "Not the typical source.", "Not the typical source."], "r": "\u00a75.4 SQLi Attack Avenues and Types"}, {"id": "6-01", "ch": 6, "sec": "Ch 6 intro", "q": "NIST SP 800-83 defines malware as:", "o": ["A program inserted, usually covertly, to compromise the victim's data, applications, or OS", "Any software containing a bug that can be triggered to cause a system failure", "A program that replicates itself only through e-mail attachments sent to contacts", "Software that encrypts the victim's data for storage in legitimate backups"], "w": ["Correct. This is NIST SP 800-83's definition.", "Bugs aren't malware by definition.", "Malware uses many propagation mechanisms.", "That's not malware."], "r": "Ch 6 introduction"}, {"id": "6-02", "ch": 6, "sec": "6.1", "q": "One useful approach classifies malware into two broad categories based on:", "o": ["How it spreads or propagates to reach targets, and the actions or payloads it performs once a target is reached", "Its file size, the programming language it was written in, and the platform or operating system it targets", "Whether it is open source or proprietary, and how widely it has been distributed", "Its cost on underground markets and the identity of its author"], "w": ["Correct. The two categories are propagation and payload.", "This is not the classification.", "This is not the classification.", "This is not the classification."], "r": "\u00a76.1 A Broad Classification of Malware"}, {"id": "6-03", "ch": 6, "sec": "6.1", "q": "Earlier malware classifications distinguished between malware needing a host program (parasitic code) and independent, self-contained programs. Which is an example of PARASITIC code?", "o": ["Viruses", "Worms", "Trojans", "Bots"], "w": ["Correct. Viruses need a host program.", "Worms are independent programs.", "Trojans are independent programs.", "Bots are independent programs."], "r": "\u00a76.1 A Broad Classification of Malware"}, {"id": "6-04", "ch": 6, "sec": "6.1", "q": "Which pair is given as malware that does NOT replicate, in the earlier classification?", "o": ["Trojans and spam e-mail", "Viruses and worms", "Worms and bots", "Macro viruses and worms"], "w": ["Correct. Viruses and worms DO replicate.", "These DO replicate.", "Worms replicate.", "Both replicate."], "r": "\u00a76.1 A Broad Classification of Malware"}, {"id": "6-05", "ch": 6, "sec": "6.1", "q": "Which of the following is NOT one of the payload actions listed for malware?", "o": ["Patching vulnerable software", "Corruption of system or data files", "Theft of service to make the system a zombie agent in a botnet", "Stealthing, hiding its presence from detection"], "w": ["Correct. Patching is not a payload. The listed payloads are corruption, theft of service (zombie/botnet), information theft (keylogging/spyware), and stealthing.", "Corruption of files IS a listed payload.", "Theft of service IS a listed payload.", "Stealthing IS a listed payload."], "r": "\u00a76.1 A Broad Classification of Malware"}, {"id": "6-06", "ch": 6, "sec": "6.1", "q": "An attack that uses multiple methods of infection or propagation to maximize the speed of contagion and the severity of the attack is called a:", "o": ["Blended attack", "Zero-day exploit", "Logic bomb", "Watering-hole attack"], "w": ["Correct. Some malware also supports updates to change its propagation and payload mechanisms after deployment.", "A zero-day is an unknown vulnerability.", "A logic bomb is a trigger condition.", "A watering-hole attack compromises sites the victims are likely to visit."], "r": "\u00a76.1 A Broad Classification of Malware"}, {"id": "6-07", "ch": 6, "sec": "6.1", "q": "In Table 6.1, code that installs other items on a machine under attack, normally included in the malware first inserted to then import a larger malware package, is a(n):", "o": ["Downloader", "Auto-rooter", "Exploit", "Flooder"], "w": ["Correct. This is the downloader.", "Auto-rooters are tools used to break into new machines remotely.", "Exploits are code specific to a vulnerability or set of vulnerabilities.", "Flooders (DoS clients) generate large volumes of data to attack systems."], "r": "\u00a76.1 Table 6.1"}, {"id": "6-08", "ch": 6, "sec": "6.1", "q": "In Table 6.1, 'malicious hacker tools used to break into new machines remotely' describes:", "o": ["Auto-rooter", "Rootkit", "Backdoor", "Attack kit"], "w": ["Correct. This is the auto-rooter.", "A rootkit is a set of tools used AFTER gaining root access.", "A backdoor bypasses a normal security check.", "An attack kit generates new malware automatically."], "r": "\u00a76.1 Table 6.1"}, {"id": "6-09", "ch": 6, "sec": "6.1", "q": "In Table 6.1, a set of hacker tools used after an attacker has broken into a computer system and gained root-level access is a:", "o": ["Rootkit", "Auto-rooter", "Downloader", "Keylogger"], "w": ["Correct. This is the rootkit.", "Auto-rooters break in.", "Downloaders import packages.", "Keyloggers capture keystrokes."], "r": "\u00a76.1 Table 6.1"}, {"id": "6-10", "ch": 6, "sec": "6.1", "q": "Advertising that is integrated into software, which can result in pop-up ads or redirection of a browser to a commercial site, is:", "o": ["Adware", "Spyware", "Mobile code", "Spammer program"], "w": ["Correct. This is adware.", "Spyware collects and transmits information.", "Mobile code is portable software executed with identical semantics.", "Spammer programs send unwanted e-mail."], "r": "\u00a76.1 Table 6.1"}, {"id": "6-11", "ch": 6, "sec": "6.1", "q": "Virus-creation toolkits (early 1990s) and attack kits (2000s), often known as crimeware, had what major effect?", "o": ["They greatly enlarged the population of attackers able to deploy malware, even novices", "They made malware far more sophisticated than custom-built malware written from scratch", "They eliminated zero-day exploits", "They made malware easier to detect"], "w": ["Correct. Toolkit malware tends to be less sophisticated, but the sheer number of variants is a significant problem.", "Toolkit malware tends to be LESS sophisticated than malware written from scratch.", "No; kits are often customized with newly discovered vulnerabilities.", "The volume of variants makes defense harder."], "r": "\u00a76.1 Attack Kits"}, {"id": "6-12", "ch": 6, "sec": "6.1", "q": "Which crimeware toolkit is a prominent example, used to generate stealthed malware for capturing and exploiting banking credentials?", "o": ["Zeus", "Angler", "Stuxnet", "Melissa"], "w": ["Correct. Zeus is the banking-credential crimeware example.", "Angler is an exploit kit first seen in 2013 and the most active in 2015, often distributed via malvertising exploiting Flash.", "Stuxnet is a worm.", "Melissa is an e-mail worm and macro virus."], "r": "\u00a76.1 Attack Kits"}, {"id": "6-13", "ch": 6, "sec": "6.1", "q": "The Angler exploit kit, the most active kit seen in 2015, was often distributed via:", "o": ["Malvertising that exploited Flash vulnerabilities", "Infected USB drives left in organizations' parking lots", "Bluetooth connections between nearby smartphones", "Spam faxes containing links to exploit pages"], "w": ["Correct. Angler was sophisticated both in its attacks and in its countermeasures against detection.", "Not the stated method.", "Not the stated method.", "Not the stated method."], "r": "\u00a76.1 Attack Kits"}, {"id": "6-14", "ch": 6, "sec": "6.2", "q": "What are Advanced Persistent Threats (APTs), according to the textbook?", "o": ["The well-resourced, persistent use of many intrusion tools against selected targets", "A specific virus family attributed to state-sponsored organizations", "A type of rootkit that lives in the BIOS of targeted systems", "Large spam e-mail campaigns sent by botnets for hire"], "w": ["Correct. They are usually aimed at business or political targets and typically attributed to state-sponsored organizations.", "APTs are not one malware family.", "Not the definition.", "Not the definition."], "r": "\u00a76.2 Advanced Persistent Threat"}, {"id": "6-15", "ch": 6, "sec": "6.2", "q": "In APT, what does 'Advanced' mean?", "o": ["Using a wide variety of intrusion tools and malware, chosen to suit the target", "Every component of the attack uses cutting-edge, previously unknown techniques", "The attack relies only on zero-day exploits that no defender has seen", "The attacker is always an expert-level hacker working alone"], "w": ["Correct. Components are selected to fit the target.", "The book says the components may NOT necessarily be technically advanced.", "Not required.", "Not the definition."], "r": "\u00a76.2 Advanced Persistent Threat"}, {"id": "6-16", "ch": 6, "sec": "6.2", "q": "In APT, what does 'Persistent' refer to?", "o": ["Determined attacks over an extended period to maximize the chance of success", "Malware that survives reboots by storing itself in the registry", "Continuous flooding traffic directed at the target's servers", "Attacks that never rely on social engineering of personnel"], "w": ["Correct. A variety of attacks may be applied progressively, often stealthily, until the target is compromised.", "That's a persistent ROOTKIT characteristic, not the APT meaning.", "Not the meaning.", "APTs heavily use social engineering."], "r": "\u00a76.2 Advanced Persistent Threat"}, {"id": "6-17", "ch": 6, "sec": "6.2", "q": "Which high-profile attacks are cited as APT examples?", "o": ["Aurora, RSA, APT1, and Stuxnet", "Melissa, Code Red, and Nimda", "Morris worm and Brain virus", "WannaCry and Mydoom"], "w": ["Correct. These four are cited.", "These are worms from the 1998\u20132001 era.", "These are early malware.", "These are not cited as APT examples."], "r": "\u00a76.2 Advanced Persistent Threat"}, {"id": "6-18", "ch": 6, "sec": "6.2", "q": "Which techniques are used in APT attacks to gain initial access?", "o": ["Social engineering, spear-phishing, supply-chain attacks, and drive-by-downloads", "Only brute-force password attacks against the target's external services", "Only physical break-ins to install malware directly on target systems", "Only SQL injection against the target's public Web applications"], "w": ["Correct. These are the listed techniques.", "Too narrow.", "Not stated.", "Not stated."], "r": "\u00a76.2 Advanced Persistent Threat"}, {"id": "6-19", "ch": 6, "sec": "6.2", "q": "Since some APT attacks will succeed even with best-practice countermeasures, what does the textbook recommend?", "o": ["Multiple layers of defense that detect, respond to, and mitigate attacks", "Rely solely on host-based anti-virus software kept fully up to date", "Disconnect critical systems from the Internet entirely", "Ignore APTs, since they are rare and target only governments"], "w": ["Correct. Awareness training is also needed.", "This is insufficient.", "Not recommended.", "Not stated."], "r": "\u00a76.2 Advanced Persistent Threat"}, {"id": "6-20", "ch": 6, "sec": "6.3", "q": "A computer virus is a piece of software that:", "o": ["Can infect other executable content by modifying it to include a copy of itself", "Runs independently and actively seeks out more machines to infect over the network", "Is controlled remotely by a command-and-control server to launch attacks", "Only hides other malware on the system to provide covert access"], "w": ["Correct. A virus is a parasitic software fragment that attaches to existing executable content.", "That's a WORM.", "That's a BOT.", "That's a rootkit or stealth payload."], "r": "\u00a76.3 The Nature of Viruses"}, {"id": "6-21", "ch": 6, "sec": "6.3", "q": "To whom is the term 'computer virus' attributed?", "o": ["Fred Cohen", "Robert Morris", "John Brunner", "Ron Rivest"], "w": ["Correct. Viruses first appeared in the early 1980s, and Cohen wrote a groundbreaking book on them.", "Morris released the 1988 worm.", "Brunner's 1975 novel introduced the WORM concept.", "Rivest co-invented RSA."], "r": "\u00a76.3 The Nature of Viruses"}, {"id": "6-22", "ch": 6, "sec": "6.3", "q": "Which virus, first seen in 1986, was one of the first to target MS-DOS systems?", "o": ["Brain", "Chernobyl", "Melissa", "Klez"], "w": ["Correct. Brain resulted in a significant number of infections for its time.", "Chernobyl appeared in 1998 (Windows 95/98).", "Melissa appeared in 1998.", "Klez appeared in 2001."], "r": "\u00a76.3 The Nature of Viruses"}, {"id": "6-23", "ch": 6, "sec": "6.3", "q": "One reason viruses dominated the malware scene in earlier years was:", "o": ["The lack of user authentication and access controls on personal computer systems at the time", "The widespread use of network firewalls that blocked the other kinds of malware at the time", "Encrypted file systems that hid viruses from scanners", "Mandatory access control on personal computers"], "w": ["Correct. Programs were also widely shared on floppy disks.", "Firewalls would hinder viruses, not help them.", "Not stated.", "Not stated."], "r": "\u00a76.3 The Nature of Viruses"}, {"id": "6-24", "ch": 6, "sec": "6.3", "q": "According to [AYCO06], a computer virus has three parts. Which is the event or condition that determines when the payload is activated, sometimes known as a logic bomb?", "o": ["Trigger", "Infection mechanism", "Payload", "Mutation engine"], "w": ["Correct. This is the trigger.", "The infection mechanism (infection vector) is how the virus spreads.", "The payload is what the virus does besides spreading.", "A mutation engine is part of polymorphic viruses."], "r": "\u00a76.3 The Nature of Viruses"}, {"id": "6-25", "ch": 6, "sec": "6.3", "q": "The means by which a virus spreads or propagates, enabling it to replicate, is also referred to as the:", "o": ["Infection vector", "Payload", "Trigger", "Virus signature"], "w": ["Correct. The infection mechanism is also called the infection vector.", "The payload is what the virus does.", "The trigger is the activation condition.", "A signature is used by scanners."], "r": "\u00a76.3 The Nature of Viruses"}, {"id": "6-26", "ch": 6, "sec": "6.3", "q": "Which correctly lists the four phases of a typical virus's lifetime, in order?", "o": ["Dormant, propagation, triggering, execution", "Infection, trigger, payload, removal", "Scanning, exploitation, replication, exfiltration", "Propagation, dormant, execution, triggering"], "w": ["Correct. Not all viruses have a dormant phase.", "These are not the phases.", "These are not the phases.", "Wrong order."], "r": "\u00a76.3 The Nature of Viruses"}, {"id": "6-27", "ch": 6, "sec": "6.3", "q": "In which virus phase does the virus place a copy of itself into other programs or system areas, possibly not identical to the original, in order to evade detection?", "o": ["Propagation phase", "Dormant phase", "Triggering phase", "Execution phase"], "w": ["Correct. Viruses often morph to evade detection.", "In the dormant phase the virus is idle.", "In the triggering phase the virus is activated.", "In the execution phase the function is performed."], "r": "\u00a76.3 The Nature of Viruses"}, {"id": "6-28", "ch": 6, "sec": "6.3", "q": "Why does the textbook say virus prevention is 'extraordinarily difficult'?", "o": ["A virus can be part of any program brought in from outside the system", "Viruses cannot be detected by any anti-virus approach", "Viruses only infect hardware, which software cannot protect", "Access controls make no difference to how viruses spread"], "w": ["Correct. Many infections can still be blocked by denying normal users the right to modify programs.", "Viruses can be detected.", "Viruses infect software.", "Access controls DO help."], "r": "\u00a76.3 The Nature of Viruses"}, {"id": "6-29", "ch": 6, "sec": "6.3", "q": "NISTIR 7298 defines a macro virus as a virus that:", "o": ["Attaches to documents and uses the application's macro language to run and spread", "Infects a master boot record and spreads when the system boots", "Rewrites itself completely at each iteration, changing its behavior", "Infects files in multiple ways, so every site must be cleaned"], "w": ["Correct. This is NISTIR 7298's definition.", "That's a boot sector infector.", "That's a metamorphic virus.", "That's a multipartite virus."], "r": "\u00a76.3 Macro and Scripting Viruses"}, {"id": "6-30", "ch": 6, "sec": "6.3", "q": "Which is a reason macro viruses are particularly threatening?", "o": ["They are platform independent, running wherever the host application runs", "They only infect executable code, which is shared more often than documents", "They are very hard to write, so only expert attackers can create them", "Traditional file access controls are highly effective at stopping them"], "w": ["Correct. They also infect documents rather than programs, spread easily through normal sharing, and are easy to write or modify.", "They infect DOCUMENTS, not executable portions of code.", "They are much EASIER to write than traditional viruses.", "Users are expected to modify documents, so file access controls are of LIMITED use."], "r": "\u00a76.3 Macro and Scripting Viruses"}, {"id": "6-31", "ch": 6, "sec": "6.3", "q": "How did Office 2000 improve macro security?", "o": ["By letting authors digitally sign macros and warning about unsigned or untrusted ones", "By removing macro support from Office documents entirely", "By encrypting all Office documents so that the macros inside them cannot be altered", "By requiring biometric login before any macro could run"], "w": ["Correct. Users were advised to disable macros in that case.", "Not removed.", "Not described.", "Not described."], "r": "\u00a76.3 Macro and Scripting Viruses"}, {"id": "6-32", "ch": 6, "sec": "6.3", "q": "In the Melissa macro virus pseudo-code (Figure 6.1), which macro contains the virus code and runs automatically when a document is opened?", "o": ["Document_Open", "AutoExec", "Document_Close", "Normal_Start"], "w": ["Correct. It disables the Macro menu, copies itself to the global (Normal) template, and e-mails the first 50 Address Book entries if the 'Melissa' registry key is absent.", "Not the macro cited.", "Not the macro cited.", "Not the macro cited."], "r": "\u00a76.3 Macro Virus Structure; Figure 6.1"}, {"id": "6-33", "ch": 6, "sec": "6.3", "q": "When the Melissa macro virus ran and Outlook was the e-mail client, to whom did it send a copy of the infected document?", "o": ["The first 50 addresses in the current user's Address Book", "Every address in the current user's Address Book", "A single hard-coded address belonging to the author", "No one; it spread only through shared USB drives"], "w": ["Correct. It then created a 'Melissa' registry entry so this happened only once per system.", "Only the first 50.", "Not described.", "It used e-mail."], "r": "\u00a76.3 Macro Virus Structure"}, {"id": "6-34", "ch": 6, "sec": "6.3", "q": "[AYCO06] classifies viruses along two orthogonal axes. What are they?", "o": ["The target the virus infects, and how it conceals itself", "The size of the virus and the speed at which it spreads", "The author of the virus and the date it was first seen", "The operating system and the hardware platform it targets"], "w": ["Correct. Target classes are boot sector, file infector, macro, and multipartite. Concealment classes are encrypted, stealth, polymorphic, and metamorphic.", "Not the axes.", "Not the axes.", "Not the axes."], "r": "\u00a76.3 Viruses Classification"}, {"id": "6-35", "ch": 6, "sec": "6.3", "q": "A virus that infects a master boot record or boot record and spreads when a system is booted from the disk containing the virus is a:", "o": ["Boot sector infector", "File infector", "Multipartite virus", "Macro virus"], "w": ["Correct. This is a boot sector infector.", "A file infector infects files the OS or shell considers executable.", "A multipartite virus infects files in multiple ways.", "A macro virus infects macro or scripting code."], "r": "\u00a76.3 Viruses Classification"}, {"id": "6-36", "ch": 6, "sec": "6.3", "q": "A virus capable of infecting multiple types of files, so that eradication must deal with all possible sites of infection, is a:", "o": ["Multipartite virus", "Polymorphic virus", "Stealth virus", "Boot sector infector"], "w": ["Correct. This is a multipartite virus.", "Polymorphism concerns changing appearance.", "Stealth concerns hiding from anti-virus software.", "A boot sector infector targets boot records only."], "r": "\u00a76.3 Viruses Classification"}, {"id": "6-37", "ch": 6, "sec": "6.3", "q": "A virus in which a portion creates a random encryption key and encrypts the remainder, storing the key with the virus and choosing a different key on each replication, is a(n):", "o": ["Encrypted virus", "Metamorphic virus", "Macro virus", "File infector"], "w": ["Correct. No constant bit pattern is left to observe.", "A metamorphic virus REWRITES itself completely.", "A macro virus is classified by target.", "A file infector is classified by target."], "r": "\u00a76.3 Viruses Classification"}, {"id": "6-38", "ch": 6, "sec": "6.3", "q": "A virus explicitly designed to hide itself from anti-virus software, so that the entire virus, not just a payload, is hidden, possibly using code mutation, compression, or rootkit techniques, is a:", "o": ["Stealth virus", "Encrypted virus", "Polymorphic virus", "Multipartite virus"], "w": ["Correct. This is a stealth virus.", "An encrypted virus uses encryption to obscure its content.", "A polymorphic virus creates functionally equivalent copies with different bit patterns.", "A multipartite virus infects multiple file types."], "r": "\u00a76.3 Viruses Classification"}, {"id": "6-39", "ch": 6, "sec": "6.3", "q": "A virus that creates functionally equivalent copies with distinctly different bit patterns during replication, so its 'signature' varies with each copy, is a:", "o": ["Polymorphic virus", "Metamorphic virus", "Stealth virus", "Boot sector infector"], "w": ["Correct. It may insert superfluous instructions, reorder independent instructions, or use encryption via a mutation engine.", "A metamorphic virus rewrites itself completely and may change BEHAVIOR too.", "Not the specific definition.", "Classified by target, not concealment."], "r": "\u00a76.3 Viruses Classification"}, {"id": "6-40", "ch": 6, "sec": "6.3", "q": "In a polymorphic virus, the portion responsible for generating keys and performing encryption/decryption, which is itself altered with each use, is the:", "o": ["Mutation engine", "Infection vector", "Trigger", "Payload"], "w": ["Correct. This is the mutation engine.", "The infection vector is the spread mechanism.", "The trigger is the activation condition.", "The payload is the action performed."], "r": "\u00a76.3 Viruses Classification"}, {"id": "6-41", "ch": 6, "sec": "6.3", "q": "How does a metamorphic virus differ from a polymorphic virus?", "o": ["It rewrites itself completely each time and may change its behavior too", "It never mutates, relying on stealth techniques instead", "It only infects boot sectors, while polymorphic viruses infect files", "It uses a fixed encryption key, so its encrypted body never changes"], "w": ["Correct. This increases the difficulty of detection.", "Both mutate.", "Not related.", "Not related."], "r": "\u00a76.3 Viruses Classification"}, {"id": "6-42", "ch": 6, "sec": "6.4", "q": "A worm is:", "o": ["A program that actively seeks out more machines to infect from each infected host", "A virus that infects documents using macro code", "A program that requires a host program to run", "A hidden entry point into a program that bypasses normal security checks"], "w": ["Correct. Worms exploit software vulnerabilities in client or server programs.", "That's a macro virus.", "Worms are independent.", "That's a backdoor."], "r": "\u00a76.4 Propagation\u2014Vulnerability Exploit\u2014Worms"}, {"id": "6-43", "ch": 6, "sec": "6.4", "q": "The concept of a computer worm was introduced in:", "o": ["John Brunner's 1975 SF novel The Shockwave Rider", "Fred Cohen's groundbreaking book on computer viruses", "Robert Morris's 1988 paper describing his Internet worm", "The 1983 movie War Games"], "w": ["Correct. The first known worm implementation was at Xerox Palo Alto Labs in the early 1980s and was nonmalicious.", "Cohen is associated with viruses.", "Morris released a worm. He didn't introduce the concept.", "War Games (1983) is the backdoor example."], "r": "\u00a76.4 Worms"}, {"id": "6-44", "ch": 6, "sec": "6.4", "q": "A worm copies itself (or infects files) on removable media such as a USB drive, then executes via autorun, a software vulnerability, or a user opening the file. This replication method is:", "o": ["File sharing", "Remote execution capability", "Remote login capability", "Electronic mail or instant messenger facility"], "w": ["Correct. This is the file sharing method.", "Remote execution executes a copy on another system via a facility or a flaw.", "Remote login logs on as a user and copies itself.", "E-mail/IM sends itself as a message or attachment."], "r": "\u00a76.4 Worms"}, {"id": "6-45", "ch": 6, "sec": "6.4", "q": "During its propagation phase, how does a worm search for access mechanisms on other systems?", "o": ["By examining host tables, address books, and trusted peers, or by scanning addresses", "By waiting for the user to open an e-mail attachment that contains it", "By reading the BIOS to find network adapters on the local machine", "By asking the command-and-control server for a list of targets only"], "w": ["Correct. It then transfers a copy and causes it to run.", "That describes e-mail viruses or Trojans.", "Not described.", "Not described."], "r": "\u00a76.4 Worms"}, {"id": "6-46", "ch": 6, "sec": "6.4", "q": "The first function in a network worm's propagation phase, searching for other systems to infect, is known as:", "o": ["Scanning or fingerprinting", "Phishing or spear-phishing", "Exfiltration", "Stealthing"], "w": ["Correct. This is scanning or fingerprinting.", "Phishing is social engineering.", "Exfiltration is data theft.", "Stealthing is hiding."], "r": "\u00a76.4 Target Discovery"}, {"id": "6-47", "ch": 6, "sec": "6.4", "q": "Which worm scanning strategy first compiles a long list of potential vulnerable machines, possibly slowly to avoid detection, then gives each infected machine a portion of the list, resulting in a very short scanning period?", "o": ["Hit-list", "Random", "Topological", "Local subnet"], "w": ["Correct. This is hit-list scanning [MIRK04].", "Random scanning probes random IP addresses with different seeds and generates high traffic volume.", "Topological scanning uses information on the infected machine to find more hosts.", "Local sub
