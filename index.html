 NIST model, but the two functions of authentication are identification and verification."], "r": "Ch 3 introduction"}, {"id": "3-03", "ch": 3, "sec": "Ch 3 intro", "q": "Which statement best distinguishes identification from authentication?", "o": ["Identification provides a claimed identity; authentication establishes the validity of that claim", "Identification uses secret information, while authentication uses public information", "Identification relies on biometrics, while authentication relies on passwords", "They are synonyms; both mean verifying who the user really is"], "w": ["Correct. In the Alice example, her ID (ABTOKLAS) is not secret, but her password is, so no one can pretend to be Alice.", "It's the reverse: the ID is generally not secret, and the authentication information (such as a password) is.", "Either can involve various methods.", "The book defines them as distinct."], "r": "Ch 3 introduction"}, {"id": "3-04", "ch": 3, "sec": "3.1", "q": "NIST SP 800-63-3 defines digital user authentication as:", "o": ["Determining the validity of one or more authenticators used to claim a digital identity", "A unique representation of a subject engaged in an online transaction", "The process of issuing credentials and tokens to registered subscribers", "Verifying that the contents of a received message have not been altered"], "w": ["Correct. Authentication establishes that a subject has control of those authenticators.", "That is the definition of a DIGITAL IDENTITY.", "Issuing credentials is the CSP's registration role.", "That is message authentication (Ch 2)."], "r": "\u00a73.1 Digital User Authentication Principles"}, {"id": "3-05", "ch": 3, "sec": "3.1", "q": "Table 3.1 (from NIST SP 800-171) lists 'Use multifactor authentication for local and network access to privileged accounts and for network access to non-privileged accounts' as a:", "o": ["Derived security requirement", "Basic security requirement", "Assurance level", "Credential type"], "w": ["Correct. The two BASIC requirements are to identify users, processes, and devices and to authenticate them. MFA is the first DERIVED requirement.", "The basic requirements are only identify and authenticate.", "Assurance levels (IAL/AAL) come from SP 800-63-3, not Table 3.1.", "This is a requirement, not a credential type."], "r": "\u00a73.1 Table 3.1"}, {"id": "3-06", "ch": 3, "sec": "3.1", "q": "Which of the following is a derived security requirement in Table 3.1 (NIST SP 800-171)?", "o": ["Obscure feedback of authentication information", "Encrypt all data at rest with AES-256", "Require biometrics for all accounts", "Use smart cards for remote access"], "w": ["Correct. Others include replay-resistant mechanisms, preventing reuse of identifiers, disabling identifiers after inactivity, password complexity, prohibiting password reuse, temporary passwords, and storing and transmitting only cryptographically protected passwords.", "This is not in Table 3.1.", "This is not in Table 3.1.", "This is not in Table 3.1."], "r": "\u00a73.1 Table 3.1"}, {"id": "3-07", "ch": 3, "sec": "3.1", "q": "In the NIST SP 800-63-3 authentication model, which trusted entity establishes and vouches for the identity of an applicant to a credential service provider (CSP)?", "o": ["Registration authority (RA)", "Relying party (RP)", "Verifier", "Claimant"], "w": ["Correct. The applicant applies to an RA to become a subscriber of a CSP.", "The RP uses the verifier's assertion to make access control or authorization decisions.", "The verifier verifies a claimant's identity during authentication.", "The claimant is the party to be authenticated."], "r": "\u00a73.1 A Model for Digital User Authentication; Figure 3.1"}, {"id": "3-08", "ch": 3, "sec": "3.1", "q": "In the NIST model, a data structure that authoritatively binds an identity and additional attributes to a token possessed by a subscriber is called a:", "o": ["Credential", "Assertion", "Template", "Nonce"], "w": ["Correct. The CSP issues the credential, which can be verified when presented to the verifier.", "An assertion is what the verifier passes to the relying party about the subscriber's identity.", "A template is the stored biometric feature set.", "A nonce is a random number used in challenge-response protocols."], "r": "\u00a73.1 Figure 3.1"}, {"id": "3-09", "ch": 3, "sec": "3.1", "q": "In the NIST model, the party to be authenticated is called the ______ and the party verifying that identity is the ______.", "o": ["Claimant; verifier", "Subscriber; registration authority", "Applicant; relying party", "Relying party; CSP"], "w": ["Correct. When the claimant demonstrates possession and control of a token, the verifier confirms it is the subscriber named in the credential.", "The RA handles registration, not verification during authentication.", "An applicant is someone not yet registered, and the RP consumes assertions.", "These roles are reversed and mismatched."], "r": "\u00a73.1 Figure 3.1"}, {"id": "3-10", "ch": 3, "sec": "3.1", "q": "The verifier passes an assertion about the identity of the subscriber to the:", "o": ["Relying party (RP)", "Registration authority (RA)", "Claimant", "Credential service provider (CSP)"], "w": ["Correct. The RP uses the authenticated information to make access control or authorization decisions.", "The RA is involved at registration, not after verification.", "The claimant is the one being verified.", "The CSP issues credentials. The assertion goes to the RP."], "r": "\u00a73.1 Figure 3.1"}, {"id": "3-11", "ch": 3, "sec": "3.1", "q": "Electronic keycards, smart cards, and physical keys are examples of which means of authentication?", "o": ["Something the individual possesses (a token)", "Something the individual knows", "Something the individual is (static biometrics)", "Something the individual does (dynamic biometrics)"], "w": ["Correct. This type of authenticator is referred to as a token.", "Something you know means a password, PIN, or answers to prearranged questions.", "Something you are means fingerprint, retina, or face.", "Something you do means voice pattern, handwriting, or typing rhythm."], "r": "\u00a73.1 Means of Authentication"}, {"id": "3-12", "ch": 3, "sec": "3.1", "q": "Recognition by voice pattern, handwriting characteristics, and typing rhythm is an example of:", "o": ["Something the individual does (dynamic biometrics)", "Something the individual is (static biometrics)", "Something the individual knows", "Something the individual possesses"], "w": ["Correct. These are dynamic biometrics.", "Static biometrics are fingerprint, retina, and face.", "Knowledge factors are passwords and PINs.", "Possession factors are tokens."], "r": "\u00a73.1 Means of Authentication"}, {"id": "3-13", "ch": 3, "sec": "3.1", "q": "An online banking system requires a password and then a code sent by SMS to the user's mobile phone. This combination uses:", "o": ["Something they know and something they possess", "Something they are and something they do", "Two knowledge factors", "Two possession factors"], "w": ["Correct. This is the book's MFA example: the password is something known, and the phone receiving the SMS is something possessed.", "No biometrics are involved.", "The phone is a possession factor.", "The password is a knowledge factor."], "r": "\u00a73.1 Multifactor Authentication"}, {"id": "3-14", "ch": 3, "sec": "3.1", "q": "According to the textbook, the most common form of MFA used by larger organizations to verify their staff uses:", "o": ["A physical token, often a one-time password (OTP) device", "Iris recognition at workstations for every staff login", "Security questions answered in addition to the password", "SMS messages sent to staff members' personal phones"], "w": ["Correct. Staff provide a login and password, then the OTP code from the token.", "Biometrics are not cited as the most common form.", "Security questions are a knowledge factor, not the cited form.", "For the GENERAL PUBLIC, MFA most commonly uses a mobile device (SMS/voice or an authenticator app)."], "r": "\u00a73.1 Multifactor Authentication"}, {"id": "3-15", "ch": 3, "sec": "3.1", "q": "Which finding from the [LBJR11] survey of organizations' use of MFA does the textbook report?", "o": ["User resistance to MFA was not an issue once it was adopted, and tokens were more common than biometrics", "The health sector had the highest MFA acceptance rate, ahead of both the defense and the government sectors", "Biometrics were the most common MFA factor, ahead of tokens", "Government mandates and public perception discouraged MFA adoption"], "w": ["Correct. Defense and government also had higher acceptance than the health sector, and government mandates and public perception encouraged adoption.", "Defense and government had higher acceptance than health.", "Tokens were more common than biometrics.", "Mandates ENCOURAGED adoption."], "r": "\u00a73.1 Multifactor Authentication"}, {"id": "3-16", "ch": 3, "sec": "3.1", "q": "Even with MFA, the textbook notes that authentication remains vulnerable in particular to:", "o": ["Social engineering or phishing attacks, and malware that intercepts authentication codes", "Brute-force attacks against the AES keys used by the authenticator to protect stored codes", "Hash collisions in the SHA-3 functions used to protect codes", "Traffic analysis of the timing of authentication messages"], "w": ["Correct. These concerns are discussed further in Chapter 6.", "This is not the stated vulnerability.", "This is not mentioned.", "This is not the stated concern."], "r": "\u00a73.1 Multifactor Authentication"}, {"id": "3-17", "ch": 3, "sec": "3.1", "q": "NIST SP 800-63-3 defines three levels for each of which two assurance types?", "o": ["Identity Assurance Level (IAL) and Authenticator Assurance Level (AAL)", "Confidentiality Assurance Level and Integrity Assurance Level", "Low, moderate, and high impact levels from FIPS 199", "Token Assurance Level and Biometric Assurance Level"], "w": ["Correct. There are IAL1\u20133 and AAL1\u20133.", "These are not SP 800-63-3 assurance types.", "These are FIPS 199 impact levels (Ch 1).", "These are not the defined types."], "r": "\u00a73.1 Assurance Levels for User Authentication"}, {"id": "3-18", "ch": 3, "sec": "3.1", "q": "A consumer registers to participate in a discussion on an organization's website discussion board. All attributes are self-asserted. Which IAL is appropriate?", "o": ["IAL1", "IAL2", "IAL3", "AAL1"], "w": ["Correct. IAL1 has no requirement to link the applicant to a specific real-life identity.", "IAL2 requires evidence supporting the claimed identity, with remote or physically present proofing.", "IAL3 requires physical presence and verification by a trained CSP representative.", "AAL is an AUTHENTICATOR assurance level, not identity proofing."], "r": "\u00a73.1 Assurance Levels"}, {"id": "3-19", "ch": 3, "sec": "3.1", "q": "A law enforcement official accesses a database containing criminal records. Identity proofing requires physical presence, with attributes verified by an authorized and trained CSP representative. This is:", "o": ["IAL3", "IAL2", "IAL1", "AAL2"], "w": ["Correct. IAL3 is for access to restricted, high-value services where improper access is very harmful.", "IAL2 allows remote OR physically present proofing.", "IAL1 means self-asserted attributes.", "AAL2 concerns authenticators, not identity proofing."], "r": "\u00a73.1 Assurance Levels"}, {"id": "3-20", "ch": 3, "sec": "3.1", "q": "Which Authenticator Assurance Level requires proof of possession and control of TWO DISTINCT authentication factors through secure protocols using approved cryptographic techniques?", "o": ["AAL2", "AAL1", "AAL3", "IAL2"], "w": ["Correct. AAL2 provides high confidence through two distinct factors.", "AAL1 provides some assurance and typically uses an ID and password.", "AAL3 provides very high confidence and requires a hardware-based authenticator with verifier impersonation resistance.", "IAL concerns identity proofing."], "r": "\u00a73.1 Assurance Levels"}, {"id": "3-21", "ch": 3, "sec": "3.1", "q": "Which AAL requires a hardware-based authenticator and an authenticator that provides verifier impersonation resistance?", "o": ["AAL3", "AAL2", "AAL1", "IAL3"], "w": ["Correct. AAL3 is based on proof of possession of a key through an approved cryptographic protocol.", "AAL2 requires two distinct factors but not necessarily hardware-based ones.", "AAL1 is typically ID and password.", "IAL3 is about identity proofing with physical presence."], "r": "\u00a73.1 Assurance Levels"}, {"id": "3-22", "ch": 3, "sec": "3.2", "q": "In password-based authentication, the user ID provides security in several ways. Which is one of them?", "o": ["The ID determines the privileges accorded to the user", "The ID encrypts the password", "The ID is secret and therefore authenticates the user", "The ID replaces the need for a salt"], "w": ["Correct. The ID also determines whether the user is authorized to access the system and is used in discretionary access control.", "IDs don't encrypt passwords.", "IDs are generally not secret. The password authenticates the ID.", "The salt is a separate mechanism."], "r": "\u00a73.2 Password-Based Authentication"}, {"id": "3-23", "ch": 3, "sec": "3.2", "q": "An attacker obtains the system password file and compares the password hashes against hashes of commonly used passwords. This is a(n):", "o": ["Offline dictionary attack", "Specific account attack", "Popular password attack", "Workstation hijacking"], "w": ["Correct. Countermeasures include controls preventing unauthorized access to the password file, intrusion detection to identify a compromise, and rapid reissuance of passwords.", "A specific account attack submits online guesses against one account.", "A popular password attack tries one popular password against many IDs.", "Workstation hijacking means using an unattended, logged-in workstation."], "r": "\u00a73.2 The Vulnerability of Passwords"}, {"id": "3-24", "ch": 3, "sec": "3.2", "q": "What is the standard countermeasure for a specific account attack, in which the attacker targets one account and submits guesses?", "o": ["An account lockout mechanism, typically after no more than five failed attempts", "Salting the password file so that each guess must be repeated per salt", "Automatically logging the workstation out after a period of inactivity", "Moving hashed passwords into a protected shadow password file"], "w": ["Correct. Typical practice is no more than five access attempts.", "Salting counters offline dictionary attacks.", "Automatic logout counters workstation hijacking.", "Shadow files protect the hashed passwords from being read."], "r": "\u00a73.2 The Vulnerability of Passwords"}, {"id": "3-25", "ch": 3, "sec": "3.2", "q": "An attacker tries a single popular password against a wide range of user IDs. Which countermeasure does the textbook list?", "o": ["Policies inhibiting common passwords, plus scanning request IPs and client cookies", "Account lockout after five failed attempts on each targeted account", "Automatically logging out workstations after a period of inactivity", "Using the DES-based crypt(3) routine with a 12-bit salt"], "w": ["Correct. These are the countermeasures for a popular password attack.", "Lockout targets a SPECIFIC account attack. Spreading guesses across many IDs avoids per-account lockout.", "That addresses workstation hijacking.", "crypt(3) is an old hashing scheme, not a countermeasure."], "r": "\u00a73.2 The Vulnerability of Passwords"}, {"id": "3-26", "ch": 3, "sec": "3.2", "q": "An attacker waits until a logged-in workstation is unattended. What is the standard countermeasure?", "o": ["Automatically logging the workstation out after a period of inactivity", "Account lockout after a set number of failed login attempts on that account", "A Bloom filter that rejects guessable passwords", "Precomputed rainbow tables of likely password hashes"], "w": ["Correct. Intrusion detection can also detect changes in user behavior.", "Lockout addresses guessing attacks.", "A Bloom filter is for proactive password checking.", "Rainbow tables are an ATTACK technique."], "r": "\u00a73.2 The Vulnerability of Passwords"}, {"id": "3-27", "ch": 3, "sec": "3.2", "q": "Why does the textbook say simple encryption will NOT fix the electronic monitoring threat to passwords sent across a network?", "o": ["The encrypted password is, in effect, the password and can be observed and reused by an adversary", "Encryption is too slow to apply to every login across the network", "Encryption reveals the salt, which lets the adversary run an offline dictionary attack to crack the password", "Encrypted passwords cannot be verified by the remote system"], "w": ["Correct. Capturing and replaying the encrypted form works just as well. This is why challenge-response protocols are used.", "Speed isn't the issue.", "The salt isn't the issue.", "Verification isn't the issue."], "r": "\u00a73.2 The Vulnerability of Passwords"}, {"id": "3-28", "ch": 3, "sec": "3.2", "q": "Countermeasures for 'exploiting user mistakes' (written-down passwords, sharing, social engineering, unchanged preconfigured passwords) include:", "o": ["User training, intrusion detection, and simpler passwords plus another mechanism", "Increasing the salt size so written-down passwords are harder to use", "Account lockout after a fixed number of failed login attempts", "Generating rainbow tables to find the passwords users have shared"], "w": ["Correct. These are the listed countermeasures.", "Salt counters offline dictionary attacks.", "Lockout counters guessing on one account.", "Rainbow tables are an attack technique."], "r": "\u00a73.2 The Vulnerability of Passwords"}, {"id": "3-29", "ch": 3, "sec": "3.2", "q": "Which is one of the reasons the textbook gives for the persistent popularity of passwords?", "o": ["Single sign-on with non-password techniques creates a single point of security risk", "Passwords are immune to offline attacks once they are hashed with a salt", "Biometric hardware is now universally deployed on clients and servers", "Password managers have excellent roaming support across client platforms"], "w": ["Correct. Other reasons are the who-goes-first stalemate over client-side hardware, the cost and inconvenience of physical tokens, and password managers' poor roaming and synchronization support.", "Passwords are vulnerable to offline attacks.", "The text cites a hardware deployment STALEMATE.", "The book says managers have POOR support for roaming and synchronization."], "r": "\u00a73.2 The Vulnerability of Passwords"}, {"id": "3-30", "ch": 3, "sec": "3.2", "q": "In the UNIX hashed password scheme, what is stored in the password file for each user ID?", "o": ["The hashed password together with a plaintext copy of the salt", "The plaintext password together with a plaintext copy of the salt", "Only the plaintext password, protected by file access controls", "The encrypted password together with an encrypted copy of the salt"], "w": ["Correct. The salt is stored in plaintext alongside the hash code.", "Plaintext passwords are never stored.", "Plaintext passwords are never stored.", "The salt is stored in PLAINTEXT. It must be available to recompute the hash."], "r": "\u00a73.2 The Use of Hashed Passwords; Figure 3.3"}, {"id": "3-31", "ch": 3, "sec": "3.2", "q": "In newer implementations of the hashed password scheme, the salt is:", "o": ["A pseudorandom or random number", "Related to the time the password was assigned", "The user's ID", "A secret key shared with the server"], "w": ["Correct. Older implementations related the salt to the time of password assignment.", "Time-related salts were used in OLDER implementations.", "The salt is not the user ID.", "The salt is stored in plaintext. It is not a secret key."], "r": "\u00a73.2 The Use of Hashed Passwords"}, {"id": "3-32", "ch": 3, "sec": "3.2", "q": "Why is the hash algorithm used for passwords designed to be slow to execute?", "o": ["To thwart attacks, since guessing becomes more expensive", "To conserve memory on the server that stores the password file", "Because fast hash functions cannot be combined with a salt value", "To make passwords easier for users to remember over time"], "w": ["Correct. A slow hash increases the cost of each guess for an attacker.", "Memory is not the reason given.", "Speed and salting are independent.", "Hash speed doesn't affect memorability."], "r": "\u00a73.2 The Use of Hashed Passwords"}, {"id": "3-33", "ch": 3, "sec": "3.2", "q": "Which is NOT one of the three purposes of the salt in the UNIX password scheme?", "o": ["It keeps the password secret if the hash is reversed", "It prevents duplicate passwords from being visible in the password file", "It greatly increases the difficulty of offline dictionary attacks", "It makes it nearly impossible to find out whether a person used the same password on multiple systems"], "w": ["Correct. This is not a purpose of the salt. The salt is stored in plaintext and doesn't protect against hash reversal.", "This IS a purpose: two users with the same password almost certainly get different salts and therefore different hashes.", "This IS a purpose: a b-bit salt multiplies the number of possible passwords by 2^b.", "This IS one of the three purposes."], "r": "\u00a73.2 The Use of Hashed Passwords"}, {"id": "3-34", "ch": 3, "sec": "3.2", "q": "For a salt of length b bits, the number of possible passwords an offline dictionary attacker must consider is increased by a factor of:", "o": ["2^b", "b", "b\u00b2", "2b"], "w": ["Correct. Each guess must be hashed once for each salt value.", "The increase is exponential, not linear.", "The increase is exponential, not quadratic.", "The increase is exponential, not linear."], "r": "\u00a73.2 The Use of Hashed Passwords"}, {"id": "3-35", "ch": 3, "sec": "3.2", "q": "The traditional UNIX crypt(3) routine uses a salt of how many bits?", "o": ["12", "48", "128", "56"], "w": ["Correct. crypt(3) uses a 12-bit salt.", "Up to 48 bits is the MD5 crypt salt.", "128 bits is the Bcrypt salt.", "56 bits is the DES KEY size derived from the password."], "r": "\u00a73.2 UNIX Implementations"}, {"id": "3-36", "ch": 3, "sec": "3.2", "q": "In traditional UNIX crypt(3), a password of up to 8 printable characters is converted into a 56-bit value that serves as the key to a modified DES. What is the data input, and how many encryptions are performed?", "o": ["A 64-bit block of zeros; 25 encryptions", "The password itself; 1 encryption", "The salt; 1000 iterations", "A random block; 16 encryptions"], "w": ["Correct. The 64-bit output is translated into an 11-character sequence. The 25 iterations multiply the time required by 25.", "The password is the KEY, not the data, and there are 25 encryptions.", "1000 iterations is MD5 crypt's inner loop.", "This is not the crypt(3) process."], "r": "\u00a73.2 UNIX Implementations"}, {"id": "3-37", "ch": 3, "sec": "3.2", "q": "Why does the textbook consider the original crypt(3) implementation 'woefully inadequate'?", "o": ["A supercomputer processed over 50 million guesses in about 80 minutes", "It uses SHA-1, which produces hashes that are too short to resist guessing", "It uses no salt, so identical passwords produce identical hash values", "It allows passwords of unlimited length, which makes hashing very slow"], "w": ["Correct. [PERR03] reported these results, yet crypt(3) is still often required for compatibility.", "crypt(3) is DES-based.", "It uses a 12-bit salt.", "It allows only up to 8 characters."], "r": "\u00a73.2 UNIX Implementations"}, {"id": "3-38", "ch": 3, "sec": "3.2", "q": "The MD5 crypt routine, recommended for many UNIX systems including Linux, Solaris, and FreeBSD, has which characteristics?", "o": ["Salt of up to 48 bits, effectively no limit on password length, 128-bit hash, inner loop of 1000 iterations", "A 12-bit salt, an 8-character password limit, and a 64-bit output from 25 DES encryptions", "A 128-bit salt, a 55-character limit, a 192-bit hash, and a configurable cost", "No salt, unlimited password length, and a 160-bit hash computed in a single pass"], "w": ["Correct. MD5 crypt is far slower than crypt(3).", "These are crypt(3)'s characteristics.", "These are Bcrypt's characteristics.", "This is not MD5 crypt."], "r": "\u00a73.2 UNIX Implementations"}, {"id": "3-39", "ch": 3, "sec": "3.2", "q": "Bcrypt, developed for OpenBSD and probably the most secure version of the UNIX hash/salt scheme, is based on which cipher and produces what?", "o": ["Blowfish; a 192-bit hash using a 128-bit random salt, passwords up to 55 characters", "DES; a 64-bit hash using a 12-bit salt, passwords up to 8 characters", "MD5; a 128-bit hash using a salt of up to 48 bits, no length limit", "AES; a 256-bit hash using no salt, passwords up to 64 characters"], "w": ["Correct. Bcrypt also includes a configurable cost variable.", "DES is crypt(3).", "MD5 crypt is the FreeBSD/Linux/Solaris scheme.", "This doesn't describe Bcrypt."], "r": "\u00a73.2 UNIX Implementations"}, {"id": "3-40", "ch": 3, "sec": "3.2", "q": "What does Bcrypt's cost variable allow administrators to do?", "o": ["Assign a higher cost (more hashing time) to privileged users' passwords", "Lower the salt size for privileged users so their logins are faster", "Store selected passwords in plaintext so they can be recovered", "Disable the salt for accounts that use another authentication factor"], "w": ["Correct. Increasing the cost increases the time required for a Bcrypt hash, and it is configurable per password.", "The cost variable doesn't change the salt.", "Passwords are never stored in plaintext.", "The salt is always used."], "r": "\u00a73.2 UNIX Implementations"}, {"id": "3-41", "ch": 3, "sec": "3.2", "q": "Precomputing hash values for a large dictionary of possible passwords with every possible salt, trading space for time, produces a:", "o": ["Rainbow table", "Bloom filter", "Shadow password file", "Password template"], "w": ["Correct. It can be countered with a sufficiently large salt value and hash length. FreeBSD's and OpenBSD's approaches should be secure from it.", "A Bloom filter is a DEFENSIVE proactive checker.", "A shadow file stores hashes separately from IDs.", "Templates are biometric."], "r": "\u00a73.2 Password Cracking \u2014 Traditional Approaches"}, {"id": "3-42", "ch": 3, "sec": "3.2", "q": "[OECH03] showed that using 1.4 GB of data, they could crack what fraction of alphanumeric Windows password hashes, and how fast?", "o": ["99.9% in 13.8 seconds", "50% in one hour", "25% in under an hour", "10% after 10^10 guesses"], "w": ["Correct. This demonstrates the power of rainbow tables against unsalted or short-salt hashes.", "This doesn't match the text.", "About 25% is [KLEI90]'s guessing result.", "10% after 10^10 guesses is [MAZU13]'s result."], "r": "\u00a73.2 Password Cracking \u2014 Traditional Approaches"}, {"id": "3-43", "ch": 3, "sec": "3.2", "q": "[BONN12]'s analysis of almost 70 million anonymized Yahoo! passwords found that passwords provide roughly how much security against an optimal offline dictionary attack?", "o": ["About 20 bits", "Fewer than 10 bits", "About 56 bits", "About 128 bits"], "w": ["Correct. Against unrestricted brute force aimed at half of all accounts, passwords are roughly equivalent to 20-bit random strings.", "Fewer than 10 bits applies to an ONLINE TRAWLING attack.", "56 bits is a DES key, not this finding.", "This is far too high."], "r": "\u00a73.2 Password Cracking \u2014 Traditional Approaches"}, {"id": "3-44", "ch": 3, "sec": "3.2", "q": "According to [BONN12], an attacker who can manage 10 guesses per account (within typical rate-limiting) will compromise roughly what percentage of accounts?", "o": ["Around 1%", "Around 25%", "Around 40%", "Around 99%"], "w": ["Correct. This is just as they would against random 10-bit strings.", "Around 25% is [KLEI90]'s thorough guessing success rate.", "Almost 40% is [MAZU13]'s result after 10^13 guesses.", "This doesn't match the text."], "r": "\u00a73.2 Password Cracking \u2014 Traditional Approaches"}, {"id": "3-45", "ch": 3, "sec": "3.2", "q": "In [KLEI90]'s study of nearly 14,000 encrypted UNIX passwords, roughly what fraction were guessed using a ~3 million word list?", "o": ["Nearly one-fourth", "Nearly one-half", "About 1%", "Over nine-tenths"], "w": ["Correct. Encrypting all the words for all salt values took under an hour, and the author called the result 'frightening.'", "This is too high.", "About 1% is the [BONN12] online figure.", "This is too high."], "r": "\u00a73.2 Password Cracking \u2014 Traditional Approaches"}, {"id": "3-46", "ch": 3, "sec": "3.2", "q": "John the Ripper, first developed in 1996, is a notable example of:", "o": ["A password cracker using a combination of brute-force and dictionary techniques", "A proactive password checker that rejects weak passwords when they are chosen", "A Bloom filter implementation for compact dictionary checking", "A biometric matching algorithm used in fingerprint systems"], "w": ["Correct. The text cites it as the dual-approach example, still in use.", "pam_passwdqc is the proactive checker example.", "Bloom filters are a separate technique.", "Not related."], "r": "\u00a73.2 Password Cracking \u2014 Traditional Approaches"}, {"id": "3-47", "ch": 3, "sec": "3.2", "q": "Which two kinds of improvement in password cracking does the textbook describe under 'Modern Approaches'?", "o": ["Much greater processing capacity (e.g., GPUs) and smarter password-generation algorithms", "Quantum computing hardware and DNA-based computing for parallel guessing", "Larger salts and longer hash values in modern password files", "Shadow password files and account lockout policies on servers"], "w": ["Correct. For example, a single AMD Radeon HD7970 GPU can try 8.2 \u00d7 10^9 combinations per second, and Markov models and grammars from leaked passwords generate guesses.", "These aren't discussed as cracking improvements.", "These are DEFENSES.", "These are DEFENSES."], "r": "\u00a73.2 Modern Approaches"}, {"id": "3-48", "ch": 3, "sec": "3.2", "q": "The first big breakthrough in studying real-world password structure came in late 2009, when an SQL injection attack exposed 32 million plaintext passwords from:", "o": ["RockYou.com", "Yahoo!", "LinkedIn.com", "Adobe"], "w": ["Correct. Since then, numerous leaked password sets have become available for analysis.", "Yahoo! data was analyzed by [BONN12], but it wasn't the 2009 breakthrough.", "This is not cited.", "This is not cited."], "r": "\u00a73.2 Modern Approaches"}, {"id": "3-49", "ch": 3, "sec": "3.2", "q": "[WEIR09] developed which approach for password cracking using leaked passwords as training data?", "o": ["A probabilistic context-free grammar, ordering guesses by likelihood", "A Bloom filter that maps leaked passwords into a compact hash table", "Rainbow tables that precompute hashes for every possible salt", "Markov modeling of letter probabilities in natural language"], "w": ["Correct. Guesses are ordered by the frequency of their character-class structures and of digit and symbol substrings.", "A Bloom filter is a defense.", "Rainbow tables are a precomputation technique, not [WEIR09].", "Markov modeling is [NARA05]."], "r": "\u00a73.2 Modern Approaches"}, {"id": "3-50", "ch": 3, "sec": "3.2", "q": "[MAZU13] analyzed passwords of over 25,000 students at a university with a complex password policy. Per Figure 3.4, roughly what percent were recovered after 10^13 guesses?", "o": ["Almost 40%", "About 10%", "About 1%", "Nearly 100%"], "w": ["Correct. Over 10% were recovered after only 10^10 guesses, and almost 40% after 10^13.", "About 10% is the figure at 10^10 guesses.", "This is too low.", "This is too high."], "r": "\u00a73.2 Modern Approaches; Figure 3.4"}, {"id": "3-51", "ch": 3, "sec": "3.2", "q": "Keeping the hashed passwords in a separate file from the user IDs, given special protection from unauthorized access, is called a:", "o": ["Shadow password file", "Rainbow table", "Bloom filter", "Password salt file"], "w": ["Correct. This is a form of password file access control: if only a privileged user can read the hashes, the opponent can't read them without already knowing a privileged password.", "A rainbow table is an attacker's precomputed hash table.", "A Bloom filter is used by a proactive password checker.", "'Salt file' is not a term the text uses."], "r": "\u00a73.2 Password File Access Control"}, {"id": "3-52", "ch": 3, "sec": "3.2", "q": "Which is a vulnerability that remains EVEN WITH password file access control?", "o": ["A user may boot from a disk running another OS such as Linux and access the file from that OS", "The salts become visible to ordinary users once hashes are moved to a shadow file", "Account lockout stops working once the password file is protected", "The Bcrypt cost variable resets to zero for every user account"], "w": ["Correct. Other remaining vulnerabilities are unanticipated break-ins exploiting OS flaws, accidents of protection, the same password reused in other domains, backups on repair or archival disks, and sniffing network traffic.", "Salts are already stored in plaintext.", "This is not a listed vulnerability.", "This is not a listed vulnerability."], "r": "\u00a73.2 Password File Access Control"}, {"id": "3-53", "ch": 3, "sec": "3.2", "q": "Which list gives the four basic techniques in use for password selection strategies?", "o": ["User education, computer-generated passwords, reactive checking, complex policy", "Salting, slow hashing, shadow password files, and account lockout after failures", "Memory cards, smart cards, electronic ID cards, and OTP devices", "Enrollment, verification, identification, and threshold setting"], "w": ["Correct. These are the four techniques for eliminating guessable passwords while keeping them memorable.", "These protect stored passwords. They are not selection strategies.", "These are tokens.", "These are biometric concepts."], "r": "\u00a73.2 Password Selection Strategies"}, {"id": "3-54", "ch": 3, "sec": "3.2", "q": "Why is the user education strategy unlikely to succeed at most installations?", "o": ["Many users ignore guidelines, and others are poor judges of password strength", "It is too expensive to train every user on password selection", "It produces unpronounceable passwords that users must write down", "It requires a Bloom filter to check each user's chosen password"], "w": ["Correct. For example, many users mistakenly believe that reversing a word or capitalizing the last letter makes a password unguessable.", "Cost isn't the stated reason.", "Unpronounceable passwords are a computer-generated password issue.", "Unrelated."], "r": "\u00a73.2 Password Selection Strategies"}, {"id": "3-55", "ch": 3, "sec": "3.2", "q": "Which password-selection advice does the textbook offer as perhaps the best approach for users?", "o": ["Use the first letter of each word of a phrase that is NOT well known, e.g., 'My dog's first name is Rex' \u2192 MdfniR", "Take a dictionary word and spell it backwards so it no longer matches the dictionary", "Use your own name, but capitalize the last letter and add a digit", "Use the first letters of a well-known phrase such as 'An apple a day keeps the doctor away'"], "w": ["Correct. Studies show users can remember such passwords, but they resist guessing attacks based on common passwords.", "The book calls this a common MISTAKEN belief.", "Also mistaken, and easily guessed.", "The book specifically says NOT to pick a well-known phrase."], "r": "\u00a73.2 Password Selection Strategies"}, {"id": "3-56", "ch": 3, "sec": "3.2", "q": "FIPS 181 (Automated Password Generator) defines an algorithm that:", "o": ["Forms pronounceable syllables and concatenates them into words, using a random number generator", "Generates passwords from the first letters of memorable phrases chosen by users", "Checks user-chosen passwords against a Bloom filter of bad passwords", "Rejects any password shorter than 16 characters, following basic16"], "w": ["Correct. The standard includes the complete C source code. Computer-generated schemes nonetheless have a history of poor user acceptance.", "The phrase approach is user-education advice.", "Bloom filters belong to proactive checking.", "That is the basic16 rule."], "r": "\u00a73.2 Password Selection Strategies"}, {"id": "3-57", "ch": 3, "sec": "3.2", "q": "A strategy in which the system periodically runs its own password cracker to find guessable passwords, then cancels them and notifies users, is:", "o": ["Reactive password checking", "Proactive password checking", "User education", "Computer-generated passwords"], "w": ["Correct. Drawbacks: it is resource intensive, a determined opponent can devote more CPU time, and existing weak passwords stay vulnerable until found.", "A proactive checker evaluates the password at the TIME OF SELECTION.", "Education just provides guidelines.", "Computer-generated means the system assigns the passwords."], "r": "\u00a73.2 Password Selection Strategies"}, {"id": "3-58", "ch": 3, "sec": "3.2", "q": "In a complex password policy (proactive password checker), when does the system check whether a password is allowable?", "o": ["At the time the user selects it, rejecting it if not allowable", "Periodically, by running its own password cracker against the password file", "Only after a breach, when compromised passwords are reissued", "Never; the system assigns random pronounceable passwords instead"], "w": ["Correct. The trick is balancing user acceptability and strength.", "Periodic cracking is REACTIVE checking.", "This is not how proactive checking works.", "That describes computer-generated passwords."], "r": "\u00a73.2 Password Selection Strategies"}, {"id": "3-59", "ch": 3, "sec": "3.2", "q": "The earlier NIST SP 800-63-2 offered two alternative rules: basic16 and comprehensive8. Which did [KELL12] find superior against large numbers of guesses?", "o": ["basic16 (at least sixteen characters)", "comprehensive8 (eight characters with uppercase, lowercase, symbol, and digit, no dictionary word)", "They were exactly equivalent", "Neither; both failed immediately"], "w": ["Correct. [KOMA11] also found basic16 easier for users, which suggests it is the better policy choice.", "NIST then considered them equivalent, but [KELL12] found basic16 superior.", "NIST's original view was overturned by the research.", "This is not the finding."], "r": "\u00a73.2 Rule Enforcement"}, {"id": "3-60", "ch": 3, "sec": "3.2", "q": "What does the more recent NIST SP 800-63B (June 2017) require for user passwords?", "o": ["At least 8 characters, with longer passwords or pass phrases encouraged", "At least 16 characters, including uppercase, lowercase, symbol, and digit", "A mandatory change every 30 days, with no reuse of the last 10 passwords", "At most 8 characters, so that users can remember their passwords"], "w": ["Correct. It also cautions that requiring overly long or complex passwords can lead to counterproductive user behavior.", "That is stricter than 800-63B and not what it requires.", "This is not stated in the text.", "This is wrong; 8 is the minimum."], "r": "\u00a73.2 Rule Enforcement"}, {"id": "3-61", "ch": 3, "sec": "3.2", "q": "What is a weakness of simple rule enforcement for passwords, according to the textbook?", "o": ["It alerts crackers to which passwords NOT to try but may still make cracking possible", "It cannot be automated, so administrators must review each password manually", "It requires biometric hardware to confirm the user's identity at selection", "It makes all passwords unmemorable, so users write them down"], "w": ["Correct. It is superior to education alone but may not be sufficient against crackers.", "It CAN be automated, for example with pam_passwdqc.", "No biometrics are involved.", "This is an overstatement not made in the text."], "r": "\u00a73.2 Rule Enforcement"}, {"id": "3-62", "ch": 3, "sec": "3.2", "q": "Which openware tool is given as an example of a proactive password checker that enforces configurable rules?", "o": ["pam_passwdqc", "John the Ripper", "crypt(3)", "LavaRnd"], "w": ["Correct. It enforces a variety of rules and is configurable by the system administrator.", "John the Ripper is a CRACKER.", "crypt(3) is a hashing routine.", "LavaRnd is a random number generator."], "r": "\u00a73.2 Rule Enforcement"}, {"id": "3-63", "ch": 3, "sec": "3.2", "q": "Compiling a large dictionary of possible 'bad' passwords and rejecting any selected password on the list (as also required by NIST SP 800-63B) has which two problems?", "o": ["Space and time", "Cost and accuracy", "Entropy and salt", "Latency and bandwidth"], "w": ["Correct. The dictionary must be very large, and searching it, including permutations, takes time.", "These are not the stated problems.", "These are not the stated problems.", "These are not the stated problems."], "r": "\u00a73.2 Password Checker"}, {"id": "3-64", "ch": 3, "sec": "3.2", "q": "A Bloom filter, used for proactive password checking, works by:", "o": ["Using a set of hash functions to map words in the password dictionary into a compact hash table", "Encrypting the entire dictionary with AES and comparing ciphertexts", "Storing every dictionary word in plaintext and searching the full list each time a password is changed", "Running a password cracker periodically against the password file"], "w": ["Correct. Checking means computing a few hash functions, independent of dictionary size.", "No encryption is involved.", "The point is compression. The full dictionary isn't stored.", "That is reactive checking."], "r": "\u00a73.2 Bloom Filter"}, {"id": "3-65", "ch": 3, "sec": "3.2", "q": "In the textbook's Bloom filter example (1 million words, 0.01 false-rejection probability, six hash functions), the hash table needs about 1.2 MB versus about 8 MB for the full dictionary. What compression is achieved?", "o": ["Almost a factor of 7", "A factor of 2", "Roughly a factor of 100", "No compression"], "w": ["Correct. 9.6 \u00d7 10^6 bits \u2248 1.2 MB, compared with on the order of 8 MB for the full dictionary.", "This understates the ratio.", "This overstates the ratio.", "There is significant compression."], "r": "\u00a73.2 Bloom Filter"}, {"id": "3-66", "ch": 3, "sec": "3.3", "q": "Objects that a user possesses for the purpose of user authentication are called:", "o": ["Tokens", "Templates", "Credentials", "Salts"], "w": ["Correct. Examples include memory cards, smart cards, hardware OTP devices, and mobile phones.", "Templates are biometric feature sets.", "Credentials are data structures binding identity to a token (NIST model).", "Salts are random values added before hashing a password."], "r": "\u00a73.3 Token-Based Authentication"}, {"id": "3-67", "ch": 3, "sec": "3.3", "q": "According to Table 3.2, which card type has a magnetic bar on the back and characters on the front, with a gift card as the example?", "o": ["Magnetic stripe", "Embossed", "Memory", "Smart (contact)"], "w": ["Correct. This is Table 3.2's magnetic stripe row.", "Embossed cards have raised characters only, on the front (old credit card).", "Memory cards have electronic memory inside (prepaid phone card).", "Smart cards have electronic memory AND a processor inside (biometric ID card, credit card)."], "r": "\u00a73.3 Table 3.2"}, {"id": "3-68", "ch": 3, "sec": "3.3", "q": "In Table 3.2, the defining feature of a SMART card is:", "o": ["Electronic memory and processor inside", "Electronic memory inside only", "Raised characters only, on front", "Magnetic bar on back"], "w": ["Correct. Contact cards have electrical contacts exposed on the surface, and contactless cards have a radio antenna embedded inside.", "Memory only is a memory card.", "Raised characters only is an embossed card.", "A magnetic bar is a magnetic stripe card."], "r": "\u00a73.3 Table 3.2"}, {"id": "3-69", "ch": 3, "sec": "3.3", "q": "Memory cards can:", "o": ["Store but not process data", "Process but not store data", "Both store and process data with an embedded microprocessor", "Generate one-time passwords"], "w": ["Correct. The most common is a bank card with a magnetic stripe that can store only a simple security code, which can be read and reprogrammed by an inexpensive reader.", "This is backwards.", "That describes smart cards.", "That describes OTP tokens."], "r": "\u00a73.3 Memory Cards"}, {"id": "3-70", "ch": 3, "sec": "3.3", "q": "Which is NOT a drawback of memory cards noted by NIST SP 800-12?", "o": ["They require an embedded microprocessor", "They require a special reader", "Token loss temporarily prevents system access", "User dissatisfaction for computer access"], "w": ["Correct. This is not a listed drawback. Memory cards do NOT have microprocessors; smart cards do.", "Needing a special reader IS a listed drawback: it raises cost, and the reader's hardware and software must be secured.", "Token loss IS a listed drawback: replacing a lost token has an administrative cost, and a finder need only learn the PIN.", "User dissatisfaction IS a listed drawback: memory cards are accepted for ATMs but may be deemed inconvenient for computer access."], "r": "\u00a73.3 Memory Cards"}, {"id": "3-71", "ch": 3, "sec": "3.3", "q": "Smart tokens can be categorized along four dimensions that are not mutually exclusive. Which is one of them?", "o": ["Authentication protocol", "Salt length", "Biometric matching threshold", "Hash algorithm"], "w": ["Correct. The four dimensions are physical characteristics, user interface, electronic interface, and authentication protocol.", "Salt length concerns passwords.", "Matching thresholds are biometric.", "Not one of the four."], "r": "\u00a73.3 Smart Cards"}, {"id": "3-72", "ch": 3, "sec": "3.3", "q": "What is the typical range for non-battery-powered contactless smart cards?", "o": ["One-half to three inches", "Up to 30 feet", "Exactly 1 meter", "Must touch the reader's contact plate"], "w": ["Correct. This is ideal for building entry and payment, which need a very fast interface. Most contactless cards draw power from the electromagnetic signal.", "This is far beyond the typical range.", "Not the stated range.", "Touching a contact plate describes CONTACT cards."], "r": "\u00a73.3 Smart Cards"}, {"id": "3-73", "ch": 3, "sec": "3.3", "q": "In which smart token authentication protocol does the token generate a unique password periodically (e.g., every minute), requiring the token and system to stay synchronized?", "o": ["Dynamic password generator", "Static", "Challenge-response protocol", "Proactive"], "w": ["Correct. The password is entered manually or electronically, and both sides must be initialized and synchronized.", "In a static protocol, the user authenticates to the token, then the token authenticates the user to the computer.", "In challenge-response, the system sends a challenge (e.g., a random number) and the token computes a response.", "'Proactive' refers to password checking."], "r": "\u00a73.3 Smart Cards"}, {"id": "3-74", "ch": 3, "sec": "3.3", "q": "A computer system sends a random string of numbers and the smart token encrypts it with the token's private key. This is which protocol?", "o": ["Challenge-response", "Static", "Dynamic password generator", "Replay"], "w": ["Correct. The text gives this public-key example of challenge-response.", "A static protocol has no challenge.", "A dynamic password generator produces periodic passwords without a challenge.", "Replay is an ATTACK."], "r": "\u00a73.3 Smart Cards"}, {"id": "3-75", "ch": 3, "sec": "3.3", "q": "A typical smart card includes three types of memory. Which holds application data and programs, such as the protocols the card can execute and data that varies over time (e.g., remaining talk time)?", "o": ["EEPROM", "ROM", "RAM", "Cache"], "w": ["Correct. EEPROM is electrically erasable programmable ROM.", "ROM holds data that never changes, such as the card number and cardholder's name.", "RAM holds temporary data generated while applications execute.", "Cache isn't listed."], "r": "\u00a73.3 Smart Cards"}, {"id": "3-76", "ch": 3, "sec": "3.3", "q": "When a smart card is inserted into a reader and reset, what message does the card respond with to define its parameters, protocols, and functions?", "o": ["Answer to reset (ATR)", "Protocol type selection (PTS)", "Card access number (CAN)", "Password authenticated connection establishment (PACE)"], "w": ["Correct. The terminal may then change the protocol via a PTS command, and the card's PTS response confirms the protocol.", "PTS is the TERMINAL's command to change protocol and parameters.", "CAN is a number printed on the German eID card.", "PACE is eID access control."], "r": "\u00a73.3 Figure 3.5"}, {"id": "3-77", "ch": 3, "sec": "3.3", "q": "Which German eID card (neuer Personalausweis) function is mandatory, reserved for government use, and used offline, for example at passport control?", "o": ["ePass", "eID", "eSign", "PACE"], "w": ["Correct. ePass stores a digital representation of the cardholder's identity and must be implemented on the card.", "The eID function is general-purpose, optional to activate, and used online or offline.", "eSign is optional and stores a private key and certificate for digital signatures.", "PACE is the access-control protocol, not a function."], "r": "\u00a73.3 Electronic Identity Cards; Table 3.3"}, {"id": "3-78", "ch": 3, "sec": "3.3", "q": "The eSign function of the German eID card stores a private key and a certificate verifying the key. Who issues the certificate?", "o": ["A private sector trust center", "The national government's ID agency", "The cardholder", "The card manufacturer"], "w": ["Correct. eSign is used for generating digital signatures.", "The government verifies the card overall, but eSign certificates come from a private sector trust center.", "Cardholders don't issue certificates.", "This is not stated."], "r": "\u00a73.3 Electronic Identity Cards"}, {"id": "3-79", "ch": 3, "sec": "3.3", "q": "What does Password Authenticated Connection Establishment (PACE) ensure?", "o": ["The contactless RF chip in the eID card cannot be read without explicit access control", "The card's PIN is stored on a government server rather than on the card", "All data is sent in plaintext so that inspection systems can read it quickly", "The card can be read from any distance by authorized government readers"], "w": ["Correct. Online use requires the six-digit PIN. Offline use requires the MRZ or the six-digit CAN.", "This is not PACE.", "Data is exchanged in encrypted form after the PIN is entered.", "This is the opposite of PACE's purpose."], "r": "\u00a73.3 PACE"}, {"id": "3-80", "ch": 3, "sec": "3.3", "q": "For OFFLINE eID applications, PACE access to the card is established using:", "o": ["Either the MRZ on the back or the six-digit CAN on the front", "The six-digit eID PIN that only the cardholder knows", "The nine-character document number printed on the card", "A fingerprint read from the card by an inspection system"], "w": ["Correct. The machine readable zone (MRZ) or card access number (CAN) is used.", "The PIN is used for ONLINE applications.", "The document number is not used for PACE.", "This is not the PACE mechanism."], "r": "\u00a73.3 PACE"}, {"id": "3-81", "ch": 3, "sec": "3.3", "q": "On the German eID card, the card access number (CAN) is:", "o": ["A six-digit decimal random number printed on the face of the card, used as a password", "The nine-character alphanumeric unique identifier of each card", "Three lines of human- and machine-readable text on the back of the card", "The cardholder's secret PIN, which is never printed on the card"], "w": ["Correct. The CAN is used as a password for offline PACE.", "That is the document number.", "That is the MRZ.", "The PIN is known only to the holder and is not printed."], "r": "\u00a73.3 Electronic Identity Cards"}, {"id": "3-82", "ch": 3, "sec": "3.3", "q": "Each OTP generated by a one-time password device:", "o": ["May only be used once, and is based on the current time or on a counter/nonce", "Remains valid for the token's lifetime once it has been displayed to the user", "Is chosen by the user at registration and stored on the authentication server", "Is the same value as the embedded secret key, displayed in decimal form"], "w": ["Correct. The device combines its embedded secret key with the time or nonce using a block cipher or hash function.", "Each OTP is single-use.", "It is generated by the device.", "The key is the SEED. The OTP is derived from it."], "r": "\u00a73.3 Hardware Authentication Tokens"}, {"id": "3-83", "ch": 3, "sec": "3.3", "q": "The Time-based One-Time Password (TOTP) algorithm, specified in RFC 6238, uses:", "o": ["HMAC (e.g., HMAC-SHA-1) over a time-step count derived from Unix time", "DES encryption of the user's password combined with a 12-bit salt", "RSA signatures computed over an event counter stored in the token", "MD5 crypt with a 48-bit salt and an inner loop of 1000 iterations"], "w": ["Correct. The default Step is 30 seconds, and the Truncate function from RFC 4226 reduces the value to 32 bits and then to a 6-digit default code.", "Not TOTP.", "Not TOTP.", "Not TOTP."], "r": "\u00a73.3 Hardware Authentication Tokens"}, {"id": "3-84", "ch": 3, "sec": "3.3", "q": "In TOTP, what is the default time step (window) before the password is updated?", "o": ["30 seconds", "60 seconds", "5 minutes", "1 second"], "w": ["Correct. The default Step is 30 seconds.", "Not the default.", "Not the default.", "Not the default."], "r": "\u00a73.3 Hardware Authentication Tokens"}, {"id": "3-85", "ch": 3, "sec": "3.3", "q": "How do time-based OTP systems handle clock drift between the token and the verifying system?", "o": ["They accept codes within a small window, record the drift, and resynchronize if needed", "They reject any OTP that was not generated at exactly the same second as the server clock", "They ignore time entirely and rely only on a counter that both sides increment", "They replace the token's secret key whenever the two clocks differ by any amount"], "w": ["Correct. Drift is compensated in future interactions.", "Some tolerance is allowed.", "Time is fundamental to TOTP.", "Keys aren't replaced for drift."], "r": "\u00a73.3 Hardware Authentication Tokens"}, {"id": "3-86", "ch": 3, "sec": "3.3", "q": "What disadvantage of tokens that DISPLAY a code is noted, and what alternative is offered?", "o": ["Another person can glance at the display; alternatively the token can communicate directly via USB, NFC, or BLE", "Displays drain the token's battery quickly; the alternative is to send each code to the user by SMS instead", "Displays are expensive to manufacture; the alternative is to use passwords instead", "Displays cannot show enough digits; the alternative is to use biometrics instead"], "w": ["Correct. Connected tokens often also support public or private key operations, such as signing a challenge.", "This isn't the stated disadvantage.", "This isn't the stated disadvantage.", "This isn't the stated disadvantage."], "r": "\u00a73.3 Hardware Authentication Tokens"}, {"id": "3-87", "ch": 3, "sec": "3.3", "q": "NIST SP 800-63B distinguishes single-factor from multifactor OTP devices. A multifactor device:", "o": ["Works only after a local authentication step on the device, such as a PIN or biometric", "Uses two different hash functions to compute each one-time password it displays", "Displays two codes at once, one for each authentication factor required", "Requires the user to carry two separate tokens that must be used together"], "w": ["Correct. The PIN or password can be entered via keyboard or interface, or a biometric reader on the device can be used.", "That isn't the distinction.", "That isn't the distinction.", "That isn't the distinction."], "r": "\u00a73.3 Hardware Authentication Tokens"}, {"id": "3-88", "ch": 3, "sec": "3.3", "q": "The FIDO2 authentication protocol consists of which two components?", "o": ["The W3C Web Authentication (WebAuthn) standard and the FIDO Alliance Client to Authenticator Protocol 2 (CTAP2)", "The Time-based OTP algorithm (TOTP) and the HMAC-based OTP algorithm (HOTP)", "The Kerberos ticket service and the RADIUS remote authentication protocol", "The Password Authenticated Connection Establishment (PACE) protocol and the smart card Answer to Reset (ATR)"], "w": ["Correct. Google and Microsoft use FIDO2 to allow authenticator tokens or apps as a second factor.", "These are OTP algorithms.", "These aren't FIDO2.", "These are eID and smart card terms."], "r": "\u00a73.3 Hardware Authentication Tokens"}, {"id": "3-89", "ch": 3, "sec": "3.3", "q": "An attacker convinces a phone company to transfer a victim's phone number to a new phone under the attacker's control, then receives the victim's SMS authentication codes. This is a:", "o": ["SIM swap attack", "Prompt-bombing attack", "Replay attack", "Rainbow table attack"], "w": ["Correct. It exploits deficiencies in phone companies' customer support processes for number transfers.", "Prompt-bombing floods the user with authentication requests hoping they approve one.", "Replay retransmits captured responses.", "Rainbow tables are precomputed hash tables."], "r": "\u00a73.3 Authentication Using a Mobile Phone"}, {"id": "3-90", "ch": 3, "sec": "3.3", "q": "How does NIST SP 800-63B classify authentication using SMS messages?", "o": ["As restricted, with other alternatives encouraged", "As prohibited for all government and commercial systems", "As the most secure method, preferred over authenticator apps", "As equivalent to AAL3 when combined with a password"], "w": ["Correct. SMS is still widely used, and the book notes it remains significantly more secure than a password alone.", "It is not prohibited.", "It is not the most secure.", "It does not meet AAL3, which requires hardware-based authenticators."], "r": "\u00a73.3 Authentication Using a Mobile Phone"}, {"id": "3-91", "ch": 3, "sec": "3.3", "q": "An attacker sends large numbers of authentication requests to a user's authenticator app, hoping the user will just approve one. This is known as:", "o": ["Prompt-bombing", "SIM swapping", "Shoulder surfing", "Keystroke logging"], "w": ["Correct. This highlights the need for user awareness training to approve only requests the user initiated.", "SIM swapping transfers the phone number.", "Shoulder surfing is observing the user.", "Keystroke logging captures keystrokes."], "r": "\u00a73.3 Authentication Using a Mobile Phone"}, {"id": "3-92", "ch": 3, "sec": "3.3", "q": "Compared with SMS codes, what advantages do authenticator apps implementing TOTP have, per the textbook?", "o": ["They don't require a network connection when used and are generally regarded as more secure", "They require no backup codes, because the app can always be recovered", "They cannot be affected by malware, since the secret never leaves the app", "They work without a phone, generating codes on any computer the user logs in from"], "w": ["Correct. Users should also generate and securely store backup codes for reinstallation.", "The book says users SHOULD keep backup codes.", "Malware can subvert them; [OZBI20] even recovered keys from seven Android apps.", "They run on the phone."], "r": "\u00a73.3 Authentication Using a Mobile Phone"}, {"id": "3-93", "ch": 3, "sec": "3.3", "q": "What requirement does NIST SP 800-63B specify when mobile phones are used as authenticators?", "o": ["The user must use the phone's unlock mechanism before the authenticator app provides the one-time code", "The phone must be a basic feature phone that cannot install additional apps or connect to app stores", "SMS must be used as the only channel for delivering one-time codes", "The authenticator app must be open source and audited by NIST"], "w": ["Correct. This provides additional protection for the device.", "Not stated.", "SMS is classified as restricted.", "Not stated."], "r": "\u00a73.3 Authentication Using a Mobile Phone"}, {"id": "3-94", "ch": 3, "sec": "3.4", "q": "Static biometrics include all of the following EXCEPT:", "o": ["Voiceprint", "Fingerprints", "Hand geometry", "Retinal and iris patterns"], "w": ["Correct. Voiceprint is a DYNAMIC biometric, along with signature.", "Fingerprints are static.", "Hand geometry is static.", "Retinal and iris patterns are static."], "r": "\u00a73.4 Biometric Authentication"}, {"id": "3-95", "ch": 3, "sec": "3.4", "q": "In essence, biometric authentication is based on:", "o": ["Pattern recognition", "Exact string matching", "Public-key cryptography", "Hash collisions"], "w": ["Correct. Compared with passwords and tokens, it is technically more complex and expensive.", "Biometrics use matching scores, not exact matches.", "This is not the basis.", "This is not the basis."], "r": "\u00a73.4 Biometric Authentication"}, {"id": "3-96", "ch": 3, "sec": "3.4", "q": "Using an infrared camera to produce a face thermogram that correlates with the underlying vascular system is an alternative approach for which biometric?", "o": ["Facial characteristics", "Retinal vascular pattern", "Hand geometry", "Iris"], "w": ["Correct. The most common facial approach uses the relative location and shape of key features. Thermograms are the alternative.", "Retinal systems project light into the eye to image the veins beneath the retinal surface.", "Hand geometry uses the shape, lengths, and widths of the fingers.", "Iris uses the detailed structure of the iris."], "r": "\u00a73.4 Physical Characteristics"}, {"id": "3-97", "ch": 3, "sec": "3.4", "q": "A biometric system that projects a low-intensity beam of visual or infrared light into the eye to image the pattern formed by veins is using:", "o": ["Retinal pattern", "Iris", "Facial characteristics", "Fingerprint"], "w": ["Correct. The vein pattern beneath the retinal surface is unique.", "Iris uses the structure of the iris, not the veins.", "Facial characteristics don't involve projecting light into the eye.", "Fingerprints are ridges and furrows on the fingertip."], "r": "\u00a73.4 Physical Characteristics"}, {"id": "3-98", "ch": 3, "sec": "3.4", "q": "Why are voice patterns described as different from signatures as a biometric?", "o": ["Voice is tied more to anatomy; a signature also reflects learned writing habits", "Voice never varies between samples from the same speaker, while signatures always vary", "Signatures are static biometrics, while voice patterns are dynamic biometrics", "Voice is a possession factor, while a signature is a knowledge factor"], "w": ["Correct. Even so, voice still varies from sample to sample over time.", "The book says voice DOES vary.", "Signatures are dynamic biometrics.", "Voice is a biometric."], "r": "\u00a73.4 Physical Characteristics"}, {"id": "3-99", "ch": 3, "sec": "3.4", "q": "According to Figure 3.7 (cost versus accuracy), which biometric is shown with the HIGHEST accuracy (and highest cost)?", "o": ["Iris", "Voice", "Signature", "Hand"], "w": ["Correct. Iris is at the top right of Figure 3.7.", "Voice is at the low-cost, low-accuracy end.", "Signature is on the low-accuracy side.", "Hand is on the low-accuracy side, although it costs more than voice."], "r": "\u00a73.4 Figure 3.7"}, {"id": "3-100", "ch": 3, "sec": "3.4", "q": "Why does the concept of accuracy not apply to passwords or smart cards in the way it does to biometrics?", "o": ["A password either matches exactly or not, whereas a biometric must be judged by how closely it matches", "Passwords and smart cards are always accurate, so measuring accuracy is unnecessary", "Smart cards have built-in error correction that hides any matching errors", "Biometrics never produce errors, so accuracy is only measured for passwords"], "w": ["Correct. Biometrics require a similarity determination.", "This is not the reasoning.", "This is not the reasoning.", "Biometrics produce false matches and nonmatches."], "r": "\u00a73.4 Physical Characteristics"}, {"id": "3-101", "ch": 3, "sec": "3.4", "q": "During biometric enrollment, the set of numbers extracted from a user's biometric characteristic and stored is called the user's:", "o": ["Template", "Salt", "Credential", "Nonce"], "w": ["Correct. The system maintains the name (ID), perhaps a PIN or password, and the biometric template.", "A salt is used for password hashing.", "Credential is the NIST model term for the identity-to-token binding.", "A nonce is a challenge value."], "r": "\u00a73.4 Operation of a Biometric Authentication System"}, {"id": "3-102", "ch": 3, "sec": "3.4", "q": "In biometric IDENTIFICATION (as opposed to verification), the individual:", "o": ["Uses the biometric sensor but presents no additional information; the system compares against the set of stored templates", "Enters a PIN and uses the biometric sensor; the system compares the input only to the template stored for that user", "Presents a smart card only, and the system reads the stored template from the card", "Is enrolled for the first time, and the system creates and stores a new template"], "w": ["Correct. If there's a match, the user is identified. Otherwise the user is rejected.", "That is VERIFICATION, which is analogous to a card plus PIN.", "This is not a biometric mode.", "That is enrollment."], "r": "\u00a73.4 Operation of a Biometric Authentication System"}, {"id": "3-103", "ch": 3, "sec": "3.4", "q": "The frequency with which biometric samples from DIFFERENT sources are erroneously assessed to be from the SAME source is the:", "o": ["False match rate", "False nonmatch rate", "Equal error rate", "Matching score"], "w": ["Correct. A false match results in accepting a user who should not be accepted.", "The false nonmatch rate is when samples from the SAME source are assessed as DIFFERENT, which rejects a valid user.", "The point where the two rates are equal is a plausible tradeoff, not this definition.", "The matching score quantifies similarity."], "r": "\u00a73.4 Biometric Accuracy"}, {"id": "3-104", "ch": 3, "sec": "3.4", "q": "If the biometric decision threshold is moved to DECREASE the false match rate, what happens?", "o": ["The false nonmatch rate increases", "The false nonmatch rate also decreases", "Both rates go to zero", "Nothing changes"], "w": ["Correct. There is an inherent tradeoff between the two rates.", "They move in opposite directions.", "This is impossible with overlapping distributions.", "Moving the threshold alters the probabilities."], "r": "\u00a73.4 Biometric Accuracy; Figure 3.9"}, {"id": "3-105", "ch": 3, "sec": "3.4", "q": "A plot of false match rate versus false nonmatch rate for a biometric scheme is called the:", "o": ["Operating characteristic curve", "Bell-shaped probability curve", "Attack tree", "Rainbow table"], "w": ["Correct. The curve that is lower and to the left performs better (Figure 3.10).", "Bell curves are the probability density functions of matching scores (Figure 3.9).", "Attack trees are Ch 1.", "Rainbow tables are password cracking."], "r": "\u00a73.4 Biometric Accuracy; Figure 3.10"}, {"id": "3-106", "ch": 3, "sec": "3.4", "q": "A forensic application looking for possible candidates to be checked further would most likely require:", "o": ["A low false nonmatch rate", "A very low false match rate", "A point where both rates are equal", "The highest possible threshold"], "w": ["Correct. You don't want to miss true candidates.", "A very low false match rate is for HIGH-SECURITY applications.", "Equal rates are a plausible general tradeoff, not the forensic requirement.", "A very high threshold would increase false nonmatches."], "r": "\u00a73.4 Biometric Accuracy"}, {"id": "3-107", "ch": 3, "sec": "3.4", "q": "On the operating characteristic curve, shifting the threshold up and to the left provides:", "o": ["Greater security at the cost of decreased convenience", "Greater convenience at the cost of security", "No change in security", "Lower cost hardware"], "w": ["Correct. The inconvenience comes from valid users being denied access and required to take further steps.", "This is the reverse.", "There is a change.", "Not related."], "r": "\u00a73.4 Biometric Accuracy"}, {"id": "3-108", "ch": 3, "sec": "3.5", "q": "To counter threats to remote user authentication, such as eavesdropping and replay, systems generally rely on:", "o": ["Some form of challenge-response protocol", "Sending the password in plaintext", "Sending the encrypted password each time", "Account lockout only"], "w": ["Correct. Section 3.5 presents challenge-response protocols for passwords, tokens, and static and dynamic biometrics.", "Plaintext passwords can be eavesdropped.", "An encrypted password can be captured and reused.", "Lockout doesn't stop eavesdropping or replay."], "r": "\u00a73.5 Remote User Authentication"}, {"id": "3-109", "ch": 3, "sec": "3.5", "q": "In the challenge-response password protocol of Figure 3.12a, what does the user return in response to the host's nonce r?", "o": ["f(r\u2032, h(P\u2032)), a function of the random number and the hash of the password", "The plaintext password P\u2032, protected only by appending the random number r", "The hash of the password, h(P\u2032), sent on its own", "The salt value associated with the user's stored password"], "w": ["Correct. The host compares this with f(r, h(P(U))) computed from its stored hash.", "Plaintext passwords are never sent.", "Sending the hash alone could be captured and replayed. It is combined with r.", "The salt isn't the response."], "r": "\u00a73.5 Password Protocol"}, {"id": "3-110", "ch": 3, "sec": "3.5", "q": "In the challenge-response password protocol, what does including a random number (nonce) as an argument of f defend against?", "o": ["Replay attacks", "Dictionary attacks on the stored hash", "Shoulder surfing", "Denial of service"], "w": ["Correct. A captured response won't work for a different nonce.", "Storing the hash protects the stored password. The nonce addresses replay.", "Shoulder surfing is physical observation.", "Not addressed by the nonce."], "r": "\u00a73.5 Password Protocol"}, {"id": "3-111", "ch": 3, "sec": "3.5", "q": "In the token challenge-response protocol (Figure 3.12b), the user activates the token's passcode by entering a password. Who shares this password?", "o": ["Only the user and the token; it does not involve the remote host", "The user and the remote host, which stores the password's hash value", "The token and the remote host, which synchronize it with the passcode", "The credential service provider and the registration authority"], "w": ["Correct. The token then responds to the host with f(r\u2032, h(W\u2032)).", "The host never sees this password.", "This is not the activation password.", "Not relevant."], "r": "\u00a73.5 Token Protocol"}, {"id": "3-112", "ch": 3, "sec": "3.5", "q": "In the static biometric protocol (Figure 3.12c), the host performs a check that the dynamic biometric protocol does not. What is it?", "o": ["Authentication of the biometric capture device by comparing its device ID to a list of registered devices", "Checking that the returned random number matches the one the host sent as the challenge in this session", "Comparing the matching score for the presented template against a threshold", "Decrypting the response that the client system encrypted"], "w": ["Correct. Static biometrics can be copied, so device authentication matters. Dynamic biometrics use a random sequence challenge instead.", "Both protocols check r\u2032 = r.", "Both protocols compare against a threshold.", "Both protocols use encryption."], "r": "\u00a73.5 Static Biometric Protocol"}, {"id": "3-113", "ch": 3, "sec": "3.5", "q": "In the dynamic biometric protocol, the host provides a random sequence as a challenge. What must the user do with it?", "o": ["Vocalize, type, or write the sequence to generate a biometric signal", "Encrypt the sequence with a private key held on the user's device", "Enter the sequence into an OTP token, which returns a passcode", "Ignore the sequence and present a fingerprint to the sensor instead"], "w": ["Correct. This covers speaker verification, keyboard dynamics, and handwriting verification.", "This is not the dynamic biometric step.", "This is not the dynamic biometric step.", "A fingerprint is static."], "r": "\u00a73.5 Dynamic Biometric Protocol"}, {"id": "3-114", "ch": 3, "sec": "3.6", "q": "Attacks in which an adversary tries to achieve user authentication WITHOUT access to the remote host or the intervening communications path are called:", "o": ["Client attacks", "Host attacks", "Replay attacks", "Trojan horse attacks"], "w": ["Correct. The adversary masquerades as a legitimate user. Defenses include large entropy and limiting attempts.", "Host attacks target the user file at the host.", "Replay repeats a captured response.", "Trojan horse attacks use rogue applications or devices."], "r": "\u00a73.6 Security Issues for User Authentication; Table 3.4"}, {"id": "3-115", "ch": 3, "sec": "3.6", "q": "According to Table 3.4, what is the typical defense against a HOST attack on a biometric (template theft)?", "o": ["Capture device authentication; challenge-response", "Hashing the stored values; requiring large entropy", "Using a 1-time passcode for each authentication", "Requiring large entropy; limiting the number of attempts"], "w": ["Correct. Biometric features are physical and hard to secure. Static features rely on device authentication, and dynamic features rely on challenge-response.", "Hashing with large entropy is the PASSWORD host-attack defense.", "A 1-time passcode is the TOKEN host-attack defense.", "Large entropy with limited attempts is a client-attack defense."], "r": "\u00a73.6 Table 3.4"}, {"id": "3-116", "ch": 3, "sec": "3.6", "q": "A token can generate a high-entropy passcode from a low-entropy PIN or password. Which attack does this primarily thwart?", "o": ["Exhaustive search (client attacks)", "Trojan horse (rogue client)", "Denial of service (account lockout)", "Template theft"], "w": ["Correct. The adversary must also acquire the physical token.", "Trojan horses capture input through rogue devices.", "DoS is thwarted by MFA with a token, for a different reason.", "Template theft is biometric."], "r": "\u00a73.6 Security Issues for User Authentication"}, {"id": "3-117", "ch": 3, "sec": "3.6", "q": "Malicious hardware or software installed so the attacker can capture the user's keystrokes is a form of eavesdropping called:", "o": ["Keystroke logging (keylogging)", "Shoulder surfing (observation)", "Prompt-bombing", "Replay"], "w": ["Correct. Multifactor systems (password plus token or biometric) resist this attack.", "Shoulder surfing is physical observation.", "Prompt-bombing floods the user with approval requests.", "Replay retransmits a captured response."], "r": "\u00a73.6 Security Issues for User Authentication"}, {"id": "3-118", "ch": 3, "sec": "3.6", "q": "A rogue bank machine used to capture user ID/password combinations is the book's example of a:", "o": ["Trojan horse attack", "Host attack", "Client attack (masquerading)", "Replay attack"], "w": ["Correct. An application or device masquerades as authentic to capture credentials. The defense is authenticating the client or capture device within a trusted security perimeter.", "A host attack targets stored files.", "A client attack involves guessing.", "Replay repeats a captured response."], "r": "\u00a73.6 Security Issues for User Authentication"}, {"id": "3-119", "ch": 3, "sec": "3.6", "q": "An attacker deliberately enters wrong passwords for a specific user until the lockout threshold is reached. Which defense does Table 3.4 list?", "o": ["Multifactor with token", "Account lockout", "Large entropy", "Challenge-response"], "w": ["Correct. The adversary would first have to acquire the token.", "Lockout is what's being ABUSED in this denial-of-service attack.", "Large entropy doesn't prevent lockout abuse.", "Challenge-response defends against replay."], "r": "\u00a73.6 Table 3.4"}, {"id": "3-120", "ch": 3, "sec": "3.6", "q": "According to Table 3.4, what is the typical defense against REPLAY of a stolen password response?", "o": ["Challenge-response protocol", "Hashing the password file", "Tamper-resistant token", "Large entropy"], "w": ["Correct. For tokens it is challenge-response plus a 1-time passcode, and for biometrics it is copy detection and device authentication via challenge-response.", "Hashing addresses host attacks.", "A tamper-resistant token addresses theft and copying.", "Large entropy addresses guessing."], "r": "\u00a73.6 Table 3.4"}, {"id": "3-121", "ch": 3, "sec": "3.6", "q": "For eavesdropping, theft, and copying of BIOMETRICS, which are less susceptible to copying or imitation?", "o": ["Dynamic biometrics", "Static biometrics", "Both equally", "Neither can be copied"], "w": ["Correct. Dynamic biometrics are less susceptible. For static biometrics, device authentication is a useful countermeasure.", "Static biometrics are more easily copied.", "The text distinguishes them.", "Spoofing copies are possible."], "r": "\u00a73.6 Security Issues for User Authentication"}, {"id": "3-122", "ch": 3, "sec": "3.7", "q": "Why did the UAE choose iris recognition for its border control system?", "o": ["No two irises are alike, not even an individual's left and right eye", "It is the cheapest biometric to deploy at a large number of border points", "It works without a camera, using a simple contact sensor at each checkpoint", "It is a dynamic biometric, so it cannot be copied by expelled persons"], "w": ["Correct. Iris recognition was chosen as the most efficient and foolproof method.", "Iris is the HIGHEST cost in Figure 3.7.", "It uses a near-infrared camera.", "Iris is static."], "r": "\u00a73.7 Practical Application: An Iris Biometric System"}, {"id": "3-123", "ch": 3, "sec": "3.7", "q": "The UAE iris system compares each incoming passenger's iris against the entire database of expelled persons. Why is this more computationally demanding than verification?", "o": ["It is one-to-many identification, needing well over 9 billion comparisons a day", "Each comparison requires sequencing the passenger's DNA from the iris image", "Each comparison uses public-key encryption of both iris templates", "The templates are stored in plaintext, so every comparison must be re-encrypted"], "w": ["Correct. Each passenger is compared against all enrolled patterns.", "The 'phase code' is only SIMILAR to a DNA sequence code.", "This is not the reason.", "This is not the reason."], "r": "\u00a73.7 Practical Application"}, {"id": "3-124", "ch": 3, "sec": "3.7", "q": "How did banned expatriates try to fool the UAE iris recognition system?", "o": ["By using eye drops to dilate the iris", "By wearing colored contact lenses", "By presenting photos of irises", "By SIM swapping"], "w": ["Correct. Officials adopted a new algorithm and procedure to detect whether an iris had been dilated.", "This is not described.", "This is not described.", "Unrelated."], "r": "\u00a73.7 Practical Application"}, {"id": "3-125", "ch": 3, "sec": "3.8", "q": "In the ATM case study, an organization that provides core data processing (PIN recognition, account updating) and electronic funds transfer services to issuers is called a:", "o": ["Processor", "Issuer", "Cardholder", "Relying party"], "w": ["Correct. Examples are Fidelity National Financial and Jack Henry & Associates.", "The issuer issues debit cards, is responsible for accounts, and authorizes transactions (banks, credit unions).", "The cardholder is the individual to whom the card is issued.", "Relying party is NIST model terminology."], "r": "\u00a73.8 Case Study: Security Problems for ATM Systems"}, {"id": "3-126", "ch": 3, "sec": "3.8", "q": "After
