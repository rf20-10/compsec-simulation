the ATM upgrade to Windows and TCP/IP on the issuer's network, what was the ONLY security enhancement, which left a serious vulnerability?", "o": ["Using triple DES instead of DES for the PIN; the rest of the message stayed in the clear", "Encrypting the entire request message, including the card number and balances, with AES", "Adding challenge-response authentication between the ATM and the processor to stop replay", "Segmenting ATM traffic from the rest of the issuer's network with firewall rule sets"], "w": ["Correct. A hacker tapping the bank's network could potentially access every ATM transaction.", "Full-message encryption was NOT done. Only the PIN was encrypted.", "Challenge-response was a RECOMMENDED long-term fix.", "Segmentation was a RECOMMENDED short-term fix."], "r": "\u00a73.8 Case Study"}, {"id": "3-127", "ch": 3, "sec": "3.8", "q": "Which was a recommended SHORT-TERM fix from Redspin for the ATM vulnerability?", "o": ["Segmenting ATM traffic from the rest of the network via firewall rule sets or physically dividing networks", "Encrypting all customer-related information that traverses the network at the application level", "Better machine-to-machine authentication between the ATM and the processor", "Using challenge-response protocols between the ATM and the processor to counter replay attacks"], "w": ["Correct. Network-level encryption between routers was another short-term fix.", "Application-level encryption is a LONG-TERM fix.", "Machine-to-machine authentication is a LONG-TERM fix.", "Challenge-response is a LONG-TERM fix."], "r": "\u00a73.8 Case Study"}, {"id": "3-128", "ch": 3, "sec": "3.8", "q": "What is the main lesson of the ATM case study, per the textbook?", "o": ["Cryptographic functions alone don't guarantee security; they must be properly implemented", "Triple DES is insecure and should never have replaced DES for encrypting the PIN", "ATMs should never run Windows, because the operating system made the attack possible", "Leased lines are insecure, so ATMs should always connect through the issuer's LAN"], "w": ["Correct. The crypto was fine, but the system design left data exposed.", "3DES wasn't the problem. Unencrypted fields were.", "The OS wasn't the core issue.", "Leased lines actually made interception difficult."], "r": "\u00a73.8 Case Study"}, {"id": "3-129", "ch": 3, "sec": "3.8", "q": "In the vulnerable ATM configuration, if an adversary captures messages en route, which integrity problem does the textbook describe?", "o": ["The adversary can pose as the processor and make the ATM dispense money", "The adversary can read each customer's PIN, which was sent in plaintext", "The adversary can change the 3DES key used by every ATM on the network", "The adversary can perform a SIM swap to receive the customer's codes"], "w": ["Correct. There was no protection against injecting or altering data in transit.", "The PIN WAS encrypted with 3DES.", "This is not described.", "Unrelated."], "r": "\u00a73.8 Case Study"}, {"id": "3-130", "ch": 3, "sec": "3.2", "q": "Which UNIX-hash-scheme threat does the textbook describe as a user gaining access via a guest account and running a password guessing program on that machine?", "o": ["Running a password cracker on the machine itself", "Generating rainbow tables offline from a copy of the password file", "Electronic monitoring of passwords sent across the network", "Hijacking a logged-in workstation that has been left unattended"], "w": ["Correct. The other threat is obtaining a copy of the password file and running a cracker on another machine at leisure.", "Rainbow tables are a separate precomputation technique.", "Electronic monitoring is eavesdropping on network transmission.", "Workstation hijacking uses an unattended logged-in session."], "r": "\u00a73.2 The Use of Hashed Passwords"}, {"id": "4-01", "ch": 4, "sec": "Ch 4 intro", "q": "NISTIR 7298 defines access control as the process of granting or denying specific requests to:", "o": ["(1) Obtain and use information and related information processing services and (2) enter specific physical facilities", "(1) Encrypt sensitive data and (2) decrypt it only for authorized users", "(1) Verify that a message came from its alleged source and (2) was not altered", "(1) Assign security clearances to subjects and (2) label every object and resource with a security classification"], "w": ["Correct. This is NISTIR 7298's two-part definition.", "Encrypting and decrypting are crypto functions, not this definition.", "That is message authentication.", "Clearances are part of MAC, not the general definition."], "r": "Ch 4 introduction"}, {"id": "4-02", "ch": 4, "sec": "Ch 4 intro", "q": "RFC 4949 defines access control as a process by which use of system resources is regulated according to a ________ and is permitted only by authorized entities.", "o": ["Security policy", "Risk assessment", "Encryption key", "Audit log"], "w": ["Correct. Use is permitted only by authorized entities (users, programs, processes, or other systems) according to that policy.", "A risk assessment is not part of the RFC 4949 definition.", "Keys are not part of this definition.", "Audit is a related but separate function."], "r": "Ch 4 introduction"}, {"id": "4-03", "ch": 4, "sec": "Ch 4 intro", "q": "The OWASP 2021 report on the top 10 Web application security risks listed which risk in FIRST place?", "o": ["Broken access control", "Cryptographic failures", "Injection", "Security logging failures"], "w": ["Correct. This shows that much greater care is needed in implementing access control correctly.", "Cryptographic failures was #2, as cited in Chapter 2.", "Injection is not cited as #1 here.", "Not cited as #1."], "r": "Ch 4 introduction"}, {"id": "4-04", "ch": 4, "sec": "Ch 4 intro", "q": "In Table 4.1 (NIST SP 800-171), which item is a BASIC (not derived) access control security requirement?", "o": ["Limit system access to the types of transactions and functions that authorized users are permitted to execute", "Limit unsuccessful logon attempts before the account is locked", "Employ the principle of least privilege, including for specific security functions and privileged accounts", "Encrypt controlled unclassified information on mobile devices and computing platforms"], "w": ["Correct. The two basic requirements limit access to authorized users, processes, and devices, and to permitted transactions and functions.", "This is derived requirement #8.", "This is derived requirement #5.", "This is derived requirement #19."], "r": "Ch 4 Table 4.1"}, {"id": "4-05", "ch": 4, "sec": "Ch 4 intro", "q": "Which is a derived requirement in Table 4.1 (SP 800-171) that relates directly to separation of duties?", "o": ["Separate the duties of individuals to reduce the risk of malevolent activity without collusion", "Use multifactor authentication for local and network access to privileged accounts", "Store and transmit only cryptographically protected passwords", "Obscure the feedback of authentication information during login"], "w": ["Correct. This is derived requirement #4 in Table 4.1.", "MFA is in Table 3.1 (identification and authentication), not Table 4.1.", "Cryptographically protected passwords are in Table 3.1.", "Obscuring authentication feedback is in Table 3.1."], "r": "Ch 4 Table 4.1"}, {"id": "4-06", "ch": 4, "sec": "4.1", "q": "RFC 4949 defines computer security as measures that implement and assure security services in a computer system, particularly those that assure:", "o": ["Access control service", "Encryption service", "Availability service", "Audit service"], "w": ["Correct. The book notes that, broadly speaking, all of computer security is concerned with access control.", "Encryption is not the service named in this definition.", "Availability is not the service named in this definition.", "Audit is not the service named in this definition."], "r": "\u00a74.1 Access Control Principles"}, {"id": "4-07", "ch": 4, "sec": "4.1", "q": "In the broader access control context (Figure 4.1), 'the granting of a right or permission to a system entity to access a system resource' is:", "o": ["Authorization", "Authentication", "Audit", "Identification"], "w": ["Correct. Authorization determines who is trusted for a given purpose.", "Authentication verifies that credentials are valid.", "Audit is an independent review of records and activities.", "Identification provides a claimed identity (Ch 3)."], "r": "\u00a74.1 Access Control Context"}, {"id": "4-08", "ch": 4, "sec": "4.1", "q": "An independent review and examination of system records and activities to test the adequacy of controls, ensure compliance, detect breaches, and recommend changes is called:", "o": ["Audit", "Authorization", "Authentication", "Access control"], "w": ["Correct. The auditing function monitors and keeps a record of user accesses to system resources.", "Authorization grants rights.", "Authentication verifies credentials.", "Access control mediates access requests."], "r": "\u00a74.1 Access Control Context"}, {"id": "4-09", "ch": 4, "sec": "4.1", "q": "In Figure 4.1, who maintains the authorization database that specifies what type of access to which resources is allowed for each user?", "o": ["A security administrator", "The user requesting access", "The auditor", "The relying party"], "w": ["Correct. The access control function consults this database to decide whether to grant access.", "Users don't maintain the authorization database.", "Auditors review records. They don't maintain the database.", "Relying party is identity-model terminology (Ch 3, 4.9)."], "r": "\u00a74.1 Access Control Context"}, {"id": "4-10", "ch": 4, "sec": "4.1", "q": "Which access control policy controls access based on the identity of the requestor and access rules, and allows an entity, by its own volition, to enable another entity to access a resource?", "o": ["Discretionary access control (DAC)", "Mandatory access control (MAC)", "Role-based access control (RBAC)", "Attribute-based access control (ABAC)"], "w": ["Correct. It is termed 'discretionary' for exactly this reason.", "Under MAC, an entity with clearance may NOT, by its own volition, enable another entity to access a resource.", "RBAC is based on roles.", "ABAC is based on attributes of the user, resource, and environment."], "r": "\u00a74.1 Access Control Policies"}, {"id": "4-11", "ch": 4, "sec": "4.1", "q": "Which policy controls access by comparing security labels (how sensitive resources are) with security clearances (which entities are eligible)?", "o": ["Mandatory access control (MAC)", "Discretionary access control (DAC)", "Role-based access control (RBAC)", "Attribute-based access control (ABAC)"], "w": ["Correct. MAC evolved out of military information security requirements.", "DAC uses identity and owner-granted rules.", "RBAC uses roles.", "ABAC CAN enforce MAC concepts, but the label-versus-clearance definition is MAC."], "r": "\u00a74.1 Access Control Policies"}, {"id": "4-12", "ch": 4, "sec": "4.1", "q": "Which statement about the four access control policies (DAC, MAC, RBAC, ABAC) is correct?", "o": ["They are not mutually exclusive; a mechanism can employ more than one to cover different classes of resources", "Only one of them may be used in any given system, chosen according to the organization's security policy", "RBAC has replaced DAC in all modern systems, so DAC is only of historical interest", "ABAC cannot express DAC or MAC concepts, so it must be combined with them"], "w": ["Correct. The book says an access control mechanism can employ two or more of these policies.", "The book explicitly says they are NOT mutually exclusive.", "No such claim is made.", "ABAC systems ARE capable of enforcing DAC, RBAC, and MAC concepts."], "r": "\u00a74.1 Access Control Policies"}, {"id": "4-13", "ch": 4, "sec": "4.1", "q": "Which access control policy is described as the TRADITIONAL method of implementing access control?", "o": ["DAC", "MAC", "RBAC", "ABAC"], "w": ["Correct. DAC is examined in Sections 4.3 and 4.4.", "MAC evolved from military requirements.", "RBAC has become increasingly popular more recently.", "ABAC is a relatively recent development."], "r": "\u00a74.1 Access Control Policies"}, {"id": "4-14", "ch": 4, "sec": "4.2", "q": "What are the basic elements of access control?", "o": ["Subject, object, and access right", "User, password, and token", "Label, clearance, and category", "Role, session, and permission"], "w": ["Correct. These are the three basic elements.", "These are authentication concepts.", "These are MAC concepts.", "These are RBAC entities (along with user)."], "r": "\u00a74.2 Subjects, Objects, and Access Rights"}, {"id": "4-15", "ch": 4, "sec": "4.2", "q": "In access control, the concept of a subject generally equates with that of a:", "o": ["Process", "File", "Directory", "Permission"], "w": ["Correct. A user or application gains access to an object through a process that represents it and takes on its attributes, such as access rights.", "A file is an object.", "A directory is an object.", "A permission is an access right."], "r": "\u00a74.2 Subjects, Objects, and Access Rights"}, {"id": "4-16", "ch": 4, "sec": "4.2", "q": "Basic access control systems typically define three classes of subject. Which class receives the LEAST amount of access?", "o": ["World", "Owner", "Group", "Administrator"], "w": ["Correct. World means users who can access the system but aren't in the owner or group categories for the resource.", "The owner, often the creator, has the most rights.", "Named group members get group rights.", "Administrator is not one of the three classes."], "r": "\u00a74.2 Subjects, Objects, and Access Rights"}, {"id": "4-17", "ch": 4, "sec": "4.2", "q": "An object, in access control, is:", "o": ["A resource to which access is controlled, generally used to contain and/or receive information", "An entity capable of accessing resources, generally equated with a process acting on behalf of a user", "A description of the way in which a subject may access a resource", "A named job function within the organization that controls the system"], "w": ["Correct. Examples include records, blocks, pages, segments, files, directories, mailboxes, messages, and programs.", "That is a SUBJECT.", "That is an ACCESS RIGHT.", "That is a ROLE."], "r": "\u00a74.2 Subjects, Objects, and Access Rights"}, {"id": "4-18", "ch": 4, "sec": "4.2", "q": "Which access right includes read access, according to the textbook?", "o": ["Write", "Execute", "Search", "Create"], "w": ["Correct. Write access means the user may add, modify, or delete data, and it includes read access.", "Execute lets the user run specified programs.", "Search lets the user list or search a directory.", "Create lets the user create new files, records, or fields."], "r": "\u00a74.2 Subjects, Objects, and Access Rights"}, {"id": "4-19", "ch": 4, "sec": "4.2", "q": "The 'search' access right allows a user to:", "o": ["List the files in a directory or otherwise search the directory", "Read the contents of any file contained in the directory", "Execute specified programs stored in the directory", "Create new files, records, or fields in the directory"], "w": ["Correct. This is the book's definition.", "That is read.", "That is execute.", "That is create."], "r": "\u00a74.2 Subjects, Objects, and Access Rights"}, {"id": "4-20", "ch": 4, "sec": "4.3", "q": "The access matrix concept was formulated by:", "o": ["Lampson, and subsequently refined by Graham and Denning and by Harrison et al.", "Bell and LaPadula, as part of their formal model for multilevel security", "Sandhu, as part of his family of RBAC reference models", "Saltzer and Schroeder, as one of their original design principles"], "w": ["Correct. [LAMP69, LAMP71], then [GRAH72, DENN71], and [HARR76].", "Bell-LaPadula is the MAC model.", "Sandhu contributed the RBAC reference models [SAND96] and Figure 4.2 [SAND94].", "Saltzer and Schroeder proposed the original design principles (Ch 1)."], "r": "\u00a74.3 Discretionary Access Control"}, {"id": "4-21", "ch": 4, "sec": "4.3", "q": "Decomposing a sparse access matrix by COLUMNS yields:", "o": ["Access control lists (ACLs)", "Capability tickets", "Protection domains", "Sorted authorization tables"], "w": ["Correct. For each object, the ACL lists users and their permitted access rights.", "Decomposition by ROWS yields capability tickets.", "A row defines a protection domain. Columns give ACLs.", "An authorization table is a different, non-sparse structure [SAND94]."], "r": "\u00a74.3 Discretionary Access Control; Figure 4.2"}, {"id": "4-22", "ch": 4, "sec": "4.3", "q": "Decomposing an access matrix by ROWS yields:", "o": ["Capability tickets", "Access control lists", "Inodes", "Security labels"], "w": ["Correct. A capability ticket specifies authorized objects and operations for a particular user.", "ACLs come from columns.", "Inodes are UNIX file structures.", "Labels are MAC."], "r": "\u00a74.3 Discretionary Access Control"}, {"id": "4-23", "ch": 4, "sec": "4.3", "q": "When it is desired to determine which subjects have which access rights to a PARTICULAR RESOURCE, which structure is convenient?", "o": ["Access control lists", "Capability tickets", "Session tables", "Rainbow tables"], "w": ["Correct. Each ACL provides the information for a given resource. It is NOT convenient for determining the rights available to a specific user.", "Capability tickets make it easy to find a user's rights but hard to find who can access a resource.", "This is not a structure in the text.", "Rainbow tables are a password-cracking tool."], "r": "\u00a74.3 Discretionary Access Control"}, {"id": "4-24", "ch": 4, "sec": "4.3", "q": "Why do capability tickets present a greater security problem than ACLs?", "o": ["Tickets are dispersed around the system, so they must be protected and unforgeable", "Tickets are stored with each object, so an attacker can modify them in place", "Tickets cannot be shared, so users must request new ones for every access", "Tickets are always encrypted, so the system cannot check their contents"], "w": ["Correct. Options include having the OS hold all tickets in memory inaccessible to users, or embedding an unforgeable token such as a large random password or a MAC.", "ACLs are stored with objects. Tickets are held by users.", "Users may be authorized to loan or give tickets to others.", "Encryption isn't the stated issue."], "r": "\u00a74.3 Discretionary Access Control"}, {"id": "4-25", "ch": 4, "sec": "4.3", "q": "Including an unforgeable token (such as a large random password or a cryptographic MAC) in a capability, verified by the resource on each access, is appropriate for:", "o": ["A distributed environment where the security of ticket contents cannot be guaranteed", "A single-user PC where only one person ever holds capability tickets", "A system with no networking, where the OS holds every ticket in protected memory", "A mandatory access control system, where tickets replace security labels"], "w": ["Correct. The value is verified whenever access is requested.", "This is not the stated context.", "This is not the stated context.", "This is not limited to MAC."], "r": "\u00a74.3 Discretionary Access Control"}, {"id": "4-26", "ch": 4, "sec": "4.3", "q": "The default (public) entry of an ACL should always follow:", "o": ["The rule of least privilege or read-only access, whichever is applicable", "Full access for every user, for convenience when no specific entry applies", "Write-only access, so unlisted users can contribute but not view", "The same rights as the owner of the object"], "w": ["Correct. The default entry gives unlisted users a default set of rights.", "This violates least privilege.", "This is not the guidance.", "This is too permissive."], "r": "\u00a74.3 Discretionary Access Control"}, {"id": "4-27", "ch": 4, "sec": "4.3", "q": "[SAND94]'s authorization table contains one row for one access right of one subject to one resource. Sorting it by SUBJECT is equivalent to a(n):", "o": ["Capability list", "Access control list", "Protection domain", "Role hierarchy"], "w": ["Correct. Sorting by OBJECT gives the equivalent of an ACL. A relational database can easily implement it.", "That's sorting by object.", "Not the stated equivalence.", "Not related."], "r": "\u00a74.3 Table 4.2"}, {"id": "4-28", "ch": 4, "sec": "4.3", "q": "In the Lampson-Graham-Denning DAC model, the 'protection state' of a system is:", "o": ["The information specifying each subject's access rights to each object at a given time", "The list of security labels assigned to subjects and objects at a given time", "The set of encryption keys currently in use by each subject", "The set of audit logs recording each subject's past accesses"], "w": ["Correct. The model addresses three requirements: representing the protection state, enforcing access rights, and allowing subjects to alter the protection state in certain ways.", "Labels are MAC.", "Keys are unrelated.", "Audit logs are unrelated."], "r": "\u00a74.3 An Access Control Model"}, {"id": "4-29", "ch": 4, "sec": "4.3", "q": "To represent the protection state, the general DAC model extends the universe of objects in the access matrix to include which of the following?", "o": ["Processes, devices, memory locations or regions, and subjects", "Only files and directories, since those are the objects users can name", "Only users and groups, since rights are always granted to them", "Roles and sessions, since rights are assigned through roles"], "w": ["Correct. For example, rights over processes include delete, stop (block), and wake up.", "The model goes beyond files and directories.", "The extension covers more than users and groups.", "Roles and sessions are RBAC."], "r": "\u00a74.3 An Access Control Model"}, {"id": "4-30", "ch": 4, "sec": "4.3", "q": "In the access control model, when subject S0 issues request type \u03b1 for object X, the controller for X interrogates the access matrix. If \u03b1 is not in A[S0, X], what happens?", "o": ["Access is denied and a protection violation occurs, which should trigger a warning and appropriate action", "Access is granted by default, and the access is logged in an audit trail for the administrator's later review", "The request is forwarded to the object's owner, who decides whether to allow it", "The copy flag is set on the entry, so the subject can request the right later"], "w": ["Correct. Every access is mediated by the object's controller.", "Granting by default would violate fail-safe defaults.", "This is not the model's behavior.", "Unrelated."], "r": "\u00a74.3 An Access Control Model; Figure 4.4"}, {"id": "4-31", "ch": 4, "sec": "4.3", "q": "In Table 4.3, what does the copy flag (shown as \u03b1*) on an access right allow?", "o": ["The subject can transfer that right, with or without the copy flag, to another subject (Rule R1)", "The subject can delete the object and remove its column from the matrix", "The subject owns the object and can therefore grant any access right on it to any other subject", "The subject can create new subjects that inherit the right"], "w": ["Correct. A right might be transferred WITHOUT the copy flag if there's concern the new subject would maliciously pass it on.", "Destroying objects requires 'owner' (R6).", "Ownership is a separate right.", "Any subject can create subjects (R7)."], "r": "\u00a74.3 Table 4.3 (Rule R1)"}, {"id": "4-32", "ch": 4, "sec": "4.3", "q": "Under Rule R2 of Table 4.3, a subject S0 can GRANT any access right to object X for any other subject if:", "o": ["S0 has 'owner' access to X", "S0 has the copy flag on read", "S0 has 'control' access to X", "S0 created any object"], "w": ["Correct. The owner of X can add any access right to A[S, X] for any S.", "The copy flag permits transfer (R1), not granting any right.", "'Control' relates to subjects (deleting rights in that subject's row).", "Not sufficient."], "r": "\u00a74.3 Table 4.3 (Rule R2)"}, {"id": "4-33", "ch": 4, "sec": "4.3", "q": "Under Rule R3, S0 may delete access right \u03b1 from A[S, X] if:", "o": ["S0 has 'control' access to S or 'owner' access to X", "S0 has read access to X, which lets it see and change the column for X", "S0 has the copy flag on \u03b1, which lets it remove \u03b1 from other subjects", "S0 is the most recently created subject in the system"], "w": ["Correct. This covers any entry in a row for a subject S0 controls, and any entry in a column for an object S0 owns.", "Read isn't sufficient.", "The copy flag is for transfer.", "Not a rule."], "r": "\u00a74.3 Table 4.3 (Rule R3)"}, {"id": "4-34", "ch": 4, "sec": "4.3", "q": "Under Rule R7 of Table 4.3, when any subject creates a new subject:", "o": ["The creator owns the new subject, and the new subject has 'control' access to itself", "The new subject owns its creator and has control access to the creator's row", "The new subject has no rights at all until the owner of each object grants them", "The operating system becomes the owner and grants the creator control access"], "w": ["Correct. This enables subject hierarchies, for example S1 owning S2 and S3.", "This is backwards.", "The new subject has control access to itself.", "This is not the rule."], "r": "\u00a74.3 Table 4.3 (Rule R7)"}, {"id": "4-35", "ch": 4, "sec": "4.3", "q": "Which is given as an example of an ADDITIONAL or ALTERNATIVE rule beyond Table 4.3?", "o": ["A transfer-only right that is added to the target and deleted from the giver", "Allowing any subject to destroy any object, whether or not it owns it", "Removing the owner right entirely so that no subject can grant rights", "Allowing access without checking the matrix when the subject is trusted"], "w": ["Correct. Another example is limiting owners to one by not allowing the copy flag on the owner right.", "This would be insecure and is not suggested.", "This is not suggested.", "This violates mediation."], "r": "\u00a74.3 An Access Control Model"}, {"id": "4-36", "ch": 4, "sec": "4.3", "q": "A protection domain is:", "o": ["A set of objects together with access rights to them; a row of the access matrix", "A column of the access matrix, listing every subject that may access an object", "A security clearance level assigned to a subject in a multilevel system", "A group of users who share the same role and therefore the same rights"], "w": ["Correct. Associating capabilities with protection domains, as proposed in [LAMP71], is more flexible than associating them with users.", "A column corresponds to an object's ACL.", "Clearances are MAC.", "Not the definition."], "r": "\u00a74.3 Protection Domains"}, {"id": "4-37", "ch": 4, "sec": "4.3", "q": "A user spawns a process with only a subset of the user's access rights, defined as a new protection domain, to run a program that is not fully trusted. This best supports:", "o": ["Minimizing the access rights any user or process has at any one time", "Separation of duty, enforced through mutually exclusive roles", "Mandatory access control, enforced through security labels", "Identity federation, enforced through a trust framework"], "w": ["Correct. Protection domains provide a simple means of satisfying least privilege.", "Mutually exclusive roles are RBAC constraints.", "Labels are MAC.", "Not related."], "r": "\u00a74.3 Protection Domains"}, {"id": "4-38", "ch": 4, "sec": "4.3", "q": "In UNIX, the distinction between user mode and kernel mode is described as:", "o": ["One form of protection domain", "A type of capability ticket", "An RBAC constraint", "A security label"], "w": ["Correct. In kernel mode, privileged instructions may be executed and protected areas of memory accessed.", "Not a capability ticket.", "Not an RBAC constraint.", "Not a security label."], "r": "\u00a74.3 Protection Domains"}, {"id": "4-39", "ch": 4, "sec": "4.4", "q": "In UNIX, a control structure that contains the key information needed by the OS for a particular file, including its attributes and permissions, is a(n):", "o": ["Inode (index node)", "Access control list", "Capability ticket", "Directory entry only"], "w": ["Correct. Several file names may be associated with one inode, but an active inode is associated with exactly one file.", "ACLs are an extension. The inode holds the base control information.", "Not UNIX file metadata.", "A directory is a file containing names plus pointers to inodes."], "r": "\u00a74.4 Example: UNIX File Access Control"}, {"id": "4-40", "ch": 4, "sec": "4.4", "q": "In UNIX, a directory is:", "o": ["Simply a file that contains a list of file names plus pointers to associated inodes", "A special hardware partition that holds files and has no inode of its own", "An object with no inode, since only regular files are described by inodes", "A capability list that records which users may access each file"], "w": ["Correct. Each directory therefore has its own inode.", "A directory is not a hardware partition.", "Directories DO have inodes.", "Not related."], "r": "\u00a74.4 Example: UNIX File Access Control"}, {"id": "4-41", "ch": 4, "sec": "4.4", "q": "How many protection bits are associated with each UNIX file in the traditional scheme?", "o": ["12", "9", "3", "16"], "w": ["Correct. Nine specify rwx for owner, group, and other. The remaining three are SetUID, SetGID, and the sticky bit.", "9 bits are the rwx bits only.", "3 bits is too few.", "16 bits is too many."], "r": "\u00a74.4 Traditional UNIX File Access Control"}, {"id": "4-42", "ch": 4, "sec": "4.4", "q": "When applied to a UNIX DIRECTORY, what does the execute bit grant?", "o": ["The right to descend into the directory or search it for a filename", "The right to run every program stored in the directory", "The right to delete the directory and everything in it", "The right to change the ownership of files in the directory"], "w": ["Correct. The read and write bits on a directory grant the right to list files and to create, rename, or delete files.", "Not the directory semantics.", "Not the execute bit.", "Not the execute bit."], "r": "\u00a74.4 Traditional UNIX File Access Control"}, {"id": "4-43", "ch": 4, "sec": "4.4", "q": "When the SetUID bit is set on an executable file, what happens when a user with execute privilege runs it?", "o": ["The executing user temporarily gets the file creator's user ID as an effective user ID", "The user permanently becomes the file's owner and keeps that ownership afterward", "The file becomes world-writable for as long as the program is running", "The program runs with no privileges, so it cannot access protected files"], "w": ["Correct. The effective user ID is used in addition to the real user ID only while the program executes. This enables privileged programs that access otherwise inaccessible files in a controlled fashion.", "The change is temporary.", "Not related.", "It's the opposite: it runs with elevated rights."], "r": "\u00a74.4 Traditional UNIX File Access Control"}, {"id": "4-44", "ch": 4, "sec": "4.4", "q": "When SetGID is applied to a DIRECTORY, what does it indicate?", "o": ["Newly created files will inherit the group of this directory", "Only the owner can delete files in it", "Programs in it run with the directory owner's rights when executed", "The directory is hidden"], "w": ["Correct. The SetUID permission is ignored on directories.", "That is the STICKY bit on directories.", "Not the directory semantics.", "Not a SetGID effect."], "r": "\u00a74.4 Traditional UNIX File Access Control"}, {"id": "4-45", "ch": 4, "sec": "4.4", "q": "Which permission bit, when applied to a directory, specifies that only the owner of any file in the directory can rename, move, or delete that file, which is useful for shared temporary directories?", "o": ["The sticky bit", "SetUID", "SetGID", "The execute bit"], "w": ["Correct. On files, the sticky bit originally meant 'retain contents in memory after execution,' which is no longer used.", "SetUID gives an executable the creator's effective user ID.", "SetGID gives the effective group ID, or group inheritance on directories.", "Execute on a directory allows descending and searching."], "r": "\u00a74.4 Traditional UNIX File Access Control"}, {"id": "4-46", "ch": 4, "sec": "4.4", "q": "Why does the textbook warn that great care is needed with programs owned by and SetUID to the superuser?", "o": ["Any user running it could potentially gain unrestricted access to the system", "Such programs cannot be executed by ordinary users at all", "Running such a program causes the superuser to lose privileges", "Such programs disable the access control lists on every file"], "w": ["Correct. The superuser is exempt from the usual file access constraints.", "They CAN be executed.", "The superuser does not lose privileges.", "Not stated."], "r": "\u00a74.4 Traditional UNIX File Access Control"}, {"id": "4-47", "ch": 4, "sec": "4.4", "q": "A user wants read access for file X given to users A and B, and read access for file Y given to users B and C. Under traditional UNIX, what's needed, and what problem does this illustrate?", "o": ["At least two groups, with B in both; varied groupings soon need too many groups", "A single group containing A, B, and C; this causes no problem", "Three owners for each file, one for each user who needs access", "The SetUID bit on both files, so every user runs them as the owner"], "w": ["Correct. This is the book's example of why modern UNIX systems provide ACLs.", "One group would give C access to X.", "Each file has a single owner.", "SetUID is unrelated."], "r": "\u00a74.4 Traditional UNIX File Access Control"}, {"id": "4-48", "ch": 4, "sec": "4.4", "q": "In FreeBSD, which command assigns a list of UNIX user IDs and groups to a file to create an extended ACL?", "o": ["setfacl", "chmod", "chown", "passwd"], "w": ["Correct. Any number of users and groups can be associated with a file, each with three protection bits (rwx).", "chmod is not the command the text cites for ACLs.", "chown changes ownership.", "passwd changes passwords."], "r": "\u00a74.4 Access Control Lists in UNIX"}, {"id": "4-49", "ch": 4, "sec": "4.4", "q": "In FreeBSD extended ACLs, the traditional UNIX approach is referred to as a:", "o": ["Minimal access control list", "Capability list", "Default access control list", "Mandatory ACL"], "w": ["Correct. The extended feature is called extended access control lists.", "Not the term used.", "Not the term used.", "Not the term used."], "r": "\u00a74.4 Access Control Lists in UNIX"}, {"id": "4-50", "ch": 4, "sec": "4.4", "q": "In FreeBSD extended ACLs, the group class entry takes on an additional role. What is it?", "o": ["It acts as a mask: the maximum permissions for named users and named groups", "It overrides the owner's permissions whenever a named user is added", "It lists all named users and their permissions for the file", "It disables the other class whenever an extended ACL is present"], "w": ["Correct. Any permission for a named user or group that is not present in the mask is disallowed.", "The owner class keeps its meaning.", "Named users are separate entries.", "Not stated."], "r": "\u00a74.4 Access Control Lists in UNIX"}, {"id": "4-51", "ch": 4, "sec": "4.4", "q": "When a process requests access under FreeBSD extended ACLs, in what order are ACL entries examined to find the one that most closely matches?", "o": ["Owner, named users, groups, others", "Others, groups, named users, owner", "Groups, owner, others, named users", "Named users, owner, others, groups"], "w": ["Correct. Only a single entry determines access.", "This is the reverse.", "Wrong order.", "Wrong order."], "r": "\u00a74.4 Access Control Lists in UNIX"}, {"id": "4-52", "ch": 4, "sec": "4.4", "q": "Under FreeBSD extended ACLs, a process belongs to several groups, and more than one group entry matches, but NONE of them contains the requested permission. What happens?", "o": ["Access is denied, no matter which entry is picked", "Access falls through to the 'others' entry", "Access is granted because a match exists", "The owner is asked for approval"], "w": ["Correct. If any matching group entry contains the permission, one of those is picked and access is granted.", "No fall-through to 'others' is described.", "A matching entry still has to contain the requested permission.", "Not described."], "r": "\u00a74.4 Access Control Lists in UNIX"}, {"id": "4-53", "ch": 4, "sec": "4.5", "q": "Why is MAC termed 'mandatory'?", "o": ["An entity with clearance can't, by its own volition, enable another entity's access", "It is required by all operating systems that store classified information", "Users must authenticate again before every access to a labeled resource", "It cannot be configured by administrators once the system is installed"], "w": ["Correct. This is the defining contrast with DAC.", "Not the reason.", "That is about authentication, not MAC.", "Not the reason."], "r": "\u00a74.5 Mandatory Access Control"}, {"id": "4-54", "ch": 4, "sec": "4.5", "q": "The Bell-LaPadula (BLP) model was developed in the 1970s as a:", "o": ["Formal model meant to prove that a design meets stated security requirements", "Commercial RBAC standard for assigning permissions to job functions", "Password hashing algorithm for multilevel secure systems", "Network firewall model for controlling traffic between security levels"], "w": ["Correct. Research was initially funded by the U.S. Department of Defense.", "RBAC came later.", "Not related.", "Not related."], "r": "\u00a74.5 Bell-LaPadula (BLP) Model"}, {"id": "4-55", "ch": 4, "sec": "4.5", "q": "In the BLP model, a subject is said to have a security ______ of a given level, and an object is said to have a security ______ of a given level.", "o": ["Clearance; classification", "Classification; clearance", "Label; role", "Role; attribute"], "w": ["Correct. Subjects have clearances, and objects have classifications.", "This is reversed.", "These are not the BLP terms.", "These are RBAC and ABAC terms."], "r": "\u00a74.5 Bell-LaPadula (BLP) Model"}, {"id": "4-56", "ch": 4, "sec": "4.5", "q": "Which is the U.S. military classification scheme given as an example of BLP security levels, from highest to lowest?", "o": ["Top secret > secret > confidential > restricted > unclassified", "Secret > top secret > restricted > confidential > unclassified", "Strategic > sensitive > confidential > public", "Restricted > confidential > secret > top secret"], "w": ["Correct. This is the military example.", "Wrong order.", "This is the CORPORATE example scheme.", "This is reversed."], "r": "\u00a74.5 Bell-LaPadula (BLP) Model"}, {"id": "4-57", "ch": 4, "sec": "4.5", "q": "In BLP, which access mode allows the subject only WRITE access to the object (no read)?", "o": ["Append", "Write", "Read", "Execute"], "w": ["Correct. Append means write-only.", "In BLP, 'write' allows BOTH read and write.", "Read means read only.", "Execute means neither read nor write, but the object may be invoked."], "r": "\u00a74.5 Bell-LaPadula (BLP) Model"}, {"id": "4-58", "ch": 4, "sec": "4.5", "q": "The BLP 'no read up' rule, under which a subject can only read an object of less or equal security level, is known as the:", "o": ["Simple security property (ss-property)", "*-property (star property)", "Discretionary security property (ds-property)", "Tranquility property"], "w": ["Correct. This is no read up.", "The *-property is NO WRITE DOWN.", "The ds-property is the discretionary rule.", "Not discussed in the text."], "r": "\u00a74.5 Bell-LaPadula (BLP) Model"}, {"id": "4-59", "ch": 4, "sec": "4.5", "q": "The BLP *-property (no write down) prevents:", "o": ["A malicious subject copying classified data into a lower-classified container", "Subjects from reading data classified at a higher level than their clearance", "Owners from granting access to documents at their own discretion", "Authorized users from downgrading the classification of objects"], "w": ["Correct. Otherwise a lower-cleared subject could later read it.", "That is the ss-property (no read up).", "That's the ds-property's domain.", "BLP lacks a downgrade provision, but that's not what *-property targets."], "r": "\u00a74.5 Bell-LaPadula (BLP) Model"}, {"id": "4-60", "ch": 4, "sec": "4.5", "q": "In BLP, the ds-property states that an individual may grant another individual access to a document based on the owner's discretion:", "o": ["Constrained by the MAC rules", "Overriding the MAC rules", "Only for unclassified documents", "Only with administrator approval"], "w": ["Correct. MAC policy overrides any discretionary access control, so a user cannot give data away to unauthorized persons.", "It's the reverse: MAC overrides DAC.", "Not restricted this way.", "Not stated."], "r": "\u00a74.5 Bell-LaPadula (BLP) Model"}, {"id": "4-61", "ch": 4, "sec": "4.5", "q": "A new document consolidates information from a range of sources and levels, so some information ends up classified higher than originally. This known concern in multilevel systems is called:", "o": ["Classification creep", "Privilege escalation", "Role explosion", "Inference"], "w": ["Correct. Managed downgrading is needed to restore reasonable classification levels.", "Not the term.", "Not the term (though roles growing exponentially is discussed for RBAC vs ABAC).", "Inference is a database topic (Ch 5)."], "r": "\u00a74.5 Bell-LaPadula (BLP) Model"}, {"id": "4-62", "ch": 4, "sec": "4.5", "q": "Which is a practical limitation of the BLP model noted in the textbook?", "o": ["It has no provision to manage the 'downgrade' of objects", "It cannot express confidentiality requirements for classified information", "It does not support read access, only append and execute", "It requires every subject to be assigned to a role before access"], "w": ["Correct. Practical systems must support controlled, monitored downgrading.", "BLP is confidentiality-centered.", "Read is a BLP mode.", "Roles are RBAC."], "r": "\u00a74.5 Bell-LaPadula (BLP) Model"}, {"id": "4-63", "ch": 4, "sec": "4.5", "q": "An early implementation of multilevel security, described as decades ahead of its time, was:", "o": ["Multics", "Windows Vista", "FreeBSD", "OS/2"], "w": ["Correct. Multics [BELL75] had superior security features even by the mid-1980s.", "Vista introduced MIC much later.", "Not cited.", "Not cited."], "r": "\u00a74.5 Bell-LaPadula (BLP) Model"}, {"id": "4-64", "ch": 4, "sec": "4.5", "q": "Which is the NSA's powerful implementation of MAC for Linux, described as complicated and time-consuming to configure?", "o": ["SELinux", "AppArmor", "Mandatory Integrity Control", "pam_passwdqc"], "w": ["Correct. Fedora and Red Hat Enterprise Linux implement it with a policy that restricts key network daemons.", "AppArmor (SUSE) is a PARTIAL MAC restricting specific processes.", "MIC is Windows (Vista and Server 2008 onward).", "pam_passwdqc is a password checker."], "r": "\u00a74.5 Mandatory Access Control"}, {"id": "4-65", "ch": 4, "sec": "4.5", "q": "Windows Mandatory Integrity Control (MIC), from Vista and Server 2008 on, adds Integrity Levels to processes. How does it differ from BLP?", "o": ["MIC focuses on the integrity of information rather than confidentiality", "MIC focuses on confidentiality only, exactly as the BLP model does", "MIC is a DAC mechanism in which owners assign integrity levels", "MIC uses roles to group processes with the same privileges"], "w": ["Correct. MIC is another variant of the MAC concept, based on a different model from BLP.", "BLP is the confidentiality model.", "MIC is a MAC variant.", "MIC doesn't use roles."], "r": "\u00a74.5 Mandatory Access Control"}, {"id": "4-66", "ch": 4, "sec": "4.6", "q": "RBAC is based on:", "o": ["The roles that users assume in a system rather than the user's identity", "Comparing security labels on resources with clearances held by users", "Attributes of the user, the resource, and the environment", "The identity of the requestor and rules stating what it may do"], "w": ["Correct. A role is typically a job function within the organization.", "That is MAC.", "That is part of ABAC.", "That is DAC."], "r": "\u00a74.6 Role-Based Access Control"}, {"id": "4-67", "ch": 4, "sec": "4.6", "q": "Which NIST standard does the textbook cite as requiring support for access control and administration through roles?", "o": ["FIPS PUB 140-3 (Cryptographic Modules)", "FIPS 197 (Advanced Encryption Standard)", "FIPS 186-4 (Digital Signature Standard)", "FIPS 181 (Automated Password Generator)"], "w": ["Correct. FIPS PUB 140-3 (March 2019) is cited.", "FIPS 197 is AES.", "FIPS 186-4 is the Digital Signature Standard.", "FIPS 181 is the Automated Password Generator."], "r": "\u00a74.6 Role-Based Access Control"}, {"id": "4-68", "ch": 4, "sec": "4.6", "q": "In RBAC, the relationship of users to roles is:", "o": ["Many-to-many", "One-to-one", "One-to-many only", "Many-to-one only"], "w": ["Correct. The relationship of roles to resources is also many-to-many.", "A user may hold multiple roles.", "Multiple users may share a role.", "A user may hold multiple roles."], "r": "\u00a74.6 Role-Based Access Control; Figure 4.6"}, {"id": "4-69", "ch": 4, "sec": "4.6", "q": "Which set in an RBAC environment is typically the MOST static?", "o": ["The set of roles", "The set of users", "User-to-role assignments", "Sessions"], "w": ["Correct. Roles change only with occasional additions or deletions.", "The set of users changes, in some environments frequently.", "User-to-role assignments may be dynamic.", "Sessions are temporary."], "r": "\u00a74.6 Role-Based Access Control"}, {"id": "4-70", "ch": 4, "sec": "4.6", "q": "RBAC lends itself to an effective implementation of which principle from Chapter 1?", "o": ["Least privilege", "Open design", "Economy of mechanism", "Least common mechanism"], "w": ["Correct. Each role contains the minimum set of access rights needed for that role.", "Not the cited principle.", "Not the cited principle.", "Not the cited principle."], "r": "\u00a74.6 Role-Based Access Control"}, {"id": "4-71", "ch": 4, "sec": "4.6", "q": "In the [SAND96] family of RBAC reference models, which model contains the MINIMUM functionality for an RBAC system?", "o": ["RBAC0", "RBAC1", "RBAC2", "RBAC3"], "w": ["Correct. RBAC0 is the base model.", "RBAC1 adds role hierarchies.", "RBAC2 adds constraints.", "RBAC3 is the consolidated model (0 + 1 + 2)."], "r": "\u00a74.6 RBAC Reference Models; Table 4.4"}, {"id": "4-72", "ch": 4, "sec": "4.6", "q": "Which RBAC model includes RBAC0 and adds constraints, but NOT role hierarchies?", "o": ["RBAC2", "RBAC1", "RBAC3", "RBAC0"], "w": ["Correct. Table 4.4: RBAC2 has Hierarchies No and Constraints Yes.", "RBAC1 has hierarchies but no constraints.", "RBAC3 has both.", "RBAC0 has neither."], "r": "\u00a74.6 Table 4.4"}, {"id": "4-73", "ch": 4, "sec": "4.6", "q": "Which is NOT one of the four types of entities in an RBAC0 system?", "o": ["Security label", "User", "Permission (privilege)", "Session"], "w": ["Correct. Security labels belong to MAC. The four RBAC0 entities are user, role, permission, and session.", "User IS one of the four entities.", "Permission IS one of the four entities.", "Session IS one of the four entities."], "r": "\u00a74.6 Base Model\u2014RBAC0"}, {"id": "4-74", "ch": 4, "sec": "4.6", "q": "In RBAC, a session is:", "o": ["A mapping between a user and an activated subset of the set of roles to which the user is assigned", "A permanent assignment of all of the roles a user is authorized to hold", "A named job function within the organization, with a description of its authority and responsibility", "An approval of a particular mode of access to one or more objects"], "w": ["Correct. The user establishes a session with only the roles needed for a task, which is an example of least privilege.", "Sessions are temporary and use a subset of roles.", "That is a ROLE.", "That is a PERMISSION."], "r": "\u00a74.6 Base Model\u2014RBAC0"}, {"id": "4-75", "ch": 4, "sec": "4.6", "q": "In RBAC, 'an approval of a particular mode of access to one or more objects' is a(n):", "o": ["Permission (also: access right, privilege)", "Role (a named job function)", "Session (an activated subset of roles)", "User (an individual with a user ID)"], "w": ["Correct. This is the RBAC0 definition of permission.", "A role is a named job function.", "A session maps a user to activated roles.", "A user is an individual with access."], "r": "\u00a74.6 Base Model\u2014RBAC0"}, {"id": "4-76", "ch": 4, "sec": "4.6", "q": "The relationship between a user and the roles in a session is:", "o": ["A temporary one-to-many relationship", "A permanent many-to-many relationship", "A one-to-one relationship", "A many-to-one relationship"], "w": ["Correct. One user activates one or more of their assigned roles.", "User\u2013role assignment (not a session) is many-to-many.", "Not correct.", "Not correct."], "r": "\u00a74.6 Base Model\u2014RBAC0"}, {"id": "4-77", "ch": 4, "sec": "4.6", "q": "The NIST RBAC document notes users might need to list directories and modify existing files without creating new files, or append records without modifying existing ones. What point does this illustrate?", "o": ["RBAC's many-to-many relationships provide flexibility and granularity not found in conventional DAC", "DAC is more granular than RBAC, because access rights are assigned directly to individual users and files", "Files cannot be appended to under RBAC unless the user can also modify them", "Roles cannot be hierarchical, so each task needs a separate role"], "w": ["Correct. Without this granularity, users risk being granted more access than needed.", "This is the reverse.", "Not relevant.", "Not relevant."], "r": "\u00a74.6 Base Model\u2014RBAC0"}, {"id": "4-78", "ch": 4, "sec": "4.6", "q": "In the role hierarchy of Figure 4.9, the Project Lead role includes all access rights of the Production Engineer and Quality Engineer roles. This uses the concept of:", "o": ["Inheritance", "Cardinality", "Mutually exclusive roles", "Prerequisite roles"], "w": ["Correct. Role hierarchies (RBAC1) use inheritance so that a role implicitly includes the rights of its subordinate roles.", "Cardinality sets maximum numbers.", "Mutually exclusive roles prevent holding conflicting roles.", "Prerequisite roles require holding another role first."], "r": "\u00a74.6 Role Hierarchies\u2014RBAC1; Figure 4.9"}, {"id": "4-79", "ch": 4, "sec": "4.6", "q": "In Figure 4.9, both Production Engineer and Quality Engineer inherit all access rights of the Engineer role. What is true of these two roles?", "o": ["They have overlapping access rights, namely those they share with the Engineer role", "They have identical rights, because both inherit from the Engineer role", "They are mutually exclusive, so no user may hold both roles", "One is a prerequisite of the other in the hierarchy"], "w": ["Correct. Each also has a different set of additional rights.", "Each has different additional rights.", "Not stated.", "Not stated."], "r": "\u00a74.6 Role Hierarchies\u2014RBAC1"}, {"id": "4-80", "ch": 4, "sec": "4.6", "q": "Which three types of role constraints does [SAND96] list?", "o": ["Mutually exclusive roles, cardinality, and prerequisite roles", "Read, write, and execute permissions assigned to each role", "Static, dynamic, and challenge-response role activation", "Subject, object, and environment constraints on each role"], "w": ["Correct. These are the RBAC2 constraint types.", "These are access rights.", "These are token protocols.", "These are ABAC attribute types."], "r": "\u00a74.6 Constraints\u2014RBAC2"}, {"id": "4-81", "ch": 4, "sec": "4.6", "q": "What is the purpose of mutually exclusive roles?", "o": ["To make collusion harder among people with different skills or job functions", "To give users more roles, so each person can cover several job functions", "To speed up access decisions by reducing the number of roles checked", "To implement role inheritance between superior and subordinate roles"], "w": ["Correct. Mutually exclusive roles support separation of duties.", "They restrict roles.", "Not the purpose.", "Inheritance is hierarchies."], "r": "\u00a74.6 Constraints\u2014RBAC2"}, {"id": "4-82", "ch": 4, "sec": "4.6", "q": "When mutually exclusive permission assignments are added to mutually exclusive roles, which properties hold?", "o": ["A user can be assigned to only one role in the set, and any permission can be granted to only one role in the set", "Any user can hold all of the roles in the set, as long as only one of those roles is active in each session", "All roles in the set share the same permissions, so they are interchangeable", "Permissions granted to a junior role in the set are inherited upward by senior roles"], "w": ["Correct. So the roles have non-overlapping permissions.", "This contradicts mutual exclusion.", "This is the opposite.", "That is hierarchy."], "r": "\u00a74.6 Constraints\u2014RBAC2"}, {"id": "4-83", "ch": 4, "sec": "4.6", "q": "Limiting a department head role to a single user is an example of which constraint?", "o": ["Cardinality", "Prerequisite role", "Mutually exclusive roles", "Role hierarchy"], "w": ["Correct. Cardinality sets a maximum number with respect to roles, for example users per role, roles per user, or roles granted a permission.", "A prerequisite role requires holding another role first.", "Mutual exclusion prevents holding conflicting roles.", "A hierarchy is about inheritance."], "r": "\u00a74.6 Constraints\u2014RBAC2"}, {"id": "4-84", "ch": 4, "sec": "4.6", "q": "Requiring that a user can be assigned to a senior role only if already assigned to the immediately junior role is a:", "o": ["Prerequisite role constraint, which with hierarchy requires RBAC3", "A cardinality constraint, which is available in the base model RBAC0", "A mutually exclusive role constraint, which is available in RBAC1", "A session constraint, which is available in the base model RBAC0"], "w": ["Correct. The user can then invoke a session with only the subordinate role when the full set isn't needed.", "Not cardinality, and RBAC0 has no constraints.", "Not mutual exclusion, and RBAC1 has no constraints.", "Not correct."], "r": "\u00a74.6 Constraints\u2014RBAC2"}, {"id": "4-85", "ch": 4, "sec": "4.7", "q": "What does [PLAT13] identify as the main obstacle to ABAC adoption in real systems?", "o": ["Concern about the performance cost of evaluating attribute predicates on every access", "A lack of expressive power compared with RBAC and DAC", "An inability to express ownership privileges for the users who create new resources", "An incompatibility with Web services and cloud computing"], "w": ["Correct. For Web services and cloud, where each access already has a high performance cost, this is less noticeable.", "ABAC's strength IS its flexibility and expressive power.", "ABAC can express ownership with a single rule using a creator attribute.", "Web services pioneered ABAC, especially via XACML."], "r": "\u00a74.7 Attribute-Based Access Control"}, {"id": "4-86", "ch": 4, "sec": "4.7", "q": "Web services have pioneered ABAC implementation, especially through which language?", "o": ["eXtensible Access Control Markup Language (XACML)", "Structured Query Language (SQL)", "Hypertext Markup Language (HTML)", "Security Assertion Markup Language (SAML) only"], "w": ["Correct. XACML is cited [BEUC13].", "Not cited.", "Not cited.", "Not cited here."], "r": "\u00a74.7 Attribute-Based Access Control"}, {"id": "4-87", "ch": 4, "sec": "4.7", "q": "What are the three key elements of an ABAC model?", "o": ["Attributes, a policy model, an architecture model", "Users, roles, and permissions", "Security labels, clearance levels, and categories", "Owner, group, and world"], "w": ["Correct. Attributes are defined for entities, the policy model defines ABAC policies, and the architecture model applies the policies to enforce access control.", "These are RBAC entities.", "These are MAC concepts.", "These are classes of subject."], "r": "\u00a74.7 Attribute-Based Access Control"}, {"id": "4-88", "ch": 4, "sec": "4.7", "q": "Current date and time, current virus/hacker activities, and the network's security level (Internet vs. intranet) are examples of:", "o": ["Environment attributes", "Subject attributes", "Object attributes", "Roles"], "w": ["Correct. The text notes these have so far been largely ignored in most access control policies.", "Subject attributes describe the subject's identity and characteristics: name, organization, job title, role.", "Object attributes describe the resource: title, author, date, ownership, QoS.", "Roles are RBAC, although a role can be viewed as a subject attribute."], "r": "\u00a74.7 Attributes"}, {"id": "4-89", "ch": 4, "sec": "4.7", "q": "In ABAC, a Microsoft Word document's title, subject, date, and author are examples of:", "o": ["Object attributes, often extracted from the object's metadata", "Subject attributes, describing the identity of the requester", "Environment attributes, describing the context of the request", "Permissions, granted to the document by its owner"], "w": ["Correct. Object attributes can often be extracted from metadata.", "Subjects are active entities.", "Environment attributes concern context.", "Not permissions."], "r": "\u00a74.7 Attributes"}, {"id": "4-90", "ch": 4, "sec": "4.7", "q": "ABAC enables fine-grained access control. What does this mean?", "o": ["It allows more discrete inputs into each decision, so more possible rules", "It limits access decisions to the identity of the requestor alone", "It can only implement mandatory access control policies", "It requires fewer attributes than RBAC needs roles"], "w": ["Correct. ABAC allows an unlimited number of attributes to be combined.", "That would be DAC-like.", "ABAC can enforce DAC, RBAC, and MAC.", "It is the opposite."], "r": "\u00a74.7 Attributes"}, {"id": "4-91", "ch": 4, "sec": "4.7", "q": "In the ABAC logical architecture (Figure 4.10), how many independent sources of information are used for the access control decision?", "o": ["Four: policy rules, subject, object, environment", "One: the access control list attached to the object", "Two: the user's identity and the user's assigned role", "Three: the security label, the clearance, and the category"], "w": ["Correct. This is what makes ABAC powerful and flexible, but more costly in complexity and performance.", "An ACL is DAC.", "User and role are RBAC.", "Label, clearance, and category are MAC."], "r": "\u00a74.7 ABAC Logical Architecture"}, {"id": "4-92", "ch": 4, "sec": "4.7", "q": "Per NIST SP 800-162 (Figure 4.11), where does the root of trust lie with ACLs, compared to ABAC?", "o": ["With ACLs, the object owner; with ABAC, many sources the owner doesn't control", "With ACLs, trust lies with the certificate authority; in ABAC, trust lies solely with the object owner", "Both ACLs and ABAC rely solely on the object owner, who provisions every access rule", "Neither ACLs nor ABAC requires trust relationships, since attributes are self-verifying"], "w": ["Correct. SP 800-162 therefore recommends an enterprise governance body and a trust model.", "This is reversed and incorrect.", "ABAC involves many more complex trust relationships.", "Both require trust."], "r": "\u00a74.7 ABAC Logical Architecture"}, {"id": "4-93", "ch": 4, "sec": "4.7", "q": "In the ABAC policy model, a policy rule deciding whether subject s can access object o in environment e is:", "o": ["A Boolean function of the attributes of s, o, and e", "A lookup in a capability list", "A comparison of clearance and classification", "A role assignment"], "w": ["Correct. If the function evaluates true, access is granted. Otherwise it is denied.", "Not ABAC.", "That is MAC.", "That is RBAC."], "r": "\u00a74.7 ABAC Policies"}, {"id": "4-94", "ch": 4, "sec": "4.7", "q": "In the online movie store example, what advantage does ABAC have over RBAC for the age/rating policy?", "o": ["It removes static roles and the work of user-to-role and permission-to-role assignment", "It requires more roles than RBAC, but each role is simpler to define and manage", "It cannot express age restrictions, so ratings must be enforced by a separate system", "It still needs manual role assignment, but permission assignment becomes automatic"], "w": ["Correct. Age and Rating are evaluated directly in a rule.", "ABAC needs NO explicit roles.", "It can express age restrictions.", "That's RBAC's burden."], "r": "\u00a74.7 ABAC Policies"}, {"id": "4-95", "ch": 4, "sec": "4.7", "q": "As the number of attributes increases to accommodate finer-grained policies, what happens to the number of roles and permissions in an RBAC model?", "o": ["It grows exponentially", "It stays constant", "It decreases", "It grows linearly at most"], "w": ["Correct. For example, adding Premium/Regular and New/Old Release doubles both roles and permissions. ABAC handles additional attributes efficiently.", "It grows.", "It grows.", "The growth is exponential (a product of ranges)."], "r": "\u00a74.7 ABAC Policies"}, {"id": "4-96", "ch": 4, "sec": "4.7", "q": "'Regular users are allowed to view new releases in promotional periods' would be difficult to express in RBAC. In ABAC, how is it handled?", "o": ["Add a conjunctive (AND) rule that checks whether the environmental attribute today's date falls in a promotional period", "Create a new role for each date in the promotional period and assign every regular user to each of those date-specific roles", "Assign all users the Premium role for the duration of the promotional period", "Apply the *-property so that regular users can read new releases during the period"], "w": ["Correct. Environmental attributes are easy to add in ABAC.", "This is impractical.", "This is not the solution.", "That is BLP."], "r": "\u00a74.7 ABAC Policies"}, {"id": "4-97", "ch": 4, "sec": "4.8", "q": "ICAM stands for:", "o": ["Identity, credential, and access management", "Integrated cryptographic authentication module", "Internet certificate authority management", "Identity confidentiality and accountability model"], "w": ["Correct. ICAM is a comprehensive approach developed by the U.S. government but applicable to enterprises too.", "Not the acronym.", "Not the acronym.", "Not the acronym."], "r": "\u00a74.8 Identity, Credential, and Access Management"}, {"id": "4-98", "ch": 4, "sec": "4.8", "q": "In ICAM, processes, applications, and automated devices seeking access are referred to as:", "o": ["Nonperson entities (NPEs)", "Relying parties (RPs)", "Subscribers", "Claimants"], "w": ["Correct. ICAM creates trusted digital identity representations of individuals and NPEs.", "RPs deliver services.", "Subscribers hold credentials.", "Claimants are being authenticated."], "r": "\u00a74.8 ICAM"}, {"id": "4-99", "ch": 4, "sec": "4.8", "q": "The goal of identity management in ICAM is to:", "o": ["Establish a trustworthy digital identity that is independent of a specific application or context", "Create a separate digital identity for each application, managed by that application", "Issue smart cards to all users so their identity can be verified in person", "Define role hierarchies that reflect the organization's reporting structure"], "w": ["Correct. The traditional approach of application-specific identities treats identity as secondary and duplicates effort.", "That is the traditional approach the book critiques.", "That is credential production.", "That is RBAC."], "r": "\u00a74.8 Identity Management"}, {"id": "4-100", "ch": 4, "sec": "4.8", "q": "Which is part of identity lifecycle management in ICAM?", "o": ["Revocation of an enterprise identity", "Producing and issuing smart cards", "Defining resource rules", "Arbitration of disputes"], "w": ["Correct. Lifecycle management also includes protecting personal identity information, controlling access to identity data, and sharing authoritative identity data.", "Producing cards is credential management.", "Resource rules are access management (resource management).", "Arbitration is a dispute resolver's job (OITF)."], "r": "\u00a74.8 Identity Management"}, {"id": "4-101", "ch": 4, "sec": "4.8", "q": "Credential management encompasses five logical components. What is the correct order?", "o": ["Sponsor, enroll, produce, issue, maintain", "Enroll, sponsor, issue, produce, revoke", "Produce, sponsor, enroll, maintain, issue", "Issue, enroll, sponsor, produce, maintain"], "w": ["Correct. An authorized individual sponsors, the sponsored party enrolls (identity proofing, biographic and biometric capture), the credential is produced, it is issued, and it is maintained over its life cycle.", "Wrong order.", "Wrong order.", "Wrong order."], "r": "\u00a74.8 Credential Management"}, {"id": "4-102", "ch": 4, "sec": "4.8", "q": "Examples of credentials in ICAM include:", "o": ["Smart cards, cryptographic keys, and certificates", "Job titles, departments, and office locations", "Security labels assigned to classified documents", "Access control lists attached to resources"], "w": ["Correct. A credential authoritatively binds an identity to a token possessed and controlled by a subscriber.", "These are attributes.", "Labels are MAC.", "ACLs are access control structures."], "r": "\u00a74.8 Credential Management"}, {"id": "4-103", "ch": 4, "sec": "4.8", "q": "Which access management support element is concerned with establishing and maintaining the entitlement or privilege attributes that make up an individual's access profile?", "o": ["Privilege management", "Resource management", "Policy management", "Identity federation"], "w": ["Correct. Privileges are considered attributes linkable to a digital identity.", "Resource management defines rules for a resource requiring access control.", "Policy management governs what is allowable in an access transaction.", "Federation is cross-organization trust."], "r": "\u00a74.8 Access Management"}, {"id": "4-104", "ch": 4, "sec": "4.8", "q": "Identity federation addresses which two questions?", "o": ["How to trust outside identities, and how to vouch for your own people to outsiders", "How do you hash passwords from other organizations, and how do you salt them?", "How do you assign roles to partner staff, and how do you constrain those roles?", "How do you label objects shared with partners, and how do you clear their subjects?"], "w": ["Correct. Federation lets an organization trust digital identities, attributes, and credentials created by another organization.", "Not federation.", "Not federation.", "Not federation."], "r": "\u00a74.8 Identity Federation"}, {"id": "4-105", "ch": 4, "sec": "4.9", "q": "In e-commerce and access control, parties to transactions generally apply which principle when deciding what attributes they need about someone?", "o": ["The need-to-know principle", "The least astonishment principle", "Open design", "Fail-safe defaults"], "w": ["Correct. The attributes that must be known and verified depend on context.", "Not the cited principle.", "Not the cited principle.", "Not the cited principle."], "r": "\u00a74.9 Trust Frameworks"}, {"id": "4-106", "ch": 4, "sec": "4.9", "q": "OpenID is:", "o": ["An open standard letting relying-party sites authenticate users via a third party", "A nonprofit community that develops the Information Card ecosystem", "An independent provider of certification trust frameworks conforming to OITF", "An Internet-scale gateway for exchanging verified identity attributes"], "w": ["Correct. Users create accounts with a preferred OpenID identity provider and use them to sign on to any site accepting OpenID.", "That is the ICF.", "That is OIX.", "That is an AXN."], "r": "\u00a74.9 Open Identity Trust Framework"}, {"id": "4-107", "ch": 4, "sec": "4.9", "q": "The Open Identity Trust Framework (OITF) was developed jointly by:", "o": ["OIDF and ICF", "NIST and ISO", "IETF and IAB", "OIX and AXN"], "w": ["Correct. The OpenID Foundation and the Information Card Foundation developed it.", "Not correct.", "Not correct.", "OIX is a certification provider conforming to OITF, and an AXN is a gateway."], "r": "\u00a74.9 Open Identity Trust Framework"}, {"id": "4-108", "ch": 4, "sec": "4.9", "q": "An online Internet-scale gateway for identity service providers and relying parties to efficiently access user-asserted, permissioned, and verified online identity attributes in high volumes at affordable cost is a(n):", "o": ["Attribute Exchange Network (AXN)", "Open Identity Exchange Corporation (OIX)", "OpenID Foundation (OIDF)", "Information Card Foundation (ICF)"], "w": ["Correct. This is the AXN definition.", "OIX is an independent provider of certification trust frameworks.", "OIDF promotes OpenID.", "ICF evolves the Information Card ecosystem."], "r": "\u00a74.9 Open Identity Trust Framework"}, {"id": "4-109", "ch": 4, "sec": "4.9", "q": "OIX defines a trust framework as:", "o": ["A set of verifiable commitments between parties, with controls and remedies", "A firewall configuration agreed between organizations that exchange identity data", "A set of role hierarchies shared by the organizations in a community of interest", "A password policy that all parties to a transaction agree to enforce"], "w": ["Correct. Commitments include (1) controls, including regulatory and contractual obligations, and (2) remedies for failure.", "Not related.", "Not related.", "Not related."], "r": "\u00a74.9 Open Identity Trust Framework"}, {"id": "4-110", "ch": 4, "sec": "4.9", "q": "In the OITF, entities acknowledged by the community of interest as able to verify given attributes presented by subjects, and often acting as brokers of derived attributes, are:", "o": ["Attribute providers (APs)", "Identity providers (IDPs)", "Relying parties (RPs)", "Assessors"], "w": ["Correct. Some APs are sources of authority, but more commonly they are brokers of derived attributes.", "IDPs authenticate user credentials and vouch for names or pseudonyms.", "RPs deliver services.", "Assessors evaluate IDPs and RPs against the blueprint."], "r": "\u00a74.9 Open Identity Trust Framework"}, {"id": "4-111", "ch": 4, "sec": "4.9", "q": "In the OITF, which role evaluates identity service providers and RPs and certifies that they are capable of following the OITF provider's blueprint?", "o": ["Assessor", "Auditor", "Dispute resolver", "Trust framework provider"], "w": ["Correct. Assessors certify capability before participation.", "Auditors check that practices have been in line with what was agreed.", "Dispute resolvers provide arbitration under OIX guidelines.", "Trust framework providers translate policymakers' requirements into a blueprint."], "r": "\u00a74.9 Open Identity Trust Framework"}, {"id": "4-112", "ch": 4, "sec": "4.9", "q": "In the OITF, an organization that translates the requirements of policymakers into a blueprint for a trust framework, consistent with the minimum OITF requirements, is a:", "o": ["Trust framework provider", "Relying party", "Attribute provider (AP)", "Subject"], "w": ["Correct. There is usually an obvious candidate organization for each industry sector.", "RPs deliver services.", "APs verify attributes.", "Subjects are users."], "r": "\u00a74.9 Open Identity Trust Framework"}, {"id": "4-113", "ch": 4, "sec": "4.10", "q": "Before 1990, how did Dresdner Bank manage access control, and why did it change?", "o": ["Simple DAC with a local access control file on each host; it was cumbersome and error-prone", "MAC with security labels on each host; it was too strict for banking work", "ABAC with XACML policies on each server; it was too slow for real-time use", "No access control on the mainframes; it was insecure and failed an audit"], "w": ["Correct. The bank moved to a systemwide RBAC scheme with three separate administrative units.", "Not described.", "Not described.", "DAC was used."], "r": "\u00a74.10 Case Study: RBAC System for a Bank"}, {"id": "4-114", "ch": 4, "sec": "4.10", "q": "At Dresdner Bank, roles are defined by a combination of:", "o": ["Official position and job function", "Security clearance and category", "User ID and password", "Age and department"], "w": ["Correct. This differs somewhat from NIST, where a role is defined by job function.", "Clearance and category are MAC concepts.", "These are authentication concepts.", "Not used."], "r": "\u00a74.10 Case Study"}, {"id": "4-115", "ch": 4, "sec": "4.10", "q": "In the bank's role hierarchy, one role is superior to another if:", "o": ["Its position is superior and their functions are identical", "Its function is superior regardless of position", "It has more users", "It was created first"], "w": ["Correct. For example, financial analyst/Group Manager is superior to financial analyst/Clerk. Office banking/Group Manager has no hierarchical relation to financial analyst/Clerk.", "This is the alternative hierarchy posed in Problem 4.11b, not the bank's.", "Not the rule.", "Not the rule."], "r": "\u00a74.10 Case Study"}, {"id": "4-116", "ch": 4, "sec": "4.10", "q": "Dresdner Bank has 65 official positions and 368 job functions, potentially 23,920 roles. About how many roles are in current use?", "o": ["About 1,300", "About 23,920", "About 42,000", "About 65"], "w": ["Correct. This is in line with other RBAC implementations.", "23,920 is the POTENTIAL number.", "42,000 is the number of security profiles distributed per day.", "65 is the number of positions."], "r": "\u00a74.10 Case Study"}, {"id": "4-117", "ch": 4, "sec": "4.10", "q": "In the bank's scheme, who creates the security profile associating a user ID and role with a set of access rights?", "o": ["The Authorization Administration", "The Human Resources Department", "Each application individually", "The user"], "w": ["Correct. HR assigns User IDs and roles, Application Administration sets each application's rights, and Authorization Administration builds the security profiles.", "HR assigns IDs and roles only.", "Applications CONSULT the profile.", "Users don't create profiles."], "r": "\u00a74.10 Case Study; Figure 4.14"}, {"id": "4-118", "ch": 4, "sec": "4.10", "q": "In the bank example, each user may be statically assigned up to four roles and select one when invoking an application. This corresponds to which NIST RBAC concept?", "o": ["Session", "Cardinality", "Role hierarchy", "Mutually exclusive roles"], "w": ["Correct. In practice most users get a single role.", "Not the stated correspondence.", "Not the stated correspondence.", "Not the stated correspondence."], "r": "\u00a74.10 Case Study"}, {"id": "4-119", "ch": 4, "sec": "4.3", "q": "Under Rule R4 of Table 4.3, a subject may:", "o": ["Read (copy) the portion of the access matrix that it owns or controls", "Destroy any object in the system, deleting its column", "Create a new subject that it owns and controls", "Transfer any right to another subject without a copy flag"], "w": ["Correct. R4 requires 'control' in A[S0, S] or 'owner' in A[S0, X].", "Destroying objects is R6 and requires owner.", "Creating subjects is R7.", "Transfer requires the copy flag (R1)."], "r": "\u00a74.3 Table 4.3 (Rule R4)"}, {"id": "4-120", "ch": 4, "sec": "4.3", "q": "Under Rule R6 of Table 4.3, when the owner destroys object X:", "o": ["The column for X is deleted from the access matrix", "The row for X is deleted from the access control matrix", "All subjects lose all rights", "X's rights pass to the creator's group"], "w": ["Correct. Destroying a subject (R8) deletes its row.", "Rows correspond to subjects.", "Only X's column is affected.", "Not described."], "r": "\u00a74.3 Table 4.3 (Rule R6)"}, {"id": "5-01", "ch": 5, "sec": "5.1", "q": "Which is one of the reasons [BENN06] cites for why database security has not kept pace with the increased reliance on databases?", "o": ["There is a dramatic imbalance between the complexity of modern DBMSs and the security techniques used to protect them", "Databases use HTTP to interact with users, which is too simple to secure properly", "Most organizations have too many full-time database security staff, which fragments responsibility", "All enterprises use a single, uniform database platform, which concentrates risk"], "w": ["Correct. The other reasons are SQL's complexity, the lack of full-time database security personnel, and heterogeneous platforms.", "It's the reverse: SQL is FAR more complex than HTTP.", "The typical organization LACKS full-time database security personnel.", "Most enterprises have a heterogeneous mix of database, enterprise, and OS platforms."], "r": "\u00a75.1 The Need for Database Security"}, {"id": "5-02", "ch": 5, "sec": "5.1", "q": "According to the textbook, what additional recent challenge adds to the burden on security staff for databases?", "o": ["Growing reliance on the cloud to host corporate database data", "The decline of relational databases in favor of flat files", "The disappearance of SQL from modern database products", "The mandatory use of flat files for regulated data"], "w": ["Correct. Cloud hosting adds an additional burden to the security staff.", "The relational approach dominates and is likely to continue doing so.", "SQL is still central.", "Not stated."], "r": "\u00a75.1 The Need for Database Security"}, {"id": "5-03", "ch": 5, "sec": "5.2", "q": "A database is defined as:", "o": ["A structured collection of data for one or more applications, plus their relationships", "A suite of programs for constructing and maintaining data and offering ad hoc queries", "A declarative language that provides a uniform interface to stored data", "A single flat file of records, one for each entity being tracked"], "w": ["Correct. Beyond the data itself, a database contains the relationships between data items and groups of items.", "That's the DBMS.", "That's a query language.", "A flat file stores all data in a single table."], "r": "\u00a75.2 Database Management Systems"}, {"id": "5-04", "ch": 5, "sec": "5.2", "q": "A suite of programs for constructing and maintaining the database and offering ad hoc query facilities to multiple users and applications is the:", "o": ["Database management system (DBMS)", "Query language", "Data definition language (DDL)", "Transaction manager"], "w": ["Correct. This is the definition of a DBMS.", "A query language provides a uniform interface to the database.", "DDL is used to define the logical structure.", "The transaction manager is one module of the DBMS."], "r": "\u00a75.2 Database Management Systems"}, {"id": "5-05", "ch": 5, "sec": "5.2", "q": "In the DBMS architecture of Figure 5.1, database designers and administrators use which language to define the database's logical structure and procedural properties?", "o": ["Data definition language (DDL)", "Data manipulation language (DML)", "Query language", "HTML"], "w": ["Correct. The DDL defines structures that are represented by database description tables.", "DML gives application developers tools to manipulate data.", "Query languages are declarative languages for end users.", "Not a DBMS language."], "r": "\u00a75.2 Figure 5.1"}, {"id": "5-06", "ch": 5, "sec": "5.2", "q": "In Figure 5.1, which table does the DBMS use to ensure the user has permission to execute a query language statement on the database?", "o": ["Authorization table", "Concurrent access table", "Database description table", "Inode table"], "w": ["Correct. The authorization table checks permissions.", "The concurrent access table prevents conflicts between simultaneous commands.", "Description tables represent the logical structure.", "Inodes are UNIX."], "r": "\u00a75.2 Figure 5.1"}, {"id": "5-07", "ch": 5, "sec": "5.2", "q": "Why do database systems generate security requirements beyond typical OS-based security mechanisms?", "o": ["OS controls cover whole files, not specific records, fields, or SQL commands", "OS mechanisms cannot authenticate users, so the DBMS must authenticate everyone itself", "Dat
