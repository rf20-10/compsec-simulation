net scanning finds targets behind the firewall on the host's own network."], "r": "\u00a76.4 Target Discovery"}, {"id": "6-48", "ch": 6, "sec": "6.4", "q": "Which worm scanning strategy produces a high volume of Internet traffic that may cause generalized disruption even before the actual attack is launched?", "o": ["Random", "Hit-list", "Topological", "Local subnet"], "w": ["Correct. Each host probes random addresses using a different seed.", "Hit-list scanning results in a short scanning period.", "Topological scanning uses local information.", "Local subnet scanning stays local."], "r": "\u00a76.4 Target Discovery"}, {"id": "6-49", "ch": 6, "sec": "6.4", "q": "A worm infects a host behind a firewall and then uses the subnet address structure to find other hosts that would otherwise be protected by the firewall. This is:", "o": ["Local subnet scanning", "Random scanning", "Hit-list scanning", "Topological scanning"], "w": ["Correct. This is local subnet scanning.", "Random scanning is not limited to the local network.", "Hit-list scanning uses a precompiled list.", "Topological scanning uses information on the infected host, which is a different idea."], "r": "\u00a76.4 Target Discovery"}, {"id": "6-50", "ch": 6, "sec": "6.4", "q": "In the classic epidemic model of worm propagation (Figure 6.2), what happens during the INITIAL phase?", "o": ["The number of infected hosts increases exponentially (slow start phase)", "Growth is approximately linear, but the rate of infection is rapid (fast spread phase)", "Growth slows as the worm seeks out remaining hosts that are hard to find (slow finish phase)", "Infection stops while the worm waits for its trigger condition (dormant phase)"], "w": ["Correct. One host infects two, each of those infects two more, and so on.", "That's the middle (fast spread) phase.", "That's the slow finish phase.", "Not a phase."], "r": "\u00a76.4 Worm Propagation Model; Figure 6.2"}, {"id": "6-51", "ch": 6, "sec": "6.4", "q": "According to the worm propagation model, when is the best time to counter a worm?", "o": ["In its slow start phase, when few hosts have been infected", "In its fast spread phase, when infection is rapid and easiest to observe", "In its slow finish phase, when only a few hosts remain to be infected", "After all vulnerable hosts are infected, when the worm's code can be analyzed"], "w": ["Correct. This is the stated objective.", "Too late.", "Too late.", "Too late."], "r": "\u00a76.4 Worm Propagation Model"}, {"id": "6-52", "ch": 6, "sec": "6.4", "q": "Which was NOT a method the 1988 Morris worm used to gain access to other hosts?", "o": ["Exploiting an SQL Server buffer overflow", "Cracking the local password file and logging on as a legitimate user", "Exploiting a bug in the UNIX finger protocol", "Exploiting a trapdoor in the debug option of the remote mail process"], "w": ["Correct. The SQL Server buffer overflow was SQL Slammer's method (2003), not Morris's.", "This WAS a Morris method: crack local passwords and log on as a legitimate user.", "This WAS a Morris method: the finger bug.", "This WAS a Morris method: the mail debug-option trapdoor."], "r": "\u00a76.4 The Morris Worm"}, {"id": "6-53", "ch": 6, "sec": "6.4", "q": "The Morris worm's password cracker tried which of the following?", "o": ["Account names and permutations, 432 likely passwords, and the system dictionary", "Only random strings of characters, generated and tried until one of them matched", "Only precomputed rainbow tables of common password hashes", "Passwords leaked in the RockYou breach"], "w": ["Correct. The assumption was that users reuse passwords across systems.", "Not described.", "Not described.", "RockYou came in 2009."], "r": "\u00a76.4 The Morris Worm"}, {"id": "6-54", "ch": 6, "sec": "6.4", "q": "Melissa (1998) was the first of a new generation of malware because it:", "o": ["Included aspects of virus, worm, and Trojan in one package", "Was the first boot sector virus to target MS-DOS systems", "Was the first rootkit to hide itself from anti-virus software", "Was the first ransomware to encrypt files and demand payment"], "w": ["Correct. It took only 3 days to infect over 10,000 computers, versus months for Brain.", "Brain predates it and targeted MS-DOS.", "Not a rootkit.", "PC Cyborg (1989) was an early ransomware example."], "r": "\u00a76.4 A Brief History of Worm Attacks"}, {"id": "6-55", "ch": 6, "sec": "6.4", "q": "The Code Red worm (July 2001) exploited a security hole in which product, and what did it do in its second wave?", "o": ["Microsoft Internet Information Server (IIS); infected nearly 360,000 servers in 14 hours", "Microsoft SQL Server; it infected 90% of the vulnerable hosts in about 10 minutes", "Outlook; sent 100 million messages in 36 hours", "UNIX finger; infected 6,000 hosts"], "w": ["Correct. It also launched a DoS against a government website.", "That's SQL Slammer.", "That's Mydoom.", "That's related to Morris."], "r": "\u00a76.4 A Brief History of Worm Attacks"}, {"id": "6-56", "ch": 6, "sec": "6.4", "q": "Code Red II (August 2001) differed from Code Red by:", "o": ["Targeting systems on the same subnet and installing a backdoor allowing remote command execution", "Targeting Microsoft SQL Server through a buffer overflow vulnerability, then scanning random addresses", "Using Bluetooth connections to spread to nearby mobile phones", "Encrypting files on infected servers and demanding a ransom"], "w": ["Correct. This is Code Red II.", "That's Slammer.", "That's mobile worms.", "That's ransomware."], "r": "\u00a76.4 A Brief History of Worm Attacks"}, {"id": "6-57", "ch": 6, "sec": "6.4", "q": "The Nimda worm (September 2001) used a variety of distribution methods. Which was one of them?", "o": ["Using backdoors left by earlier worms such as Code Red II", "Replicating over Bluetooth to nearby mobile phones", "SIM swapping to receive victims' authentication codes", "SQL injection against Web application databases"], "w": ["Correct. Nimda also used e-mail, Windows shares, Web servers, and Web clients.", "Mobile worms used Bluetooth.", "Not related.", "Not described."], "r": "\u00a76.4 A Brief History of Worm Attacks"}, {"id": "6-58", "ch": 6, "sec": "6.4", "q": "The SQL Slammer worm (early 2003) was extremely compact and spread rapidly. What did it exploit and how fast did it spread?", "o": ["A buffer overflow in Microsoft SQL Server; it infected 90% of vulnerable hosts within 10 minutes", "A security hole in Microsoft's IIS Web server; it infected nearly 360,000 servers in just 14 hours", "Open proxy servers; at its peak it accounted for 1 in 17 e-mail messages", "A Windows SMB vulnerability; it infected systems in more than 150 countries"], "w": ["Correct. This caused significant Internet congestion.", "That's Code Red.", "That's Sobig.F.", "That's WannaCry."], "r": "\u00a76.4 A Brief History of Worm Attacks"}, {"id": "6-59", "ch": 6, "sec": "6.4", "q": "Which worm (late 2003) exploited open proxy servers to turn infected machines into spam engines, reportedly accounting for one in every 17 messages at its peak?", "o": ["Sobig.F", "Mydoom", "Warezov", "Conficker"], "w": ["Correct. It produced more than one million copies of itself within the first 24 hours.", "Mydoom (2004) was a mass-mailer with a backdoor.", "Warezov (2006) scanned files for e-mail addresses.", "Conficker (2008) exploited a Windows buffer overflow."], "r": "\u00a76.4 A Brief History of Worm Attacks"}, {"id": "6-60", "ch": 6, "sec": "6.4", "q": "Mydoom (2004) is described as a mass-mailing e-mail worm that:", "o": ["Installed a backdoor in infected computers and replicated up to 1000 times per minute", "Targeted industrial control systems, such as those used in nuclear enrichment", "Used four previously unknown zero-day exploits to spread", "Spread to nearby mobile phones over Bluetooth"], "w": ["Correct. This is Mydoom.", "That's Stuxnet.", "That's Stuxnet.", "That's mobile worms."], "r": "\u00a76.4 A Brief History of Worm Attacks"}, {"id": "6-61", "ch": 6, "sec": "6.4", "q": "The Conficker (Downadup) worm, first detected in November 2008:", "o": ["Spread via a Windows buffer overflow, later via USB drives and file shares", "Was the first mobile phone worm, spreading between Symbian phones", "Targeted the Iranian nuclear program's centrifuges", "Was a macro virus spread through infected Word documents"], "w": ["Correct. It was the second most common family observed by Symantec [SYMA16].", "Cabir was the first mobile worm.", "That's Stuxnet.", "Not a macro virus."], "r": "\u00a76.4 A Brief History of Worm Attacks"}, {"id": "6-62", "ch": 6, "sec": "6.4", "q": "Which characteristic set the Stuxnet worm (detected 2010) apart?", "o": ["It deliberately slowed its spread and targeted industrial control systems", "It spread faster than any earlier worm, infecting most vulnerable hosts in minutes", "It was a simple macro virus spread through infected Office documents", "It targeted only smartphones, spreading over Bluetooth connections"], "w": ["Correct. Some claim it was the first serious use of a cyberwarfare weapon against a nation's physical infrastructure.", "It deliberately SLOWED its spread to reduce the chance of detection.", "It was not a macro virus.", "It did not target smartphones."], "r": "\u00a76.4 A Brief History of Worm Attacks"}, {"id": "6-63", "ch": 6, "sec": "6.4", "q": "The Duqu worm (late 2011) uses code related to Stuxnet. What was its aim?", "o": ["Cyber-espionage", "Industrial sabotage", "Ransom", "Spam"], "w": ["Correct. It appears to also target the Iranian nuclear program. Flame (2012) is another cyber-espionage family.", "Sabotage was Stuxnet's aim.", "Not its aim.", "Not its aim."], "r": "\u00a76.4 A Brief History of Worm Attacks"}, {"id": "6-64", "ch": 6, "sec": "6.4", "q": "How did the WannaCry ransomware (May 2017) spread as a worm, and what slowed it?", "o": ["By exploiting an SMB flaw on unpatched Windows; slowed by a 'kill-switch' domain", "By e-mail macros sent to address book contacts; slowed by Office 2000 macro signing", "By Bluetooth between nearby devices; slowed by mobile phone OS updates", "By SQL injection against Web servers; slowed by perimeter firewall rules"], "w": ["Correct. A UK security researcher activated the domain, whose existence the malware checked. WannaCry infected hundreds of thousands of systems in more than 150 countries.", "Not WannaCry's method.", "Not WannaCry's method.", "Not WannaCry's method."], "r": "\u00a76.4 A Brief History of Worm Attacks"}, {"id": "6-65", "ch": 6, "sec": "6.4", "q": "In state-of-the-art worm technology, which characteristic describes worms with a repertoire of behavior patterns unleashed at different stages of propagation?", "o": ["Metamorphic", "Polymorphic", "Multiplatform", "Transport vehicle"], "w": ["Correct. Metamorphic worms change their behavior as well as their appearance.", "Polymorphic worms change their code with each copy but not their behavior repertoire.", "Multiplatform worms attack many OSs.", "A transport vehicle carries payloads such as DDoS bots and rootkits."], "r": "\u00a76.4 State of Worm Technology"}, {"id": "6-66", "ch": 6, "sec": "6.4", "q": "A worm exploiting an unknown vulnerability that is discovered by the network community only when the worm is launched uses a:", "o": ["Zero-day exploit", "Hit-list", "Logic bomb", "Mutation engine"], "w": ["Correct. In 2021, 80 zero-day exploits were discovered [MAND21], significantly more than in previous years.", "A hit-list is a scanning strategy.", "A logic bomb is a trigger.", "A mutation engine handles polymorphism."], "r": "\u00a76.4 State of Worm Technology"}, {"id": "6-67", "ch": 6, "sec": "6.4", "q": "NIST SP 800-28 defines mobile code as:", "o": ["Portable programs shipped unchanged to many platforms and run with identical semantics", "Malware that only infects mobile phones, delivered through third-party app stores", "Code transmitted to devices in SMS or MMS messages", "A type of rootkit that moves between virtual machines"], "w": ["Correct. Popular vehicles are Java applets, ActiveX, JavaScript, and VBScript.", "Not the definition.", "Not the definition.", "Not the definition."], "r": "\u00a76.4 Mobile Code"}, {"id": "6-68", "ch": 6, "sec": "6.4", "q": "The first mobile phone worm, Cabir (2004), and later Lasco and CommWarrior, communicated through:", "o": ["Bluetooth wireless connections or MMS", "Wi-Fi network connections only", "USB cables", "SMS text messages only"], "w": ["Correct. They all targeted Symbian smartphones.", "Not stated.", "Not stated.", "MMS, not SMS only."], "r": "\u00a76.4 Mobile Phone Worms"}, {"id": "6-69", "ch": 6, "sec": "6.4", "q": "According to the textbook, the vast majority of mobile phone malware observed installs itself via:", "o": ["Trojan apps", "Bluetooth worms", "SQL injection", "Boot sector infection"], "w": ["Correct. Worms are possible, but trojan apps dominate.", "Bluetooth worms are possible but not the majority.", "Not stated.", "Not stated."], "r": "\u00a76.4 Mobile Phone Worms"}, {"id": "6-70", "ch": 6, "sec": "6.4", "q": "Code on an attacker-controlled webpage exploits browser or plugin bugs to download and install malware without the user's knowledge or consent when the page is viewed. This is a:", "o": ["Drive-by-download", "Clickjacking attack", "Spear-phishing attack", "Logic bomb"], "w": ["Correct. It typically does not actively propagate. It waits for users to visit.", "Clickjacking hijacks clicks.", "Spear-phishing is targeted e-mail.", "A logic bomb is a trigger."], "r": "\u00a76.4 Client-Side Vulnerabilities and Drive-by-Downloads"}, {"id": "6-71", "ch": 6, "sec": "6.4", "q": "An attacker researches intended victims, identifies websites they're likely to visit, compromises those sites with drive-by-download code, and may infect only systems belonging to the target organization. This is a:", "o": ["Watering-hole attack", "Malvertising attack", "Clickjacking attack", "Hit-list scan"], "w": ["Correct. Targeting only specific visitors helps the compromise stay undetected.", "Malvertising places malware in ads without compromising the sites.", "Clickjacking hijacks clicks.", "A hit-list is a worm scanning strategy."], "r": "\u00a76.4 Client-Side Vulnerabilities and Drive-by-Downloads"}, {"id": "6-72", "ch": 6, "sec": "6.4", "q": "An attacker pays for advertisements likely to be placed on target websites, with malware incorporated in the ads, sometimes for only a few hours. This is:", "o": ["Malvertising", "Watering-hole attack", "Spam", "Click fraud"], "w": ["Correct. It places malware on websites without actually compromising them, and it is hard to track.", "A watering-hole attack COMPROMISES the sites.", "Spam is bulk e-mail.", "Click fraud is bots clicking ads for money."], "r": "\u00a76.4 Client-Side Vulnerabilities and Drive-by-Downloads"}, {"id": "6-73", "ch": 6, "sec": "6.4", "q": "Clickjacking, also known as a user-interface (UI) redress attack, works by:", "o": ["Using transparent or opaque layers so a user's click lands on a different page", "Encrypting the user's files and demanding payment for the key", "Sending SMS messages to premium-priced numbers from the user's phone", "Guessing the user's passwords from information on their profile"], "w": ["Correct. Keystrokes can also be hijacked with stylesheets, iframes, and text boxes.", "That's ransomware.", "That's mobile malware.", "Not related."], "r": "\u00a76.4 Clickjacking"}, {"id": "6-74", "ch": 6, "sec": "6.5", "q": "The final category of malware propagation, which 'tricks' users into assisting in compromising their own systems or personal information, is:", "o": ["Social engineering", "Vulnerability exploit", "Infected content", "Remote login"], "w": ["Correct. This includes spam e-mail and Trojans.", "Vulnerability exploits are worms and drive-bys.", "Infected content is viruses.", "Remote login is a worm replication method."], "r": "\u00a76.5 Propagation\u2014Social Engineering"}, {"id": "6-75", "ch": 6, "sec": "6.5", "q": "According to [SYMA16], what share of inbound business e-mail traffic is still spam?", "o": ["More than half", "About 1%", "About 10%", "Virtually none"], "w": ["Correct. This is despite a gradual decline.", "Too low.", "Too low.", "Not correct."], "r": "\u00a76.5 Spam (Unsolicited Bulk) E-Mail"}, {"id": "6-76", "ch": 6, "sec": "6.5", "q": "Most recent spam is sent by:", "o": ["Botnets using compromised user systems", "Legitimate commercial mail servers only", "Physical mail", "Certificate authorities"], "w": ["Correct. Some is sent from legitimate servers with stolen credentials.", "Only some comes from legitimate servers.", "Not related.", "Not related."], "r": "\u00a76.5 Spam (Unsolicited Bulk) E-Mail"}, {"id": "6-77", "ch": 6, "sec": "6.5", "q": "A Trojan horse is:", "o": ["An apparently useful program with hidden code that performs an unwanted function", "A self-replicating program that propagates across a network on its own", "A virus that infects boot sectors and spreads when the system boots", "A program controlled by command-and-control servers to launch attacks"], "w": ["Correct. This is the definition.", "That's a worm.", "That's a boot sector infector.", "That's a bot."], "r": "\u00a76.5 Trojan Horses"}, {"id": "6-78", "ch": 6, "sec": "6.5", "q": "A Trojan horse version of a process-listing program that does not display certain malicious processes fits which Trojan model?", "o": ["Continuing to perform the original function but modifying it to perform malicious activity or disguise other malicious activity", "Continuing to perform the original function and additionally performing a separate, unrelated malicious activity in the background", "Completely replacing the function of the original program", "Not a Trojan model"], "w": ["Correct. The Trojan login program that collects passwords also fits this model.", "This model adds an unrelated malicious activity on top of the original function.", "This model replaces the original function entirely.", "It is one of the three models."], "r": "\u00a76.5 Trojan Horses"}, {"id": "6-79", "ch": 6, "sec": "6.5", "q": "The Hydraq Trojan used in Operation Aurora (2009\u20132010) is an example of a Trojan that:", "o": ["Avoided the need for user assistance by exploiting an Internet Explorer vulnerability to install itself", "Replicated itself like a worm across the Internet, spreading on its own to every host with the vulnerability", "Infected Symbian smartphones through a mobile app marketplace", "Was spread only on floppy disks shared between users"], "w": ["Correct. It shares features with worms but does not replicate. It was distributed via spam or watering-hole attacks.", "Trojans don't replicate.", "Not related.", "Not related."], "r": "\u00a76.5 Trojan Horses"}, {"id": "6-80", "ch": 6, "sec": "6.5", "q": "Call centers calling users about nonexistent computer problems, then selling bogus support or asking them to install Trojan malware, are known as:", "o": ["Tech support scams", "Watering-hole attacks", "Prompt-bombing", "Click fraud"], "w": ["Correct. This is a growing social engineering concern.", "Not this.", "Not this.", "Not this."], "r": "\u00a76.5 Trojan Horses"}, {"id": "6-81", "ch": 6, "sec": "6.5", "q": "In 2015, XcodeGhost malware was found in legitimate Apple Store apps. How did it get there?", "o": ["Developers built the apps with a compromised Xcode development system", "Users jailbroke their phones and installed the apps from unofficial sites", "Apple intentionally included it for testing and failed to remove it", "A Bluetooth worm spread it to apps on nearby iPhones"], "w": ["Correct. This is an example of attackers exploiting development infrastructure.", "Not the cause.", "Not the cause.", "Not the cause."], "r": "\u00a76.5 Mobile Phone Trojans"}, {"id": "6-82", "ch": 6, "sec": "6.5", "q": "Why do many iPhone Trojans target 'jail-broken' phones?", "o": ["Apple imposes tighter controls on its app store, so Trojans are distributed via unofficial sites", "iPhones have no operating system protections for apps from the official store", "Jailbroken phones have stronger security, so Trojans must target them specifically", "Apple distributes Trojans through its own store for testing purposes"], "w": ["Correct. Graphic or PDF vulnerabilities used for jailbreaking also gave malware a path in.", "Not true.", "It's the opposite.", "Not true."], "r": "\u00a76.5 Mobile Phone Trojans"}, {"id": "6-83", "ch": 6, "sec": "6.6", "q": "System corruption payloads (data destruction, unwanted messages, real-world damage) all target:", "o": ["The integrity of the system's software or hardware, or of the user's data", "Only the confidentiality of the data stored on the system", "Only the availability of network services provided by the system", "The authentication mechanisms that control logins to the system"], "w": ["Correct. They may activate only when logic-bomb trigger conditions are met.", "Not only confidentiality.", "Not only availability.", "Not authentication."], "r": "\u00a76.6 Payload\u2014System Corruption"}, {"id": "6-84", "ch": 6, "sec": "6.6", "q": "The Chernobyl virus (1998), a destructive memory-resident Windows 95/98 virus, did what when its trigger date was reached?", "o": ["Overwrote the start of the hard drive with zeroes and tried to rewrite the BIOS", "Encrypted the user's files and demanded a ransom for the key", "Displayed a Simpsons quote in the document being opened", "Sent copies of itself by e-mail to the first 50 contacts in the user's Address Book"], "w": ["Correct. It first triggered on April 26, 1999, affecting more than one million computers.", "Not Chernobyl.", "That's Melissa.", "That's Melissa."], "r": "\u00a76.6 Data Destruction; Real-World Damage"}, {"id": "6-85", "ch": 6, "sec": "6.6", "q": "The Klez mass-mailing worm (October 2001) did what on its trigger dates (the 13th of several months)?", "o": ["Caused files on the local hard drive to become empty", "Encrypted all files and demanded a ransom payment", "Attacked Siemens industrial control systems", "Installed a backdoor on Microsoft IIS servers"], "w": ["Correct. It could also stop and delete some anti-virus programs.", "Not Klez.", "That's Stuxnet.", "That's Code Red II."], "r": "\u00a76.6 Data Destruction and Ransomware"}, {"id": "6-86", "ch": 6, "sec": "6.6", "q": "Malware that encrypts the user's data and demands payment for the key needed to recover it is:", "o": ["Ransomware", "Adware", "Spyware", "A rootkit"], "w": ["Correct. The PC Cyborg Trojan (1989) was an early example. Gpcode (mid-2006) used public-key cryptography with increasingly large keys.", "Adware is advertising.", "Spyware collects information.", "A rootkit hides its presence."], "r": "\u00a76.6 Data Destruction and Ransomware"}, {"id": "6-87", "ch": 6, "sec": "6.6", "q": "Why could later ransomware like Gpcode not be broken without paying, unlike earlier instances?", "o": ["They used public-key cryptography with large key sizes", "They used no encryption at all, so there was nothing to break", "They stored the decryption keys on the victim's own disk", "They used DES with a 56-bit key"], "w": ["Correct. Earlier instances used weaker cryptography that could be cracked.", "Not true.", "Not described.", "Not described."], "r": "\u00a76.6 Data Destruction and Ransomware"}, {"id": "6-88", "ch": 6, "sec": "6.6", "q": "According to [VERI22], ransomware accounted for around what share of all breaches in 2021?", "o": ["Around 25%", "Around 1%", "Around 75%", "Around 99%"], "w": ["Correct. It's a simple means for attackers to extort money from victims.", "Too low.", "Too high.", "Too high."], "r": "\u00a76.6 Data Destruction and Ransomware"}, {"id": "6-89", "ch": 6, "sec": "6.6", "q": "Once WannaCry encrypted an organization's files, recovery was generally only possible if:", "o": ["It had good backups and a working incident response and recovery plan", "The organization ran anti-virus software after the infection", "The user rebooted the infected systems", "The perimeter firewall was enabled"], "w": ["Correct. This is what the textbook says.", "Not sufficient.", "Not sufficient.", "Not sufficient."], "r": "\u00a76.6 Data Destruction and Ransomware"}, {"id": "6-90", "ch": 6, "sec": "6.6", "q": "Stuxnet's key payload, if it found Siemens industrial control software with a specific device configuration, was to:", "o": ["Drive the controlled equipment outside its normal range until it fails", "Steal banking credentials using a keylogger", "Encrypt the plant's engineering data and demand a ransom to restore it", "Send spam from the infected control systems"], "w": ["Correct. The centrifuges in Iran's uranium enrichment program were the suspected target.", "Not Stuxnet.", "Not Stuxnet.", "Not Stuxnet."], "r": "\u00a76.6 Real-World Damage"}, {"id": "6-91", "ch": 6, "sec": "6.6", "q": "Which December 2015 event showed that concerns about cyber attacks on critical infrastructure are well-founded?", "o": ["An attack that disrupted Ukraine's power grid", "The Anthem medical insurance data breach", "The RockYou password breach", "The Morris worm"], "w": ["Correct. Much critical infrastructure isn't sufficiently hardened.", "Anthem (January 2015) was a data breach.", "RockYou (2009) was a password leak.", "Morris was 1988."], "r": "\u00a76.6 Real-World Damage"}, {"id": "6-92", "ch": 6, "sec": "6.6", "q": "Code embedded in malware that is set to 'explode' when certain conditions are met (e.g., a date, a particular user, presence or absence of files) is a:", "o": ["Logic bomb", "Backdoor", "Downloader", "Keylogger"], "w": ["Correct. Once triggered, it may alter or delete data, halt a machine, or do other damage.", "A backdoor is a secret entry point.", "A downloader installs other items.", "A keylogger captures keystrokes."], "r": "\u00a76.6 Logic Bomb"}, {"id": "6-93", "ch": 6, "sec": "6.6", "q": "Tim Lloyd was convicted of setting a logic bomb at Omega Engineering. What were the consequences cited?", "o": ["It cost over $10 million and led to 80 layoffs", "It cost the employer about $100,000 and led to no layoffs", "It caused a worldwide Internet outage lasting several days", "It infected more than one million PCs on a trigger date"], "w": ["Correct. These are the figures from [GAUD00].", "The numbers are wrong.", "Not described.", "That's Chernobyl."], "r": "\u00a76.6 Logic Bomb"}, {"id": "6-94", "ch": 6, "sec": "6.7", "q": "Malware that subverts the computational and network resources of an infected system for use by the attacker turns that system into a:", "o": ["Bot (robot), zombie, or drone", "Honeypot", "Sandbox", "Certificate authority (CA)"], "w": ["Correct. A coordinated collection of bots is a botnet. This payload attacks the integrity and availability of the infected system.", "A honeypot is a decoy.", "A sandbox is an analysis environment.", "Not related."], "r": "\u00a76.7 Payload\u2014Attack Agent\u2014Zombie, Bots"}, {"id": "6-95", "ch": 6, "sec": "6.7", "q": "Which is a listed use of bots?", "o": ["Click fraud: automatically clicking on ads that pay for clicks, or manipulating online polls", "Patching vulnerable systems automatically on behalf of the botnet owner", "Generating digital certificates for the botnet's command-and-control servers and websites", "Defragmenting disks to make room for stored malware"], "w": ["Correct. Other uses: DDoS, spam, spyware, file sharing, spreading malware, chatterbots, and bitcoin mining.", "Not a bot use.", "Not a bot use.", "Not a bot use."], "r": "\u00a76.7 Uses of Bots"}, {"id": "6-96", "ch": 6, "sec": "6.7", "q": "Bots that connect to chat rooms and dating sites pretending to be human users, aiming to gather sensitive personal information, are called:", "o": ["Chatterbots", "Spam bots", "Flooders", "Auto-rooters"], "w": ["Correct. This is the chatterbot use.", "Not the term.", "Flooders are DoS clients.", "Auto-rooters break into machines."], "r": "\u00a76.7 Uses of Bots"}, {"id": "6-97", "ch": 6, "sec": "6.7", "q": "What distinguishes a bot from a worm?", "o": ["A bot is controlled through a C&C network; a worm acts on its own", "Bots cannot replicate, while worms always replicate", "Worms are always encrypted, while bots never are", "Bots only run on mobile phones, while worms run on PCs"], "w": ["Correct. Contact with the C&C server needn't be continuous.", "Bots can use worms to spread, but the remote control facility is the stated distinction.", "Not true.", "Not true."], "r": "\u00a76.7 Remote Control Facility"}, {"id": "6-98", "ch": 6, "sec": "6.7", "q": "An early means of implementing a botnet's remote control facility was:", "o": ["An IRC server channel whose messages the bots treat as commands", "Bluetooth connections between nearby bots that relay the commands", "SMS messages sent to each bot", "Fax messages to infected machines"], "w": ["Correct. More recent botnets use covert channels via HTTP or peer-to-peer protocols to avoid a single point of failure.", "Not the early means.", "Not the early means.", "Not the early means."], "r": "\u00a76.7 Remote Control Facility"}, {"id": "6-99", "ch": 6, "sec": "6.7", "q": "In fast-flux DNS, used to hide botnet C&C servers:", "o": ["A server name's address changes every few minutes, rotating across many proxies", "The server name and its address never change once the botnet is built", "DNS is disabled so the bots contact servers by broadcast instead", "Each bot uses a single hard-coded IP address for its server"], "w": ["Correct. Another technique is automatic generation of huge numbers of domain names.", "It changes.", "Not described.", "Fixed addresses were the OLD approach, which law enforcement could take down."], "r": "\u00a76.7 Remote Control Facility"}, {"id": "6-100", "ch": 6, "sec": "6.7", "q": "What is one effective countermeasure against a botnet, per the textbook?", "o": ["Take over or shut down its C&C network", "Install more bots", "Increase bandwidth", "Disable DNS for the whole Internet"], "w": ["Correct. Law enforcement cooperation has led to successful C&C seizures and criminal charges.", "Not a countermeasure.", "Not a countermeasure.", "Not a countermeasure."], "r": "\u00a76.7 Remote Control Facility"}, {"id": "6-101", "ch": 6, "sec": "6.8", "q": "Information theft payloads (keyloggers, phishing, spyware) primarily target which security property?", "o": ["Confidentiality", "Availability", "Integrity of hardware", "Accountability"], "w": ["Correct. They gather data stored on the infected system for use by the attacker.", "Availability is targeted by DoS and corruption payloads.", "Corruption payloads target integrity.", "Not the stated target."], "r": "\u00a76.8 Payload\u2014Information Theft"}, {"id": "6-102", "ch": 6, "sec": "6.8", "q": "Since login credentials are often sent over encrypted channels (HTTPS, IMAPS), how does an attacker capture them with malware?", "o": ["By installing a keylogger that captures keystrokes on the infected machine", "By breaking the TLS encryption that protects the login session", "By sniffing network packets as the credentials cross the network", "By precomputing rainbow tables of the site's password hashes"], "w": ["Correct. The keylogger captures keystrokes before they are encrypted.", "The keylogger bypasses the encryption rather than breaking it.", "Encryption protects against sniffing.", "Not relevant."], "r": "\u00a76.8 Credential Theft, Keyloggers, and Spyware"}, {"id": "6-103", "ch": 6, "sec": "6.8", "q": "Some banking sites switched to graphical applets for entering passwords to defeat keyloggers. How did attackers respond?", "o": ["With broader spyware that monitors browsing, redirects requests, and alters data", "They gave up on credential theft and switched to ransomware", "They used SQL injection against the banking sites' databases", "They switched to Bluetooth worms that targeted customers' mobile banking apps instead"], "w": ["Correct. This is the spyware escalation described in the text.", "Not true.", "Not described.", "Not described."], "r": "\u00a76.8 Credential Theft, Keyloggers, and Spyware"}, {"id": "6-104", "ch": 6, "sec": "6.8", "q": "The Zeus banking Trojan steals banking credentials by:", "o": ["Using a keylogger and capturing or altering form data", "Encrypting the victim's files and demanding payment", "Flooding banking servers with traffic", "Infecting the BIOS to survive reinstalls"], "w": ["Correct. It is typically deployed by spam e-mails or drive-by-downloads.", "Not Zeus.", "Not Zeus.", "Not Zeus."], "r": "\u00a76.8 Credential Theft, Keyloggers, and Spyware"}, {"id": "6-105", "ch": 6, "sec": "6.8", "q": "A phishing attack exploits social engineering to leverage the user's trust by:", "o": ["Masquerading as communications from a trusted source", "Exploiting buffer overflows in the user's e-mail client", "Brute-forcing the user's passwords through a botnet", "Scanning random IP addresses for vulnerable systems"], "w": ["Correct. The goal is to obtain credentials or enough personal details for identity theft.", "Not phishing.", "Not phishing.", "Not phishing."], "r": "\u00a76.8 Phishing and Identity Theft"}, {"id": "6-106", "ch": 6, "sec": "6.8", "q": "How does spear-phishing differ from general phishing?", "o": ["Each recipient is researched and the e-mail is crafted specifically for them", "It is sent to millions of random users, relying on a gullible fraction to respond", "It never includes attachments, only links to fake login pages", "It is delivered only by SMS rather than by e-mail"], "w": ["Correct. This makes it especially useful in espionage and financial fraud.", "That's general phishing.", "It often includes malicious attachments disguised as invoices or documents.", "Not described."], "r": "\u00a76.8 Phishing and Identity Theft"}, {"id": "6-107", "ch": 6, "sec": "6.8", "q": "The Anthem medical data breach in January 2015 exposed more than how many personal information records?", "o": ["78 million", "10,000", "1.2 million", "32 million"], "w": ["Correct. The Black Vine cyber-espionage group was thought responsible.", "10,000 is Melissa's 3-day infection count.", "1.2 million is Bank of America's tapes (Ch 2).", "32 million is the RockYou passwords (Ch 3)."], "r": "\u00a76.8 Phishing and Identity Theft"}, {"id": "6-108", "ch": 6, "sec": "6.8", "q": "The unauthorized transfer of data from a computer system is called:", "o": ["Data exfiltration", "Data inference", "Data envelope", "Data mining"], "w": ["Correct. Credential and identity theft are special cases of the more general reconnaissance payload.", "Inference is deducing data from queries (Ch 5).", "Not a term.", "Not the term."], "r": "\u00a76.8 Reconnaissance, Espionage, and Data Exfiltration"}, {"id": "6-109", "ch": 6, "sec": "6.8", "q": "The WikiLeaks release by Chelsea Manning (2010) and the NSA disclosures by Edward Snowden (2013) are examples of:", "o": ["Insiders misusing legitimate access for ideological reasons", "Outside hackers attacking poorly secured systems", "Ransomware demanding payment for stolen data", "Botnet attacks against government websites"], "w": ["Correct. By contrast, Ashley Madison (2015) and the Panama Papers (2016) are thought to be outside hackers.", "That describes Ashley Madison and the Panama Papers.", "Not ransomware.", "Not DDoS."], "r": "\u00a76.8 Reconnaissance, Espionage, and Data Exfiltration"}, {"id": "6-110", "ch": 6, "sec": "6.8", "q": "Operation Aurora (2009) used a Trojan to gain access to, and potentially modify, what?", "o": ["Source code repositories at high-tech, security, and defense contractor companies", "Control systems for Iranian uranium enrichment centrifuges at nuclear facilities", "Ukrainian power grid control systems", "Hospital databases holding patient allergy information"], "w": ["Correct. This is a reconnaissance and espionage example.", "That's Stuxnet.", "That was the December 2015 attack.", "That's a Ch 1 example."], "r": "\u00a76.8 Reconnaissance, Espionage, and Data Exfiltration"}, {"id": "6-111", "ch": 6, "sec": "6.9", "q": "Stealthing payloads (backdoors, rootkits) hide malware's presence and provide covert access. They attack:", "o": ["The integrity of the infected system", "Only availability", "Only confidentiality of network traffic", "The CA hierarchy"], "w": ["Correct. This is what the textbook states.", "Not the stated target.", "Not the stated target.", "Not the stated target."], "r": "\u00a76.9 Payload\u2014Stealthing"}, {"id": "6-112", "ch": 6, "sec": "6.9", "q": "A backdoor (trapdoor) used legitimately by programmers to debug and test programs is called a:", "o": ["Maintenance hook", "Logic bomb", "Rootkit", "Mutation engine"], "w": ["Correct. It becomes a threat when unscrupulous programmers use it for unauthorized access.", "A logic bomb is a trigger.", "A rootkit hides malware.", "A mutation engine is polymorphic."], "r": "\u00a76.9 Backdoor"}, {"id": "6-113", "ch": 6, "sec": "6.9", "q": "During Multics development, an Air Force 'tiger team' sent a bogus OS update containing a Trojan activated by a backdoor. What was notable?", "o": ["Developers couldn't find it even after being told it was there", "It was detected immediately by the Multics developers during code review", "It caused a system-wide outage at every site running Multics", "It was a ransomware attack that encrypted the Multics source code"], "w": ["Correct. This is the [ENGE80] example.", "It was not detected.", "Not described.", "Not described."], "r": "\u00a76.9 Backdoor"}, {"id": "6-114", "ch": 6, "sec": "6.9", "q": "In more recent times, a backdoor is usually implemented as:", "o": ["A network service on a non-standard port that accepts the attacker's commands", "A hardware jumper on the motherboard that disables authentication", "A BIOS password known only to the original programmer", "A hidden watermark embedded in images displayed by the application"], "w": ["Correct. WannaCry included such a backdoor. Controls must focus on program development and software updates.", "Not described.", "Not described.", "Not described."], "r": "\u00a76.9 Backdoor"}, {"id": "6-115", "ch": 6, "sec": "6.9", "q": "A rootkit is:", "o": ["Programs that keep covert administrator-level access while hiding their presence", "A set of tools used to break into new machines remotely across a network", "A virus that infects boot sectors and spreads when the system starts", "A program that sends large volumes of unwanted e-mail from the system"], "w": ["Correct. The book notes that only some form of mandatory access control (Ch 4) can prevent the complete control that root access gives.", "That's an auto-rooter.", "That's a boot sector infector.", "Not related."], "r": "\u00a76.9 Rootkit"}, {"id": "6-116", "ch": 6, "sec": "6.9", "q": "A rootkit that activates each time the system boots, storing code in the registry or file system, is:", "o": ["Persistent, which makes it easier to detect since the stored copy can be scanned", "Memory based, which is harder to detect because it never touches storage", "Virtual machine based, which runs the OS in a VM above a hypervisor", "External mode, which resides in BIOS, UEFI, or system management mode"], "w": ["Correct. Persistence makes it easier to detect.", "Memory-based rootkits don't survive reboot and are harder to detect.", "VM-based rootkits install a hypervisor.", "External mode rootkits reside in BIOS, UEFI, or SMM."], "r": "\u00a76.9 Rootkit"}, {"id": "6-117", "ch": 6, "sec": "6.9", "q": "A rootkit that has no persistent code and cannot survive a reboot, but is harder to detect, is:", "o": ["Memory based", "Persistent", "User mode", "Kernel mode"], "w": ["Correct. This is a memory-based rootkit.", "Persistent rootkits survive reboot.", "User mode is about where it intercepts calls.", "Kernel mode is about where it intercepts calls."], "r": "\u00a76.9 Rootkit"}, {"id": "6-118", "ch": 6, "sec": "6.9", "q": "A rootkit that intercepts calls to APIs and modifies returned results (e.g., hiding its files from directory listings) is:", "o": ["User mode", "Kernel mode", "External mode", "Virtual machine based"], "w": ["Correct. Early rootkits worked this way and could be detected by kernel code, the layer below.", "Kernel mode intercepts NATIVE APIs in kernel mode and can remove processes from the kernel's list.", "External mode resides in BIOS, UEFI, or SMM.", "VM-based rootkits run the OS in a VM above them."], "r": "\u00a76.9 Rootkit"}, {"id": "6-119", "ch": 6, "sec": "6.9", "q": "A rootkit that can hide a malware process by removing it from the kernel's list of active processes is:", "o": ["Kernel mode", "User mode", "Memory based", "Persistent"], "w": ["Correct. This is a kernel mode rootkit.", "User mode rootkits modify API results.", "Memory-based describes lack of persistence.", "Persistent describes surviving reboots."], "r": "\u00a76.9 Rootkit"}, {"id": "6-120", "ch": 6, "sec": "6.9", "q": "Much of the rootkit arms race is associated with finding what kind of attack?", "o": ["'Layer-below' attacks", "Layer-above attacks", "Side-channel attacks", "Physical attacks"], "w": ["Correct. Rootkits moved from user mode to kernel to hypervisor to firmware.", "Not the term.", "Not the term.", "Not the term."], "r": "\u00a76.9 Rootkit"}, {"id": "6-121", "ch": 6, "sec": "6.9", "q": "[LEVI06] lists three techniques for changing Linux system calls. Which technique overwrites selected legitimate system call routines with malicious code WITHOUT changing the system call table?", "o": ["Modify system call table targets", "Modify the system call table", "Redirect the system call table", "Hook the BIOS"], "w": ["Correct. This is modifying the system call table targets.", "Modifying the table changes the syscall addresses stored in it (as the knark rootkit does).", "Redirecting points references to an entirely new table in kernel memory.", "Not one of the three."], "r": "\u00a76.9 Kernel Mode Rootkits"}, {"id": "6-122", "ch": 6, "sec": "6.9", "q": "The knark rootkit (Figure 6.3) achieves concealment by:", "o": ["Changing syscall addresses in the system call table to point to its own routines", "Writing replacement code into the BIOS so it loads before the kernel", "Running a thin hypervisor beneath the operating system", "Infecting Word macros that run whenever a document is opened"], "w": ["Correct. This is the 'modify the system call table' technique.", "Not knark.", "Not knark.", "Not knark."], "r": "\u00a76.9 Kernel Mode Rootkits; Figure 6.3"}, {"id": "6-123", "ch": 6, "sec": "6.9", "q": "The Blue Pill rootkit (2006) subverted a native Windows Vista system by:", "o": ["Installing a thin hypervisor beneath the running system and moving Vista into a VM", "Modifying the boot process used by Virtual PC or VMware Workstation", "Overwriting the master boot record so it loads before Windows", "Embedding macro code in documents opened by the administrator"], "w": ["Correct. It needed only a rogue driver, could install while the system ran, and was much harder to detect.", "That's SubVirt, which could be detected.", "Not Blue Pill.", "Not Blue Pill."], "r": "\u00a76.9 Virtual Machine and Other External Rootkits"}, {"id": "6-124", "ch": 6, "sec": "6.9", "q": "[KASP22] describes a sophisticated UEFI-based rootkit. Why is it hard to detect?", "o": ["It loads through the boot process and fetches its payload over the network each boot", "It only runs on Linux systems, which most anti-virus products do not scan", "It is a macro virus hidden inside documents rather than executable files", "It receives commands only through SMS messages, which are not monitored"], "w": ["Correct. It is attributed to an unknown Chinese-speaking group, in use since 2016.", "Not described.", "Not described.", "Not described."], "r": "\u00a76.9 Virtual Machine and Other External Rootkits"}, {"id": "6-125", "ch": 6, "sec": "6.9", "q": "To defend against virtual machine and external (BIOS/UEFI/SMM) rootkits, what is needed?", "o": ["A secure boot process, including checking that any hypervisor code is legitimate", "Only user-mode anti-virus software, kept up to date with signatures", "Only a perimeter firewall that blocks traffic from known rootkit servers", "Disabling the keyboard driver so keyloggers cannot be installed"], "w": ["Correct. This is discussed further in Chapter 12.", "User-mode tools can't see below the OS.", "Not sufficient.", "Not relevant."], "r": "\u00a76.9 Virtual Machine and Other External Rootkits"}, {"id": "6-126", "ch": 6, "sec": "6.10", "q": "NIST SP 800-83 suggests four main elements of malware prevention. Which list is correct?", "o": ["Policy, awareness, vulnerability mitigation, and threat mitigation", "Detection, identification, removal, recovery", "Generality, timeliness, resiliency, transparency", "Scanners, heuristics, activity traps, full-featured protection"], "w": ["Correct. These are the four elements of prevention.", "Detection, identification, and removal are threat mitigation options used when prevention fails.", "These are requirements for effective countermeasures.", "These are the anti-virus generations."], "r": "\u00a76.10 Malware Countermeasure Approaches"}, {"id": "6-127", "ch": 6, "sec": "6.10", "q": "If prevention fails, which threat mitigation options do technical mechanisms support?", "o": ["Detection, identification, and removal", "Encryption, hashing, and signing", "Prevention, avoidance, and acceptance", "Scanning, exploitation, and exfiltration"], "w": ["Correct. If identification or removal isn't possible, discard infected files and reload a clean backup, or even wipe and rebuild.", "Not the options.", "Not the options.", "These are attacker activities."], "r": "\u00a76.10 Malware Countermeasure Approaches"}, {"id": "6-128", "ch": 6, "sec": "6.10", "q": "Which requirement for effective malware countermeasures states that the approach should not require modification to existing (legacy) OSs, application software, and hardware?", "o": ["Transparency", "Generality", "Resiliency", "Global and local coverage"], "w": ["Correct. This is transparency.", "Generality means handling a wide variety of attacks.", "Resiliency means resisting evasion techniques.", "Global and local coverage means dealing with attack sources outside and inside the enterprise."], "r": "\u00a76.10 Malware Countermeasure Approaches"}, {"id": "6-129", "ch": 6, "sec": "6.10", "q": "Which requirement for malware countermeasures says the approach should respond quickly to limit the number of infected programs or systems?", "o": ["Timeliness", "Minimal denial-of-service cost", "Generality", "Transparency"], "w": ["Correct. This is timeliness.", "Minimal DoS cost means minimal reduction in capacity or service.", "Generality means handling a wide variety of attacks.", "Transparency means no modification to legacy systems."], "r": "\u00a76.10 Malware Countermeasure Approaches"}, {"id": "6-130", "ch": 6, "sec": "6.10", "q": "Malware detection can occur in three locations. Which list is correct?", "o": ["On the host, at the perimeter (firewall/IDS), and through distributed gathering", "Only in the cloud, where the providers scan all of their customers' traffic", "Only in the BIOS, before the operating system has loaded", "Only in the user's e-mail client, where most malware arrives"], "w": ["Correct. These are the three locations.", "Not the list.", "Not the list.", "Not the list."], "r": "\u00a76.10 Malware Countermeasure Approaches"}, {"id": "6-131", "ch": 6, "sec": "6.10", "q": "[STEP93] identifies four generations of anti-virus software. Which is the THIRD generation?", "o": ["Activity traps", "Simple scanners", "Heuristic scanners", "Full-featured protection"], "w": ["Correct. Activity traps are memory-resident programs that identify malware by its actions rather than its structure.", "Simple scanners are the first generation.", "Heuristic scanners are the second.", "Full-featured protection is the fourth."], "r": "\u00a76.10 Host-Based Scanners and Signature-Based Anti-Virus"}, {"id": "6-132", "ch": 6, "sec": "6.10", "q": "A first-generation anti-virus scanner:", "o": ["Needs a malware signature, so it detects only known malware (or watches length changes)", "Uses heuristic rules to search for probable malware, such as encryption loops", "Identifies malware by its actions while resident in memory, rather than its structure", "Combines scanning, activity traps, and access control in a single package"], "w": ["Correct. This is a first-generation (simple) scanner.", "That's the second generation.", "That's the third generation.", "That's the fourth generation."], "r": "\u00a76.10 Host-Based Scanners"}, {"id": "6-133", "ch": 6, "sec": "6.10", "q": "A scanner that looks for the beginning of an encryption loop used in a polymorphic virus to discover the key, then decrypts and removes the malware, is an example of:", "o": ["A second-generation (heuristic) scanner", "A first-generation (simple) scanner", "An activity trap", "A sandbox"], "w": ["Correct. Heuristic scanners search for probable malware instances without a specific signature.", "First-generation scanners need specific signatures.", "Activity traps watch actions.", "Not this technique."], "r": "\u00a76.10 Host-Based Scanners"}, {"id": "6-134", "ch": 6, "sec": "6.10", "q": "In second-generation integrity checking, why use an encrypted hash function rather than a simple checksum?", "o": ["So malware that can fix a checksum can't forge a new hash; the key is kept separately", "Because checksums are much slower to compute than encrypted hash values", "Because hash functions compress programs so that changes are easier to see", "To speed up scanning by checking only the encrypted portion of each program"], "w": ["Correct. A hash also prevents malware from adjusting the program to reproduce the same code.", "Not the reason.", "Not the reason.", "Not the reason."], "r": "\u00a76.10 Host-Based Scanners"}, {"id": "6-135", "ch": 6, "sec": "6.10", "q": "What is the advantage of third-generation activity traps?", "o": ["Only a small set of malicious actions must be recognized, not every malware variant", "They require no memory, since they run only when a file is scanned", "They detect only known malware, but with fewer false positives", "They work only offline, when the system is not connected to a network"], "w": ["Correct. This is the advantage of activity traps.", "They are memory-resident.", "That's first generation.", "Not described."], "r": "\u00a76.10 Host-Based Scanners"}, {"id": "6-136", "ch": 6, "sec": "6.10", "q": "Fourth-generation anti-virus products include, in addition to scanning and activity traps:", "o": ["Access control that limits penetration and file updates", "Only signature scanning, updated far more frequently", "Only heuristic rules for detecting encryption loops", "Nothing else; they simply run the earlier techniques faster"], "w": ["Correct. This is full-featured protection.", "Too narrow.", "Too narrow.", "Not correct."], "r": "\u00a76.10 Host-Based Scanners"}, {"id": "6-137", "ch": 6, "sec": "6.10", "q": "Running potentially malicious code in an emulated sandbox or virtual machine enables detection of complex encrypted, polymorphic, or metamorphic malware because:", "o": ["The code must decrypt or unpack itself to run, exposing it to scanning and monitoring", "Sandboxes automatically decrypt all files using known malware keys", "Malware cannot run inside a sandbox, so any program that fails is flagged", "Sandboxes have unlimited time to emulate each program until it reveals itself"], "w": ["Correct. This extended analysis can also produce signatures for new malware.", "Not how it works.", "Malware does run there.", "Time is the key LIMITATION."], "r": "\u00a76.10 Sandbox Analysis"}, {"id": "6-138", "ch": 6, "sec": "6.10", "q": "What is the most difficult design issue with sandbox analysis?", "o": ["Deciding how long to run each program, since malware may sleep to evade detection", "Choosing a color scheme for the analyst's reporting console", "Paying the licensing costs for every emulated operating system and application", "Finding enough malware samples to analyze"], "w": ["Correct. Malware may also check whether it's in a sandbox or VM, or use a logic bomb for specific conditions.", "Not an issue.", "Not discussed.", "Not discussed."], "r": "\u00a76.10 Sandbox Analysis"}, {"id": "6-139", "ch": 6, "sec": "6.10", "q": "Host-based dynamic malware analysis (behavior-blocking software) differs from sandbox analysis in that it:", "o": ["Integrates with the host OS and can block malicious actions in real time before they affect the system", "Runs suspicious code only in an emulator that simulates the CPU and memory, away from the real host", "Uses only signatures to recognize malware before it executes", "Cannot see file operations, only network communications"], "w": ["Correct. It is a type of host-based intrusion prevention system.", "That's a sandbox.", "That's the first generation.", "It monitors file operations."], "r": "\u00a76.10 Host-Based Dynamic Malware Analysis"}, {"id": "6-140", "ch": 6, "sec": "6.10", "q": "Why does behavior blocking have an advantage over fingerprinting and heuristics?", "o": ["However obfuscated, the code must eventually make OS requests that can be intercepted", "It never produces false positives, because only real malware makes OS requests", "It doesn't need to run the code at all, since it analyzes the program's structure", "It detects malware before download by checking the website's reputation"], "w": ["Correct. There are trillions of ways to obfuscate instructions.", "Not claimed.", "It monitors running code.", "Not true."], "r": "\u00a76.10 Host-Based Dynamic Malware Analysis"}, {"id": "6-141", "ch": 6, "sec": "6.10", "q": "What is a limitation of dynamic analysis (behavior blocking) alone?", "o": ["The code must run before its behavior is seen, so it can cause harm before being blocked", "It cannot block anything at all; it can only report the observed behavior after the fact", "It requires up-to-date signatures for every malware family it blocks", "It only works on Linux, because Windows hides system calls"], "w": ["Correct. This is the stated limitation.", "It can block actions.", "It doesn't rely on signatures.", "Not stated."], "r": "\u00a76.10 Host-Based Dynamic Malware Analysis"}, {"id": "6-142", "ch": 6, "sec": "6.10", "q": "RootkitRevealer, from Sysinternals, detects rootkits by:", "o": ["Comparing an API-based system scan with a raw view of storage that bypasses the API", "Scanning incoming e-mail attachments and downloaded files for known rootkit signatures", "Checking which network ports are open on the system", "Analyzing document macros for hidden installation code"], "w": ["Correct. A rootkit modifies the view seen through administrator calls, so the discrepancy reveals it.", "Not this tool.", "Not this tool.", "Not this tool."], "r": "\u00a76.10 Rootkit Countermeasures"}, {"id": "6-143", "ch": 6, "sec": "6.10", "q": "If a kernel-level or virtual machine rootkit is detected, what is the only secure and reliable way to recover?", "o": ["Do an entire new OS install on the infected machine", "Run the anti-virus scan again in safe mode", "Delete the rootkit files from the system directories", "Reboot to clear the rootkit from memory"], "w": ["Correct. For a low-level rootkit such as a UEFI rootkit, hardware replacement may be needed.", "Not reliable.", "Not reliable.", "Not reliable."], "r": "\u00a76.10 Rootkit Countermeasures"}, {"id": "6-144", "ch": 6, "sec": "6.10", "q": "Monitoring software located at the border between the enterprise network and the Internet, which can look for incoming traffic to unused local IP addresses, is a(n):", "o": ["Ingress monitor", "Egress monitor", "Activity trap", "Sandbox"], "w": ["Correct. A honeypot can also capture incoming malware traffic.", "Egress monitors watch OUTGOING traffic for scanning and other signs.", "Activity traps are host-based.", "Sandboxes are for analysis."], "r": "\u00a76.10 Perimeter Scanning Approaches"}, {"id": "6-145", "ch": 6, "sec": "6.10", "q": "Egress monitors are designed to:", "o": ["Find infected hosts by watching outgoing traffic for scanning, mass e-mail, or exfiltration", "Block all incoming traffic at the border between the enterprise network and the Internet", "Scan files on each host's disk for known malware signatures", "Replace the external firewall with a dedicated monitoring appliance"], "w": ["Correct. This is the purpose of egress monitors.", "That's not their role.", "That's host-based.", "Not described."], "r": "\u00a76.10 Perimeter Scanning Approaches"}, {"id": "6-146", "ch": 6, "sec": "6.10", "q": "What is a limitation of perimeter-based anti-virus scanning compared to host-based?", "o": ["It can scan malware content but can't observe how the malware behaves on a host", "It sees no network traffic, only files that have already been saved to disk", "It cannot block anything, since it only produces reports for administrators", "It only works for mobile devices that connect through the corporate network"], "w": ["Correct. On the other hand, it gives a larger-scale view of malware activity.", "It does see traffic.", "It may include intrusion prevention measures.", "Not stated."], "r": "\u00a76.10 Perimeter Scanning Approaches"}, {"id": "6-147", "ch": 6, "sec": "6.10", "q": "A distributed configuration that gathers data from many host-based and perimeter sensors, correlates it centrally, and returns updated signatures and behavior patterns is an example of:", "o": ["A distributed IPS", "A rootkit", "A peer-to-peer botnet", "A logic bomb"], "w": ["Correct. This is the distributed intelligence-gathering approach.", "Not related.", "Botnets are malicious.", "Not related."], "r": "\u00a76.10 Distributed Intelligence Gathering Approaches"}, {"id": "6-148", "ch": 6, "sec": "6.10", "q": "For perimeter monitoring of botnets, what is the PRIMARY objective?", "o": ["To detect and disable the botnet during its construction phase", "To wait until the attack starts, then filter the attack traffic", "To join the botnet and issue commands that shut it down", "To increase bandwidth so attacks have less impact"], "w": ["Correct. Monitoring can detect an active attack, but the primary goal is catching the botnet during construction.", "Not the primary goal.", "Not a goal.", "Not a goal."], "r": "\u00a76.10 Perimeter Scanning Approaches"}, {"id": "6-149", "ch": 6, "sec": "6.10", "q": "Why do spyware-specific detection and removal utilities exist alongside general anti-virus?", "o": ["Spyware is a serious threat that uses stealth; these utilities complement anti-virus", "Because general anti-virus products cannot detect any spyware at all", "Because spyware is legal, so general products are not allowed to remove it", "Because they replace general anti-virus products on systems at risk"], "w": ["Correct. They provide more robust capabilities and should be used together with general products.", "General products do include some spyware signatures.", "Not stated.", "They complement anti-virus. They don't replace it."], "r": "\u00a76.10 Spyware Detection and Removal"}, {"id": "6-150", "ch": 6, "sec": "6.10", "q": "One of the first countermeasures that should be employed against malware is:", "o": ["Ensuring all systems are as current as possible, with all patches applied", "Disabling all networking on systems that hold sensitive data", "Allowing users to install any software they need", "Removing access controls that slow down patching"], "w": ["Correct. Setting appropriate access controls is next. Both target the key propagation mechanisms.", "Not recommended.", "This would increase risk.", "This would increase risk."], "r": "\u00a76.10 Malware Countermeasure Approaches"}, {"id": "6-151", "ch": 6, "sec": "6.6", "q": "WannaCry demanded ransom payment in which form?", "o": ["Bitcoins", "Gift cards", "Wire transfer to a bank", "Credit card"], "w": ["Correct. WannaCry demanded payment in Bitcoins.", "Not stated.", "Not stated.", "Not stated."], "r": "\u00a76.6 Data Destruction and Ransomware"}, {"id": "6-152", "ch": 6, "sec": "6.5", "q": "Given that five in six new phones run Android [SYMA16], what does the textbook conclude?", "o": ["Android phones are a key target for criminals and attackers", "Android phones are immune to malware because of app store controls", "iPhones are the only significant mobile target", "Mobile malware has declined as phones became more secure"], "w": ["Correct. Vulnerabilities and malware targeting phones have increased steadily.", "Not true.", "Not true.", "It has increased."], "r": "\u00a76.5 Mobile Phone Trojans"}, {"id": "6-153", "ch": 6, "sec": "6.5", "q": "The first mobile phone Trojan, discovered in 2004, was:", "o": ["Skuller", "Cabir", "CommWarrior", "Zeus"], "w": ["Correct. Skuller targeted Symbian phones.", "Cabir was the first mobile WORM (2004).", "CommWarrior was a mobile worm that followed Cabir.", "Zeus is a banking Trojan toolkit."], "r": "\u00a76.5 Mobile Phone Trojans"}, {"id": "6-154", "ch": 6, "sec": "6.4", "q": "CommWarrior replicates by which means?", "o": ["Bluetooth, MMS to contacts, the memory card, and installation files", "Only SMS messages sent to every contact in the phone's address book", "Only e-mail attachments sent from the phone's mail client", "Only USB connections when the phone is plugged into a computer"], "w": ["Correct. CommWarrior uses all of these methods.", "Too narrow.", "Not described.", "Not described."], "r": "\u00a76.4 Mobile Phone Worms"}, {"id": "8-01", "ch": 8, "sec": "8.1", "q": "Which class of intruders consists of individuals or members of an organized crime group whose goal is financial reward?", "o": ["Cyber criminals", "Activists", "State-sponsored organizations", "Others (classic hackers)"], "w": ["Correct. Their activities include identity theft, theft of financial credentials, corporate espionage, data theft, and data ransoming.", "Activists (hacktivists) are motivated by social or political causes.", "State-sponsored groups conduct espionage or sabotage for governments.", "'Others' are motivated by technical challenge or peer-group esteem."], "r": "Ch 8 \u00b7 Classes of Intruders"}, {"id": "8-02", "ch": 8, "sec": "8.1", "q": "Intruders motivated by social or political causes, whose skill level is often quite low and who aim to promote and publicize their cause, are:", "o": ["Activists (hacktivists)", "Cyber criminals", "APTs", "Script-kiddies by definition"], "w": ["Correct. Their typical methods are website defacement, denial of service, and theft and distribution of data that creates negative publicity for their targets.", "Cyber criminals seek financial reward.", "APTs are state-sponsored and persistent.", "'Script-kiddie' is a skill level, not a class defined by motivation."], "r": "Ch 8 \u00b7 Classes of Intruders \u2013 Activists"}, {"id": "8-03", "ch": 8, "sec": "8.1", "q": "State-sponsored hacker groups are also known as Advanced Persistent Threats (APTs) because of:", "o": ["The covert nature and persistence over extended periods of many attacks in this class", "Their low skill level, which leads them to persist with simple toolkits", "Their reliance on public toolkits that are advanced and widely shared", "Their focus on financial reward over extended periods"], "w": ["Correct. The slides describe their activities as widespread across many countries.", "They are typically highly skilled.", "They often develop custom tools.", "Financial reward is the cyber criminal motive."], "r": "Ch 8 \u00b7 Classes of Intruders \u2013 State-Sponsored"}, {"id": "8-04", "ch": 8, "sec": "8.1", "q": "The 'Others' class of intruders includes classic hackers or crackers motivated by:", "o": ["Technical challenge or peer-group esteem and reputation", "Financial reward from identity theft and data ransoming", "Political or social causes they want to publicize", "Directives from the governments that sponsor them"], "w": ["Correct. It also includes 'hobby hackers' who use widely available attack toolkits.", "That's cyber criminals.", "That's activists.", "That's state-sponsored groups."], "r": "Ch 8 \u00b7 Classes of Intruders \u2013 Others"}, {"id": "8-05", "ch": 8, "sec": "8.1", "q": "Which intruder skill level likely comprises the LARGEST number of attackers and is the EASIEST to defend against?", "o": ["Beginner (script-kiddies)", "Skilled (modifies attack tools)", "Expert", "State-sponsored"], "w": ["Correct. Beginners primarily use existing attack toolkits, which makes their attacks the easiest to defend against.", "Skilled hackers can modify and extend toolkits.", "Experts discover new categories of vulnerabilities and are the hardest to defend against.", "This is a class of intruder, not a skill level."], "r": "Ch 8 \u00b7 Intruder Skill Levels \u2013 Beginner"}, {"id": "8-06", "ch": 8, "sec": "8.1", "q": "Hackers with enough technical skill to modify and extend attack toolkits to use newly discovered or purchased vulnerabilities are at which skill level?", "o": ["Skilled", "Beginner", "Expert", "Activist"], "w": ["Correct. They are likely found in all intruder classes, and they adapt tools for use by others.", "Beginners use existing toolkits as they are.", "Experts discover brand new categories of vulnerabilities and write new toolkits.", "Activist is a class of intruder, not a skill level."], "r": "Ch 8 \u00b7 Intruder Skill Levels \u2013 Skilled"}, {"id": "8-07", "ch": 8, "sec": "8.1", "q": "Which skill level describes hackers capable of discovering brand new categories of vulnerabilities and writing powerful new attack toolkits, against whom defense is of the highest difficulty?", "o": ["Expert", "Skilled", "Beginner", "Hobby hacker"], "w": ["Correct. Some experts are employed by state-sponsored organizations.", "Skilled hackers extend existing toolkits.", "Beginners use existing toolkits.", "Hobby hackers use available toolkits."], "r": "Ch 8 \u00b7 Intruder Skill Levels \u2013 Expert"}, {"id": "8-08", "ch": 8, "sec": "8.1", "q": "Which of the following is listed in the slides as an example of intrusion?", "o": ["Using an unattended workstation", "Applying a security patch", "Running a scheduled backup", "Rotating encryption keys"], "w": ["Correct. Other examples include remote root compromise, web server defacement, guessing or cracking passwords, viewing sensitive data without authorization, and impersonating an executive to get information.", "Patching is a defense.", "Backups are routine operations.", "Key rotation is routine operations."], "r": "Ch 8 \u00b7 Examples of Intrusion"}, {"id": "8-09", "ch": 8, "sec": "8.1", "q": "The slides list the stages of intruder behavior. Which is the correct sequence?", "o": ["Target acquisition \u2192 initial access \u2192 privilege escalation \u2192 exploit \u2192 maintaining access \u2192 covering tracks", "Initial access \u2192 covering tracks \u2192 privilege escalation \u2192 target acquisition \u2192 maintaining access", "Covering tracks \u2192 maintaining access \u2192 initial access \u2192 privilege escalation \u2192 information gathering", "Privilege escalation \u2192 target acquisition \u2192 initial access \u2192 covering tracks \u2192 maintaining access"], "w": ["Correct. Table 8.1 gives examples for each stage.", "Wrong order.", "Wrong order.", "Wrong order."], "r": "Ch 8 \u00b7 Intruder Behavior; Table 8.1"}, {"id": "8-10", "ch": 8, "sec": "8.1", "q": "In Table 8.1, editing logfiles to remove entries generated during the intrusion is an example of which stage?", "o": ["Covering tracks", "Maintaining access", "Privilege escalation", "Initial access"], "w": ["Correct. Using a rootkit to hide installed files is another example.", "Maintaining access means keeping a way back in for later.", "Privilege escalation means gaining elevated rights.", "Initial access means first getting in."], "r": "Ch 8 \u00b7 Table 8.1 (f)"}, {"id": "8-11", "ch": 8, "sec": "8.1", "q": "In Table 8.1, modifying or disabling anti-virus or IDS programs on the system is listed under which stage?", "o": ["Maintaining access", "Covering tracks", "Target acquisition", "Information gathering or system exploit"], "w": ["Correct. This stage also includes installing remote administration tools for later access.", "Covering tracks focuses on hiding files and editing logs.", "Target acquisition is reconnaissance before access.", "That stage is about scanning for and transferring information."], "r": "Ch 8 \u00b7 Table 8.1 (e)"}, {"id": "8-12", "ch": 8, "sec": "8.1", "q": "According to the slides, a key element of intrusion is:", "o": ["Guessed or captured credentials that let attackers move between systems", "Physical theft of servers that hold stored credentials", "Posts on social media that reveal system configurations", "Hardware failures that leave systems temporarily unprotected"], "w": ["Correct. This is the 'Key Element of Intrusion' slide.", "Not stated.", "Not stated.", "Not stated."], "r": "Ch 8 \u00b7 Key Element of Intrusion"}, {"id": "8-13", "ch": 8, "sec": "8.1", "q": "The 2021 Colonial Pipeline ransomware attack is cited as causing serious fuel shortages. What ransom did the company pay to gain access to the recovery tool?", "o": ["Around $4.4 million", "Around $10,000", "Around $100 million", "No ransom was paid"], "w": ["Correct. The slides note that paying means the attackers have succeeded, while not paying may cost the organization significant value.", "Too low.", "Too high.", "It did pay."], "r": "Ch 8 \u00b7 Recent Trends of Intrusion \u2013 Ransomware"}, {"id": "8-14", "ch": 8, "sec": "8.1", "q": "An attacker targets an organization that provides key software or services to many customers, then targets those customers through the compromised software. This trend is a:", "o": ["Supply-chain attack", "Business e-mail compromise", "Watering-hole attack", "Flash crowd"], "w": ["Correct. The slides describe these attacks as hard to prevent and detect.", "BEC impersonates a trusted supplier or representative by e-mail.", "A watering-hole attack compromises sites the victims visit (Ch 6).", "A flash crowd is legitimate overload of a site."], "r": "Ch 8 \u00b7 Recent Trends of Intrusion \u2013 Supply-chain"}, {"id": "8-15", "ch": 8, "sec": "8.1", "q": "In the SolarWinds attack, attackers compromised the update mechanism of which product, delivering a backdoor Trojan to more than 18,000 customers?", "o": ["Orion (network monitoring)", "Exchange (e-mail server)", "Windows Defender", "Office 365"], "w": ["Correct. Orion is SolarWinds' popular network monitoring product.", "Not cited.", "Not cited.", "Not cited."], "r": "Ch 8 \u00b7 Recent Trends of Intrusion \u2013 Supply-chain"}, {"id": "8-16", "ch": 8, "sec": "8.1", "q": "Cybercriminals compromise a business or personal e-mail account and impersonate a trusted supplier or business representative to scam victims. This is:", "o": ["Business e-mail compromise (BEC)", "Software supply-chain attack", "Ransomware", "Script-kiddie activity"], "w": ["Correct. BEC can often evade technical controls and is often aimed at small or medium businesses with less sophisticated IT security.", "A supply-chain attack goes through a software or service provider.", "Ransomware encrypts data.", "Not this."], "r": "Ch 8 \u00b7 Recent Trends of Intrusion \u2013 BEC"}, {"id": "8-17", "ch": 8, "sec": "8.2", "q": "An IDS that monitors the characteristics of a single host for suspicious activity is a:", "o": ["Host-based IDS (HIDS)", "Network-based IDS (NIDS)", "Distributed or hybrid IDS", "Firewall"], "w": ["Correct. This is a HIDS.", "A NIDS monitors network traffic.", "A distributed or hybrid IDS combines many sensors in a central analyzer.", "A firewall is not an IDS."], "r": "Ch 8 \u00b7 Intrusion Detection System (IDS)"}, {"id": "8-18", "ch": 8, "sec": "8.2", "q": "An IDS that monitors network traffic and analyzes network, transport, and application protocols to identify suspicious activity is a:", "o": ["Network-based IDS (NIDS)", "Host-based IDS (HIDS)", "Honeypot", "Bastion host"], "w": ["Correct. This is a NIDS.", "A HIDS monitors a single host.", "A honeypot is a decoy system.", "A bastion host is a firewall platform (Ch 9)."], "r": "Ch 8 \u00b7 Intrusion Detection System (IDS)"}, {"id": "8-19", "ch": 8, "sec": "8.2", "q": "A distributed or hybrid IDS:", "o": ["Combines host and network sensor data in a central analyzer to better detect and respond", "Monitors the characteristics of a single host for suspicious activity", "Is a firewall that filters traffic but performs no detection", "Uses only signature detection at each sensor, with no central analysis or correlation of data"], "w": ["Correct. This is the distributed or hybrid IDS definition.", "That's a HIDS.", "Not this.", "Not specified."], "r": "Ch 8 \u00b7 Intrusion Detection System (IDS)"}, {"id": "8-20", "ch": 8, "sec": "8.2", "q": "An IDS comprises which three logical components?", "o": ["Sensors, analyzers, and user interface", "Firewalls, routers, and switches", "Subjects, objects, and access rights", "Prevention, detection, and recovery"], "w": ["Correct. Sensors collect data, analyzers determine whether an intrusion has occurred, and the user interface lets users view output or control system behavior.", "These are network devices.", "These are access control elements.", "These are strategy elements."], "r": "Ch 8 \u00b7 Intrusion Detection System (IDS)"}, {"id": "8-21", "ch": 8, "sec": "8.2", "q": "In an IDS, which component determines whether an intrusion has occurred?", "o": ["Analyzer", "Sensor", "User interface", "Honeypot"], "w": ["Correct. The analyzer makes this determination.", "Sensors collect data.", "The user interface displays output and controls behavior.", "A honeypot is a decoy, not an IDS component."], "r": "Ch 8 \u00b7 Intrusion Detection System (IDS)"}, {"id": "8-22", "ch": 8, "sec": "8.3", "q": "Which IDS analysis approach collects data on the behavior of legitimate users over a period of time, then analyzes current behavior to decide if it is that of a legitimate user or an intruder?", "o": ["Anomaly detection", "Signature/heuristic detection", "Misuse detection", "Pattern matching only"], "w": ["Correct. This is anomaly detection.", "Signature/heuristic detection compares behavior against known malicious patterns or attack rules.", "Misuse detection is another name for signature/heuristic detection.", "Pattern matching is a signature technique."], "r": "Ch 8 \u00b7 Analysis Approaches"}, {"id": "8-23", "ch": 8, "sec": "8.3", "q": "Signature/heuristic detection is also known as:", "o": ["Misuse detection", "Anomaly detection", "Stateful protocol analysis", "Statistical detection"], "w": ["Correct. It can only identify known attacks for which it has patterns or rules.", "Anomaly detection is the other approach.", "SPA is a subset of anomaly detection.", "Statistical analysis is an anomaly classification approach."], "r": "Ch 8 \u00b7 Analysis Approaches"}, {"id": "8-24", "ch": 8, "sec": "8.3", "q": "What is a key limitation of signature/heuristic (misuse) detection?", "o": ["It can only identify known attacks for which it has patterns or rules", "It cannot detect any attacks", "It requires a training period of normal behavior", "It always produces more false alarms than anomaly detection"], "w": ["Correct. This is the stated limitation.", "It detects known attacks.", "Training on normal behavior is part of ANOMALY detection.", "Not stated."], "r": "Ch 8 \u00b7 Analysis Approaches"}, {"id": "8-25", "ch": 8, "sec": "8.3", "q": "Which anomaly detection classification approach analyzes observed behavior using univariate, multivariate, or time-series models of observed metrics?", "o": ["Statistical", "Knowledge based", "Machine-learning", "Signature"], "w": ["Correct. This is the statistical approach.", "The knowledge-based approach uses an expert system with rules that model legitimate behavior.", "The machine-learning approach automatically builds a classification model from training data using data mining.", "Signature is not an anomaly approach."], "r": "Ch 8 \u00b7 Anomaly Detection"}, {"id": "8-26", "ch": 8, "sec": "8.3", "q": "Which anomaly detection approach uses an expert system that classifies observed behavior according to a set of rules modeling legitimate behavior?", "o": ["Knowledge based", "Statistical", "Machine-learning", "Stateful protocol analysis"], "w": ["Correct. This is the knowledge-based approach.", "The statistical approach uses metric models.", "The machine-learning approach builds models automatically from data.", "SPA compares traffic against vendor-supplied protocol profiles."], "r": "Ch 8 \u00b7 Anomaly Detection"}, {"id": "8-27", "ch": 8, "sec": "8.3", "q": "Which anomaly detection approach automatically determines a suitable classification model from training data using data mining techniques?", "o": ["Machine-learning", "Knowledge based", "Statistical", "Rule-based heuristic"], "w": ["Correct. This is the machine-learning approach.", "The knowledge-based approach uses an expert system.", "The statistical approach uses metric models.", "Rule-based heuristic identification is a signature approach."], "r": "Ch 8 \u00b7 Anomaly Detection"}, {"id": "8-28", "ch": 8, "sec": "8.3", "q": "For signature approaches, the signatures need to be large enough to:", "o": ["Minimize the false alarm rate while still detecting a sufficiently large fraction of malicious data", "Fill all available memory, so that no malicious pattern can be missed", "Detect only zero-day attacks, since known attacks are already handled by the perimeter firewalls", "Eliminate the need for updates as new malicious data appears"], "w": ["Correct. Signature approaches are widely used in anti-virus, network traffic scanning proxies, and NIDS.", "Not the stated goal.", "Signatures detect KNOWN attacks.", "Signatures still need updates."], "r": "Ch 8 \u00b7 Signature or Heuristic Detection"}, {"id": "8-29", "ch": 8, "sec": "8.3", "q": "Rule-based heuristic identification involves rules for identifying known penetrations. What else can such rules identify?", "o": ["Suspicious behavior, even when it is within the bounds of established patterns of usage", "Only hardware failures that resemble the effects of known penetrations", "Only encrypted traffic that cannot be matched against signatures", "Nothing beyond the known penetrations the signatures describe"], "w": ["Correct. The rules used are typically specific.", "Not stated.", "Not stated.", "Rules can also flag suspicious behavior."], "r": "Ch 8 \u00b7 Signature or Heuristic Detection"}, {"id": "8-30", "ch": 8, "sec": "8.3", "q": "Which product is given as an example of a rule-based NIDS?", "o": ["Snort", "Tripwire", "SELinux", "Bcrypt"], "w": ["Correct. Snort is the slides' example of a rule-based NIDS.", "Tripwire is a file-integrity HIDS tool.", "SELinux is MAC for Linux (Ch 4).", "Bcrypt is password hashing (Ch 3)."], "r": "Ch 8 \u00b7 Signature or Heuristic Detection"}, {"id": "8-31", "ch": 8, "sec": "8.4", "q": "A host-based IDS:", "o": ["Adds security software to sensitive systems; detects internal and external intrusions", "Only monitors network traffic passing selected points on the organization's network perimeter", "Can only detect external intrusions, not those by insiders", "Cannot log events; it can only send alerts as they occur"], "w": ["Correct. Its primary purpose is to detect intrusions, log suspicious events, and send alerts. It can use anomaly or signature and heuristic approaches.", "That describes a NIDS.", "It detects BOTH external and internal intrusions.", "Logging suspicious events is a primary function."], "r": "Ch 8 \u00b7 Host-Based Intrusion Detection (HIDS)"}, {"id": "8-32", "ch": 8, "sec": "8.4", "q": "Which is a common data source for host-based intrusion detection sensors?", "o": ["File integrity checksums", "Router ARP cache tables", "DNS root zone files", "Public certificates"
