d", "Access decisions should be cached over time so they need not be rechecked for performance", "Privileges should increase over time as the user gains seniority in the organization"], "w": ["Correct. For example, administrators should hold special privileges only while needed, because leaving them in place 'just opens the door to accidents.'", "The book doesn't describe fixed expiration periods.", "Caching access decisions conflicts with complete mediation.", "Nothing in least privilege ties privileges to seniority."], "r": "\u00a71.4 Least privilege"}, {"id": "1-82", "ch": 1, "sec": "1.4", "q": "Moving high-privilege operations into a separate process that runs with elevated rights, while day-to-day interfaces run in a lower-privileged process, illustrates which principle (in its modern interpretation)?", "o": ["Separation of privilege", "Least common mechanism", "Open design", "Isolation"], "w": ["Correct. The term now also applies to dividing a program into parts limited to the specific privileges each needs, which reduces potential damage from an attack.", "Least common mechanism minimizes functions shared by different users.", "Open design means not relying on secret mechanisms.", "Isolation is related, but the book presents this specific example under separation of privilege."], "r": "\u00a71.4 Separation of privilege"}, {"id": "1-83", "ch": 1, "sec": "1.4", "q": "Which principle helps 'reduce the number of unintended communication paths' and reduce the hardware and software on which all users depend?", "o": ["Least common mechanism", "Economy of mechanism", "Modularity", "Complete mediation"], "w": ["Correct. Least common mechanism minimizes functions shared by different users, providing mutual security.", "Economy of mechanism keeps designs small and simple. The book doesn't frame it in terms of shared paths.", "Modularity creates common modules, which is somewhat the opposite of minimizing shared mechanisms.", "Complete mediation checks every access."], "r": "\u00a71.4 Least common mechanism"}, {"id": "1-84", "ch": 1, "sec": "1.4", "q": "Which design principle does the textbook call 'perhaps the most difficult principle to honor' because of the constant demand for new features?", "o": ["Economy of mechanism", "Complete mediation", "Psychological acceptability", "Least privilege"], "w": ["Correct. The text singles out economy of mechanism this way, because feature demands keep adding complexity.", "The book says the complete mediation approach is 'rarely used' because it is so exhaustive, but it doesn't call it the most difficult to honor.", "Psychological acceptability is not given this description.", "Least privilege is not given this description."], "r": "\u00a71.4 Economy of mechanism"}, {"id": "1-85", "ch": 1, "sec": "1.5", "q": "Which is an example of the attack surface listed in the textbook?", "o": ["An employee with access to sensitive information vulnerable to a social engineering attack", "A firewall rule that blocks all inbound traffic to the organization's internal network", "An encrypted backup copy of the customer database stored offline in a locked vault", "A fully patched workstation that is disconnected from every network"], "w": ["Correct. The book's examples include open ports, services inside a firewall, code processing incoming data, interfaces/SQL/web forms, and employees vulnerable to social engineering.", "A blocking firewall rule reduces the attack surface.", "Offline encrypted backups aren't a reachable and exploitable vulnerability.", "A disconnected, patched host offers little that is reachable."], "r": "\u00a71.5 Attack Surfaces"}, {"id": "1-86", "ch": 1, "sec": "1.5", "q": "In the Internet banking attack tree of Figure 1.5, what type are all the nodes other than the leaf nodes?", "o": ["OR-nodes", "AND-nodes", "A mix of AND and OR nodes", "Countermeasure nodes"], "w": ["Correct. The text notes that in this tree all non-leaf nodes are OR-nodes.", "No AND-nodes are present in Figure 1.5.", "The text specifically says all non-leaf nodes are OR-nodes.", "Attack trees don't contain countermeasure nodes."], "r": "\u00a71.5 Figure 1.5"}, {"id": "1-87", "ch": 1, "sec": "1.5", "q": "In Figure 1.5, which strategy is based on distributed zombie PCs hosting automated programs that send random usernames and passwords?", "o": ["User credential guessing", "User credential compromise", "Injection of commands", "Use of known authenticated session"], "w": ["Correct. [HILT06] reports that brute-force attacks against some banking schemes are feasible this way.", "User credential compromise covers observing PINs, stealing tokens, hacking smartcards, malware, and sniffing.", "Injection of commands means intercepting UT\u2194IBS communication to impersonate the user.", "Use of known authenticated session involves a preset session ID."], "r": "\u00a71.5 Figure 1.5"}, {"id": "1-88", "ch": 1, "sec": "1.6", "q": "The definition of security policy as a formal statement of the rules and practices governing how a system or organization provides security services comes from which source?", "o": ["RFC 4949", "FIPS 199", "NISTIR 7298", "[NRC91]"], "w": ["Correct. The formal definition is from RFC 4949. [NRC91] gives the informal 'description of desired system behavior.'", "FIPS 199 defines the security objectives and impact levels.", "NISTIR 7298 is the glossary that defines computer security.", "[NRC91] gives the INFORMAL description."], "r": "\u00a71.6 Security Policy"}, {"id": "1-89", "ch": 1, "sec": "1.6", "q": "According to the textbook, a security manager developing a policy must consider which three factors?", "o": ["Value of the assets, vulnerabilities of the system, and potential threats and likelihood of attacks", "The project's cost, its implementation schedule, and the scope of systems it covers", "The organization's hardware, software, and data assets", "Its ability to prevent attacks, detect them, and recover from them"], "w": ["Correct. These are the three factors listed before the trade-offs.", "These are project management factors.", "These are asset categories.", "These are implementation courses of action."], "r": "\u00a71.6 Security Policy"}, {"id": "1-90", "ch": 1, "sec": "1.6", "q": "The textbook concludes that security policy is ultimately:", "o": ["A business decision, possibly influenced by legal requirements", "A purely technical decision made by engineers and system administrators", "Determined entirely by government standards", "Identical for all organizations"], "w": ["Correct. Because of trade-offs such as cost of security vs. cost of failure, policy is a business decision.", "The book frames it as a business decision, not a purely technical one.", "Legal requirements may influence it, but they don't wholly determine it.", "Each organization weighs its own assets, threats, and trade-offs."], "r": "\u00a71.6 Security Policy"}, {"id": "1-91", "ch": 1, "sec": "1.6", "q": "Evaluation, as defined in Chapter 1, is:", "o": ["The process of examining a computer product or system with respect to certain criteria", "The degree of confidence that a system operates so that its security policy is enforced", "A formal mathematical proof that a design and implementation are correct", "The detection of intrusions in progress by monitoring system activity"], "w": ["Correct. Evaluation involves testing and possibly formal analytic or mathematical techniques. A central thrust is developing evaluation criteria for product comparisons.", "That is ASSURANCE.", "The book says formal proof isn't achievable.", "That is detection, a course of action."], "r": "\u00a71.6 Assurance and Evaluation"}, {"id": "1-92", "ch": 1, "sec": "1.7", "q": "Which description fits ISO as presented in Chapter 1?", "o": ["A nongovernmental worldwide federation of national standards bodies from more than 140 countries", "A U.S. federal agency whose standards are published as FIPS and Special Publications", "A United Nations agency whose standards are published as Recommendations", "A professional membership society that is the organizational home of the IETF"], "w": ["Correct. ISO's work results in International Standards.", "That is NIST.", "That is the ITU (ITU-T).", "That is ISOC."], "r": "\u00a71.7 Standards"}, {"id": "2-01", "ch": 2, "sec": "2.1", "q": "Symmetric encryption is also referred to as:", "o": ["Conventional encryption or single-key encryption", "Asymmetric encryption or two-key encryption", "Public-key encryption or dual-key encryption", "Hash-based encryption or one-way encryption"], "w": ["Correct. Symmetric encryption is also called conventional or single-key encryption. It was the only type in use before public-key encryption appeared in the late 1970s.", "Asymmetric encryption is the other name for public-key encryption.", "Public-key encryption uses two separate keys.", "Symmetric encryption uses one shared secret key."], "r": "\u00a72.1 Symmetric Encryption"}, {"id": "2-02", "ch": 2, "sec": "2.1", "q": "Which of the following is NOT one of the five ingredients of a symmetric encryption scheme?", "o": ["Public key", "Plaintext", "Secret key", "Decryption algorithm"], "w": ["Correct. The five ingredients are plaintext, encryption algorithm, secret key, ciphertext, and decryption algorithm. A public key belongs to public-key schemes.", "Plaintext is ingredient #1: the original message fed into the algorithm.", "The secret key is input to the encryption algorithm and determines the exact substitutions and transformations.", "The decryption algorithm is essentially the encryption algorithm run in reverse."], "r": "\u00a72.1 Figure 2.1"}, {"id": "2-03", "ch": 2, "sec": "2.1", "q": "What are the two requirements for secure use of symmetric encryption?", "o": ["A strong encryption algorithm, and secure sharing and safekeeping of the secret key by sender and receiver", "A sufficiently long public key, and a certificate authority to vouch for that key", "A secret encryption algorithm, and a short key that is easy for both parties to share", "A digital signature on every message, and a secure hash function for integrity checking"], "w": ["Correct. The algorithm should resist an opponent even when the opponent holds plaintext-ciphertext pairs, and the key must be obtained securely and kept secure.", "Public keys and CAs belong to public-key cryptography.", "Open design says algorithms should be public. Security rests on the secret key.", "These provide authentication, not the requirements for symmetric confidentiality."], "r": "\u00a72.1 Symmetric Encryption"}, {"id": "2-04", "ch": 2, "sec": "2.1", "q": "The two general approaches to attacking a symmetric encryption scheme are:", "o": ["Cryptanalysis and brute-force attack", "Replay and masquerade", "Phishing and social engineering", "Traffic analysis and inference"], "w": ["Correct. Cryptanalysis exploits the nature of the algorithm, and a brute-force attack tries every possible key.", "These are active network attacks from Chapter 1.", "These are human-targeted attacks, not the cryptographic approaches named here.", "These are passive or inference attacks."], "r": "\u00a72.1 Symmetric Encryption"}, {"id": "2-05", "ch": 2, "sec": "2.1", "q": "On average, how many keys must a brute-force attacker try before finding the correct key, if there are x possible keys?", "o": ["x/2", "x", "\u221ax", "log\u2082 x"], "w": ["Correct. On average, half of all possible keys must be tried.", "Trying all x keys is the worst case, not the average.", "\u221ax is unrelated here. The 2^(n/2) figure applies to hash COLLISIONS.", "log\u2082 x is simply the key length in bits."], "r": "\u00a72.1 Symmetric Encryption"}, {"id": "2-06", "ch": 2, "sec": "2.1", "q": "If a cryptanalytic attack succeeds in deducing the key, what does the textbook say is the effect?", "o": ["Catastrophic: all future and past messages encrypted with that key are compromised", "Limited: only the current message encrypted with that key is compromised", "Partial: only messages encrypted with that key in the future are compromised", "Negligible: nothing is exposed as long as the algorithm itself is public"], "w": ["Correct. Deducing the key exposes ALL messages, past and future, encrypted with it.", "The key is reused, so more than one message is exposed.", "Past messages are also exposed.", "A public algorithm with a known key means everything is readable."], "r": "\u00a72.1 Symmetric Encryption"}, {"id": "2-07", "ch": 2, "sec": "2.1", "q": "Why is brute force more than simply running through all possible keys?", "o": ["Unless known plaintext is provided, the analyst must be able to recognize plaintext as plaintext", "The keys must be tried in a specific order, beginning with the most likely candidates", "Each candidate key must be approved by a certificate authority before it is tried", "The ciphertext changes with each attempt, so it must be captured again for every key"], "w": ["Correct. If the data is compressed or is a numerical file, recognizing correct plaintext is harder to automate, so some knowledge of the expected plaintext is needed.", "Order doesn't matter; the average is still half the keyspace.", "CAs are irrelevant to brute force.", "The ciphertext is fixed; the attacker tries keys against it."], "r": "\u00a72.1 Symmetric Encryption"}, {"id": "2-08", "ch": 2, "sec": "2.1", "q": "A block cipher:", "o": ["Processes plaintext in fixed-size blocks and produces a ciphertext block of equal size for each", "Processes plaintext one byte at a time, combining it with a pseudorandom keystream", "Uses two related keys, one for encryption and a different one for decryption", "Produces a fixed-size digest from input of any length, with no key involved"], "w": ["Correct. Longer plaintext is processed as a series of fixed-size blocks.", "That describes a stream cipher.", "That describes public-key (asymmetric) encryption.", "That describes a hash function."], "r": "\u00a72.1 Symmetric Block Encryption Algorithms"}, {"id": "2-09", "ch": 2, "sec": "2.1", "q": "DES takes a plaintext block of ___ bits and a key of ___ bits.", "o": ["64; 56", "128; 128", "64; 128", "56; 64"], "w": ["Correct. DES produces a 64-bit ciphertext block from a 64-bit plaintext block using a 56-bit key.", "128-bit blocks and keys belong to AES.", "DES's key is 56 bits, not 128.", "The numbers are reversed: the block is 64 and the key is 56."], "r": "\u00a72.1 Data Encryption Standard; Table 2.1"}, {"id": "2-10", "ch": 2, "sec": "2.1", "q": "According to the textbook, the MORE serious concern about DES is:", "o": ["Its 56-bit key length", "A discovered fatal weakness in its algorithm", "Its 128-bit block size", "Its use of public keys"], "w": ["Correct. With 2^56 keys (\u22487.2 \u00d7 10^16), the key length is 'woefully inadequate' against modern processors.", "Despite DES being the most-studied algorithm, no one has reported a fatal weakness.", "DES uses a 64-bit block, not 128.", "DES is symmetric."], "r": "\u00a72.1 Data Encryption Standard"}, {"id": "2-11", "ch": 2, "sec": "2.1", "q": "DES was adopted in 1977 by the National Bureau of Standards (now NIST) as:", "o": ["FIPS 46", "FIPS 197", "FIPS 180", "FIPS 186"], "w": ["Correct. DES was published as FIPS 46. The algorithm itself is called the Data Encryption Algorithm (DEA).", "FIPS 197 (2001) is AES.", "FIPS 180 is the Secure Hash Algorithm.", "FIPS 186 is the Digital Signature Standard."], "r": "\u00a72.1 Data Encryption Standard"}, {"id": "2-12", "ch": 2, "sec": "2.1", "q": "According to Table 2.2 and the surrounding text, roughly how long would today's supercomputers take to find a DES key by brute force?", "o": ["About an hour", "About a year", "Thousands of years", "Over 100,000 years"], "w": ["Correct. The book estimates today's supercomputers could find a DES key in about an hour.", "About a year is the book's estimate for a single PC.", "This greatly overstates the time for DES.", "Over 100,000 years applies to 128-bit keys even with a trillion-fold speedup."], "r": "\u00a72.1 Table 2.2"}, {"id": "2-13", "ch": 2, "sec": "2.1", "q": "Triple DES (3DES) uses either two or three unique keys for a key size of:", "o": ["112 or 168 bits", "56 or 112 bits", "128 or 256 bits", "168 or 256 bits"], "w": ["Correct. 3DES repeats DES three times with two or three keys, giving 112 or 168 bits.", "56 bits is single DES.", "128 and 256 are AES key sizes.", "256 is an AES key size."], "r": "\u00a72.1 Triple DES"}, {"id": "2-14", "ch": 2, "sec": "2.1", "q": "What is the PRINCIPAL drawback of 3DES?", "o": ["It is relatively sluggish in software", "It has a known cryptanalytic weakness", "Its key is too short to resist brute force", "It cannot be used for stored data"], "w": ["Correct. DES was designed for mid-1970s hardware, and 3DES needs three times the calculations. The secondary drawback is its 64-bit block size.", "No effective cryptanalytic attack on the underlying algorithm has been found.", "With 168 bits, 3DES overcomes DES's brute-force vulnerability.", "No such restriction exists."], "r": "\u00a72.1 Triple DES"}, {"id": "2-15", "ch": 2, "sec": "2.1", "q": "NIST required AES to be a symmetric block cipher with a block length of ___ bits and support for key lengths of ___.", "o": ["128; 128, 192, and 256 bits", "64; 56, 112, and 168 bits", "256; 128 and 256 bits", "128; 64, 128, and 192 bits"], "w": ["Correct. AES uses a 128-bit block with 128-, 192-, or 256-bit keys.", "64-bit blocks and these key sizes belong to DES and 3DES.", "The AES block is 128 bits, and there is also a 192-bit key option.", "64 is not an AES key size."], "r": "\u00a72.1 Advanced Encryption Standard"}, {"id": "2-16", "ch": 2, "sec": "2.1", "q": "Which algorithm did NIST select as AES, published as FIPS 197 in November 2001?", "o": ["Rijndael", "Triple DES", "RSA", "SHA-3"], "w": ["Correct. Rijndael was selected after 15 proposals were narrowed to 5 finalists.", "3DES is what AES replaced.", "RSA is a public-key algorithm.", "SHA-3 is a hash function (2015)."], "r": "\u00a72.1 Advanced Encryption Standard"}, {"id": "2-17", "ch": 2, "sec": "2.1", "q": "In the first round of the AES evaluation, how many proposed algorithms were accepted, and how many advanced to the second round?", "o": ["15; 5", "5; 1", "10; 3", "20; 5"], "w": ["Correct. The first round accepted 15 algorithms, and the second narrowed the field to 5.", "5 were in the second round, not the first.", "These numbers don't match the text.", "These numbers don't match the text."], "r": "\u00a72.1 Advanced Encryption Standard"}, {"id": "2-18", "ch": 2, "sec": "2.1", "q": "In electronic codebook (ECB) mode:", "o": ["Each b-bit block of plaintext is encrypted independently using the same key", "Each block is combined with a pseudorandom keystream using XOR before transmission", "Each b-bit block of plaintext is encrypted with a different key from a key schedule", "Only the first block is encrypted, and later blocks are chained to it"], "w": ["Correct. ECB divides plaintext into n b-bit blocks and encrypts each with the same algorithm and key.", "XORing with a keystream is stream cipher behavior.", "ECB uses the SAME key for each block.", "All blocks are encrypted."], "r": "\u00a72.1 Practical Security Issues"}, {"id": "2-19", "ch": 2, "sec": "2.1", "q": "Why may ECB mode be insecure for lengthy messages?", "o": ["A cryptanalyst may exploit regularities in the plaintext, such as known predefined fields", "ECB requires a key that is too short to resist a brute-force attack on long messages", "ECB ciphertext cannot be reliably decrypted once the message exceeds one block", "ECB requires public keys, which are too slow to use for lengthy messages"], "w": ["Correct. Known message structure gives the attacker plaintext-ciphertext pairs. Modes of operation were developed to overcome ECB's weaknesses.", "Key length depends on the cipher, not the mode.", "ECB decrypts normally.", "ECB is a symmetric block cipher mode."], "r": "\u00a72.1 Practical Security Issues"}, {"id": "2-20", "ch": 2, "sec": "2.1", "q": "Alternative techniques developed to increase the security of symmetric block encryption for large sequences of data are called:", "o": ["Modes of operation", "Keystreams", "Message digests", "Digital envelopes"], "w": ["Correct. Modes of operation overcome ECB's weaknesses, and each has its own advantages (detailed in Chapter 20).", "A keystream is the output of a stream cipher's pseudorandom generator.", "Message digests are hash outputs.", "Digital envelopes protect a symmetric key with public-key encryption."], "r": "\u00a72.1 Practical Security Issues"}, {"id": "2-21", "ch": 2, "sec": "2.1", "q": "In a typical stream cipher, the output of the pseudorandom bit generator, called the ________, is combined with the plaintext one byte at a time using XOR.", "o": ["Keystream", "Message digest", "Initialization vector", "Session key"], "w": ["Correct. The key seeds a pseudorandom bit generator whose output, the keystream, is XORed with the plaintext.", "A message digest is a hash output.", "An IV is not the term the text uses for the generator output.", "A session key is a temporary symmetric key. The generator's OUTPUT is the keystream."], "r": "\u00a72.1 Stream Ciphers"}, {"id": "2-22", "ch": 2, "sec": "2.1", "q": "What is the primary advantage of a stream cipher over a block cipher, according to the text?", "o": ["Stream ciphers are almost always faster and use far less code", "Stream ciphers allow the same key to be reused safely across many messages", "Stream ciphers are always more secure than block ciphers of comparable key length", "Stream ciphers don't need a key, because the keystream is generated automatically"], "w": ["Correct. The book also notes that with a properly designed PRNG, a stream cipher can be as secure as a block cipher of comparable key length.", "Key REUSE is the advantage of BLOCK ciphers.", "The book says 'can be as secure,' not always more secure.", "A key seeds the generator."], "r": "\u00a72.1 Stream Ciphers"}, {"id": "2-23", "ch": 2, "sec": "2.1", "q": "For which application does the textbook suggest a stream cipher might be the better alternative?", "o": ["Encryption of a stream of data over a data communications channel or browser/Web link", "File transfer between servers, where data is handled as discrete files", "E-mail messages, which are composed and sent as complete units", "Database applications that store and retrieve individual records"], "w": ["Correct. Streams of data over channels or web links suit stream ciphers.", "The book says block ciphers may be more appropriate for file transfer.", "Block ciphers are suggested for e-mail.", "Block ciphers are suggested for database applications."], "r": "\u00a72.1 Stream Ciphers"}, {"id": "2-24", "ch": 2, "sec": "2.2", "q": "Encryption protects against passive attack. Protection against active attack, such as falsification of data and transactions, is known as:", "o": ["Message or data authentication", "Traffic padding of message flows", "Key exchange", "Cryptanalysis"], "w": ["Correct. Message or data authentication lets parties verify that messages are authentic: unaltered and from the alleged source.", "Traffic padding is not the term used here.", "Key exchange distributes keys.", "Cryptanalysis is an ATTACK on cryptosystems."], "r": "\u00a72.2 Message Authentication and Hash Functions"}, {"id": "2-25", "ch": 2, "sec": "2.2", "q": "Why is symmetric encryption alone NOT a suitable tool for data authentication?", "o": ["In ECB mode an attacker can reorder ciphertext blocks, and each block still decrypts successfully", "The receiver cannot decrypt symmetric ciphertext without first verifying the sender", "Symmetric encryption reveals the key to anyone who intercepts enough ciphertext", "Symmetric encryption requires a certificate authority to authenticate each block"], "w": ["Correct. Reordered blocks can change the meaning without detection, because per-block sequence numbers are typically absent.", "Receivers decrypt normally.", "Encryption doesn't reveal the key.", "CAs relate to public keys."], "r": "\u00a72.2 Authentication Using Symmetric Encryption"}, {"id": "2-26", "ch": 2, "sec": "2.2", "q": "Which of the following is one of the three situations [DAVI89] gives where message authentication WITHOUT confidentiality is preferable?", "o": ["A message broadcast to many destinations, with only one responsible for monitoring authenticity", "Sending credit card numbers to an online merchant over the Internet", "Storing user passwords in a system password file", "Transmitting a newly generated secret session key to a communication partner over an untrusted network"], "w": ["Correct. The other two are a heavily loaded side that checks authenticity selectively, and authenticating a computer program in plaintext so it can run without being decrypted.", "Credit card numbers need confidentiality.", "Password storage uses hashing, which is a different discussion.", "Session keys need confidentiality."], "r": "\u00a72.2 Message Authentication without Message Encryption"}, {"id": "2-27", "ch": 2, "sec": "2.2", "q": "A message authentication code (MAC) is computed as:", "o": ["A function of the message and a shared secret key: MAC = F(K_AB, M)", "A hash of the message with no key", "The full message encrypted with the sender's private key, like a signature", "A random number appended to the message"], "w": ["Correct. A MAC is a small block of data generated using a secret key shared by A and B.", "An unkeyed hash is a one-way hash function, not a MAC.", "Encrypting with a private key relates to digital signatures.", "A MAC depends on both message and key; it isn't random."], "r": "\u00a72.2 Message Authentication Code"}, {"id": "2-28", "ch": 2, "sec": "2.2", "q": "If the received MAC matches the receiver's calculated MAC, which assurance is NOT provided?", "o": ["That the message contents were kept confidential", "That the message has not been altered", "That the message is from the alleged sender", "That the sequence is proper, if the message includes a sequence number"], "w": ["Correct. A MAC provides authentication, not confidentiality. The message can be sent in the clear.", "This IS assured: an attacker can't alter the code to match an altered message without the key.", "This IS assured: no one else knows the secret key.", "This IS assured when a sequence number (as in X.25, HDLC, TCP) is included."], "r": "\u00a72.2 Message Authentication Code"}, {"id": "2-29", "ch": 2, "sec": "2.2", "q": "How does a MAC authentication algorithm differ from an encryption algorithm?", "o": ["It need not be reversible", "It must be reversible", "It never uses a key", "It always produces output longer than the message"], "w": ["Correct. Because it need not be reversible, its mathematical properties make it less vulnerable to being broken than encryption.", "Reversibility is required for decryption, not for MACs.", "MACs use a secret key.", "MACs are small, fixed-size blocks."], "r": "\u00a72.2 Message Authentication Code"}, {"id": "2-30", "ch": 2, "sec": "2.2", "q": "According to the textbook, which mode is now recommended for generating a MAC with a block cipher, replacing the older CBC approach?", "o": ["Cipher-based Message Authentication Code (CMAC)", "Electronic codebook (ECB) mode, using AES instead of DES", "Keystream mode, combining the message with a pseudorandom stream", "Diffie-Hellman mode, deriving the MAC from a shared secret"], "w": ["Correct. CMAC and newer, more secure modes are recommended, with AES preferred over DES.", "ECB is not recommended, especially for authentication.", "'Keystream mode' is not a term the text uses.", "Diffie-Hellman is key agreement."], "r": "\u00a72.2 Message Authentication Code"}, {"id": "2-31", "ch": 2, "sec": "2.2", "q": "A one-way hash function differs from a MAC in that the hash function:", "o": ["Does not take a secret key as input", "Produces variable-size output", "Must be reversible", "Requires public-key encryption"], "w": ["Correct. A hash function takes a variable-size message M and produces a fixed-size digest H(M) without a key.", "Hash output is FIXED-size.", "Hashes are one-way, meaning not reversible.", "Hashes can be used with or without encryption."], "r": "\u00a72.2 One-Way Hash Function"}, {"id": "2-32", "ch": 2, "sec": "2.2", "q": "Why does hash padding include the length of the original message in bits?", "o": ["It is a security measure that makes it harder to produce an alternative message with the same hash value", "It makes the hash function reversible, so the receiver can recover the original message", "It encrypts the message contents, so that the hash also provides confidentiality", "It reduces the size of the hash output when the original message is very long"], "w": ["Correct. The length field increases the difficulty of finding another message with the same hash.", "Hashes are one-way, and padding doesn't change that.", "Padding doesn't encrypt anything.", "Output size is fixed regardless of padding."], "r": "\u00a72.2 One-Way Hash Function; Figure 2.4"}, {"id": "2-33", "ch": 2, "sec": "2.2", "q": "Figure 2.5 shows three ways to authenticate a message with a hash. Which approach avoids encryption altogether?", "o": ["Using a secret value (keyed hash MAC)", "Encrypting the digest with symmetric encryption", "Encrypting the digest with public-key encryption", "Encrypting the whole message with AES"], "w": ["Correct. In Figure 2.5c, A and B share secret K and compute MD = H(K || M || K). The secret key itself is never sent.", "Figure 2.5a encrypts the digest symmetrically.", "Figure 2.5b encrypts the digest with public-key encryption.", "Encrypting the whole message isn't one of the three Figure 2.5 schemes."], "r": "\u00a72.2 Figure 2.5"}, {"id": "2-34", "ch": 2, "sec": "2.2", "q": "What two advantages does the public-key approach (Figure 2.5b) to authenticating a hash have?", "o": ["It provides a digital signature too, and it needs no key distribution to the parties", "It is faster than any symmetric approach, and it also provides confidentiality for the message", "It needs no hash function and no key, because the public key authenticates the message itself", "It eliminates the need for certificates, because the public key is sent along with the message"], "w": ["Correct. The text names these two advantages.", "Public-key operations are computationally heavier, and this scheme doesn't encrypt the message.", "A hash and a key pair are both used.", "Certificates remain useful for trusting public keys."], "r": "\u00a72.2 One-Way Hash Function"}, {"id": "2-35", "ch": 2, "sec": "2.2", "q": "Which is NOT one of the reasons [TSUD92] gives for interest in authentication techniques that avoid encryption?", "o": ["Encryption algorithms cannot provide integrity", "Encryption software is quite slow", "Encryption hardware costs are nonnegligible", "An encryption algorithm may be protected by a patent"], "w": ["Correct. This isn't one of the listed reasons. The four are slow software, nonnegligible hardware costs, hardware optimized for large data sizes, and patents.", "Slow encryption software IS a listed reason.", "Nonnegligible hardware cost IS a listed reason.", "Patent protection IS a listed reason."], "r": "\u00a72.2 One-Way Hash Function"}, {"id": "2-36", "ch": 2, "sec": "2.2", "q": "In the keyed-hash scheme of Figure 2.5c, why is the secret key used as BOTH a prefix and a suffix?", "o": ["Using it as only a prefix or only a suffix makes the scheme less secure", "It doubles the length of the hash output, making brute-force attacks harder", "It provides confidentiality for the message, since the key surrounds the plaintext", "It is required so that the receiver can verify the hash with a public key"], "w": ["Correct. The text notes that prefix-only or suffix-only is less secure. HMAC (Chapter 21) is the standard keyed-hash approach.", "Output length is fixed by the hash function.", "The message is sent in the clear.", "No public keys are involved."], "r": "\u00a72.2 Figure 2.5c"}, {"id": "2-37", "ch": 2, "sec": "2.2", "q": "A hash function where, for any given code h, it is computationally infeasible to find x such that H(x) = h, is called:", "o": ["One-way or preimage resistant", "Second preimage resistant", "Collision resistant", "Weak hash function"], "w": ["Correct. This is property 4, the one-way property.", "Second preimage resistance (property 5) means that given x, you can't find y \u2260 x with H(y) = H(x).", "Collision resistance (property 6) means you can't find ANY pair with the same hash.", "A weak hash satisfies properties 1\u20135. It is not a name for property 4."], "r": "\u00a72.2 Hash Function Requirements"}, {"id": "2-38", "ch": 2, "sec": "2.2", "q": "For any given block x, it is computationally infeasible to find y \u2260 x with H(y) = H(x). This property is called:", "o": ["Second preimage resistant (weak collision resistant)", "Strong collision resistant (collision resistant)", "Preimage resistant (one-way)", "Pseudorandom (unpredictable output)"], "w": ["Correct. This is property 5, also known as weak collision resistance.", "Strong collision resistance (property 6) involves ANY pair, with x not given.", "Preimage resistance means going from a code h back to an x.", "Pseudorandomness is a property of number generators."], "r": "\u00a72.2 Hash Function Requirements"}, {"id": "2-39", "ch": 2, "sec": "2.2", "q": "A hash function that satisfies all six properties, including collision resistance, is referred to as a:", "o": ["Strong hash function", "Weak hash function", "Keyed hash function", "One-time pad"], "w": ["Correct. If the sixth property is also satisfied, it's a strong hash function.", "A weak hash satisfies only the first five properties.", "A keyed hash is the MAC technique, not a property class.", "A one-time pad is unrelated."], "r": "\u00a72.2 Hash Function Requirements"}, {"id": "2-40", "ch": 2, "sec": "2.2", "q": "Bob finds two messages with the same hash: one requiring Alice to pay a small amount, one a large amount. Alice signs the first, and Bob claims the second is authentic. Which property would have prevented this?", "o": ["Collision resistance (strong collision resistance)", "Preimage resistance (the one-way property)", "Variable-length input (applies to data of any size)", "Ease of computation (practical to implement)"], "w": ["Correct. A strong hash function protects against attacks where one party generates the message for another to sign. This is the book's IOU example.", "Preimage resistance prevents inverting a hash. Here Bob only needs ANY colliding pair.", "Accepting any input size is a practical requirement, not a security one.", "Easy computation is a practical requirement."], "r": "\u00a72.2 Hash Function Requirements"}, {"id": "2-41", "ch": 2, "sec": "2.2", "q": "The fourth (one-way) property is especially important when the authentication technique involves:", "o": ["A secret value (Figure 2.5c); a reversible hash would let an attacker recover it", "Encrypting the message digest with public-key encryption (Figure 2.5b)", "Encrypting the entire message along with its hash code using AES", "Broadcasting the message in plaintext to many destinations at once"], "w": ["Correct. If the hash weren't one-way, an attacker could invert MD = H(K || M || K) and, knowing M, trivially recover K.", "The fifth property is what matters most for encrypted hash codes (Figures 2.5a and b).", "Whole-message encryption isn't the scenario the text discusses.", "Broadcasting isn't the scenario the text discusses."], "r": "\u00a72.2 Hash Function Requirements"}, {"id": "2-42", "ch": 2, "sec": "2.2", "q": "For a hash code of length n, the brute-force effort to find a collision is proportional to:", "o": ["2^(n/2)", "2^n", "n\u00b2", "2^(2n)"], "w": ["Correct. Collision resistance has effort 2^(n/2), so 2^(n/2) determines the hash code's strength when collision resistance is required.", "2^n is the effort for preimage and second preimage resistance.", "n\u00b2 is not one of the effort levels given.", "2^(2n) is not one of the effort levels given."], "r": "\u00a72.2 Security of Hash Functions"}, {"id": "2-43", "ch": 2, "sec": "2.2", "q": "The strength of a hash function against brute-force attacks depends solely on:", "o": ["The length of the hash code produced", "The secrecy of the algorithm", "The length of the input message", "The speed of the hashing hardware"], "w": ["Correct. Strength depends solely on hash code length n.", "Open design: hash algorithms like SHA are public.", "Inputs can be any length; the output length matters.", "Attacker speed affects time, but strength is determined by code length."], "r": "\u00a72.2 Security of Hash Functions"}, {"id": "2-44", "ch": 2, "sec": "2.2", "q": "Van Oorschot and Wiener designed a $10 million collision search machine for MD5 that could find a collision in 24 days. What is MD5's hash length?", "o": ["128 bits", "160 bits", "256 bits", "512 bits"], "w": ["Correct. A 128-bit code may therefore be viewed as inadequate.", "160 bits is SHA-1. The same machine would need over 4,000 years.", "256 bits is SHA-256.", "512 bits is SHA-512."], "r": "\u00a72.2 Security of Hash Functions"}, {"id": "2-45", "ch": 2, "sec": "2.2", "q": "SHA-1, issued as FIPS 180-1 in 1995, produces a hash value of:", "o": ["160 bits", "128 bits", "256 bits", "512 bits"], "w": ["Correct. SHA-1 produces 160-bit hashes.", "128 bits is MD5.", "256 bits is SHA-256, part of SHA-2.", "512 bits is SHA-512."], "r": "\u00a72.2 Secure Hash Function Algorithms"}, {"id": "2-46", "ch": 2, "sec": "2.2", "q": "Which hash lengths were defined in FIPS 180-2 (2002), collectively known as SHA-2?", "o": ["256, 384, and 512 bits", "128, 160, and 256 bits", "160, 224, and 256 bits", "512, 1024, and 2048 bits"], "w": ["Correct. SHA-256, SHA-384, and SHA-512 are collectively SHA-2.", "128 is MD5 and 160 is SHA-1.", "This doesn't match the text's list.", "These aren't SHA-2 output lengths."], "r": "\u00a72.2 Secure Hash Function Algorithms"}, {"id": "2-47", "ch": 2, "sec": "2.2", "q": "Why did NIST standardize SHA-3 (published 2015)?", "o": ["Because of SHA-2's structural similarity to SHA-1, NIST wanted a very different alternative", "Because SHA-2 had been broken by practical collision attacks shortly after release", "Because SHA-2 was too slow to be practical for any real-world application", "Because SHA-2 offered no 512-bit version, which high-security uses required"], "w": ["Correct. SHA-2, especially the 512-bit version, appeared to provide 'unassailable security,' but its similarity to SHA-1 led NIST to standardize a structurally different function.", "The book does not say SHA-2 was broken.", "Speed is not the stated reason.", "SHA-2 includes SHA-512."], "r": "\u00a72.2 Secure Hash Function Algorithms"}, {"id": "2-48", "ch": 2, "sec": "2.2", "q": "Storing H(F) for each file on a write-locked drive and later recomputing it to detect modification is an application of hash functions for:", "o": ["Intrusion detection, requiring weak second preimage resistance", "One-way password storage, requiring strong collision resistance", "Digital envelopes", "Key exchange"], "w": ["Correct. An intruder would need to change F without changing H(F).", "Password storage requires preimage resistance and perhaps second preimage resistance.", "Digital envelopes use public-key encryption of a symmetric key.", "Key exchange is not a hash application here."], "r": "\u00a72.2 Other Applications of Hash Functions"}, {"id": "2-49", "ch": 2, "sec": "2.2", "q": "Storing a hash of each password instead of the password itself requires which hash properties, according to the text?", "o": ["Preimage resistance and perhaps second preimage resistance", "Only collision resistance, since two users might choose the same password", "Reversibility, so the system can recover a password the user forgets", "Variable-length output, so longer passwords produce longer hashes"], "w": ["Correct. An attacker who gains the password file must not be able to recover the actual password from the hashes.", "The text names preimage resistance (and perhaps second preimage), not collision resistance.", "Reversibility would defeat the purpose.", "Hash outputs are fixed-length."], "r": "\u00a72.2 Other Applications of Hash Functions"}, {"id": "2-50", "ch": 2, "sec": "2.3", "q": "Public-key encryption was first publicly proposed by:", "o": ["Diffie and Hellman in 1976", "Rivest, Shamir, and Adleman in 1977", "NIST in 1977", "Rijndael in 2001"], "w": ["Correct. The book describes Diffie and Hellman's 1976 paper [DIFF76] as the first truly revolutionary advance in encryption in thousands of years.", "RSA (1977, published 1978) was one of the first public-key SCHEMES, but it came after Diffie-Hellman's proposal.", "NIST adopted DES in 1977.", "Rijndael is the AES algorithm."], "r": "\u00a72.3 Public-Key Encryption Structure"}, {"id": "2-51", "ch": 2, "sec": "2.3", "q": "Which statement does the textbook identify as a MISCONCEPTION about public-key encryption?", "o": ["Public-key encryption is more secure from cryptanalysis than symmetric encryption", "Security depends on key length and on the computational work to break the cipher", "Symmetric encryption is unlikely to be abandoned", "Public-key distribution requires some form of protocol"], "w": ["Correct. Nothing in principle makes either type superior at resisting cryptanalysis.", "This is TRUE per the text: security depends on (1) key length and (2) the computational work involved.", "This is TRUE: public-key overhead means symmetric encryption won't be abandoned.", "This is TRUE: the procedures are no simpler than for symmetric key distribution."], "r": "\u00a72.3 Public-Key Encryption Structure"}, {"id": "2-52", "ch": 2, "sec": "2.3", "q": "Public-key algorithms are based on:", "o": ["Mathematical functions rather than simple operations on bit patterns", "Substitutions and permutations performed on fixed-size blocks of bits", "A single shared secret key known to both sender and receiver", "Hash collisions that are computationally infeasible to find"], "w": ["Correct. This contrasts with the bit-pattern operations of symmetric algorithms.", "Bit-pattern substitutions and transformations characterize symmetric ciphers.", "Public-key systems use a key pair, not one shared secret.", "Hash collisions are a weakness, not a foundation."], "r": "\u00a72.3 Public-Key Encryption Structure"}, {"id": "2-53", "ch": 2, "sec": "2.3", "q": "How many ingredients does a public-key encryption scheme have, per the textbook?", "o": ["Six", "Five", "Four", "Seven"], "w": ["Correct. The six are plaintext, encryption algorithm, public key, private key, ciphertext, and decryption algorithm.", "Five is the count for SYMMETRIC encryption.", "Four is too few.", "Seven is too many."], "r": "\u00a72.3 Figure 2.6"}, {"id": "2-54", "ch": 2, "sec": "2.3", "q": "Bob wants to send Alice a private message using public-key encryption. Which key does Bob use to encrypt?", "o": ["Alice's public key", "Alice's private key", "Bob's private key", "Bob's public key"], "w": ["Correct. Only Alice, who holds the matching private key, can decrypt it, which provides confidentiality (Figure 2.6a).", "Only Alice knows her private key.", "Encrypting with Bob's private key provides authentication, not confidentiality (Figure 2.6b).", "Then only Bob could decrypt it."], "r": "\u00a72.3 Figure 2.6a"}, {"id": "2-55", "ch": 2, "sec": "2.3", "q": "A user encrypts data using their OWN private key so that anyone with the corresponding public key can decrypt it. This scheme is directed toward:", "o": ["Authentication and/or data integrity", "Confidentiality of the encrypted data", "Key secrecy", "Availability"], "w": ["Correct. Only Bob could have encrypted the plaintext, so this provides authentication (Figure 2.6b).", "Anyone with the public key can decrypt, so there is no confidentiality.", "Not the purpose described.", "Not related."], "r": "\u00a72.3 Figure 2.6b"}, {"id": "2-56", "ch": 2, "sec": "2.3", "q": "The textbook classifies the use of public-key cryptosystems into which three categories?", "o": ["Digital signature, symmetric key distribution, and encryption of secret keys", "Hashing messages, signing documents, and compressing data before transmission", "Confidentiality, integrity, and availability of stored information", "Block encryption, stream encryption, and hybrid encryption of messages"], "w": ["Correct. These are the three categories of use.", "Hashing and compression are not public-key uses.", "These are security objectives.", "These are cipher types."], "r": "\u00a72.3 Applications for Public-Key Cryptosystems"}, {"id": "2-57", "ch": 2, "sec": "2.3", "q": "According to Table 2.3, which algorithm can be used ONLY for key exchange?", "o": ["Diffie-Hellman", "RSA", "Elliptic Curve Cryptography", "DSS"], "w": ["Correct. Diffie-Hellman: encryption/decryption No, digital signature No, key exchange Yes.", "RSA supports all three uses.", "ECC supports all three uses.", "DSS supports ONLY digital signatures."], "r": "\u00a72.3 Table 2.3"}, {"id": "2-58", "ch": 2, "sec": "2.3", "q": "According to Table 2.3, which algorithm supports ONLY digital signatures?", "o": ["DSS", "Diffie-Hellman", "RSA", "Elliptic Curve Cryptography"], "w": ["Correct. Unlike RSA, DSS cannot be used for encryption or key exchange.", "DH supports only key exchange.", "RSA supports all three uses.", "ECC supports all three uses."], "r": "\u00a72.3 Table 2.3"}, {"id": "2-59", "ch": 2, "sec": "2.3", "q": "Which of Diffie and Hellman's requirements for public-key cryptography is described as useful but NOT necessary for all applications?", "o": ["Either of the two related keys can be used for encryption, with the other used for decryption", "It is computationally infeasible to determine the private key from the public key", "It is computationally easy for B to generate a key pair", "It is computationally infeasible to recover M from the public key and ciphertext"], "w": ["Correct. This is the 'sixth requirement,' useful but not necessary for all public-key applications.", "This is requirement 4, which is necessary.", "This is requirement 1, which is necessary.", "This is requirement 5, which is necessary."], "r": "\u00a72.3 Requirements for Public-Key Cryptography"}, {"id": "2-60", "ch": 2, "sec": "2.3", "q": "RSA is a block cipher in which the plaintext and ciphertext are:", "o": ["Integers between 0 and n \u2212 1 for some n", "64-bit blocks", "Streams of bytes", "Points on an elliptic curve over a field"], "w": ["Correct. RSA was developed in 1977 by Rivest, Shamir, and Adleman at MIT.", "64-bit blocks belong to DES.", "Byte streams belong to stream ciphers.", "Points on a curve belong to ECC."], "r": "\u00a72.3 RSA"}, {"id": "2-61", "ch": 2, "sec": "2.3", "q": "In 1994, RSA's Scientific American challenge (a key size of 129 decimal digits, around 428 bits) was broken after 8 months by a group using over 1600 computers. What does the textbook conclude?", "o": ["This doesn't invalidate RSA; it means larger key sizes must be used", "The result shows that RSA is fundamentally broken and should no longer be used", "The result shows that RSA should be replaced by DES for most applications", "The result shows that public-key encryption in general cannot be made secure"], "w": ["Correct. The book states that a 1024-bit key size (about 300 decimal digits) is considered strong enough for virtually all applications.", "The book explicitly says the result does not invalidate RSA.", "DES is weaker and symmetric.", "No such conclusion is drawn."], "r": "\u00a72.3 RSA"}, {"id": "2-62", "ch": 2, "sec": "2.3", "q": "The purpose of the Diffie-Hellman algorithm is to:", "o": ["Enable two users to securely reach agreement about a shared secret for subsequent symmetric encryption", "Encrypt long messages directly with public keys, without the two users first agreeing on a symmetric key", "Create digital signatures that the receiver verifies with a public key", "Generate fixed-length hash values for message authentication"], "w": ["Correct. The algorithm itself is limited to the exchange of keys.", "Diffie-Hellman does not encrypt messages.", "DH can't do signatures (Table 2.3).", "Not a hash function."], "r": "\u00a72.3 Diffie-Hellman Key Agreement"}, {"id": "2-63", "ch": 2, "sec": "2.3", "q": "What is the drawback of Diffie-Hellman key exchange in its simplest form?", "o": ["It provides no authentication of the two communicating partners", "It cannot produce a shared secret unless both users already share a key", "It requires a 56-bit key, which is too short to resist brute force", "It only works for digital signatures, not for exchanging keys"], "w": ["Correct. Variations of Diffie-Hellman and other protocols overcome this drawback.", "It does produce a shared secret.", "No such requirement exists.", "DH is for key exchange only."], "r": "\u00a72.4 Symmetric Key Exchange Using Public-Key Encryption"}, {"id": "2-64", "ch": 2, "sec": "2.3", "q": "The Digital Signature Standard (DSS), originally FIPS 186, makes use of which hash function and presents which signature technique?", "o": ["SHA-1; the Digital Signature Algorithm (DSA)", "MD5; the RSA digital signature algorithm", "SHA-3; the Elliptic Curve Digital Signature Algorithm", "SHA-256; the Diffie-Hellman key agreement"], "w": ["Correct. DSS uses SHA-1 and presents the DSA.", "MD5 and RSA aren't what the original DSS specified.", "SHA-3 came in 2015, and ECDSA was added later in FIPS 186-4.", "Diffie-Hellman is key exchange, not a signature technique."], "r": "\u00a72.3 Digital Signature Standard"}, {"id": "2-65", "ch": 2, "sec": "2.3", "q": "What is the principal attraction of elliptic curve cryptography (ECC) compared with RSA?", "o": ["It appears to offer equal security for a far smaller bit size, reducing processing overhead", "It has been studied longer than RSA, so confidence in its security is higher", "It can only be used for key exchange, which keeps its implementation simple", "It needs no private key, which removes the key management burden"], "w": ["Correct. The book also notes that confidence in ECC is not yet as high as in RSA.", "It's the reverse: ECC has had LESS sustained cryptanalytic scrutiny.", "ECC supports all three uses in Table 2.3.", "ECC is public-key, so it has a key pair."], "r": "\u00a72.3 Elliptic Curve Cryptography"}, {"id": "2-66", "ch": 2, "sec": "2.3", "q": "ECC is showing up in standardization efforts including which standard for public-key cryptography?", "o": ["IEEE P1363", "FIPS 46", "X.509", "ANSI X9.17"], "w": ["Correct. IEEE P1363 is the Standard for Public-Key Cryptography.", "FIPS 46 is DES.", "X.509 is the public-key certificate format.", "ANSI X9.17 first standardized 3DES in 1985."], "r": "\u00a72.3 Elliptic Curve Cryptography"}, {"id": "2-67", "ch": 2, "sec": "2.4", "q": "NIST FIPS 186-4 defines a digital signature as the result of a cryptographic transformation of data that provides a mechanism for verifying:", "o": ["Origin authentication, data integrity, and signatory non-repudiation", "Confidentiality, integrity, and availability of the signed data", "Key exchange, message encryption, and message hashing", "Randomness and unpredictability of the signature value"], "w": ["Correct. This is the FIPS 186-4 definition quoted in the text.", "A digital signature doesn't provide confidentiality, and these three are the CIA triad.", "These are other crypto functions.", "These are random number requirements."], "r": "\u00a72.4 Digital Signature"}, {"id": "2-68", "ch": 2, "sec": "2.4", "q": "FIPS 186-4 specifies three digital signature algorithms. Which one is based on the difficulty of computing discrete logarithms?", "o": ["Digital Signature Algorithm (DSA)", "RSA Digital Signature Algorithm", "Elliptic Curve Digital Signature Algorithm (ECDSA)", "HMAC"], "w": ["Correct. DSA is the original NIST-approved algorithm and is based on discrete logarithms.", "The RSA DSA is based on the RSA public-key algorithm.", "ECDSA is based on elliptic-curve cryptography.", "HMAC is a keyed hash MAC, not a signature algorithm."], "r": "\u00a72.4 Digital Signature"}, {"id": "2-69", "ch": 2, "sec": "2.4", "q": "In Figure 2.7, Bob signs a message. What are the inputs to the digital signature GENERATION algorithm?", "o": ["The hash value of the message and Bob's private key", "The full message and Alice's public key", "The hash value of the message and Bob's own public key", "The message and a shared secret key"], "w": ["Correct. Bob hashes the message (e.g., SHA-512), then uses the hash and his private key to produce a short signature block.", "Alice's public key would be used for encryption to Alice, not for Bob's signature.", "Bob's PUBLIC key is used by Alice for VERIFICATION.", "A shared secret key is MAC territory."], "r": "\u00a72.4 Figure 2.7"}, {"id": "2-70", "ch": 2, "sec": "2.4", "q": "When Alice verifies Bob's signature, she provides which inputs to the verification algorithm?", "o": ["The hash value she calculates for the message and Bob's public key", "Bob's private key and the signature attached to the message", "Her own private key and the message she received from Bob", "The CA's private key and the hash value of the message"], "w": ["Correct. If the algorithm returns 'valid,' the message must have been signed by Bob.", "Alice does not have Bob's private key.", "Alice's own keys aren't used to verify Bob's signature.", "The CA's PRIVATE key is used to sign certificates, not for this verification."], "r": "\u00a72.4 Figure 2.7"}, {"id": "2-71", "ch": 2, "sec": "2.4", "q": "Which service does a digital signature NOT provide?", "o": ["Confidentiality", "Source authentication", "Data integrity", "Non-repudiation"], "w": ["Correct. The message is safe from alteration but NOT from eavesdropping. Even if the whole message is 'encrypted' with the private key, anyone can decrypt it with the public key.", "Source authentication IS provided, because only Bob has his private key.", "Data integrity IS provided, because the message can't be altered without Bob's private key.", "Non-repudiation IS provided, because the signer cannot repudiate the signature."], "r": "\u00a72.4 Digital Signature"}, {"id": "2-72", "ch": 2, "sec": "2.4", "q": "Which is NOT one of the three aspects of using public-key encryption for key management and distribution?", "o": ["The use of public-key encryption to compress messages", "The secure distribution of public keys", "The use of public-key encryption to distribute secret keys", "The use of public-key encryption to create temporary keys for message encryption"], "w": ["Correct. Compression is not one of the aspects listed.", "Secure distribution of public keys IS one of the three aspects.", "Using public-key encryption to distribute secret keys IS one of the three aspects.", "Creating temporary keys for message encryption IS one of the three aspects."], "r": "\u00a72.4 Digital Signatures and Key Management"}, {"id": "2-73", "ch": 2, "sec": "2.4", "q": "What major weakness does a public-key certificate solve?", "o": ["Anyone can forge a public announcement of a public key, pretending to be another user", "Public keys are too long to transmit reliably over ordinary networks", "Private keys must otherwise be shared with every communicating party", "Hash functions are not collision resistant enough to protect public keys"], "w": ["Correct. A forger posing as Bob could read messages meant for Bob until the forgery is discovered. Certificates bind a key to an ID with a trusted signature.", "Length isn't the issue.", "Private keys are never shared.", "This is unrelated to certificates."], "r": "\u00a72.4 Public-Key Certificates"}, {"id": "2-74", "ch": 2, "sec": "2.4", "q": "In essence, a public-key certificate consists of:", "o": ["A public key plus a user ID of the key owner, with the whole block signed by a trusted third party", "The owner's private key, encrypted with a password chosen by the owner and stored in a trusted directory", "A symmetric session key encrypted with the receiver's public key", "A hash of the owner's password, signed by the owner's private key"], "w": ["Correct. It also includes information about the third party (usually a certificate authority, CA) and a validity period.", "Private keys are never placed in certificates.", "That describes a digital envelope.", "That relates to password storage."], "r": "\u00a72.4 Public-Key Certificates"}, {"id": "2-75", "ch": 2, "sec": "2.4", "q": "To create a certificate's signature, the CA:", "o": ["Hashes the unsigned certificate and generates a signature using the CA's private key", "Encrypts the user's private key with the CA's public key and returns it", "Hashes the user's password and appends it to the unsigned certificate", "Signs the certificate with the user's private key, supplied during registration"], "w": ["Correct. The CA computes the hash code of the unsigned certificate, then signs it with its private key and a signature generation algorithm.", "Private keys are never sent to the CA.", "Passwords are not part of this process.", "The CA uses ITS OWN private key."], "r": "\u00a72.4 Figure 2.8 steps"}, {"id": "2-76", "ch": 2, "sec": "2.4", "q": "How does any user verify that a certificate is valid?", "o": ["Calculate the hash of the certificate (excluding the signature) and verify the signature using the CA's public key", "Decrypt the certificate with the user's own private key and check the user ID", "Ask the certificate owner to send their private key, then check that it matches the public key in the certificate", "Recompute the certificate using a shared secret key previously agreed with the CA"], "w": ["Correct. The verification algorithm returns 'signature valid' or 'invalid.'", "The user's own private key isn't involved.", "Private keys are never revealed.", "No shared secret is involved."], "r": "\u00a72.4 Figure 2.8 step 8"}, {"id": "2-77", "ch": 2, "sec": "2.4", "q": "Which scheme has become universally accepted for formatting public-key certificates?", "o": ["X.509", "FIPS 186", "RFC 4949", "ANSI X9.17"], "w": ["Correct. X.509 is used in IPsec, TLS, SSH, and S/MIME.", "FIPS 186 is the Digital Signature Standard.", "RFC 4949 is the Internet Security Glossary.", "ANSI X9.17 first standardized 3DES."], "r": "\u00a72.4 Public-Key Certificates"}, {"id": "2-78", "ch": 2, "sec": "2.4", "q": "Which of the following network security applications is listed as using X.509 certificates?", "o": ["Transport Layer Security (TLS)", "Electronic codebook mode", "Diffie-Hellman in its simplest form", "LavaRnd"], "w": ["Correct. IPsec, TLS, SSH, and S/MIME are listed.", "ECB is a block cipher mode.", "Simple DH has no authentication, so no certificates are used.", "LavaRnd is a random number project."], "r": "\u00a72.4 Public-Key Certificates"}, {"id": "2-79", "ch": 2, "sec": "2.4", "q": "A digital envelope is described as the equivalent of:", "o": ["A sealed envelope containing an unsigned letter", "A signed postcard that anyone handling it can read", "A notarized document whose signature has been witnessed", "A locked safe that opens only with a combination"], "w": ["Correct. It provides confidentiality (sealed) but no signature (unsigned).", "A signed postcard would be authenticated but not confidential, which is the opposite.", "Not the book's analogy.", "Not the book's analogy."], "r": "\u00a72.4 Digital Envelopes"}, {"id": "2-80", "ch": 2, "sec": "2.4", "q": "To create a digital envelope for Alice, Bob encrypts the message with a one-time symmetric key, and then:", "o": ["Encrypts the one-time key with Alice's public key and attaches it to the encrypted message", "Encrypts the one-time key with his own private key and attaches it to the message", "Sends the one-time key in the clear in a separate message to Alice", "Hashes the one-time key and attaches the hash value to the encrypted message"], "w": ["Correct. Only Alice can decrypt the one-time key, and therefore the message.", "Bob's private key would let anyone with his public key recover the key.", "Sending the key in the clear defeats the purpose.", "A hash can't be reversed to recover the key."], "r": "\u00a72.4 Figure 2.9"}, {"id": "2-81", "ch": 2, "sec": "2.4", "q": "In 2016 NIST started a project to standardize algorithms resistant to quantum-computer attacks. In NISTIR 8413 (July 2022), how many algorithms were first selected?", "o": ["Four: one for key exchange and three for digital signatures", "Two: one for public-key encryption and one for hash functions", "Five finalists for a single standard", "Three: all for key exchange"], "w": ["Correct. The process continues, with more algorithms likely to be selected.", "This doesn't match the text.", "Five finalists describes the AES competition's second round.", "This doesn't match the text."], "r": "\u00a72.4 Digital Envelopes (post-quantum note)"}, {"id": "2-82", "ch": 2, "sec": "2.5", "q": "Which is NOT a listed use of random numbers in cryptographic network security algorithms?", "o": ["Producing the fixed-length output of a hash function", "Generation of keys for RSA", "Generation of a stream key for a symmetric stream cipher", "Handshaking to prevent replay attacks in key distribution scenarios like Kerberos"], "w": ["Correct. Hash output is deterministic, so this is not a random-number use.", "Generating RSA keys IS a listed use.", "Generating stream keys IS a listed use.", "Handshaking to prevent replay in schemes like Kerberos IS a listed use."], "r": "\u00a72.5 The Use of Random Numbers"}, {"id": "2-83", "ch": 2, "sec": "2.5", "q": "The two criteria used to validate that a sequence of numbers is random are:", "o": ["Uniform distribution and independence", "Unpredictability and secrecy", "Length and entropy", "Determinism and repeatability of output"], "w": ["Correct. Uniform distribution means each number occurs with roughly equal frequency, and independence means no value can be inferred from the others.", "Unpredictability is a separate requirement, distinct from statistical randomness.", "These are not the two criteria in the text.", "These describe PRNG algorithms, not randomness criteria."], "r": "\u00a72.5 Randomness"}, {"id": "2-84", "ch": 2, "sec": "2.5", "q": "What does the textbook say about testing for independence in a random sequence?", "o": ["There is no test to 'prove' independence; tests can only show when a sequence does NOT exhibit independence", "A single well-designed statistical test is sufficient to prove independence", "Independence is tested the same way as uniform distribution, by counting how often each value occurs in the sequence", "Independence cannot be tested at all, so it must simply be assumed"], "w": ["Correct. The strategy is to apply many tests until confidence is sufficiently strong.", "No test PROVES independence.", "Well-defined tests exist for distribution, but not to prove independence.", "Tests can demonstrate a LACK of independence."], "r": "\u00a72.5 Randomness"}, {"id": "2-85", "ch": 2, "sec": "2.5", "q": "In applications such as reciprocal authentication and session key generation, the key requirement is that random numbers be:", "o": ["Unpredictable", "Uniformly distributed only", "Short", "Reusable"], "w": ["Correct. Successive members of the sequence must be unpredictable, so an opponent can't predict future elements from earlier ones.", "Statistical randomness alone is not the key requirement here.", "Length isn't the requirement.", "Reuse is not the requirement."], "r": "\u00a72.5 Unpredictability"}, {"id": "2-86", "ch": 2, "sec": "2.5", "q": "Using a sequence of randomly chosen integers as input to simple computations to test whether a large number is prime with near certainty is an approach known as:", "o": ["Randomization", "Brute force", "Cryptanalysis", "Key stretching"], "w": ["Correct. When a problem is too hard to solve exactly, a randomized approach gives an answer with any desired level of confidence.", "Brute force would divide N by every odd integer less than \u221aN.", "Cryptanalysis means attacking ciphers.", "Key stretching is not discussed here."], "r": "\u00a72.5 Randomness"}, {"id": "2-87", "ch": 2, "sec": "2.5", "q": "Numbers produced by deterministic algorithms that pass many reasonable tests of randomness are called:", "o": ["Pseudorandom numbers", "True random numbers", "Nonces", "Keystreams"], "w": ["Correct. Pseudorandom numbers come from deterministic algorithms and so aren't statistically random, but good algorithms pass many tests.", "True random numbers come from a nondeterministic source (TRNG).", "'Nonce' is not the term the text uses for this.", "A keystream is a specific USE of pseudorandom output."], "r": "\u00a72.5 Random versus Pseudorandom"}, {"id": "2-88", "ch": 2, "sec": "2.5", "q": "A true random number generator (TRNG) differs from a PRNG because it:", "o": ["Uses a nondeterministic source, such as measuring unpredictable natural processes", "Uses a longer seed value so its output repeats less often than a PRNG's", "Runs a deterministic algorithm faster, producing more bits per second than a PRNG", "Uses a cryptographic hash function to make each output value unpredictable"], "w": ["Correct. Examples include ionizing radiation pulse detectors, gas discharge tubes, leaky capacitors, and Intel's thermal-noise chip.", "Seeds belong to PRNGs.", "Deterministic algorithms are PRNGs.", "Not the distinguishing feature."], "r": "\u00a72.5 Random versus Pseudorandom"}, {"id": "2-89", "ch": 2, "sec": "2.5", "q": "LavaRnd produces truly random numbers using:", "o": ["A saturated charge-coupled device (CCD) in a light-tight can as a chaotic source", "Thermal noise measured across undriven resistors on a dedicated chip", "Pulse detectors that count ionizing radiation events", "A deterministic algorithm seeded by the system clock and open source code"], "w": ["Correct. LavaRnd is an open source project using inexpensive cameras and hardware.", "Thermal noise across undriven resistors is Intel's chip [JUN99].", "Radiation detectors are another TRNG example, but not LavaRnd.", "A deterministic algorithm would make it a PRNG."], "r": "\u00a72.5 Random versus Pseudorandom"}, {"id": "2-90", "ch": 2, "sec": "2.5", "q": "What is notable about the Intel digital random number generator (DRNG), offered on multicore chips since May 2012?", "o": ["It is the first commercially available TRNG achieving bit rates comparable with PRNGs", "It is a deterministic PRNG built into the processor's instruction set", "It was the first open-source TRNG, built from inexpensive cameras", "It replaced AES as the standard for encrypting data on multicore chips"], "w": ["Correct. The book describes it as the first commercially available TRNG to achieve bit production rates comparable to PRNGs.", "It is a TRNG.", "LavaRnd is the open-source example.", "Not related."], "r": "\u00a72.5 Random versus Pseudorandom"}, {"id": "2-91", "ch": 2, "sec": "2.6", "q": "Data stored locally, often with little protection beyond domain authentication and OS access controls, is referred to as:", "o": ["Data at rest", "Data in transit", "Plaintext in motion", "Ephemeral data"], "w": ["Correct. The book argues that it should be mandatory to encrypt data at rest and combine this with an effective key management scheme.", "Data in transit is typically already protected with encryption.", "Not a term used in the text.", "Not a term used in the text."], "r": "\u00a72.6 Encryption of Stored Data"}, {"id": "2-92", "ch": 2, "sec": "2.6", "q": "How does PGP protect files on a laptop, per the textbook?", "o": ["It generates a key from a password and uses it to encrypt files, without storing the password", "It stores the password in an encrypted file and retrieves it whenever a file is opened", "It encrypts each file using the user's public key only, with no password involved", "It relies on a hardware co-processor in the tape drive to encrypt files at rest"], "w": ["Correct. To recover a file, the user re-enters the password and PGP regenerates the key.", "PGP does NOT store the password.", "The text describes deriving a key from a password.", "That describes library-based tape encryption."], "r": "\u00a72.6 Encryption of Stored Data"}, {"id": "2-93", "ch": 2, "sec": "2.6", "q": "A hardware device that sits between servers and storage systems and encrypts all data going to storage at close to wire speed is called a:", "o": ["Back-end appliance", "Library-based tape encryption board", "Background laptop encryption product", "Digital envelope"], "w": ["Correct. It adds very little latency, whereas encryption software on servers slows backups.", "Library-based tape encryption is a co-processor board embedded in the tape drive and library.", "Background laptop encryption is software such as BitLocker or FileVault.", "A digital envelope is a key-protection technique."], "r": "\u00a72.6 Encryption of Stored Data"}, {"id": "2-94", "ch": 2, "sec": "2.6", "q": "Windows BitLocker and macOS FileVault are examples of:", "o": ["Background laptop and PC data encryption that can encrypt an entire disk", "Back-end appliances that sit between servers and storage systems", "Library-based tape encryption using a co-processor in the tape drive", "Pseudorandom number generators used to create session keys"], "w": ["Correct. They encrypt an entire disk or disk image transparently to the user.", "Back-end appliances are hardware between servers and storage.", "Library-based tape encryption is co-processor hardware in tape drives.", "These are not PRNGs."], "r": "\u00a72.6 Encryption of Stored Data"}, {"id": "2-95", "ch": 2, "sec": "2.6", "q": "In library-based tape encryption, if matching tape drive hardware isn't available at the target facility, how can the data be recovered?", "o": ["The target facility can use the key in a software decryption package", "The data cannot be recovered without the matching tape drive hardware", "The facility must brute-force the key, which is feasible for tape encryption", "The facility requests the CA's private key to decrypt the tapes"], "w": ["Correct. The key can be exported via secure e-mail or a securely transported flash drive and used in software.", "The book provides a software fallback.", "Brute force isn't the intended recovery method.", "CAs aren't involved."], "r": "\u00a72.6 Encryption of Stored Data"}, {"id": "2-96", "ch": 2, "sec": "2.6", "q": "The December 2004 Bank of America incident in which backup tapes containing data on 1.2 million government workers never arrived illustrates:", "o": ["Human-factor vulnerabilities of unencrypted data at rest during backup and shipping", "A cryptanalytic break of AES that exposed the encrypted backup tapes", "A weakness in SHA-1 that allowed the backup tapes to be forged", "A DDoS attack that disrupted the shipment of backup tapes"], "w": ["Correct. None of the data was encrypted, and the tapes were never found.", "No cryptographic break was involved.", "No hash weakness was involved.", "Not a DoS."], "r": "\u00a72.6 Encryption of Stored Data"}, {"id": "2-97", "ch": 2, "sec": "Ch 2", "q": "OWASP's 2021 report on the 10 most critical Web application security risks listed which risk as the SECOND highest?", "o": ["Cryptographic failures", "Injection", "Broken access control", "Security misconfiguration"], "w": ["Correct. The chapter opens by citing cryptographic failures, leading to sensitive data exposure or system compromise, as the second highest risk.", "Injection is discussed in Chapter 5, but the Chapter 2 intro cites cryptographic failures as #2.", "Not the risk cited in Chapter 2.", "Not cited here."], "r": "Ch 2 introduction"}, {"id": "2-98", "ch": 2, "sec": "2.1", "q": "Which symmetric encryption algorithm is described as the 'most-studied encryption algorithm in existence'?", "o": ["DES", "AES", "RSA", "RC4"], "w": ["Correct. Despite numerous attempts, no fatal weakness in the DES algorithm has been reported.", "AES is newer (2001).", "RSA is public-key.", "RC4 isn't discussed in this context."], "r": "\u00a72.1 Data Encryption Standard"}, {"id": "2-99", "ch": 2, "sec": "2.1", "q": "Given its 168-bit key and DES's heavily scrutinized algorithm, what does the textbook say about 3DES if security were the ONLY consideration?", "o": ["It would be an appropriate choice for a standardized encryption algorithm for decades to come", "It should be retired immediately because its algorithm has known cryptanalytic weaknesses", "It is weaker than single DES, because repeating the algorithm reduces its strength", "It cannot resist a brute-force attack, given today's multicore processors"], "w": ["Correct. The text says security alone would justify 3DES, but efficiency concerns (slow software, 64-bit blocks) led to AES.", "The book's concern is efficiency, not security.", "3DES is stronger than DES.", "168 bits overcomes DES's brute-force vulnerability."], "r": "\u00a72.1 Triple DES"}, {"id": "2-100", "ch": 2, "sec": "2.1", "q": "What is a secondary drawback shared by both DES and 3DES?", "o": ["They use a 64-bit block size", "They use a 128-bit key", "They are public-key algorithms", "They cannot be implemented in hardware"], "w": ["Correct. For both efficiency and security, a larger block size is desirable.", "DES uses 56 bits, and 3DES uses 112 or 168 bits.", "Both are symmetric.", "DES was designed for hardware."], "r": "\u00a72.1 Triple DES"}, {"id": "2-101", "ch": 2, "sec": "2.1", "q": "3DES was first standardized for use in financial applications in which standard, in 1985?", "o": ["ANSI X9.17", "FIPS 46-3", "NIST SP 800-67", "FIPS 197"], "w": ["Correct. 3DES was later incorporated into FIPS 46-3 (1999) and published separately as NIST SP 800-67.", "FIPS 46-3 (1999) incorporated 3DES into the Data Encryption Standard.", "SP 800-67 is the TDEA recommendation (2017 revision).", "FIPS 197 is AES."], "r": "\u00a72.1 Triple DES"}, {"id": "2-102", "ch": 2, "sec": "2.2", "q": "The text says that a message is 'authentic' when:", "o": ["It is genuine and came from its alleged source", "It has been encrypted so that only the intended recipient can read it", "It has been signed by a certificate authority that vouches for the sender", "It has been compressed and transmitted without any bit errors"], "w": ["Correct. Message authentication verifies that contents are unaltered and that the source is authentic. Timeliness and sequence may also be verified.", "Encryption gives confidentiality, not authenticity.", "CA signatures apply to certificates.", "Compression is unrelated."], "r": "\u00a72.2 Message Authentication"}, {"id": "2-103", "ch": 2, "sec": "2.2", "q": "Combining authentication and confidentiality in a single algorithm can be done by:", "o": ["Encrypting a message plus its authentication tag", "Using ECB mode alone", "Using an unkeyed hash alone", "Sending a MAC in the clear with the message"], "w": ["Correct. The text notes this is possible, although authentication is typically a separate function.", "ECB alone gives no authentication.", "An unkeyed hash alone provides neither confidentiality nor authentication.", "A MAC in the clear with the message provides no confidentiality."], "r": "\u00a72.2 Message Authentication without Message Encryption"}, {"id": "2-104", "ch": 2, "sec": "2.2", "q": "Which list correctly states the first three (practical) properties a hash function needs for message authentication?", "o": ["Applies to data of any size; produces fixed-length output; is relatively easy to compute", "Is one-way (preimage resistant); is second preimage resistant; is collision resistant", "Uses a secret key; is reversible; produces variable-length output", "Is random; is unpredictable; is statistically independent"], "w": ["Correct. The first three are practical requirements. Properties 4\u20136 are the security properties.", "These are properties 4, 5, and 6.", "Hashes don't use a key, aren't reversible, and output a fixed length.", "These are random-number properties."], "r": "\u00a72.2 Hash Function Requirements"}, {"id": "2-105", "ch": 2, "sec": "2.3", "q": "Asymmetric encryption algorithms discussed in Chapter 2 (RSA, DH, DSS, ECC) are described as all being:", "o": ["Block ciphers", "Stream ciphers", "Hash functions", "Symmetric"], "w": ["Correct. The text says the most widely used asymmetric algorithms 'are all block ciphers.'", "None of them is described as a stream cipher.", "None of them is a hash function.", "They are asymmetric."], "r": "\u00a72.3 Asymmetric Encryption Algorithms"}, {"id": "2-106", "ch": 2, "sec": "2.3", "q": "The textbook says the bit length for secure RSA use has increased in recent years. What consequence does it highlight?", "o": ["A heavier processing load, especially for e-commerce sites conducting large numbers of secure transactions", "RSA can no longer be used to create digital signatures at the larger key sizes now recommended for security", "RSA keys can now be shorter, because computing power has increased", "Symmetric encryption became obsolete, since RSA now handles bulk encryption"], "w": ["Correct. This burden is part of why ECC, with its smaller key sizes, is attractive.", "RSA still supports signatures.", "The keys are getting longer, not shorter.", "No such claim is made."], "r": "\u00a72.3 Elliptic Curve Cryptography"}, {"id": "2-107", "ch": 2, "sec": "2.4", "q": "A user must obtain Alice's public key securely before creating a digital envelope for her. What does the text say assures Bob that the key is valid?", "o": ["Obtaining it via Alice's public-key certificate", "Receiving it by e-mail from anyone", "Hashing it with SHA-1", "Encrypting it with his own private key before storing it"], "w": ["Correct. If Bob obtained Alice's public key through her certificate, he is assured that it is a valid key.", "Unauthenticated announcements can be forged.", "Hashing alone doesn't authenticate the key's owner.", "This doesn't validate Alice's key."], "r": "\u00a72.4 Digital Envelopes"}, {"id": "2-108", "ch": 2, "sec": "2.1", "q": "Key sizes of what length or greater does the textbook describe as effectively unbreakable using simply a brute-force approach?", "o": ["128 bits", "56 bits", "64 bits", "112 bits"], "w": ["Correct. Even with a trillion-fold speedup, breaking a 128-bit key would take over 100,000 years.", "56-bit DES is breakable.", "64 bits is a block size, and it is not cited as unbreakable.", "112-bit 3DES is strong, but the book's stated threshold is 128 bits."], "r": "\u00a72.1 Table 2.2"}, {"id": "3-01", "ch": 3, "sec": "Ch 3 intro", "q": "According to Chapter 3, in most computer security contexts user authentication is:", "o": ["The fundamental building block and the primary line of defense", "A secondary control used only after access control", "The same as message authentication", "Required only for remote access"], "w": ["Correct. User authentication is the basis for most types of access control and for user accountability.", "Authentication comes first. Access control decisions depend on it.", "The book stresses that user authentication is distinct from message authentication.", "It applies to local and remote access alike."], "r": "Ch 3 introduction"}, {"id": "3-02", "ch": 3, "sec": "Ch 3 intro", "q": "User authentication encompasses which two steps?", "o": ["Identification step and verification step", "Encryption step and decryption step", "Enrollment step and revocation step", "Registration step and auditing step"], "w": ["Correct. The user identifies themselves by presenting a credential such as a user ID, and the system verifies them by exchanging authentication information.", "Encryption and decryption are cryptographic operations, not the two steps of user authentication.", "Enrollment applies to biometrics. Revocation is not one of the two functions.", "Registration precedes authentication in the
