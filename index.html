<style>
/* Layout: a single-column "operations console" — HUD strip on top, one working panel at a time,
   sticky action bar at the bottom on phones; widens to a two-column dashboard on the Mac. */
:root{
  /* palette — deliberately dark-only (one visual world: an avionics / SOC console) */
  --void:#06090f;      /* page ground */
  --deck:#0c121c;      /* panels */
  --deck-2:#121a28;    /* raised controls */
  --wire:#1f2b3f;      /* hairlines */
  --wire-2:#2c3c57;
  --text:#e4ebf5;
  --dim:#8798b2;
  --faint:#56667f;
  --amber:#ffb547;     /* primary HUD accent */
  --amber-ink:#1a1204;
  --ice:#7fd4ff;       /* secondary readout */
  --ok:#4fe3a1;
  --ok-bg:rgba(79,227,161,.09);
  --bad:#ff6f6f;
  --bad-bg:rgba(255,111,111,.09);
  --amber-bg:rgba(255,181,71,.09);
  --ice-bg:rgba(127,212,255,.08);
  /* type */
  --f-display:"Chakra Petch","Eurostile","Bank Gothic",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --s-xs:.75rem; --s-sm:.8125rem; --s-md:1rem; --s-lg:1.125rem; --s-xl:1.5rem; --s-2xl:2.25rem;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--text);
  font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
.in-session .hud{display:none}
.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:linear-gradient(rgba(127,212,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(127,212,255,.035) 1px,transparent 1px);
  background-size:28px 28px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 80%)}
.shell{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 120px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);letter-spacing:.02em}
.label{font-family:var(--f-display);font-weight:600;font-size:var(--s-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- top HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;
  padding-block:12px;margin-inline:-16px;padding-inline:16px;background:rgba(6,9,15,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--wire)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0}
.brand-mark{width:26px;height:26px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.brand-name span{color:var(--amber)}
.hud-spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--dim);border:1px solid var(--wire);border-radius:99px;padding:3px 9px;white-space:nowrap}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sync[data-s="cloud"] i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sync[data-s="saving"] i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.sync[data-s="local"] i{background:var(--dim)}

/* ---------- panels ---------- */
.panel{position:relative;background:var(--deck);border:1px solid var(--wire);border-radius:var(--r);padding:18px}
.panel.bracket::before,.panel.bracket::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--amber);border-style:solid;opacity:.85}
.panel.bracket::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-top-left-radius:var(--r)}
.panel.bracket::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-bottom-right-radius:var(--r)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.home{display:grid;gap:16px;padding-top:18px}
@media (min-width:880px){.home{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}.home .span2{grid-column:1/-1}}

/* hero */
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.08;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--amber)}
.spec{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--wire);border:1px solid var(--wire);border-radius:8px;overflow:hidden;margin-block:16px}
.spec div{background:var(--deck-2);padding:10px 8px;text-align:center;min-width:0}
.spec b{display:block;font-family:var(--f-mono);font-weight:600;font-size:1.25rem;color:var(--text)}
.spec span{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:8px;border:1px solid var(--wire-2);background:var(--deck-2);font-weight:600;font-size:15px;text-decoration:none;color:var(--text);transition:transform .08s ease,background .15s,border-color .15s}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,111,111,.5);color:var(--bad);background:transparent}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.bankline{font-family:var(--f-mono);font-size:12px;color:var(--dim);margin-top:12px}
.bankline b{color:var(--ice);font-weight:500}

/* mode tiles */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--deck-2);border:1px solid var(--wire);border-radius:9px;padding:14px;min-height:112px;min-width:0}
.mode:hover{border-color:var(--wire-2)}
.mode .k{font-family:var(--f-mono);font-size:11px;color:var(--amber)}
.mode h3{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.02em}
.mode p{margin:0;font-size:13px;color:var(--dim);line-height:1.4}
.mode .count{margin-top:auto;font-family:var(--f-mono);font-size:12px;color:var(--ice)}

/* readiness */
.ch-list{display:flex;flex-direction:column;gap:2px}
.ch-row{display:grid;grid-template-columns:34px minmax(0,1fr) 54px;gap:10px;align-items:center;padding:9px 6px;border-radius:7px;background:none;border:0;text-align:left;width:100%}
.ch-row:hover{background:var(--deck-2)}
.ch-num{font-family:var(--f-mono);font-size:12px;color:var(--amber);border:1px solid var(--wire-2);border-radius:5px;text-align:center;padding:2px 0}
.ch-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-bar{height:5px;border-radius:3px;background:var(--wire);margin-top:5px;position:relative;overflow:hidden}
.ch-bar i{position:absolute;inset:0 auto 0 0;background:var(--ice);opacity:.35;border-radius:3px}
.ch-bar b{position:absolute;inset:0 auto 0 0;border-radius:3px}
.ch-acc{font-family:var(--f-mono);font-size:13px;text-align:right}
.ch-row.missing .ch-name{color:var(--dim)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:4px;border-radius:2px;display:inline-block}

/* history */
.hist{display:flex;flex-direction:column}
.hist-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--wire);font-size:14px}
.hist-row:first-child{border-top:0}
.hist-row .m{color:var(--dim);font-size:12px}
.score-pill{font-family:var(--f-mono);font-weight:600;font-size:13px;padding:2px 8px;border-radius:5px;border:1px solid}
.score-pill.hi{color:var(--ok);border-color:rgba(79,227,161,.35)}
.score-pill.mid{color:var(--amber);border-color:rgba(255,181,71,.35)}
.score-pill.lo{color:var(--bad);border-color:rgba(255,111,111,.35)}
.empty{color:var(--dim);font-size:14px;padding:6px 0}

/* ---------- setup sheet ---------- */
.setup{padding-top:18px;max-width:720px;margin:0 auto}
.setup h2{font-family:var(--f-display);font-size:var(--s-xl);font-weight:700}
.setup .sub{color:var(--dim);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--wire-2);background:var(--deck-2);font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.chip[aria-pressed="true"] .n{color:var(--amber)}
.chip[disabled]{opacity:.35}
.field{display:flex;flex-direction:column;gap:10px}

/* ---------- question view ---------- */
.qtop{position:sticky;top:calc(env(safe-area-inset-top,0px) + 0px);z-index:15;margin-inline:-16px;padding:10px 16px 0;background:rgba(6,9,15,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--wire)}
.qbar{display:flex;align-items:center;gap:10px}
.qid{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.qmode{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcount{font-family:var(--f-mono);font-size:13px;color:var(--dim)}
.timer{font-family:var(--f-mono);font-weight:600;font-size:18px;letter-spacing:.04em;padding:2px 10px;border:1px solid var(--wire-2);border-radius:6px;min-width:84px;text-align:center}
.timer.warn{color:var(--amber);border-color:var(--amber)}
.timer.crit{color:var(--bad);border-color:var(--bad);animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.55}}
.iconbtn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--wire-2);background:var(--deck-2);flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.track{display:flex;gap:2px;margin-top:10px;height:4px}
.track i{flex:1;background:var(--wire);border-radius:1px}
.track i.a{background:var(--ice)}
.track i.c{background:var(--ok)}
.track i.w{background:var(--bad)}
.track i.cur{background:var(--amber)}
.pace{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--faint);padding:6px 0 8px}
.pace .ahead{color:var(--ok)} .pace .behind{color:var(--amber)}
.qwrap{max-width:760px;margin:0 auto;padding-top:20px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--ice);background:var(--ice-bg);border:1px solid rgba(127,212,255,.22);border-radius:4px;padding:2px 7px}
.tag.amber{color:var(--amber);background:var(--amber-bg);border-color:rgba(255,181,71,.28)}
.qtext{font-size:1.14rem;line-height:1.5;font-weight:500;margin:0 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1px solid var(--wire-2);border-radius:9px;background:var(--deck);overflow:hidden;transition:border-color .15s,background .15s}
.opt-head{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;text-align:left;background:none;border:0;padding:14px;min-height:54px}
.key{font-family:var(--f-mono);font-weight:600;font-size:13px;width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--wire-2);border-radius:6px;color:var(--dim)}
.otext{font-size:15px;line-height:1.45;padding-top:3px}
.verdict{font-family:var(--f-display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding-top:6px;white-space:nowrap;color:var(--dim)}
.opt.sel{border-color:var(--ice);background:var(--ice-bg)}
.opt.sel .key{border-color:var(--ice);color:var(--ice);background:rgba(127,212,255,.12)}
.opt.ok{border-color:rgba(79,227,161,.6);background:var(--ok-bg)}
.opt.ok .key{border-color:var(--ok);color:var(--void);background:var(--ok)}
.opt.ok .verdict{color:var(--ok)}
.opt.bad{border-color:rgba(255,111,111,.6);background:var(--bad-bg)}
.opt.bad .key{border-color:var(--bad);color:var(--void);background:var(--bad)}
.opt.bad .verdict{color:var(--bad)}
.opt.dist .verdict{color:var(--faint)}
.opt.dist .verdict::after{content:" ▸";}
.opt.dist.open .verdict::after{content:" ▾";}
.why{padding:0 14px 14px 58px;font-size:14px;line-height:1.55;color:#c9d4e3}
.why .wlabel{display:block;font-family:var(--f-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.opt.ok .wlabel{color:var(--ok)} .opt.bad .wlabel,.opt.dist .wlabel{color:var(--bad)}
.ref{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border:1px dashed var(--wire-2);border-radius:9px;background:var(--deck)}
.ref svg{width:18px;height:18px;flex:none;color:var(--amber);margin-top:2px}
.ref b{display:block;font-family:var(--f-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600}
.ref span{font-family:var(--f-mono);font-size:13px}
.result-banner{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.result-banner.ok{color:var(--ok)} .result-banner.bad{color:var(--bad)}
.toggle-all{background:none;border:0;color:var(--ice);font-size:13px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

/* bottom action bar */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(6,9,15,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--wire)}
.actions-in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.actions .btn{flex:1}
.actions .btn.narrow{flex:0 0 auto}
.kbd-hint{display:none;font-family:var(--f-mono);font-size:11px;color:var(--faint);text-align:center;margin-top:16px}
@media (hover:hover) and (pointer:fine){.kbd-hint{display:block}}

/* sheet / modal */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(2,4,8,.72);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{width:100%;max-width:520px;max-height:85vh;overflow:auto;background:var(--deck);border:1px solid var(--wire-2);border-radius:12px;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--f-display);font-size:18px;font-weight:700;margin-bottom:8px}
.sheet p{color:var(--dim);margin:0 0 16px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-block:12px 16px}
.navgrid button{height:42px;border-radius:6px;border:1px solid var(--wire-2);background:var(--deck-2);font-family:var(--f-mono);font-size:13px;position:relative}
.navgrid button.ans{background:rgba(127,212,255,.16);border-color:rgba(127,212,255,.45);color:var(--ice)}
.navgrid button.cur{outline:2px solid var(--amber);outline-offset:1px}
.navgrid button.flg::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;background:var(--amber);border-radius:50%}

/* results */
.res-head{display:grid;gap:16px;padding-top:18px}
@media (min-width:760px){.res-head{grid-template-columns:auto minmax(0,1fr);align-items:center}}
.gauge{width:170px;height:170px;position:relative;margin:0 auto}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .v b{font-family:var(--f-mono);font-size:2.4rem;font-weight:600;line-height:1}
.gauge .v span{display:block;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{background:var(--deck-2);border:1px solid var(--wire);border-radius:8px;padding:10px 12px;min-width:0}
.kv b{display:block;font-family:var(--f-mono);font-size:1.2rem;font-weight:600}
.kv span{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-block:6px 12px}
.rev-item{border:1px solid var(--wire);border-radius:9px;background:var(--deck);margin-bottom:10px;overflow:hidden}
.rev-q{display:grid;grid-template-columns:30px minmax(0,1fr) 22px;gap:10px;width:100%;text-align:left;background:none;border:0;padding:14px;align-items:start}
.rev-q .n{font-family:var(--f-mono);font-size:12px;color:var(--dim);padding-top:2px}
.rev-q .t{font-size:14.5px;line-height:1.45}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.skip{background:transparent;border:2px solid var(--faint)}
.rev-body{padding:0 14px 14px}

/* import + stats */
textarea{width:100%;min-height:220px;resize:vertical;background:var(--void);color:var(--text);border:1px solid var(--wire-2);border-radius:8px;padding:12px;font-family:var(--f-mono);font-size:13px;line-height:1.5}
select{background:var(--deck-2);color:var(--text);border:1px solid var(--wire-2);border-radius:8px;min-height:42px;padding:0 10px;font:inherit}
pre.fmt{margin:0;overflow-x:auto;background:var(--void);border:1px solid var(--wire);border-radius:8px;padding:12px;font-family:var(--f-mono);font-size:12px;line-height:1.55;color:var(--dim)}
pre.fmt b{color:var(--amber);font-weight:500}
.note{font-size:13px;color:var(--dim)}
.note.ok{color:var(--ok)} .note.bad{color:var(--bad)}
.back{background:none;border:0;color:var(--dim);font-size:14px;padding:14px 0 0;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--text)}
.callout{border-left:2px solid var(--amber);padding:2px 0 2px 12px;font-size:14px;color:#c9d4e3}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.spec b{font-size:1.05rem}.modes{gap:8px}.mode{padding:12px;min-height:104px}.brand-name{font-size:13px}}

<script type="application/json" id="bank">[{"id": "1-01", "ch": 1, "sec": "1.1", "q": "According to NISTIR 7298, computer security consists of measures and controls that ensure which three properties of information processed and stored by a computer?", "o": ["Confidentiality, integrity, and availability", "Authentication, authorization, and accounting", "Confidentiality, authenticity, and nonrepudiation", "Prevention, detection, and recovery"], "w": ["Correct. The NISTIR 7298 definition is built on the CIA triad: confidentiality, integrity, and availability of information, including hardware, software, firmware, information data, and telecommunications.", "AAA is an access-management model, not the definition of computer security given in the chapter.", "Authenticity and nonrepudiation are additional concepts some add to the triad (Figure 1.1), but they are not the three objectives in the definition.", "Prevention, detection, response, and recovery are courses of action for security implementation (Section 1.6), not the objectives in the definition."], "r": "\u00a71.1 A Definition of Computer Security"}, {"id": "1-02", "ch": 1, "sec": "1.1", "q": "Confidentiality, as described in Chapter 1, covers which two related concepts?", "o": ["Data confidentiality and privacy", "Data integrity and system integrity", "Authenticity and accountability", "Secrecy and availability"], "w": ["Correct. Data confidentiality (private information is not disclosed to unauthorized individuals) and privacy (individuals control what information about them is collected, stored, and disclosed).", "These are the two concepts under integrity, not confidentiality.", "These are the two extra concepts some add beyond the CIA triad.", "Availability is a separate objective; it is not a sub-concept of confidentiality."], "r": "\u00a71.1 A Definition of Computer Security"}, {"id": "1-03", "ch": 1, "sec": "1.1", "q": "Which concept assures that a system performs its intended function in an unimpaired manner, free from deliberate or inadvertent unauthorized manipulation?", "o": ["System integrity", "Data integrity", "Availability", "Authenticity"], "w": ["Correct. System integrity is about the system itself working as intended without unauthorized manipulation.", "Data integrity assures that information and programs are changed only in a specified and authorized manner. It covers the data, not how the system functions.", "Availability assures that systems work promptly and that service is not denied to authorized users. It does not address manipulation.", "Authenticity is about being genuine and verifiable, such as confirming that users are who they say they are."], "r": "\u00a71.1 A Definition of Computer Security"}, {"id": "1-04", "ch": 1, "sec": "1.1", "q": "Under FIPS 199, a loss of integrity is defined as:", "o": ["The unauthorized modification or destruction of information", "The unauthorized disclosure of information", "The disruption of access to or use of information", "The inability to trace actions to a responsible party"], "w": ["Correct. FIPS 199 defines a loss of integrity as the unauthorized modification or destruction of information.", "That is FIPS 199's definition of a loss of confidentiality.", "That is FIPS 199's definition of a loss of availability.", "Tracing actions to an entity is accountability, which is not one of the three FIPS 199 objectives."], "r": "\u00a71.1 FIPS 199 characterization"}, {"id": "1-05", "ch": 1, "sec": "1.1", "q": "Which security goal generates the requirement for the actions of an entity to be traced uniquely to that entity, supporting nonrepudiation, deterrence, fault isolation, and after-action recovery?", "o": ["Accountability", "Authenticity", "Availability", "Privacy"], "w": ["Correct. Accountability requires that actions be traceable to a specific entity, so systems must keep records for later forensic analysis.", "Authenticity is about verifying that users and inputs are genuine. It does not cover tracing actions afterward.", "Availability concerns timely, reliable access to services.", "Privacy concerns an individual's control over information about themselves."], "r": "\u00a71.1 Authenticity & Accountability"}, {"id": "1-06", "ch": 1, "sec": "1.1", "q": "FIPS 199 treats authenticity as part of which security objective?", "o": ["Integrity", "Confidentiality", "Availability", "Accountability"], "w": ["Correct. The text notes that FIPS 199 includes authenticity under integrity. Its definition of integrity mentions 'ensuring information nonrepudiation and authenticity.'", "Confidentiality concerns restricting access and disclosure, not genuineness.", "Availability concerns timely and reliable access.", "Accountability is not one of the three FIPS 199 objectives."], "r": "\u00a71.1 (note after Authenticity/Accountability)"}, {"id": "1-07", "ch": 1, "sec": "1.1", "q": "A loss that could cause severe or catastrophic harm to individuals involving loss of life or serious life-threatening injuries corresponds to which FIPS 199 impact level?", "o": ["High", "Moderate", "Low", "Critical"], "w": ["Correct. 'High' means a severe or catastrophic adverse effect, including loss of mission capability, major financial loss, or loss of life.", "'Moderate' means a serious adverse effect and significant harm that does NOT involve loss of life or serious life-threatening injuries.", "'Low' means a limited adverse effect, such as minor damage, minor loss, or minor harm.", "FIPS 199 defines only three levels (low, moderate, high). 'Critical' is not one of them."], "r": "\u00a71.1 Examples (FIPS 199 levels)"}, {"id": "1-08", "ch": 1, "sec": "1.1", "q": "In the textbook's examples, which asset is given as an example of a HIGH integrity requirement?", "o": ["A hospital patient's allergy information stored in a database", "An anonymous online poll offered to readers on a news organization's website", "A discussion forum for registered users of a hobby website with little revenue", "A university's public website for prospective students and donors"], "w": ["Correct. Inaccurate allergy data could cause serious harm or death and expose the hospital to massive liability.", "The anonymous online poll is the book's LOW-integrity example, since its inaccuracy is well understood.", "The hobby discussion forum is the MODERATE-integrity example.", "The university public website is the book's MODERATE-availability example. It is not an integrity example."], "r": "\u00a71.1 Examples \u2014 Integrity"}, {"id": "1-09", "ch": 1, "sec": "1.1", "q": "An online telephone directory lookup application is used in the textbook as an example of what?", "o": ["A low availability requirement", "A high availability requirement", "A moderate confidentiality requirement", "A low integrity requirement"], "w": ["Correct. Losing it is only an annoyance because other ways exist to get the information, such as a hardcopy directory or the operator.", "The high-availability example is a system that provides authentication services for critical systems.", "The book's confidentiality examples involve student information covered by FERPA. Enrollment data is the moderate example.", "The low-integrity example is an anonymous online poll."], "r": "\u00a71.1 Examples \u2014 Availability"}, {"id": "1-10", "ch": 1, "sec": "1.1", "q": "Which of the following is listed among the challenges of computer security?", "o": ["The attacker need only find a single weakness, while the designer must find and eliminate all weaknesses", "Security requirements are complex and require multi-word labels", "Users generally perceive high benefit from security investment before any failure occurs", "Security is usually built into the design process from the start"], "w": ["Correct. This asymmetry between attacker and designer is challenge #6, the 'battle of wits.'", "The book says the opposite: most requirements have self-explanatory one-word labels, but the mechanisms that meet them are complex.", "The book says users tend to perceive LITTLE benefit from security investment until a failure occurs.", "The book says security is too often an afterthought, added after the design is complete."], "r": "\u00a71.1 The Challenges of Computer Security"}, {"id": "1-11", "ch": 1, "sec": "1.1", "q": "In Table 1.1, risk is described as typically a function of:", "o": ["The adverse impacts that would arise if an event occurs and the likelihood of occurrence", "The number of vulnerabilities in the system and the number of countermeasures deployed against them", "The value of the asset and the cost of the countermeasure", "The skill of the adversary and the size of the attack surface"], "w": ["Correct. Risk measures how much an entity is threatened, typically as a function of (1) adverse impact and (2) likelihood.", "Counts of vulnerabilities and countermeasures are not how Table 1.1 defines risk.", "Asset value and countermeasure cost are factors in security policy trade-offs, not the definition of risk.", "Adversary skill and attack surface affect threat assessment, but Table 1.1 defines risk as impact \u00d7 likelihood."], "r": "\u00a71.1 Table 1.1 Computer Security Terminology"}, {"id": "1-12", "ch": 1, "sec": "1.1", "q": "A weakness in an information system, its security procedures, internal controls, or implementation that could be exploited by a threat source is called a(n):", "o": ["Vulnerability", "Threat", "Attack", "Countermeasure"], "w": ["Correct. That is the Table 1.1 definition of a vulnerability.", "A threat is a circumstance or event with the POTENTIAL to adversely impact operations. It exploits a vulnerability; it is not the weakness itself.", "An attack is malicious activity that tries to collect, disrupt, deny, degrade, or destroy resources. It is a threat that has been carried out.", "A countermeasure is a device or technique meant to impair adversarial activity."], "r": "\u00a71.1 Table 1.1"}, {"id": "1-13", "ch": 1, "sec": "1.1", "q": "According to [NRC02], a system that has become 'leaky' corresponds to a vulnerability of which security concept?", "o": ["Confidentiality", "Integrity", "Availability", "Accountability"], "w": ["Correct. 'Leaky' means someone who should not have access obtains it, which is a confidentiality failure.", "'Corrupted' (doing the wrong thing or giving wrong answers) maps to integrity.", "'Unavailable or very slow' maps to availability.", "The three NRC vulnerability categories map only to C, I, and A."], "r": "\u00a71.1 A Model for Computer Security"}, {"id": "1-14", "ch": 1, "sec": "1.1", "q": "An attack initiated by an entity inside the security perimeter who is authorized to access resources but uses them in an unapproved way is called a(n):", "o": ["Inside attack", "Passive attack", "Outside attack", "Masquerade"], "w": ["Correct. An inside attack comes from an 'insider' who has authorization but misuses it.", "A passive attack tries to learn or use information without affecting resources. That classification is by effect, not by origin.", "An outside attack comes from an unauthorized or illegitimate user outside the perimeter.", "A masquerade is when one entity poses as another. The insider here uses their own access."], "r": "\u00a71.1 A Model for Computer Security"}, {"id": "1-15", "ch": 1, "sec": "1.1", "q": "Which statement about countermeasures is consistent with the textbook?", "o": ["A countermeasure may itself introduce new vulnerabilities, and residual vulnerabilities may remain", "Properly designed countermeasures eliminate all risk, so no residual risk remains for owners to manage", "When prevention fails, nothing further can be done except to accept the damage", "Countermeasures apply only to outside attacks, since insiders are already authorized users"], "w": ["Correct. The text says countermeasures can introduce new vulnerabilities and that residual vulnerabilities leave a residual level of risk, which owners try to minimize.", "The text says residual risk remains. Owners minimize risk; they do not eliminate it.", "When prevention fails, the goal becomes detecting the attack and recovering from its effects.", "Countermeasures are 'any means taken to deal with a security attack,' from any origin."], "r": "\u00a71.1 A Model for Computer Security"}, {"id": "1-16", "ch": 1, "sec": "1.2", "q": "In RFC 4949's threat consequences (Table 1.2), 'unauthorized disclosure' is a threat to which property?", "o": ["Confidentiality", "Availability", "System integrity only", "Data integrity"], "w": ["Correct. Unauthorized disclosure, achieved through exposure, interception, inference, or intrusion, is a threat to confidentiality.", "Disruption is the consequence that threatens availability (or system integrity).", "Usurpation is the consequence that threatens system integrity.", "Deception is the consequence that threatens data or system integrity."], "r": "\u00a71.2 Table 1.2"}, {"id": "1-17", "ch": 1, "sec": "1.2", "q": "An adversary observes the amount of traffic between particular pairs of hosts and deduces sensitive information without reading message contents. In Table 1.2, this threat action is:", "o": ["Inference", "Interception", "Exposure", "Intrusion"], "w": ["Correct. Inference means indirectly accessing sensitive data by reasoning from characteristics or by-products of communications. Traffic analysis is the book's example.", "Interception means DIRECTLY accessing sensitive data traveling between authorized sources and destinations, for example by sniffing packets.", "Exposure means sensitive data are directly released to an unauthorized entity, whether deliberately or by error.", "Intrusion means gaining access to data by circumventing a system's security protections."], "r": "\u00a71.2 Threats and Attacks"}, {"id": "1-18", "ch": 1, "sec": "1.2", "q": "A student alters their grades in the school database. According to Table 1.2, this threat action is:", "o": ["Falsification", "Repudiation", "Corruption", "Misappropriation"], "w": ["Correct. Falsification means altering or replacing valid data, or introducing false data. The book uses exactly this grade example. It falls under Deception.", "Repudiation is falsely denying responsibility for an act, such as denying having sent data.", "Corruption (under Disruption) means undesirably altering system OPERATION by modifying system functions, for example by planting backdoor logic.", "Misappropriation (under Usurpation) means taking unauthorized control of a resource, such as theft of service."], "r": "\u00a71.2 Threats and Attacks \u2014 Deception"}, {"id": "1-19", "ch": 1, "sec": "1.2", "q": "Malicious software installed on many hosts so they can be used as platforms to launch traffic at a target (as in DDoS) is the book's example of which threat action?", "o": ["Misappropriation", "Incapacitation", "Obstruction", "Masquerade"], "w": ["Correct. Misappropriation (under Usurpation) includes theft of service: the malware makes unauthorized use of the zombie hosts' processor and OS resources.", "Incapacitation disables a system component, for example by physical destruction or malware that disables services.", "Obstruction interrupts service delivery by interfering with communications or overloading the system. It describes the effect on the victim, but the book's example of using the zombies' resources is misappropriation.", "A masquerade is posing as an authorized entity."], "r": "\u00a71.2 Threats and Attacks \u2014 Usurpation"}, {"id": "1-20", "ch": 1, "sec": "1.2", "q": "Which threat consequence in Table 1.2 includes incapacitation, corruption, and obstruction?", "o": ["Disruption", "Deception", "Usurpation", "Unauthorized disclosure"], "w": ["Correct. Disruption interrupts or prevents correct operation of system services. It threatens availability or system integrity.", "Deception includes masquerade, falsification, and repudiation.", "Usurpation includes misappropriation and misuse.", "Unauthorized disclosure includes exposure, interception, inference, and intrusion."], "r": "\u00a71.2 Table 1.2"}, {"id": "1-21", "ch": 1, "sec": "1.2", "q": "A user places backdoor logic in a system so that others can later access it by other than the usual procedure. In Table 1.2, this is an example of:", "o": ["Corruption", "Falsification", "Exposure", "Incapacitation"], "w": ["Correct. The book's example of corruption, an attack on system integrity, is a user placing backdoor logic that alters system functions.", "Falsification concerns false DATA, not altered system functions.", "Exposure is the direct release of sensitive data.", "Incapacitation disables a component. A backdoor makes the system work in an unintended way rather than stopping it."], "r": "\u00a71.2 Threats and Attacks \u2014 Disruption"}, {"id": "1-22", "ch": 1, "sec": "1.2", "q": "According to the textbook, what is the major threat to computer system hardware?", "o": ["Threats to availability", "Threats to confidentiality", "Threats to integrity", "Software piracy"], "w": ["Correct. Hardware's main threat is to availability through accidental or deliberate damage and theft. Hardware is the most vulnerable to attack and the least susceptible to automated controls.", "Theft of USB drives can cause a loss of confidentiality, but the book names availability as the MAJOR hardware threat.", "Integrity threats are emphasized for software modification and data.", "Piracy is a software concern."], "r": "\u00a71.2 Threats and Assets \u2014 Hardware"}, {"id": "1-23", "ch": 1, "sec": "1.2", "q": "One table reports the aggregate income of respondents A, B, C, and D, and another reports the aggregate for A, B, C, D, and E. Subtracting the two reveals E's income. This illustrates a threat to secrecy involving:", "o": ["Statistical databases", "Network traffic analysis", "Replay attacks", "Software piracy"], "w": ["Correct. Statistical databases provide aggregate information, but careful analysis, such as differencing aggregates, can reveal individuals' data.", "Traffic analysis infers information from communication patterns, not database aggregates.", "Replay means retransmitting captured data units.", "Piracy is unauthorized copying of software."], "r": "\u00a71.2 Threats and Assets \u2014 Data"}, {"id": "1-24", "ch": 1, "sec": "1.2", "q": "What are the two types of passive attacks described in the textbook?", "o": ["Release of message contents and traffic analysis", "Replay and masquerade", "Modification of messages and denial of service", "Interception and falsification"], "w": ["Correct. Passive attacks are eavesdropping or monitoring. Release of message contents and traffic analysis are the two types.", "Replay and masquerade are ACTIVE attacks.", "Modification of messages and DoS are ACTIVE attacks.", "Falsification alters data, which makes it active, and these two terms come from Table 1.2's threat actions rather than the passive-attack list."], "r": "\u00a71.2 Communication Lines and Networks"}, {"id": "1-25", "ch": 1, "sec": "1.2", "q": "Why does the textbook say that the emphasis in dealing with passive attacks is on prevention rather than detection?", "o": ["Passive attacks are very difficult to detect because they do not alter data, but they can be prevented, usually with encryption", "Passive attacks are easy to detect from altered traffic, but they are impossible to prevent with encryption", "Prevention requires physical protection of all communication facilities and paths at all times", "Detection has a strong deterrent effect, so detecting passive attacks also prevents them"], "w": ["Correct. Neither sender nor receiver can tell that a third party read the traffic, but encryption can prevent success.", "It's the reverse: passive attacks are hard to detect and feasible to prevent.", "Physical protection of all paths is the reason ACTIVE attacks are hard to prevent absolutely.", "The deterrent effect of detection is mentioned for ACTIVE attacks."], "r": "\u00a71.2 Communication Lines and Networks"}, {"id": "1-26", "ch": 1, "sec": "1.2", "q": "An attacker captures an authentication sequence and retransmits it later to produce an unauthorized effect. This active attack is:", "o": ["Replay", "Traffic analysis", "Repudiation", "Inference"], "w": ["Correct. Replay is the passive capture of a data unit and its later retransmission to produce an unauthorized effect.", "Traffic analysis is a passive attack that observes communication patterns.", "Repudiation is falsely denying an act.", "Inference is indirectly deducing sensitive data."], "r": "\u00a71.2 Active attacks"}, {"id": "1-27", "ch": 1, "sec": "1.2", "q": "A message stating 'Allow Abigail Flores to read confidential file accounts' is changed to 'Allow Isidora Martinez to read confidential file accounts.' This is an example of:", "o": ["Modification of messages", "Masquerade", "Replay", "Release of message contents"], "w": ["Correct. Modification of messages means altering part of a legitimate message, or delaying or reordering it, to produce an unauthorized effect. This is the book's own example.", "In a masquerade, one entity pretends to be a different entity.", "Replay retransmits a captured message unchanged.", "Release of message contents is a passive attack in which contents are read, not altered."], "r": "\u00a71.2 Active attacks"}, {"id": "1-28", "ch": 1, "sec": "1.2", "q": "Because absolute prevention of active attacks would require physical protection of all communication facilities at all times, the goal for active attacks is to:", "o": ["Detect them and recover from any disruption or delays", "Encrypt all traffic end to end so that they can never succeed", "Ignore them since they are rare", "Prevent them using traffic padding"], "w": ["Correct. For active attacks the emphasis is on detection and recovery, and detection may also have a deterrent effect.", "Encryption is the main PREVENTION tool for passive attacks. It cannot stop all active attacks, such as DoS.", "Nothing in the text suggests active attacks are rare or can be ignored.", "Traffic padding is not the approach the chapter describes for active attacks."], "r": "\u00a71.2 Active attacks"}, {"id": "1-29", "ch": 1, "sec": "1.3", "q": "FIPS 200 enumerates how many security-related areas for protecting the CIA of information systems?", "o": ["17", "13", "10", "8"], "w": ["Correct. FIPS 200 lists 17 security-related areas (Table 1.4).", "13 is the number of fundamental security design principles listed by NCAE.", "10 is the number of challenges of computer security in Section 1.1.", "8 is the number of design principles originally proposed by Saltzer and Schroeder [SALT75]."], "r": "\u00a71.3 Table 1.4"}, {"id": "1-30", "ch": 1, "sec": "1.3", "q": "Which FIPS 200 functional area is identified as PRIMARILY requiring computer security technical measures?", "o": ["Identification and authentication", "Awareness and training", "Personnel security", "Contingency planning (backup and recovery)"], "w": ["Correct. The primarily technical areas are access control, identification and authentication, system and communication protection, and system and information integrity.", "Awareness and training is primarily a management control.", "Personnel security is primarily a management control.", "Contingency planning is primarily a management control."], "r": "\u00a71.3 Security Functional Requirements"}, {"id": "1-31", "ch": 1, "sec": "1.3", "q": "Which group of FIPS 200 functional areas is described as OVERLAPPING technical measures and management controls?", "o": ["Configuration management, incident response, and media protection", "Access control, audit and accountability, and planning", "Risk assessment, maintenance, and personnel security", "Identification and authentication, contingency planning, and physical protection"], "w": ["Correct. The text names configuration management, incident response, and media protection as the overlap areas.", "Access control is primarily technical, while audit and accountability and planning are primarily management, so this group is not the overlap set.", "All three are primarily management areas.", "I&A is primarily technical, while the other two are primarily management."], "r": "\u00a71.3 Security Functional Requirements"}, {"id": "1-32", "ch": 1, "sec": "1.4", "q": "Which design principle states that the design of security measures should be as simple and small as possible?", "o": ["Economy of mechanism", "Least common mechanism", "Modularity", "Least astonishment"], "w": ["Correct. Simple, small designs are easier to test and verify and tend to have fewer exploitable flaws. The book calls this perhaps the most difficult principle to honor.", "Least common mechanism minimizes functions shared by different users.", "Modularity means building security functions as separate, protected modules.", "Least astonishment means responding in the way least likely to astonish the user."], "r": "\u00a71.4 Fundamental Security Design Principles"}, {"id": "1-33", "ch": 1, "sec": "1.4", "q": "A system grants access only when a rule explicitly permits it, and a mistake in the mechanism therefore tends to fail by refusing access. Which principle is this?", "o": ["Fail-safe defaults", "Complete mediation", "Separation of privilege", "Psychological acceptability"], "w": ["Correct. Under fail-safe defaults, access decisions are based on permission rather than exclusion, so the default is no access. A failure that refuses access is safe and quickly detected.", "Complete mediation means EVERY access is checked rather than relying on cached decisions.", "Separation of privilege requires multiple privilege attributes, such as multifactor authentication.", "Psychological acceptability means security shouldn't unduly interfere with users' work."], "r": "\u00a71.4 Fail-safe defaults"}, {"id": "1-34", "ch": 1, "sec": "1.4", "q": "A file system checks permissions when a file is opened, but never again even if permissions change while the file is open. Which principle is NOT fully implemented?", "o": ["Complete mediation", "Open design", "Least privilege", "Encapsulation"], "w": ["Correct. Complete mediation requires every access to be checked and not served from a cached decision. The book uses exactly this file-open example.", "Open design is about not relying on the secrecy of the mechanism.", "Least privilege is about granting only the minimal privileges needed.", "Encapsulation is about protecting internal structure behind designated entry points."], "r": "\u00a71.4 Complete mediation"}, {"id": "1-35", "ch": 1, "sec": "1.4", "q": "The idea that encryption algorithms should be open to public scrutiny while only the keys are kept secret reflects which principle?", "o": ["Open design", "Isolation", "Economy of mechanism", "Layering"], "w": ["Correct. Under open design, the mechanism is open rather than secret. This is the philosophy behind NIST's standardization of public encryption and hash algorithms.", "Isolation separates public systems, users' processes, and security mechanisms from one another.", "Economy of mechanism is about simplicity, not openness.", "Layering (defense in depth) uses multiple overlapping protections."], "r": "\u00a71.4 Open design"}, {"id": "1-36", "ch": 1, "sec": "1.4", "q": "Requiring BOTH a password AND a smart card to access a restricted resource is the textbook's example of which principle?", "o": ["Separation of privilege", "Least privilege", "Layering", "Fail-safe defaults"], "w": ["Correct. Separation of privilege, defined in [SALT75], requires multiple privilege attributes for access, as in multifactor authentication.", "Least privilege limits each user or process to the minimum set of privileges. It does not require multiple attributes.", "Layering uses multiple overlapping protection approaches across people, technology, and operations. The book's example for requiring two attributes is separation of privilege.", "Fail-safe defaults makes the default 'no access.'"], "r": "\u00a71.4 Separation of privilege"}, {"id": "1-37", "ch": 1, "sec": "1.4", "q": "Role-based access control, where each role gets only the permissions needed for its functions, is cited as a good example of which principle?", "o": ["Least privilege", "Least common mechanism", "Modularity", "Complete mediation"], "w": ["Correct. Least privilege means every process and user operates with the least set of privileges necessary. It also has a temporal aspect: hold special privileges only while needed.", "Least common mechanism minimizes functions shared among users.", "Modularity is about separate security modules and upgradable architecture.", "Complete mediation is about checking every access."], "r": "\u00a71.4 Least privilege"}, {"id": "1-38", "ch": 1, "sec": "1.4", "q": "Security mechanisms that hinder usability so much that users turn them off violate which principle?", "o": ["Psychological acceptability", "Least astonishment", "Economy of mechanism", "Open design"], "w": ["Correct. Psychological acceptability says security shouldn't unduly interfere with users' work and should match the user's mental model of protection.", "Least astonishment means the program or UI responds in the way least likely to surprise the user. It is related, but the key idea here is mechanisms hindering usability, which is psychological acceptability.", "Economy of mechanism concerns simplicity of design.", "Open design concerns not relying on secrecy of design."], "r": "\u00a71.4 Psychological acceptability"}, {"id": "1-39", "ch": 1, "sec": "1.4", "q": "Which principle is described as a specific form of isolation based on object-oriented functionality, where internal structure is accessible only through designated domain entry points?", "o": ["Encapsulation", "Modularity", "Layering", "Separation of privilege"], "w": ["Correct. Encapsulation protects a collection of procedures and data objects in their own domain, reachable only at designated entry points.", "Modularity is about separate protected modules and upgradable architecture, not OO entry points.", "Layering means overlapping protections (defense in depth).", "Separation of privilege means multiple privilege attributes or split privileged components."], "r": "\u00a71.4 Encapsulation"}, {"id": "1-40", "ch": 1, "sec": "1.4", "q": "Developing a single common cryptographic module that many protocols and applications invoke, instead of implementing crypto in each one, is an example of:", "o": ["Modularity", "Least common mechanism", "Isolation", "Economy of mechanism"], "w": ["Correct. The book's modularity example is a common crypto module, along with a modular architecture that allows parts to be upgraded without redesigning the whole system.", "Least common mechanism MINIMIZES shared functions. A shared crypto module is the modularity example, not this one.", "Isolation separates public systems from critical ones, users from each other, and security mechanisms from tampering.", "Simplicity is a related benefit, but the book presents this specific example under modularity."], "r": "\u00a71.4 Modularity"}, {"id": "1-41", "ch": 1, "sec": "1.4", "q": "The use of multiple, overlapping protection approaches addressing people, technology, and operations, so that the failure of one doesn't leave the system unprotected, is called:", "o": ["Layering (defense in depth)", "Isolation", "Separation of privilege", "Complete mediation"], "w": ["Correct. Layering is often referred to as defense in depth.", "Isolation separates resources. It is not about overlapping protections.", "Separation of privilege requires multiple attributes for a single access decision.", "Complete mediation checks every access."], "r": "\u00a71.4 Layering"}, {"id": "1-42", "ch": 1, "sec": "1.4", "q": "Which of the following was NOT among the original eight design principles proposed by Saltzer and Schroeder [SALT75]?", "o": ["Layering", "Economy of mechanism", "Least common mechanism", "Psychological acceptability"], "w": ["Correct. The first eight principles in the NCAE list, from economy of mechanism through psychological acceptability, come from [SALT75]. Isolation, encapsulation, modularity, layering, and least astonishment were added later.", "Economy of mechanism is #1 of the original eight.", "Least common mechanism is #7 of the original eight.", "Psychological acceptability is #8 of the original eight."], "r": "\u00a71.4 list of principles"}, {"id": "1-43", "ch": 1, "sec": "1.5", "q": "An attack surface is defined as:", "o": ["The reachable and exploitable vulnerabilities in a system", "A hierarchical data structure representing techniques for exploiting vulnerabilities", "The set of all countermeasures deployed", "The physical perimeter of the data center"], "w": ["Correct. Examples include open ports, services inside a firewall, code that processes incoming data, interfaces and web forms, and employees open to social engineering.", "That describes an attack TREE.", "Countermeasures reduce the attack surface; they are not the surface itself.", "The attack surface is not a physical perimeter. It includes network, software, and human categories."], "r": "\u00a71.5 Attack Surfaces"}, {"id": "1-44", "ch": 1, "sec": "1.5", "q": "Vulnerabilities created by personnel or outsiders, such as social engineering, human error, and trusted insiders, belong to which attack surface category?", "o": ["Human attack surface", "Network attack surface", "Software attack surface", "Physical attack surface"], "w": ["Correct. The human attack surface covers social engineering, human error, and trusted insiders.", "The network attack surface covers protocol vulnerabilities, DoS, and disruption of links.", "The software attack surface covers flaws in application, utility, or OS code, especially web server software.", "The book defines only three categories: network, software, and human."], "r": "\u00a71.5 Attack Surfaces"}, {"id": "1-45", "ch": 1, "sec": "1.5", "q": "According to Figure 1.4, which combination yields the LOWEST security risk?", "o": ["Deep layering with a small attack surface", "Shallow layering with a small attack surface", "Deep layering with a large attack surface", "Shallow layering with a large attack surface"], "w": ["Correct. Defense in depth and attack surface reduction complement each other. Deep layering combined with a small surface gives low risk.", "Shallow layering with a small surface gives medium risk.", "Deep layering with a large surface gives medium risk.", "Shallow layering with a large surface gives HIGH risk."], "r": "\u00a71.5 Figure 1.4"}, {"id": "1-46", "ch": 1, "sec": "1.5", "q": "In an attack tree, what does the root node represent?", "o": ["The security incident that is the goal of the attack", "The different ways to initiate an attack", "The countermeasures already in place to stop the attack", "The weakest vulnerability"], "w": ["Correct. The root node is the attacker's goal. Branches and subnodes are subgoals.", "The LEAF nodes represent the different ways to initiate an attack.", "Attack trees model the attack, not the defenses.", "No single node represents 'the weakest vulnerability.' Branch labels can carry difficulty or cost so that attacks can be compared."], "r": "\u00a71.5 Attack Trees"}, {"id": "1-47", "ch": 1, "sec": "1.5", "q": "In an attack tree, achieving the goal of an AND-node requires:", "o": ["All of its subnodes' subgoals to be achieved", "At least one subnode's subgoal to be achieved", "Only the leaf node with the lowest cost", "The root node to be achieved first"], "w": ["Correct. An AND-node needs ALL subgoals. An OR-node needs at least one.", "That is an OR-node.", "Costs can label branches, but the AND semantics require all subnodes.", "The root is the final goal and is reached last, not first."], "r": "\u00a71.5 Attack Trees"}, {"id": "1-48", "ch": 1, "sec": "1.5", "q": "In the Internet banking attack tree (Figure 1.5), an attack that persuades or forces the user to connect to the bank server with a preset session ID is called:", "o": ["Use of known authenticated session", "Injection of commands", "User credential guessing", "Security policy violation"], "w": ["Correct. Once the user authenticates with the attacker-chosen session ID, the attacker uses that known session ID to spoof the user.", "Injection of commands means intercepting communication between the user terminal (UT) and the bank server (IBS) to impersonate the user.", "User credential guessing means brute-forcing usernames and passwords, for example via zombie PCs.", "Security policy violation means an employee violating policy, combined with weak access control or logging, exposes an account."], "r": "\u00a71.5 Figure 1.5 \u2014 five strategies"}, {"id": "1-49", "ch": 1, "sec": "1.5", "q": "The Internet banking attack tree analysis considered which three components involved in authentication?", "o": ["User terminal and user (UT/U), communications channel (CC), and Internet banking server (IBS)", "The client browser, the perimeter firewall, and the back-end customer database", "The network attack surface, the software attack surface, and the human attack surface", "The bank's hardware, its application software, and the customer account data"], "w": ["Correct. The attack strategies target UT/U, CC, and IBS.", "These are generic components, not those named in the [DIMI07] analysis.", "These are the three attack SURFACE categories.", "These are asset categories (along with communication lines)."], "r": "\u00a71.5 Attack Trees"}, {"id": "1-50", "ch": 1, "sec": "1.6", "q": "Lampson [LAMP04] suggests a comprehensive security strategy involves three aspects. Which aspect answers the question 'Does it really work?'", "o": ["Correctness/assurance", "Specification/policy", "Implementation/mechanisms", "Evaluation/certification"], "w": ["Correct. Correctness/assurance asks whether the security really works.", "Specification/policy asks 'What is the security scheme supposed to do?'", "Implementation/mechanisms asks 'How does it do it?'", "This is not one of Lampson's three aspects, although evaluation is related to assurance."], "r": "\u00a71.6 Computer Security Strategy"}, {"id": "1-51", "ch": 1, "sec": "1.6", "q": "In developing a security policy, which pair is presented as a trade-off the manager must consider?", "o": ["Cost of security versus cost of failure and recovery", "Confidentiality of customer data versus integrity of the transaction records", "Prevention of attacks versus detection of attacks already under way", "Investment in hardware security versus investment in software security"], "w": ["Correct. The two trade-offs are ease of use vs. security and cost of security vs. cost of failure and recovery.", "C and I are objectives, not one of the policy trade-offs listed.", "These are courses of action in implementation.", "These are asset categories."], "r": "\u00a71.6 Security Policy"}, {"id": "1-52", "ch": 1, "sec": "1.6", "q": "Using backup systems so that a prior, correct copy of data can be reloaded after integrity is compromised is an example of which course of action?", "o": ["Recovery", "Response", "Detection", "Prevention"], "w": ["Correct. Recovery is the book's backup example.", "Response means halting an ongoing attack to prevent further damage.", "Detection means noticing attacks, as an IDS does.", "Prevention means stopping attacks from succeeding at all, for example with strong encryption and protected keys."], "r": "\u00a71.6 Security Implementation"}, {"id": "1-53", "ch": 1, "sec": "1.6", "q": "Which statement about assurance is correct according to the textbook?", "o": ["Assurance is expressed as a degree of confidence, not as a formal proof of correctness", "Assurance provides absolute mathematical proof that a design is correct", "Assurance is the process of examining a product against criteria", "Assurance applies only to system implementation, not design"], "w": ["Correct. Absolute proof isn't possible with the current state of the art, so assurance is a matter of degree.", "The book says absolute proof is not possible.", "That describes EVALUATION.", "Assurance encompasses both design and implementation."], "r": "\u00a71.6 Assurance and Evaluation"}, {"id": "1-54", "ch": 1, "sec": "1.7", "q": "Which standards organization is the home for the IETF and the IAB, whose standards are published as Requests for Comments (RFCs)?", "o": ["Internet Society (ISOC)", "National Institute of Standards and Technology (NIST)", "ITU-T", "ISO"], "w": ["Correct. ISOC is the organizational home for the IETF and IAB, which publish RFCs.", "NIST publishes FIPS and Special Publications (SP).", "ITU-T, a UN agency sector, publishes 'Recommendations.'", "ISO is a nongovernmental federation of national standards bodies that publishes International Standards."], "r": "\u00a71.7 Standards"}, {"id": "1-55", "ch": 1, "sec": "1.7", "q": "ITU-T standards are referred to as:", "o": ["Recommendations", "Requests for Comments", "Federal Information Processing Standards", "Special Publications"], "w": ["Correct. ITU-T, one of the ITU's three sectors, produces 'Recommendations.'", "RFCs come from the IETF/IAB under ISOC.", "FIPS come from NIST.", "SPs come from NIST."], "r": "\u00a71.7 Standards"}, {"id": "1-56", "ch": 1, "sec": "1.4", "q": "A design principle requiring that public access systems be separated from critical resources, that users' processes and files be separated from each other, and that security mechanisms be protected from access is:", "o": ["Isolation", "Encapsulation", "Least common mechanism", "Layering"], "w": ["Correct. The book describes isolation in exactly these three contexts.", "Encapsulation is a specific OO form of isolation, but it doesn't cover these three contexts.", "Least common mechanism minimizes shared functions among users. It is related but narrower.", "Layering is about overlapping protections."], "r": "\u00a71.4 Isolation"}, {"id": "1-57", "ch": 1, "sec": "1.1", "q": "The textbook frames its whole focus around three fundamental questions. Which of the following is one of them?", "o": ["What assets do we need to protect?", "Who is the most likely attacker?", "Which standard should we comply with?", "How much should security cost?"], "w": ["Correct. The three questions are: What assets do we need to protect? How are those assets threatened? What can we do to counter those threats?", "Adversary identity matters, but it isn't one of the three framing questions.", "Standards are covered in 1.7, but this isn't a framing question.", "Cost is a policy trade-off (1.6), not one of the three questions."], "r": "Ch 1 introduction"}, {"id": "1-58", "ch": 1, "sec": "1.1", "q": "Which challenge of computer security concerns deciding at what points in a network, and at what layer(s) of an architecture such as TCP/IP, mechanisms should be placed?", "o": ["Deciding where to use security mechanisms, both physically and logically", "Security being an afterthought in design", "The need for constant monitoring", "Users and managers perceiving little benefit from security investment until a failure occurs"], "w": ["Correct. Challenge #4 covers physical placement (where in a network) and logical placement (which layer).", "Challenge #9 says security is too often incorporated after the design is complete.", "Challenge #8 says security requires regular, even constant, monitoring.", "Challenge #7 says users perceive little benefit until a failure occurs."], "r": "\u00a71.1 The Challenges of Computer Security"}, {"id": "1-59", "ch": 1, "sec": "1.1", "q": "A security mechanism requires time limits on a message's transit time, but the underlying network introduces variable, unpredictable delays. Which challenge does this illustrate?", "o": ["Mechanisms depend on secret information and on communications protocols whose behavior can complicate them", "The attacker needs to find only a single weakness, while the designer must eliminate all of them", "Requirements have self-explanatory one-word labels, which makes them seem simpler than they are", "Users and administrators view strong security as an impediment to efficient operation"], "w": ["Correct. Challenge #5 notes that mechanisms involve more than an algorithm. They need secret information (keys) and may rely on protocols whose delays can make time limits meaningless.", "That is challenge #6, the battle of wits.", "That is part of challenge #1, which says requirements look simple but mechanisms are complex.", "That is challenge #10."], "r": "\u00a71.1 The Challenges of Computer Security"}, {"id": "1-60", "ch": 1, "sec": "1.1", "q": "Per Table 1.1, an individual, group, organization, or government that carries out (or intends to carry out) detrimental activities is a(n):", "o": ["Adversary (threat agent)", "Threat", "Vulnerability", "System resource (asset)"], "w": ["Correct. That is the Table 1.1 definition of adversary, also called threat agent.", "A threat is a circumstance or event with potential adverse impact. It is not the actor.", "A vulnerability is a weakness.", "A system resource is what's being protected."], "r": "\u00a71.1 Table 1.1"}, {"id": "1-61", "ch": 1, "sec": "1.1", "q": "How does the textbook relate a threat to an attack?", "o": ["An attack is a threat that is carried out (threat action) and, if successful, leads to a threat consequence", "A threat is an attack that has already succeeded and produced a threat consequence", "Threats are always intentional acts carried out by an adversary, while attacks may be accidental or environmental", "An attack is a weakness in the system, while a threat is the actor who exploits it"], "w": ["Correct. A threat represents potential harm. An attack is a carried-out threat (threat action) that, if successful, causes an undesirable violation of security (threat consequence).", "It's reversed: the threat is the potential, and the attack is the realization.", "Neither definition hinges on threats always being intentional. Threats include circumstances or events.", "A weakness is a vulnerability, and the actor is a threat agent."], "r": "\u00a71.1 A Model for Computer Security"}, {"id": "1-62", "ch": 1, "sec": "1.1", "q": "Which list correctly gives the four categories of computer system assets in Chapter 1?", "o": ["Hardware, software, data, and communication facilities and networks", "Hardware, software, people, and policies", "Data, applications, users, and devices", "Confidentiality, integrity, availability, and authenticity"], "w": ["Correct. The assets are hardware, software, data, and communication facilities and networks (also called 'communication lines and networks' in 1.2).", "People and policies are not listed as asset categories.", "This is not the book's categorization.", "These are security objectives, not asset categories."], "r": "\u00a71.1 A Model for Computer Security"}, {"id": "1-63", "ch": 1, "sec": "1.2", "q": "According to the textbook, an example of MASQUERADE that uses malicious logic is:", "o": ["A Trojan horse that appears to perform a useful function but gains unauthorized access", "A user who falsely denies having sent a message that was in fact sent", "Disabling a communication link so that system services cannot be delivered", "Observing the pattern of traffic between hosts to infer what is being communicated"], "w": ["Correct. Besides an unauthorized user posing with stolen credentials, the book gives a Trojan horse as an example of masquerade.", "That is repudiation.", "That is obstruction.", "That is inference via traffic analysis."], "r": "\u00a71.2 Threats and Attacks \u2014 Deception"}, {"id": "1-64", "ch": 1, "sec": "1.2", "q": "A university accidentally posts confidential student information on the Web. In Table 1.2, which threat action is this?", "o": ["Exposure", "Interception", "Intrusion", "Inference"], "w": ["Correct. Exposure can be deliberate (an insider releasing data) or the result of human, hardware, or software error. The accidental web posting is the book's example.", "Interception means directly capturing data in transit.", "Intrusion means circumventing security protections.", "Inference means indirectly deducing data."], "r": "\u00a71.2 Threats and Attacks \u2014 Unauthorized disclosure"}, {"id": "1-65", "ch": 1, "sec": "1.2", "q": "An adversary gains unauthorized access to sensitive data by overcoming the system's access control protections. In Table 1.2, this is:", "o": ["Intrusion", "Exposure", "Misuse", "Masquerade"], "w": ["Correct. Intrusion means gaining access to sensitive data by circumventing a system's security protections.", "Exposure is direct release of data, typically by an insider or by error.", "Misuse (Usurpation) causes a component to perform a function detrimental to security, such as disabling security functions.", "A masquerade involves posing as an authorized entity. Simply overcoming access controls is intrusion."], "r": "\u00a71.2 Threats and Attacks"}, {"id": "1-66", "ch": 1, "sec": "1.2", "q": "Deception, as a threat consequence, is a threat to:", "o": ["Either system integrity or data integrity", "The confidentiality of data passed between authorized sources and destinations", "The availability of system services only, never system or data integrity", "The accountability of users whose actions must be traced to them"], "w": ["Correct. The book states that deception is a threat to either system integrity or data integrity.", "Unauthorized disclosure threatens confidentiality.", "Disruption threatens availability or system integrity.", "Accountability isn't mapped as a consequence in Table 1.2."], "r": "\u00a71.2 Threats and Attacks"}, {"id": "1-67", "ch": 1, "sec": "1.2", "q": "Usurpation, as a threat consequence, is a threat to:", "o": ["System integrity", "Confidentiality", "Data integrity", "Availability"], "w": ["Correct. Usurpation, which covers misappropriation and misuse, is a threat to system integrity, meaning control of system services by an unauthorized entity.", "Unauthorized disclosure threatens confidentiality.", "Deception threatens data (or system) integrity.", "Disruption threatens availability."], "r": "\u00a71.2 Threats and Attacks"}, {"id": "1-68", "ch": 1, "sec": "1.2", "q": "An intruder who has gained unauthorized access disables or thwarts the system's security functions. In Table 1.2, this is:", "o": ["Misuse", "Misappropriation", "Obstruction", "Falsification"], "w": ["Correct. Misuse can occur through malicious logic or a hacker. In either case, security functions can be disabled or thwarted.", "Misappropriation is unauthorized control of a resource, such as theft of service.", "Obstruction hinders service delivery.", "Falsification introduces false data."], "r": "\u00a71.2 Threats and Attacks \u2014 Usurpation"}, {"id": "1-69", "ch": 1, "sec": "1.2", "q": "In Table 1.3, 'a door sensor is replaced with one that sends a closed status regardless of actual door position' is an example of a threat to:", "o": ["Hardware integrity", "Hardware availability", "Data confidentiality", "Software availability"], "w": ["Correct. The modified door sensor still functions, but it reports false data. This is Table 1.3's hardware/integrity example.", "The hardware availability example is equipment that is stolen or disabled, denying service.", "Data confidentiality examples are unauthorized reads and statistical analysis revealing data.", "The software availability example is programs being deleted, denying access to users."], "r": "\u00a71.2 Table 1.3"}, {"id": "1-70", "ch": 1, "sec": "1.2", "q": "In Table 1.3, 'an unauthorized copy of software is made' is classified as a threat to software:", "o": ["Confidentiality", "Availability", "Integrity", "Authenticity"], "w": ["Correct. Unauthorized copying, which relates to software piracy, sits in the software/confidentiality cell.", "Software availability: programs are deleted, denying access.", "Software integrity: a working program is modified to fail or to do an unintended task.", "Table 1.3 uses only availability, confidentiality, and integrity columns."], "r": "\u00a71.2 Table 1.3"}, {"id": "1-71", "ch": 1, "sec": "1.2", "q": "In Table 1.3, messages being modified, delayed, reordered, or duplicated, and false messages being fabricated, threaten which property of communication lines and networks?", "o": ["Integrity", "Confidentiality", "Availability", "Privacy"], "w": ["Correct. These are integrity threats to communication lines and networks.", "Confidentiality threats: messages are read, or traffic patterns are observed.", "Availability threats: messages are destroyed or deleted, or lines and networks are made unavailable.", "Privacy is a sub-concept of confidentiality, and these actions alter data."], "r": "\u00a71.2 Table 1.3"}, {"id": "1-72", "ch": 1, "sec": "1.2", "q": "What does the textbook say about the problem of software piracy?", "o": ["Although certain countermeasures are available, by and large it has not been solved", "It has been largely solved through careful software configuration management and backups", "It is primarily an availability threat, because pirated copies deny service to users", "It is the major threat to hardware, since unlicensed software damages equipment"], "w": ["Correct. The book says the unauthorized copying problem 'has not been solved' by and large.", "Configuration management with backups supports AVAILABILITY. It doesn't solve piracy.", "Unauthorized copying is listed under software confidentiality.", "The major hardware threat is to availability (damage and theft)."], "r": "\u00a71.2 Threats and Assets \u2014 Software"}, {"id": "1-73", "ch": 1, "sec": "1.2", "q": "Software modification that produces a program which still functions but behaves differently than before, such as a virus infection, is a threat to:", "o": ["Integrity/authenticity", "Availability", "Confidentiality", "Accountability/nonrepudiation"], "w": ["Correct. The book calls this a threat to integrity/authenticity, and computer viruses fall into this category.", "The KEY software threat is availability (easy deletion), but altered behavior is integrity.", "Confidentiality isn't at issue when behavior is altered.", "Accountability isn't the category the text uses here."], "r": "\u00a71.2 Threats and Assets \u2014 Software"}, {"id": "1-74", "ch": 1, "sec": "1.2", "q": "Active attacks can be subdivided into which four categories?", "o": ["Replay, masquerade, modification of messages, and denial of service", "Exposure, interception, inference, and intrusion", "Release of message contents, traffic analysis, replay, and masquerade", "Incapacitation, corruption, obstruction, and misuse"], "w": ["Correct. These are the four active attack categories.", "These are the threat actions under unauthorized disclosure in Table 1.2.", "The first two are PASSIVE attacks.", "These are disruption and usurpation threat actions from Table 1.2."], "r": "\u00a71.2 Communication Lines and Networks"}, {"id": "1-75", "ch": 1, "sec": "1.2", "q": "According to the textbook, a masquerade attack:", "o": ["Usually includes one of the other forms of active attack, such as replaying captured authentication sequences", "Is a passive attack, because the attacker only learns information without changing anything", "Never involves stolen credentials, since it relies entirely on malicious software", "Is a form of traffic analysis in which the attacker observes communication patterns"], "w": ["Correct. For example, authentication sequences can be captured and replayed so that an entity with few privileges impersonates one with more.", "Masquerade is an ACTIVE attack.", "Posing with a learned logon ID and password is a classic masquerade.", "Traffic analysis is passive observation."], "r": "\u00a71.2 Active attacks"}, {"id": "1-76", "ch": 1, "sec": "1.3", "q": "Which FIPS 200 area requires organizations to 'sanitize or destroy information system media before disposal or release for reuse'?", "o": ["Media Protection", "Maintenance", "Physical and Environmental Protection", "Configuration Management"], "w": ["Correct. Media Protection covers protecting paper and digital media, limiting access to it, and sanitizing or destroying it before disposal.", "Maintenance covers periodic and timely maintenance and controls on maintenance tools and personnel.", "Physical and Environmental Protection limits physical access and protects the plant and environment.", "Configuration Management maintains baseline configurations and inventories."], "r": "\u00a71.3 Table 1.4"}, {"id": "1-77", "ch": 1, "sec": "1.3", "q": "Which FIPS 200 area calls for establishing plans for emergency response, backup operations, and postdisaster recovery to ensure continuity of operations?", "o": ["Contingency Planning", "Incident Response", "Planning", "Risk Assessment"], "w": ["Correct. Contingency Planning ensures availability of critical resources and continuity of operations in emergencies.", "Incident Response establishes an incident-handling capability covering preparation, detection, analysis, containment, recovery, and user-response activities.", "Planning develops and updates security plans and rules of behavior.", "Risk Assessment periodically assesses risk to operations, assets, and individuals."], "r": "\u00a71.3 Table 1.4"}, {"id": "1-78", "ch": 1, "sec": "1.3", "q": "Which FIPS 200 area includes ensuring that information is protected during and after personnel actions such as terminations and transfers?", "o": ["Personnel Security", "Awareness and Training", "Access Control", "Audit and Accountability"], "w": ["Correct. Personnel Security also requires trustworthy individuals in positions of responsibility and formal sanctions for noncompliance.", "Awareness and Training ensures that people know the risks and are trained for their duties.", "Access Control limits system access to authorized users, processes, and devices.", "Audit and Accountability creates and retains audit records and traces actions to users."], "r": "\u00a71.3 Table 1.4"}, {"id": "1-79", "ch": 1, "sec": "1.3", "q": "Which FIPS 200 area includes identifying, reporting, and correcting flaws in a timely manner and providing protection from malicious code?", "o": ["System and Information Integrity", "System and Communications Protection", "Systems and Services Acquisition", "Maintenance"], "w": ["Correct. System and Information Integrity also includes monitoring security alerts and advisories.", "System and Communications Protection monitors and protects communications at external and key internal boundaries.", "Systems and Services Acquisition allocates resources, uses a security-aware SDLC, and holds third-party providers to standards.", "Maintenance covers periodic maintenance and the controls on it."], "r": "\u00a71.3 Table 1.4"}, {"id": "1-80", "ch": 1, "sec": "1.3", "q": "What point does the textbook make about the FIPS 200 functional requirements areas overall?", "o": ["The majority are primarily management issues or have a significant management component", "Nearly all of them can be satisfied purely with hardware and software technical measures", "They apply only to federal contractors and have little relevance to other organizations", "They focus solely on confidentiality and leave integrity and availability to other standards"], "w": ["Correct. The book stresses combining technical and managerial approaches, citing Schneier's point that technology alone cannot solve security problems.", "The book argues the opposite: most areas have a significant management component.", "The book uses FIPS 200 as a useful general classification.", "FIPS 200 covers the confidentiality, integrity, and availability of information systems."], "r": "\u00a71.3 Security Functional Requirements"}, {"id": "1-81", "ch": 1, "sec": "1.4", "q": "Least privilege has a 'temporal aspect.' What does this mean?", "o": ["Special privileges should be held only when necessary and withdrawn during ordinary activities", "Privileges should automatically expire after a fixed number of days, regardless of nee
