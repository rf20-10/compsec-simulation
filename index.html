 all proxies can be supported", "It allows unlimited disk writes for logging every connection", "Its proxies share privileged code to reduce the size of the system"], "w": ["Correct. A bastion host also runs a secure OS with only essential services, may require user authentication, restricts features and hosts per proxy, and uses limited disk with read-only code.", "It runs only essential services.", "It uses limited disk and read-only code.", "Proxies are independent and non-privileged."], "r": "Ch 9 \u00b7 Bastion Hosts"}, {"id": "9-28", "ch": 9, "sec": "9.7", "q": "Why does a bastion host use limited disk use and read-only code?", "o": ["To make it hard for an attacker to install or change code", "To increase the storage capacity available for logging", "To speed up downloads for users behind the firewall", "Because a bastion host has no disk at all"], "w": ["Correct. The slides list 'Limited disk use, hence read-only code' as a common characteristic, which keeps the platform hardened.", "Not the reason.", "Not the reason.", "Not stated."], "r": "Ch 9 \u00b7 Bastion Hosts"}, {"id": "9-29", "ch": 9, "sec": "9.7", "q": "Which is an ADVANTAGE of host-based firewalls?", "o": ["Rules tailored to the host, protection independent of topology, extra layer", "They protect the entire network perimeter on their own, without any other firewall", "They require no configuration once installed on a host", "They replace the need for network firewalls"], "w": ["Correct. Their common location is a server.", "They protect an individual host.", "Not stated.", "They are an additional layer."], "r": "Ch 9 \u00b7 Host-Based Firewalls"}, {"id": "9-30", "ch": 9, "sec": "9.7", "q": "What is the primary role of a personal firewall?", "o": ["To deny unauthorized remote access to the computer", "To route traffic between the home network and several ISPs", "To host public Web servers for the household", "To replace anti-virus software on the computer"], "w": ["Correct. It may also monitor outgoing traffic to detect and block worms and malware activity.", "Not its role.", "Not its role.", "Not its role."], "r": "Ch 9 \u00b7 Personal Firewall"}, {"id": "9-31", "ch": 9, "sec": "9.7", "q": "Personal firewalls are typically:", "o": ["Much less complex than server-based firewalls, often a PC software module", "More complex than enterprise firewalls, because they protect every application", "Only stand-alone hardware appliances sold for corporate networks", "Used only by government agencies to protect classified laptops"], "w": ["Correct. This is how personal firewalls are typically described.", "They are less complex.", "They're often software.", "They're for home and corporate use."], "r": "Ch 9 \u00b7 Personal Firewall"}, {"id": "9-32", "ch": 9, "sec": "9.8", "q": "Which firewall topology uses a single router between internal and external networks with stateless or full packet filtering?", "o": ["Screening router", "Single bastion inline", "Double bastion T", "Host-resident firewall"], "w": ["Correct. This is a screening router.", "Single bastion inline is a single firewall device between an internal and an external router.", "Double bastion T puts the DMZ on a separate interface of the bastion firewall.", "A host-resident firewall is software on a PC or server."], "r": "Ch 9 \u00b7 Firewall Topologies"}, {"id": "9-33", "ch": 9, "sec": "9.8", "q": "Which topology has a third network interface on the bastion leading to a DMZ where externally visible servers are placed?", "o": ["Single bastion T", "Single bastion inline", "Double bastion inline", "Screening router"], "w": ["Correct. This is single bastion T.", "Single bastion inline has no DMZ interface.", "Double bastion inline sandwiches the DMZ between two bastion firewalls.", "A screening router is a single router."], "r": "Ch 9 \u00b7 Firewall Topologies"}, {"id": "9-34", "ch": 9, "sec": "9.8", "q": "In which topology is the DMZ sandwiched between bastion firewalls?", "o": ["Double bastion inline", "Double bastion T", "Single bastion T", "Distributed firewall configuration"], "w": ["Correct. This is double bastion inline.", "In double bastion T, the DMZ is on a separate network interface of the bastion firewall.", "Single bastion T has one bastion.", "A distributed configuration is used by large businesses and governments."], "r": "Ch 9 \u00b7 Firewall Topologies"}, {"id": "9-35", "ch": 9, "sec": "9.8", "q": "Which firewall topology is described as used by large businesses and government organizations?", "o": ["Distributed firewall configuration", "Screening router", "Host-resident firewall", "Single bastion inline"], "w": ["Correct. This is the distributed firewall configuration (Figure 9.4).", "A screening router is simple.", "Not stated.", "Not stated."], "r": "Ch 9 \u00b7 Firewall Topologies; Figure 9.4"}, {"id": "9-36", "ch": 9, "sec": "9.8", "q": "In firewall topologies, what is a DMZ?", "o": ["A network segment for externally visible servers, separated by the firewall", "The internal LAN where employees' workstations are placed", "The ISP's backbone network outside the external router, beyond the firewall", "A type of honeypot used only to trap attackers"], "w": ["Correct. In single bastion T, the DMZ sits on a third bastion interface.", "Not the DMZ.", "Not the DMZ.", "Not the definition."], "r": "Ch 9 \u00b7 Firewall Topologies"}, {"id": "9-37", "ch": 9, "sec": "9.9", "q": "An intrusion prevention system (IPS), also known as an intrusion detection and prevention system (IDPS), is:", "o": ["An extension of an IDS that can also try to block detected malicious activity", "A replacement for all of the firewalls on the network perimeter and on hosts", "A honeypot that lures attackers away from real systems", "A password manager that blocks weak credentials"], "w": ["Correct. It can be host-based, network-based, or distributed/hybrid.", "Not a replacement.", "Not this.", "Not this."], "r": "Ch 9 \u00b7 Intrusion Prevention Systems (IPS)"}, {"id": "9-38", "ch": 9, "sec": "9.9", "q": "How does an IPS decide when to block traffic?", "o": ["Using IDS algorithms: anomaly or signature/heuristic detection", "It blocks all traffic until an administrator approves it", "It asks the user to approve or deny each connection", "It blocks a random sample of traffic to limit damage"], "w": ["Correct. It can block traffic, but it uses IDS algorithms to decide when.", "Not true.", "Not true.", "Not true."], "r": "Ch 9 \u00b7 Intrusion Prevention Systems (IPS)"}, {"id": "9-39", "ch": 9, "sec": "9.10", "q": "In a host-based IPS (HIPS) using signature techniques, the focus is on:", "o": ["Specific content or system-call sequences matching known malicious patterns", "Behavior patterns that indicate malware, rather than specific content", "The firewall rules configured on the host", "The strength of the passwords used on the host"], "w": ["Correct. With ANOMALY detection, the HIPS looks for behavior patterns that indicate malware.", "That's the anomaly focus.", "Not this.", "Not this."], "r": "Ch 9 \u00b7 Host-Based IPS (HIPS)"}, {"id": "9-40", "ch": 9, "sec": "9.10", "q": "Which is an example of malicious behavior addressed by a HIPS?", "o": ["Directory traversal", "Patching", "Defragmentation", "DNS name resolution"], "w": ["Correct. The examples are modification of system resources, privilege escalation, buffer overflow, access to the e-mail contact list, and directory traversal.", "Not malicious.", "Not malicious.", "Not malicious."], "r": "Ch 9 \u00b7 Host-Based IPS (HIPS)"}, {"id": "9-41", "ch": 9, "sec": "9.10", "q": "HIPS can use a sandbox approach, which is especially suited to:", "o": ["Mobile code such as Java applets and scripts, run in isolation and monitored", "Hardware drivers loaded during the boot process", "Encrypted network traffic that cannot be inspected by sensors on the network", "Firewall rules that need to be tested before deployment"], "w": ["Correct. This is the sandbox approach.", "Not stated.", "Not stated.", "Not stated."], "r": "Ch 9 \u00b7 HIPS"}, {"id": "9-42", "ch": 9, "sec": "9.10", "q": "Which areas does a HIPS typically protect on the desktop?", "o": ["System calls, file system access, registry settings, and host I/O", "Only the network routers and switches connected to the desktop", "Only the e-mail client and its attachments", "Only the BIOS and boot sequence"], "w": ["Correct. These are the four areas.", "Not a HIPS area.", "Not the full set.", "Not stated."], "r": "Ch 9 \u00b7 HIPS"}, {"id": "9-43", "ch": 9, "sec": "9.10", "q": "Some HIPS packages are designed to protect specific types of servers. In that case, what does the HIPS look for?", "o": ["Particular application attacks against those servers", "Only hardware faults that affect those servers", "Only spam e-mail directed at the servers' administrators", "Nothing beyond the general-purpose desktop protections"], "w": ["Correct. This is what a server-specific HIPS looks for.", "Not stated.", "Not stated.", "Not true."], "r": "Ch 9 \u00b7 HIPS"}, {"id": "9-44", "ch": 9, "sec": "9.10", "q": "What are the advantages of the integrated HIPS approach to endpoint security?", "o": ["The tools work closely together, prevention is broader, and management is easier", "It eliminates the need for network-level defenses such as firewalls", "It costs nothing, since it is built into every operating system", "It needs no updates once installed on each endpoint"], "w": ["Correct. The slides say a prudent approach uses HIPS as one element of defense-in-depth with network-level devices.", "Not true. Network devices are still recommended.", "Not stated.", "Not stated."], "r": "Ch 9 \u00b7 The Role of HIPS"}, {"id": "9-45", "ch": 9, "sec": "9.10", "q": "Traditionally, endpoint security has been provided by:", "o": ["Separate products such as antivirus, antispam, and personal firewalls", "A single integrated HIPS suite installed and managed on every endpoint", "Only network firewalls at the perimeter", "Only honeypots deployed inside the network"], "w": ["Correct. HIPS aims to integrate these into a single-product suite.", "That's the newer approach.", "Not true.", "Not true."], "r": "Ch 9 \u00b7 The Role of HIPS"}, {"id": "9-46", "ch": 9, "sec": "9.10", "q": "Why are security vendors focusing more on endpoint security products?", "o": ["The enterprise endpoint is now seen as the main target", "Endpoints are no longer used in most enterprises", "Network firewalls are no longer permitted", "Servers no longer have vulnerabilities"], "w": ["Correct. This is the stated reason.", "Not true.", "Not true.", "Not true."], "r": "Ch 9 \u00b7 The Role of HIPS"}, {"id": "9-47", "ch": 9, "sec": "9.11", "q": "A network-based IPS (NIPS) is:", "o": ["An inline NIDS that can modify or discard packets and tear down connections", "A passive NIDS sensor that only logs suspicious packets for later analysis", "A host-based agent that monitors system calls", "A honeypot that collects malicious traffic"], "w": ["Correct. A NIPS uses signature/heuristic and anomaly detection.", "A passive sensor is a NIDS, not a NIPS.", "A host agent is a HIPS.", "Not this."], "r": "Ch 9 \u00b7 Network-Based IPS (NIPS)"}, {"id": "9-48", "ch": 9, "sec": "9.11", "q": "To provide flow data protection, a NIPS requires:", "o": ["That the application payload in a sequence of packets be reassembled", "That all packets in the flow be encrypted end-to-end between the hosts", "That users authenticate before each flow begins", "That traffic be mirrored offline for later analysis"], "w": ["Correct. Flow data protection requires reassembling the payload.", "Not required.", "Not required.", "Not required."], "r": "Ch 9 \u00b7 Network-Based IPS (NIPS)"}, {"id": "9-49", "ch": 9, "sec": "9.11", "q": "Which is NOT one of the methods listed for a NIPS to identify malicious packets?", "o": ["Password cracking", "Pattern matching", "Stateful matching", "Protocol anomaly"], "w": ["Correct. Password cracking is not a NIPS method. The listed methods are pattern matching, stateful matching, protocol anomaly, traffic anomaly, and statistical anomaly.", "Pattern matching IS a listed method.", "Stateful matching IS a listed method.", "Protocol anomaly IS a listed method."], "r": "Ch 9 \u00b7 Network-Based IPS (NIPS)"}, {"id": "9-50", "ch": 9, "sec": "9.12", "q": "The Digital Immune System is:", "o": ["A comprehensive malware defense developed by IBM and refined by Symantec", "A biometric authentication scheme for administrators of the network's servers", "A firewall topology for large enterprises", "A Snort rule action for malware packets"], "w": ["Correct. Its success depends on the malware analysis system's ability to detect new and innovative strains.", "Not this.", "Not this.", "Not this."], "r": "Ch 9 \u00b7 Digital Immune System"}, {"id": "9-51", "ch": 9, "sec": "9.12", "q": "Which motivated the development of the Digital Immune System?", "o": ["Rising Internet malware, faster propagation, and the need for a global view", "Declining malware threats that made local scanning sufficient", "Cheaper hardware for running anti-virus on every host", "Password policies that required central enforcement"], "w": ["Correct. These are the stated motivations.", "Not true.", "Not stated.", "Not stated."], "r": "Ch 9 \u00b7 Digital Immune System"}, {"id": "9-52", "ch": 9, "sec": "9.13", "q": "Snort Inline enables Snort to function as:", "o": ["An intrusion prevention system", "A packet-filter-only router", "A password cracker", "A honeypot only"], "w": ["Correct. Snort Inline adds the drop, reject, and sdrop actions, plus a replace option.", "Not this.", "Not this.", "It can support honeypots, but its function is IPS."], "r": "Ch 9 \u00b7 Snort Inline"}, {"id": "9-53", "ch": 9, "sec": "9.13", "q": "Snort Inline's replace option allows the user to modify packets rather than drop them. Why is this useful for a honeypot?", "o": ["Attackers see the failure but cannot figure out why it occurred", "It speeds up the attacker so the honeypot can record more activity", "It hides the honeypot's existence from the administrator", "It encrypts the honeypot's traffic so attackers cannot read it"], "w": ["Correct. This is the stated benefit.", "Not the reason.", "Not the reason.", "Not the reason."], "r": "Ch 9 \u00b7 Snort Inline"}, {"id": "9-54", "ch": 9, "sec": "9.13", "q": "In Snort Inline, the 'reject' action differs from 'drop' in that:", "o": ["The packet is rejected, the result is logged, and an error message is returned", "The packet is dropped silently, and the result is neither logged nor reported", "The packet is ignored and allowed to continue", "The packet is modified rather than dropped"], "w": ["Correct. This is the reject action.", "That's sdrop.", "That's pass.", "That's replace."], "r": "Ch 9 \u00b7 Snort Inline"}, {"id": "9-55", "ch": 9, "sec": "9.14", "q": "Figure 9.6 illustrates which type of appliance?", "o": ["A UTM appliance", "A bastion host", "A honeypot", "A screening router"], "w": ["Correct. Figure 9.6 shows a UTM appliance (based on [JAME06]).", "Not Figure 9.6.", "Not Figure 9.6.", "Not Figure 9.6."], "r": "Ch 9 \u00b7 Figure 9.6"}, {"id": "9-56", "ch": 9, "sec": "9.2", "q": "Which firewall filter characteristic is typically used for inside users who identify themselves using some form of secure authentication technology?", "o": ["User identity", "IP address and protocol values", "Network activity", "Application protocol"], "w": ["Correct. This is user identity filtering.", "Address and protocol filtering is used by packet filters.", "Network activity filtering is based on time, rate, and patterns.", "Application protocol filtering is used by application gateways."], "r": "Ch 9 \u00b7 Firewall Filter Characteristics"}, {"id": "9-57", "ch": 9, "sec": "9.4", "q": "Compared to a simple packet filter, a stateful inspection firewall additionally:", "o": ["Tracks TCP connections and admits inbound packets only for established ones", "Authenticates every user before allowing a connection", "Relays all application data through a proxy for each protocol", "Reassembles all application payloads for inspection"], "w": ["Correct. This is the key addition.", "Not stated.", "That's an application gateway.", "Not stated."], "r": "Ch 9 \u00b7 Stateful Inspection Firewall"}, {"id": "9-59", "ch": 9, "sec": "9.1", "q": "Why may relying only on host-based security be insufficient or not cost effective for a large network?", "o": ["Every potentially affected system must be upgraded when a flaw is found, needing scalable configuration management and aggressive patching", "Host-based security features cannot be installed on any of the servers, only on the workstations that individual users log on to each day", "Host-based security blocks all Internet access, so users turn to wireless broadband links that bypass the network", "Every host must run the same operating system version before any host-based security feature can be enabled"], "w": ["Correct. With hundreds or thousands of systems running various operating systems, this is difficult, though possible and necessary if only host-based security is used.", "Host-based security can be used on servers as well as workstations.", "Host-based security does not block all Internet access.", "The difficulty comes from the variety of systems, but there is no requirement that they all match."], "r": "\u00a79.1 The Need for Firewalls"}, {"id": "9-60", "ch": 9, "sec": "9.1", "q": "More generally, the chapter describes a firewall as:", "o": ["A boundary system that separates different security domains within and between organizations", "An endpoint product that scans each file stored on a host for the signatures of known malware", "A decoy system that lures attackers away from the organization's critical systems", "A monitoring system that alerts on intrusions but does not affect traffic"], "w": ["Correct. It protects the internal network from attacks and provides a single choke point where security and auditing can be imposed.", "That describes anti-virus software.", "That describes a honeypot.", "That describes an intrusion detection system."], "r": "\u00a79.1 The Need for Firewalls"}, {"id": "9-62", "ch": 9, "sec": "9.2", "q": "The design goal that all traffic between inside and outside must pass through the firewall is achieved by:", "o": ["Physically blocking all access to the local network except via the firewall", "Encrypting all of the traffic that leaves the local network for the Internet", "Installing a host-based firewall on each system in the local network", "Requiring each user to authenticate before using the local network"], "w": ["Correct. This is the first of the three design goals listed from [BELL94].", "Encryption does not force traffic through the firewall.", "Host-based firewalls add protection but do not create the single path.", "User authentication is a filter characteristic, not how this goal is met."], "r": "\u00a79.2 Firewall Characteristics and Access Policy"}, {"id": "9-66", "ch": 9, "sec": "9.2", "q": "Filtering on the basis of authorized application protocol data, such as checking SMTP e-mail for spam, is used by which type of firewall?", "o": ["An application-level gateway", "A packet filtering firewall", "A circuit-level gateway", "A screening router"], "w": ["Correct. The gateway relays and monitors the exchange of information for specific application protocols.", "A packet filter does not examine upper-layer data.", "A circuit-level gateway relays segments without examining their contents.", "A screening router performs packet filtering only."], "r": "\u00a79.2 Firewall Characteristics and Access Policy"}, {"id": "9-67", "ch": 9, "sec": "9.2", "q": "Why does the use of a single choke point simplify security management?", "o": ["Security capabilities are consolidated on a single system or set of systems", "Internal threats can no longer reach any of the hosts behind the choke point", "Each host behind the choke point no longer needs any security patches", "Traffic passing the choke point no longer has to be logged or audited"], "w": ["Correct. The choke point keeps unauthorized users out, prohibits vulnerable services, and protects against IP spoofing and routing attacks.", "A firewall may not fully protect against internal threats.", "Hosts still need patching; the firewall is an additional layer.", "The firewall is a location for monitoring; audits and alarms can be implemented on it."], "r": "\u00a79.2 Firewall Characteristics and Access Policy"}, {"id": "9-69", "ch": 9, "sec": "9.2", "q": "How can a firewall be used to implement virtual private networks?", "o": ["By serving as the platform for IPSec, using its tunnel mode capability", "By acting as a network address translator for the local network's addresses", "By filtering on the time of request and the rate of requests", "By running a proxy for each application the users need"], "w": ["Correct. A firewall can serve as the platform for IPSec, and tunnel mode can be used to implement VPNs.", "NAT is a separate, non-security function of the firewall.", "That is filtering on network activity.", "That describes an application-level gateway."], "r": "\u00a79.2 Firewall Characteristics and Access Policy"}, {"id": "9-70", "ch": 9, "sec": "9.2", "q": "Which of the following is given as a way that attacks can bypass the firewall?", "o": ["Internal systems may have wired or mobile broadband capability to connect to an ISP", "External systems may send it packets whose source port number is anywhere above 1023", "Internal systems may use a proxy to reach Web sites on the Internet", "External systems may be denied access by the default discard policy"], "w": ["Correct. An internal LAN may also have direct connections to peer organizations that bypass the firewall.", "That traffic still passes through the firewall.", "Proxy traffic passes through the firewall.", "Denied traffic has not bypassed the firewall."], "r": "\u00a79.2 Firewall Characteristics and Access Policy"}, {"id": "9-72", "ch": 9, "sec": "9.2", "q": "Which limitation of firewalls involves devices such as a laptop, PDA, or portable storage device?", "o": ["They may be used and infected outside the corporate network, then attached and used internally", "They cannot be assigned a network address that any of the firewall's filtering rules can match", "They always connect by wireless links that the firewall is unable to filter", "They hold too little data to be of any interest to an external attacker"], "w": ["Correct. The infection is carried past the firewall rather than through it.", "This is not the limitation described.", "This is not the limitation described.", "This is not the limitation described."], "r": "\u00a79.2 Firewall Characteristics and Access Policy"}, {"id": "9-73", "ch": 9, "sec": "9.3", "q": "What is the difference between a firewall operating as a positive filter and as a negative filter?", "o": ["A positive filter passes only packets that meet specific criteria; a negative filter rejects any packet that meets certain criteria", "A positive filter rejects only packets that meet specific criteria; a negative filter passes any packet that meets certain criteria", "A positive filter examines the packet payload; a negative filter examines only the protocol headers of each packet", "A positive filter applies to outbound packets; a negative filter applies to the packets that are inbound"], "w": ["Correct. In both cases the criteria implement the firewall's access policy.", "This reverses the two definitions.", "What is examined depends on the type of firewall, not on positive versus negative filtering.", "The distinction is not about direction."], "r": "\u00a79.3 Types of Firewalls"}, {"id": "9-76", "ch": 9, "sec": "9.3", "q": "Which statement about the default discard policy is given in the chapter?", "o": ["It is the policy likely to be preferred by businesses and government organizations", "It is the policy that increases ease of use for end users of the network", "It is the policy under which the administrator reacts to each new threat", "It is the policy that is used mainly by organizations that are generally more open"], "w": ["Correct. It is more conservative: everything is blocked at first and services are added case by case.", "Ease of use for end users is a feature of the default forward policy.", "Reacting to each new threat as it becomes known describes the default forward policy.", "More open organizations may use default forward, though its use is not recommended."], "r": "\u00a79.3 Packet Filtering Firewall"}, {"id": "9-78", "ch": 9, "sec": "9.3", "q": "In Table 9.1, what is rule 2 (Out, Internal to External, TCP, destination port >1023, Permit) intended to allow?", "o": ["A response to an inbound SMTP connection", "Outbound mail to an external source", "A response to an outbound SMTP connection", "Inbound mail from an external source"], "w": ["Correct. Rule 1 lets inbound mail reach port 25; rule 2 lets the reply go back out to the client's high-numbered port.", "That is rule 3, with destination port 25.", "That is rule 4, an inbound rule.", "That is rule 1."], "r": "\u00a79.3 Packet Filtering Firewall \u00b7 Table 9.1"}, {"id": "9-79", "ch": 9, "sec": "9.3", "q": "What problem does the chapter identify with rule 4 of Table 9.1 as first written?", "o": ["It allows external traffic to any destination port above 1023", "It blocks all responses to outbound SMTP connections", "It denies inbound mail that is sent to port 25", "It permits outbound traffic to any port at all"], "w": ["Correct. An external attacker could, for example, connect from port 5150 to an internal Web proxy server on port 8080.", "Rule 4 is intended to allow those responses, and it does.", "Inbound mail to port 25 is handled by rule 1.", "Rule 4 is an inbound rule."], "r": "\u00a79.3 Packet Filtering Firewall \u00b7 Table 9.1"}, {"id": "9-80", "ch": 9, "sec": "9.3", "q": "To counter the first weakness in the Table 9.1 rule set, a source port field is added to each row. How is it set?", "o": ["Source port 25 for rules 2 and 4; source port >1023 for rules 1 and 3", "Source port 25 for rules 1 and 3; source port >1023 for rules 2 and 4", "Source port 8080 for rules 2 and 4; source port 5150 for rules 1 and 3", "Source port 25 for all four rules; any source port for rule 5"], "w": ["Correct. Rules 2 and 4 carry replies from an SMTP server (port 25); rules 1 and 3 carry requests from a client port above 1023.", "This reverses the assignment.", "Ports 5150 and 8080 are from the example exploit, not the fix.", "Clients use high-numbered ports, so not all rules can use 25."], "r": "\u00a79.3 Packet Filtering Firewall \u00b7 Table 9.1"}, {"id": "9-82", "ch": 9, "sec": "9.3", "q": "How is the revised rule 4 of Table 9.1 finally tightened against packets that merely use source port 25?", "o": ["An ACK flag field is added, requiring the ACK flag to be set on the incoming packet", "A user identity field is added, requiring the sender to authenticate to the firewall", "A payload field is added, requiring the packet to contain valid SMTP commands", "A time field is added, requiring the packet to arrive during business hours"], "w": ["Correct. Once a connection is set up, the ACK flag of a TCP segment is set to acknowledge segments from the other side.", "Most packet filters do not support advanced user authentication.", "Packet filters do not examine upper-layer data.", "This is not the fix described."], "r": "\u00a79.3 Packet Filtering Firewall \u00b7 Table 9.1"}, {"id": "9-83", "ch": 9, "sec": "9.3", "q": "Because packet filter firewalls do not examine upper-layer data, what follows?", "o": ["If a given application is allowed, all functions available within it are permitted", "If a given application is allowed, each user of it must first be authenticated to it", "If a given application is allowed, its traffic is logged in complete detail", "If a given application is allowed, its packets are reassembled and scanned"], "w": ["Correct. A packet filter cannot block specific application commands or prevent attacks that use application-specific vulnerabilities.", "Most packet filters do not support advanced user authentication schemes.", "Packet filter logging is limited.", "Reassembling payloads is done by devices such as a NIPS, not a packet filter."], "r": "\u00a79.3 Packet Filtering Firewall"}, {"id": "9-86", "ch": 9, "sec": "9.3", "q": "What is the countermeasure to IP address spoofing against a packet filtering firewall?", "o": ["Discard packets with an inside source address if they arrive on an external interface", "Discard all packets that use the source routing option in the IP header", "Require the first fragment to hold a predefined minimum amount of the transport header", "Require the ACK flag to be set on every packet that enters the network"], "w": ["Correct. This countermeasure is often implemented at the router external to the firewall.", "That is the countermeasure to source routing attacks.", "That is the countermeasure to tiny fragment attacks.", "The ACK flag check was the fix for the SMTP rule set, not for address spoofing."], "r": "\u00a79.3 Packet Filtering Firewall"}, {"id": "9-87", "ch": 9, "sec": "9.3", "q": "What is a source routing attack on a packet filtering firewall, as described in the chapter?", "o": ["The source station specifies the route a packet should take, hoping to bypass security measures", "The source station claims the IP address of an internal host that the firewall is set up to trust", "The source station splits the packet so the TCP header sits in a separate fragment", "The source station uses port 25 so that its packets look like replies to mail"], "w": ["Correct. It hopes to bypass measures that do not analyze the source routing information; the countermeasure is to discard all packets that use this option.", "That is IP address spoofing.", "That is a tiny fragment attack.", "That is the weakness in the Table 9.1 rule set."], "r": "\u00a79.3 Packet Filtering Firewall"}, {"id": "9-88", "ch": 9, "sec": "9.3", "q": "What is a tiny fragment attack designed to circumvent?", "o": ["Filtering rules that depend on TCP header information", "Filtering rules that check the source IP address", "Proxies that examine application commands", "State tables that track sequence numbers"], "w": ["Correct. The intruder uses IP fragmentation to force the TCP header information into a separate packet fragment.", "Source address checks are the target of IP address spoofing.", "The attack is aimed at packet filters, not proxies.", "The attack is aimed at simple filtering on the first fragment."], "r": "\u00a79.3 Packet Filtering Firewall"}, {"id": "9-89", "ch": 9, "sec": "9.3", "q": "How can a tiny fragment attack be defeated?", "o": ["By enforcing a rule that the first fragment must contain a predefined minimum amount of the transport header", "By enforcing a rule that packets with an inside source address are dropped if they arrive on the external interface", "By enforcing a rule that every fragment must carry the complete application payload", "By enforcing a rule that fragments are accepted only from well-known port numbers"], "w": ["Correct. If the first fragment is rejected, the filter can remember the packet and discard all subsequent fragments.", "That is the countermeasure to IP address spoofing.", "This is not the countermeasure described.", "This is not the countermeasure described."], "r": "\u00a79.3 Packet Filtering Firewall"}, {"id": "9-90", "ch": 9, "sec": "9.3", "q": "What limits a traditional packet filter with regard to context?", "o": ["It makes filtering decisions on an individual packet basis", "It keeps a record of each currently established TCP connection", "It relays application data between two endpoints", "It asks each user for authentication information"], "w": ["Correct. It does not take into consideration any higher-layer context.", "That describes a stateful inspection firewall.", "That describes an application-level gateway.", "That describes an application-level gateway."], "r": "\u00a79.3 Stateful Inspection Firewalls"}, {"id": "9-91", "ch": 9, "sec": "9.3", "q": "What does the chapter say about TCP port numbers less than 1024?", "o": ["They are the 'well-known' port numbers, assigned permanently to particular applications", "They are generated dynamically and have significance only for the lifetime of one connection", "They are reserved for the firewall and cannot be used by applications", "They are used by client applications when connecting to a remote server"], "w": ["Correct. An example is 25 for server SMTP.", "That describes the numbers between 1024 and 65535.", "They are used by server applications.", "Client applications use a number between 1024 and 65535."], "r": "\u00a79.3 Stateful Inspection Firewalls"}, {"id": "9-92", "ch": 9, "sec": "9.3", "q": "Why does a simple packet filtering firewall create a vulnerability for TCP-based traffic?", "o": ["It must permit inbound network traffic on all the high-numbered ports", "It must block all outbound traffic to all of the well-known port numbers", "It must decrypt each packet before the rules are applied", "It must keep an entry for every connection ever opened"], "w": ["Correct. Replies to clients arrive on ports 1024 to 65535, so all of these must be open, which unauthorized users can exploit.", "Outbound traffic to well-known ports is what clients need.", "Packet filters do not decrypt traffic.", "Keeping entries for connections is what a stateful firewall does."], "r": "\u00a79.3 Stateful Inspection Firewalls"}, {"id": "9-95", "ch": 9, "sec": "9.3", "q": "What happens if an application-level gateway does not implement the proxy code for a specific application?", "o": ["The service is not supported and cannot be forwarded across the firewall", "The service is passed through using the ordinary packet filtering rules instead", "The service is relayed by a circuit-level function without checks", "The service is logged and allowed until a proxy has been written"], "w": ["Correct. The gateway can also be configured to support only the features of an application the administrator considers acceptable.", "There is no fallback to packet filtering.", "There is no automatic fallback to circuit-level relaying.", "Unsupported services are not forwarded."], "r": "\u00a79.3 Application-Level Gateway"}, {"id": "9-96", "ch": 9, "sec": "9.3", "q": "Why do application-level gateways tend to be more secure than packet filters?", "o": ["They need only scrutinize a few allowable applications, rather than many TCP and IP level combinations", "They add no processing overhead at all, so there is more capacity left over for checking each of the packets", "They never open a connection to the remote host, so no traffic reaches it", "They rely on well-known port numbers, which cannot be used by attackers"], "w": ["Correct. It is also easy to log and audit all incoming traffic at the application level.", "Additional processing overhead on each connection is their prime disadvantage.", "The gateway does contact the remote host and relays the traffic.", "Port numbers are what packet filters rely on."], "r": "\u00a79.3 Application-Level Gateway"}, {"id": "9-98", "ch": 9, "sec": "9.3", "q": "A gateway can be configured with application-level service on inbound connections and circuit-level functions on outbound connections. What is the effect?", "o": ["It incurs the overhead of examining incoming application data, but not outgoing data", "It incurs the overhead of examining outgoing application data, but not incoming data", "It examines the application data in both directions, at twice the usual overhead", "It examines no application data, and only decides which connections to allow"], "w": ["Correct. This suits a situation where the system administrator trusts the internal users.", "This reverses the configuration.", "Outbound connections use circuit-level functions, which do not examine contents.", "Inbound connections are still examined for forbidden functions."], "r": "\u00a79.3 Circuit-Level Gateway"}, {"id": "9-99", "ch": 9, "sec": "9.3", "q": "The SOCKS package is given as an example implementation of which type of firewall?", "o": ["Circuit-level gateway", "Application-level gateway", "Stateful inspection firewall", "Packet filtering firewall"], "w": ["Correct. Version 5 of SOCKS is specified in RFC 1928.", "SOCKS relays connections rather than acting as an application proxy.", "SOCKS is not a stateful packet inspection firewall.", "SOCKS is not a packet filter."], "r": "\u00a79.3 Circuit-Level Gateway"}, {"id": "9-102", "ch": 9, "sec": "9.3", "q": "On which TCP port is the SOCKS service located?", "o": ["1080", "1023", "8080", "1928"], "w": ["Correct. A TCP-based client opens a connection to the SOCKS port, 1080, on the SOCKS server system.", "1023 is the top of the well-known port range, not the SOCKS port.", "8080 is the Web proxy port used in the packet filter exploit example.", "1928 is the number of the RFC that specifies SOCKS version 5."], "r": "\u00a79.3 Circuit-Level Gateway"}, {"id": "9-107", "ch": 9, "sec": "9.4", "q": "How is each proxy on a bastion host configured with respect to an application's commands and the hosts it can reach?", "o": ["It supports only a subset of the command set and allows access only to specific host systems", "It supports the full command set but allows access only to hosts in the DMZ network", "It supports only a subset of the command set but allows access to every internal host", "It supports the full command set and allows access to every one of the hosts on the protected network"], "w": ["Correct. The limited command and feature set may be applied only to a subset of systems on the protected network.", "Each proxy supports only a subset of the standard application's command set.", "Each proxy allows access only to specific host systems.", "Both the commands and the reachable hosts are restricted."], "r": "\u00a79.4 Bastion Host"}, {"id": "9-109", "ch": 9, "sec": "9.4", "q": "The chapter contrasts a typical UNIX mail application with a mail proxy on a bastion host. What is the point of the comparison?", "o": ["The proxy is far smaller, under 1,000 lines against over 20,000, so it is easier to check for security flaws", "The proxy is far larger, over 20,000 lines against under 1,000, so it is able to filter a great many more commands", "The proxy is far faster, since it runs as a privileged user with direct access to the disk", "The proxy is far newer, since mail applications are no longer updated to fix security flaws"], "w": ["Correct. Each proxy module is a very small software package specifically designed for network security.", "This reverses the two sizes.", "Each proxy runs as a nonprivileged user and does almost no disk access.", "This is not the comparison made."], "r": "\u00a79.4 Bastion Host"}, {"id": "9-110", "ch": 9, "sec": "9.4", "q": "What is the benefit of each proxy on a bastion host being independent of the other proxies?", "o": ["A proxy with a problem can be uninstalled without affecting the other proxy applications", "A proxy with a problem can hand its connections over to one of the other proxies", "A single audit log can be shared, so each proxy does not need to keep its own", "A single authentication step can be shared, so users log in to all of the proxies at one time"], "w": ["Correct. The administrator can also easily install a new proxy if users need support for a new service.", "Proxies do not take over each other's connections.", "Each proxy maintains its own detailed audit information.", "Each proxy service may require its own authentication."], "r": "\u00a79.4 Bastion Host"}, {"id": "9-111", "ch": 9, "sec": "9.4", "q": "How does each proxy run on a bastion host?", "o": ["As a nonprivileged user in a private and secured directory", "As the root user in the main system directory", "As a kernel module that is loaded each time the system boots", "As a shared library used by all of the proxies"], "w": ["Correct. A proxy also generally performs no disk access other than to read its initial configuration file.", "Running as root would undermine the hardened design.", "Proxies are small user-level software packages.", "Each proxy is independent of the others."], "r": "\u00a79.4 Bastion Host"}, {"id": "9-113", "ch": 9, "sec": "9.4", "q": "What advantage does a host-based firewall give when a new type of server is added to the network?", "o": ["The server can be added with its own firewall, without altering the network firewall configuration", "The server can be added without a firewall, since the network firewall rules cover it", "The server can be placed outside the perimeter, since it no longer needs any filtering", "The server can share the firewall of another server nearby, since host rules apply across the whole network"], "w": ["Correct. Used with stand-alone firewalls, the host-based firewall provides an additional layer of protection.", "The benefit is that the server brings its own tailored firewall.", "The host-based firewall adds a layer; it does not remove the need for the others.", "Host-based rules are tailored to the individual host."], "r": "\u00a79.4 Host-Based Firewalls"}, {"id": "9-114", "ch": 9, "sec": "9.4", "q": "Which firewall functions are commonly provided in network devices such as routers and switches?", "o": ["Packet filtering and stateful inspection capabilities", "Application proxies and additional user authentication", "Sandbox analysis and patch generation", "Antivirus scanning and antispam filtering"], "w": ["Correct. They monitor and filter packet flows through the device, adding layers of protection alongside bastion hosts and host-based firewalls.", "These are typically provided on a bastion host.", "These belong to the digital immune system approach.", "These are modules of a unified threat management appliance."], "r": "\u00a79.4 Network Device Firewall"}, {"id": "9-117", "ch": 9, "sec": "9.4", "q": "Besides denying unauthorized remote access, what else can a personal firewall do?", "o": ["Monitor outgoing activity in an attempt to detect and block worms and other malware", "Relay application traffic on behalf of the other computers on the same home network", "Generate patches for vulnerable applications that malware has targeted", "Reassemble packet flows so that an antivirus engine can scan them"], "w": ["Correct. Its primary role is to deny unauthorized remote access to the computer.", "Relaying application traffic is what an application-level gateway does.", "Patch generation belongs to the hybrid digital immune architecture.", "Reassembly for content analysis is done in a UTM appliance."], "r": "\u00a79.4 Personal Firewall"}, {"id": "9-119", "ch": 9, "sec": "9.4", "q": "When a personal firewall is enabled, how are connections usually treated?", "o": ["Inbound connections are denied except those the user explicitly permits; outbound are usually allowed", "Outbound connections are denied except those the user explicitly permits; inbound are usually allowed", "Inbound and outbound connections are both denied until the user permits each one", "Inbound and outbound connections are both allowed until the user blocks each one"], "w": ["Correct. The user can selectively re-enable inbound services such as remote login or file sharing.", "This reverses the two directions.", "Outbound connections are usually allowed.", "Inbound connections are usually denied."], "r": "\u00a79.4 Personal Firewall"}, {"id": "9-121", "ch": 9, "sec": "9.4", "q": "What does stealth mode do on a personal firewall?", "o": ["Hides the system on the Internet by dropping unsolicited communication packets", "Hides the firewall's rule set from all of the other users of the same computer", "Encrypts all outbound traffic so that it cannot be read in transit", "Blocks all UDP packets so that only TCP traffic is permitted"], "w": ["Correct. Dropping unsolicited packets makes it appear as though the system is not present.", "Stealth mode is about how the system appears to the network.", "Stealth mode does not encrypt traffic.", "Blocking UDP packets is a separate advanced feature."], "r": "\u00a79.4 Personal Firewall"}, {"id": "9-123", "ch": 9, "sec": "9.5", "q": "Where is an external firewall placed?", "o": ["At the edge of a local or enterprise network, just inside the boundary router", "Between the DMZ network and the bulk of the enterprise network", "On each of the servers that need to be reached from the Internet", "Outside the boundary router, on the Internet service provider's side of the link"], "w": ["Correct. The boundary router connects to the Internet or some wide area network.", "That is where an internal firewall sits.", "That would be a host-based firewall.", "The external firewall sits inside the boundary router."], "r": "\u00a79.5 DMZ Networks \u00b7 Figure 9.2"}, {"id": "9-124", "ch": 9, "sec": "9.5", "q": "Which systems are usually located on DMZ networks?", "o": ["Systems that are externally accessible but need some protections", "Systems that hold the most sensitive internal application data", "Systems used by employees as their own daily workstations", "Systems that have no need for any external connectivity"], "w": ["Correct. Typical examples are a corporate website, an e-mail server, or a DNS server.", "Application and database servers sit behind the internal firewall.", "Workstations sit on the internal protected network.", "DMZ systems require or foster external connectivity."], "r": "\u00a79.5 DMZ Networks"}, {"id": "9-125", "ch": 9, "sec": "9.5", "q": "Compared with the external firewall, the internal firewall in a DMZ configuration:", "o": ["Adds more stringent filtering to protect enterprise servers and workstations from external attack", "Applies looser filtering, since all of the traffic that reaches it has already been checked once before", "Handles only outbound traffic, leaving inbound traffic to the external firewall", "Performs no filtering, and serves only to log traffic from the DMZ systems"], "w": ["Correct. This is the first of the internal firewall's three purposes.", "The internal firewall is more stringent, not looser.", "It provides two-way protection.", "It filters as well as protects in both directions."], "r": "\u00a79.5 DMZ Networks"}, {"id": "9-126", "ch": 9, "sec": "9.5", "q": "What is meant by the internal firewall providing two-way protection with respect to the DMZ?", "o": ["It protects the rest of the network from attacks launched from DMZ systems, and DMZ systems from the internal network", "It protects the DMZ systems from attacks from the Internet, and the Internet from attacks that are launched by DMZ systems", "It protects inbound mail from spam, and outbound mail from leaking any confidential information", "It protects wired traffic from eavesdropping, and wireless traffic from access point impersonation"], "w": ["Correct. Attacks from the DMZ might originate from worms, rootkits, bots, or other malware lodged in a DMZ system.", "Protecting the DMZ from the Internet is the external firewall's role.", "This is not what two-way protection refers to.", "This is not what two-way protection refers to."], "r": "\u00a79.5 DMZ Networks"}, {"id": "9-128", "ch": 9, "sec": "9.5", "q": "In essence, what is a virtual private network (VPN)?", "o": ["A set of computers that interconnect over a relatively unsecure network, using encryption and special protocols for security", "A set of computers that interconnect over leased private lines, using no encryption at all because the lines themselves are trusted", "A set of virtual machines that share common physical hardware, using a hypervisor to filter their traffic", "A set of proxies that run on a bastion host, using a separate audit log for each application"], "w": ["Correct. The Internet or another public network can interconnect sites, at a cost saving over a private network.", "A VPN is an alternative to a real private network using private lines.", "That describes a virtualized environment.", "That describes a bastion host."], "r": "\u00a79.5 Virtual Private Networks"}, {"id": "9-130", "ch": 9, "sec": "9.5", "q": "What is the most common protocol mechanism used to provide a VPN, and at which level does it operate?", "o": ["IP security (IPSec), at the IP level", "SOCKS, at the application level", "SMTP, at the transport level", "IDXP, at the data link level"], "w": ["Correct. IPSec protocols operate in networking devices, such as a router or firewall, that connect each LAN to the outside world.", "SOCKS is a circuit-level gateway package.", "SMTP is the mail transfer protocol.", "IDXP is for exchanging intrusion detection data."], "r": "\u00a79.5 Virtual Private Networks"}, {"id": "9-133", "ch": 9, "sec": "9.5", "q": "What is the problem if IPSec is implemented in a separate box behind (internal to) the firewall?", "o": ["VPN traffic passing through the firewall is encrypted, so the firewall cannot filter or scan it", "VPN traffic is decrypted before it reaches the firewall, so that it crosses the Internet in the clear", "VPN traffic is handled by a device that is likely to be less secure than the firewall", "VPN traffic is compressed twice, so the firewall's throughput is reduced by half"], "w": ["Correct. The firewall is unable to perform its filtering function or other security functions such as access control, logging, or scanning for viruses.", "The traffic is encrypted across the Internet; the issue is that the firewall sees only ciphertext.", "That is the drawback of implementing IPSec in the boundary router, outside the firewall.", "This is not the problem described."], "r": "\u00a79.5 Virtual Private Networks"}, {"id": "9-134", "ch": 9, "sec": "9.5", "q": "Why is the boundary router, outside the firewall, less desirable as an IPSec platform?", "o": ["The device is likely to be less secure than the firewall", "The device cannot encrypt traffic that is addressed to the WAN", "The device would hide all VPN traffic from the firewall", "The device has no network interface on the external side"], "w": ["Correct. A logical means of implementing IPSec is in the firewall itself.", "A router can run IPSec; the concern is its security.", "Hiding traffic from the firewall is the problem with a box behind the firewall.", "The boundary router connects to the Internet or WAN."], "r": "\u00a79.5 Virtual Private Networks"}, {"id": "9-135", "ch": 9, "sec": "9.5", "q": "What does a distributed firewall configuration involve?", "o": ["Stand-alone firewall devices plus host-based firewalls working together under central administrative control", "Several stand-alone firewall devices placed in sequence, with each one of them administered by a separate team", "A single firewall appliance that integrates antivirus, intrusion prevention, and VPN functions", "A set of proxies on one bastion host, each of which is independent of the other proxies"], "w": ["Correct. Tools let the network administrator set policies and monitor security across the entire network.", "The defining features are host-based firewalls and central administrative control.", "That describes a unified threat management appliance.", "That describes a bastion host."], "r": "\u00a79.5 Distributed Firewalls \u00b7 Figure 9.4"}, {"id": "9-138", "ch": 9, "sec": "9.5", "q": "The screening router arrangement is described as typical for which kind of application?", "o": ["Small office/home office (SOHO) applications", "Medium to large organizations", "Large businesses and government organizations", "Enterprise cloud data centers"], "w": ["Correct. It is a single router between internal and external networks with stateless or full packet filtering.", "Single bastion T is common for medium to large organizations.", "The double bastion configurations are common for large businesses and government organizations.", "This is not the setting named."], "r": "\u00a79.5 Summary of Firewall Locations and Topologies"}, {"id": "9-139", "ch": 9, "sec": "9.5", "q": "Which topology is described as the typical firewall appliance configuration for small to medium-sized organizations?", "o": ["Single bastion inline", "Single bastion T", "Double bastion inline", "Screening router"], "w": ["Correct. A single firewall device sits between an internal and external router, and may implement stateful filters and/or application proxies.", "Single bastion T adds a third interface to a DMZ and is common for medium to large organizations.", "Double bastion inline is common for large businesses and government organizations.", "A screening router is typical for small office/home office applications."], "r": "\u00a79.5 Summary of Firewall Locations and Topologies"}, {"id": "9-140", "ch": 9, "sec": "9.5", "q": "In the double bastion T topology, illustrated by Figure 8.5, where is the DMZ?", "o": ["On a separate network interface on the bastion firewall", "Sandwiched between the two bastion firewalls", "Outside the external firewall, with no protection", "On each host, protected by host-resident firewalls"], "w": ["Correct. This configuration is also common for large businesses and government organizations and may be required.", "That is the double bastion inline topology.", "The DMZ is protected by the bastion firewall.", "That describes host-resident firewalls, not this topology."], "r": "\u00a79.5 Summary of Firewall Locations and Topologies"}, {"id": "9-143", "ch": 9, "sec": "9.6", "q": "Once malicious activity has been detected, how can an IPS respond?", "o": ["By modifying or blocking network packets, or modifying or blocking system calls by programs on a host", "By sending an alert to the operator and logging the event, but leaving the traffic itself entirely unchanged", "By opening a new connection to the attacker's system to collect evidence of the attack", "By rewriting the firewall access policy and distributing it to all of the hosts"], "w": ["Correct. Packets can be modified or blocked across a perimeter or into a host.", "Alerting and logging without acting on the traffic describes an IDS.", "This is not a response the chapter describes.", "This is not a response the chapter describes."], "r": "\u00a79.6 Intrusion Prevention Systems"}, {"id": "9-145", "ch": 9, "sec": "9.6", "q": "Among the malicious behaviors addressed by a HIPS, how do rootkits, Trojan horses, and backdoors operate?", "o": ["By changing system resources, such as libraries, directories, registry settings, and user accounts", "By mailing a copy of themselves to each of the addresses found in the local system's e-mail address book", "By accessing files outside the range a server application user would normally need", "By attempting to give ordinary users root access through a local vulnerability"], "w": ["Correct. This is the 'modification of system resources' category.", "That is 'access to e-mail contact list', how many worms spread.", "That is directory traversal.", "That is a privilege-escalation exploit."], "r": "\u00a79.6 Host-Based IPS"}, {"id": "9-147", "ch": 9, "sec": "9.6", "q": "In the HIPS sandbox approach, what happens to code that violates predefined policies or matches predefined behavior signatures?", "o": ["It is halted and prevented from executing in the normal system environment", "It is patched and then released to run in the normal system environment", "It is logged and then allowed to continue running inside the sandbox", "It is forwarded to the firewall, which decides whether it may run"], "w": ["Correct. The HIPS quarantines the code in an isolated system area, runs it, and monitors its behavior.", "The sandbox halts offending code; it does not patch it.", "Offending code is halted.", "The HIPS makes the decision on the host."], "r": "\u00a79.6 Host-Based IPS"}, {"id": "9-148", "ch": 9, "sec": "9.6", "q": "Why can a HIPS usefully examine each system call for malicious characteristics?", "o": ["Any exploit code will execute at least one system call", "Any system call is recorded in the system registry", "Any system call requires the user to authenticate", "Any exploit code is delivered inside a system call"], "w": ["Correct. User applications invoke system calls to the kernel to use resources such as memory, I/O devices, and processor.", "The registry holds configuration information, not a record of system calls.", "System calls do not each require user authentication.", "Exploit code makes system calls; it is not delivered inside one."], "r": "\u00a79.6 Host-Based IPS"}, {"id": "9-151", "ch": 9, "sec": "9.6", "q": "In a NIPS, what happens when a flow is determined to be malicious under flow data protection?", "o": ["The latest and all subsequent packets belonging to the suspect flow are dropped", "The packets that were already delivered are then recalled from the destination host", "The flow is redirected to a honeypot for the rest of the session", "The source address is added to the packet filter's rule set"], "w": ["Correct. The IPS applies filters to the full content of the flow every time a new packet for the flow arrives.", "Delivered packets cannot be recalled.", "This is not what flow data protection does.", "This is not what flow data protection does."], "r": "\u00a79.6 Network-Based IPS"}, {"id": "9-152", "ch": 9, "sec": "9.6", "q": "Which NIPS method scans incoming packets for specific byte sequences stored in a database of known attacks?", "o": ["Pattern matching", "Stateful matching", "Protocol anomaly", "Statistical anomaly"], "w": ["Correct. The byte sequences are the signatures.", "Stateful matching scans for attack signatures in the context of a traffic stream rather than individual packets.", "Protocol anomaly looks for deviation from standards set forth in RFCs.", "Statistical anomaly develops baselines of normal traffic and alerts on deviations."], "r": "\u00a79.6 Network-Based IPS"}, {"id": "9-153", "ch": 9, "sec": "9.6", "q": "Which NIPS method looks for deviation from standards set forth in RFCs?", "o": ["Protocol anomaly", "Traffic anomaly", "Statistical anomaly", "Pattern matching"], "w": ["Correct. Protocol anomaly checks traffic against the protocol standards.", "Traffic anomaly watches for unusual traffic activities.", "Statistical anomaly compares activity with baselines of normal traffic and throughput.", "Pattern matching looks for specific byte sequences."], "r": "\u00a79.6 Network-Based IPS"}, {"id": "9-154", "ch": 9, "sec": "9.6", "q": "A flood of UDP packets, or a new service appearing on the network, is an example of what which NIPS method watches for?", "o": ["Traffic anomaly", "Protocol anomaly", "Stateful matching", "Pattern matching"], "w": ["Correct. Traffic anomaly watches for unusual traffic activities such as these.", "Protocol anomaly looks for deviation from RFC standards.", "Stateful matching scans for signatures in the context of a traffic stream.", "Pattern matching scans for specific byte sequences."], "r": "\u00a79.6 Network-Based IPS"}, {"id": "9-155", "ch": 9, "sec": "9.6", "q": "How does a distributed or hybrid IPS operate?", "o": ["Sensors relay data to a central analysis system, which returns updated signatures and behavior patterns", "Each sensor analyzes its own data alone, and blocks traffic without ever informing any of the other systems", "A single inline device inspects all traffic, and reports each of its decisions to the vendor", "Each host exchanges its rule set with its peers, and adopts whichever rules are most common"], "w": ["Correct. This lets all the coordinated systems respond to and defend against malicious behavior.", "The approach depends on central correlation and coordination.", "It gathers data from a large number of host and network-based sensors.", "This is not how the approach is described."], "r": "\u00a79.6 Distributed or Hybrid IPS"}, {"id": "9-156", "ch": 9, "sec": "9.6", "q": "What is the objective of the digital immune system?", "o": ["To provide rapid response time, so malware can be stamped out almost as soon as it is introduced", "To provide a single device that integrates the firewall, VPN, and antivirus functions", "To provide a decoy network that keeps attackers occupied while defenses are prepared", "To provide a standard format for exchanging alert messages between different intrusion detection systems"], "w": ["Correct. It expands on sandbox analysis to give a general-purpose emulation and malware detection system.", "That describes a unified threat management system.", "That describes a honeypot network.", "That describes the intrusion detection exchange format."], "r": "\u00a79.6 Distributed or Hybrid IPS \u00b7 Digital Immune System"}, {"id": "9-161", "ch": 9, "sec": "9.6", "q": "Which three new rule types does Snort Inline add to provide intrusion prevention features?", "o": ["Drop, reject, and sdrop", "Alert, log, and pass", "Activate, dynamic, and replace", "Block, reset, and quarantine"], "w": ["Correct. Drop rejects and logs; reject also returns an error message; sdrop rejects without logging.", "These are standard Snort actions that do not block packets.", "Replace is an option that modifies packets, and activate and dynamic are standard actions.", "These are not the names of the rule types."], "r": "\u00a79.6 Snort Inline"}, {"id": "9-163", "ch": 9, "sec": "9.7", "q": "What does the chapter give as the downside of implementing antivirus, IPS, IDS, and firewalls piecemeal?", "o": ["The need to configure, deploy, and manage a range of devices and software packages", "The need to buy every product from one vendor to make sure they all work together", "The loss of defense in depth, since the products duplicate each other's functions", "The loss of all logging, since each product assumes that another one keeps the logs"], "w": ["Correct. In addition, deploying a number of devices in sequence can reduce performance.", "This is not the downside given.", "The piecemeal implementation does provide defense in depth.", "This is not the downside given."], "r": "\u00a79.7 Unified Threat Management Products"}, {"id": "9-164", "ch": 9, "sec": "9.7", "q": "According to the IDC definition, what must an appliance be able to perform to be included in the unified threat management (UTM) category?", "o": ["Network firewalling, network intrusion detection and prevention, and gateway anti-virus", "Packet filtering, circuit-level relaying, and application-level proxying of all network traffic", "Sandbox analysis, patch generation, and automatic patch distribution", "Log aggregation, firewall statistics, and remote host monitoring"], "w": ["Correct. The capabilities need not all be used concurrently, but the functions must exist inherently in the appliance.", "These are firewall types, not the IDC requirement.", "These belong to the hybrid digital immune architecture.", "These are distributed firewall monitoring functions."], "r": "\u00a79.7 Unified Threat Management Products"}, {"id": "9-165", "ch": 9, "sec": "9.7", "q": "What is a significant issue with a UTM device, and what figure is reported for it?", "o": ["Performance: typical throughput losses for current commercial devices are 50%", "Coverage: typical devices recognize only 50% of the known attack signatures", "Reliability: typical devices fail within four years of being put into service", "Cost: typical devices cost 50% more than the separate products they replace"], "w": ["Correct. Customers are advised to get very high-performance, high-throughput devices to minimize the apparent degradation.", "The issue named is performance, both throughput and latency.", "The four-year figure is from the San Diego Supercomputer Center example.", "Cost is not the issue named."], "r": "\u00a79.7 Unified Threat Management Products"}, {"id": "9-166", "ch": 9, "sec": "9.7", "q": "In the UTM appliance architecture of Figure 9.6, what is the data analysis engine responsible for?", "o": ["Keeping track of packet flows and coordinating the work of the antivirus, IDS, and IPS engines", "Decrypting inbound traffic before the initial firewall module inspects it", "Optimizing performance using priority and quality-of-service algorithms", "Issuing alerts for specified conditions and storing the data that is needed for forensic analysis"], "w": ["Correct. It also reassembles multipacket payloads for content analysis by the antivirus engine and the Web filtering and antispam modules.", "Decryption happens first, for example in the VPN module.", "That is the bandwidth-shaping module.", "That is the logging and reporting module."], "r": "\u00a79.7 Unified Threat Management Products \u00b7 Figure 9.6"}]</script>
<script>
(function(){
"use strict";
/* ============ data ============ */
const BANK = JSON.parse(document.getElementById("bank").textContent);
const CH = {1:"Computer Security Overview",2:"Cryptographic Tools",3:"User Authentication",4:"Access Control",5:"Database & Data Center Security",6:"Malicious Software",7:"Denial-of-Service Attacks",8:"Intrusion Detection",9:"Firewalls & Intrusion Prevention"};
const CHS = [1,2,3,4,5,6,7,8,9];
const EXAM_N = 50, EXAM_SEC = 75*60, PACE = 90;
const LS_KEY = "compsec.sim.v1", LS_SESS = "compsec.sim.session.v1";

let prog = {};    // id -> [seen, correct, last(1|0), ts]
let hist = {};    // key -> {m, ts, n, c, dur, lim, ch:{ch:[c,n]}}
let custom = {};  // id -> question (imported)
let S = null;     // active session

const $ = (s, el=document) => el.querySelector(s);
const app = $("#app"), layer = $("#layer");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// An imported question that repeats a built-in one (same question and options) is hidden, so nothing is asked twice.
const qkey = q => (q.q+"|"+q.o.slice().sort().join("|")).toLowerCase().replace(/\s+/g," ").trim();
let BKEYS = null;
const bankKey = q => { if(!BKEYS){ BKEYS=new Map(); BANK.forEach(b=>BKEYS.set(qkey(b), b.id)); } return BKEYS.get(qkey(q)); };
const liveCustom = () => Object.values(custom).filter(q => !bankKey(q));
const allQ = () => BANK.concat(liveCustom());
// Progress made on a hidden imported copy carries over to the built-in question.
function adoptDupes(){ let ch=false; Object.values(custom).forEach(q=>{ const b=bankKey(q); if(b && prog[q.id] && !prog[b]){ prog[b]=prog[q.id]; Sync.queue("progress", b, prog[b]); ch=true; } }); if(ch) saveLocal(); }
const byId = id => QIDX[id] || custom[id];
let QIDX = {}; BANK.forEach(q => QIDX[q.id] = q);
const now = () => Date.now();
const fmtT = s => { s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return (m<10?"0":"")+m+":"+(r<10?"0":"")+r; };
const pct = (a,b) => b ? Math.round(100*a/b) : 0;
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const LET = ["A","B","C","D"];
const ICON = {
  flag:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 18V3m0 1h10l-2 3.5L14 11H4"/></svg>',
  grid:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="12" y="3" width="5" height="5" rx="1"/><rect x="3" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/></svg>',
  x:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l10 10M15 5 5 15"/></svg>',
  book:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5C5.5 3.5 8 3.6 10 5c2-1.4 4.5-1.5 7-.5v11c-2.5-1-5-.9-7 .5-2-1.4-4.5-1.5-7-.5v-11Z"/><path d="M10 5v11"/></svg>'
};

/* ============ storage: browser cache + synced store ============ */
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
(function loadLocal(){ const d = lsGet(LS_KEY); if(d){ prog=d.prog||{}; hist=d.hist||{}; custom=d.custom||{}; } })();
function saveLocal(){ lsSet(LS_KEY, {prog, hist, custom}); }

const Sync = {
  mode:"local", refs:null, pend:{progress:{}, history:{}, custom:{}}, chain:Promise.resolve(), timer:null,
  setBadge(s){ const el=$("#sync"); el.dataset.s=s; el.lastElementChild.textContent = s==="cloud"?"Synced":s==="saving"?"Saving…":"This device"; el.title = s==="local"?"Progress is saved in this browser only":"Progress syncs across your devices"; },
  async init(){
    this.setBadge("local");
    if(!window.claude || typeof window.claude.use!=="function") return;
    try{
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if(!db || !user) return;
      const uid = await user.id(); if(!uid) return;
      const base = "data/users/"+uid+"/";
      this.refs = {progress:db.doc(base+"progress"), history:db.doc(base+"history"), custom:db.doc(base+"custom")};
      const [p,h,c] = await Promise.all([this.refs.progress.get(), this.refs.history.get(), this.refs.custom.get()]);
      const merge = (local, snap, field, pick) => {
        const remote = (snap.exists && snap.data() && snap.data()[field]) || {};
        const out = Object.assign({}, remote); let localExtra = false;
        for(const k in local){ if(!(k in remote) || pick(local[k], remote[k])){ out[k]=local[k]; localExtra=true; } }
        return {out, localExtra, exists:snap.exists};
      };
      const mp = merge(prog, p, "qs", (a,b)=> (a[3]||0) > (b[3]||0));
      const mh = merge(hist, h, "att", ()=>false);
      const mc = merge(custom, c, "qs", ()=>false);
      prog = mp.out; hist = mh.out; custom = mc.out; saveLocal();
      adoptDupes();
      // make sure each doc exists, carrying anything only this device had
      if(!mp.exists || mp.localExtra) await this.refs.progress.set({qs:prog, v:1});
      if(!mh.exists || mh.localExtra) await this.refs.history.set({att:hist, v:1});
      if(!mc.exists || mc.localExtra) await this.refs.custom.set({qs:custom, v:1});
      this.mode = "cloud"; this.setBadge("cloud");
      // live updates from the other device
      this.refs.progress.onSnapshot(s => { if(!s.exists||s.metadata.hasPendingWrites) return; const q=(s.data()||{}).qs||{}; let ch=false; for(const k in q){ if(!prog[k] || (q[k][3]||0) > (prog[k][3]||0)){ prog[k]=q[k]; ch=true; } } if(ch){ saveLocal(); if(!S) render(); } }, ()=>{});
      this.refs.history.onSnapshot(s => { if(!s.exists||s.metadata.hasPendingWrites) return; const a=(s.data()||{}).att||{}; let ch=false; for(const k in a){ if(!hist[k]){ hist[k]=a[k]; ch=true; } } if(ch){ saveLocal(); if(!S) render(); } }, ()=>{});
      this.refs.custom.onSnapshot(s => { if(!s.exists||s.metadata.hasPendingWrites) return; const q=(s.data()||{}).qs||{}; const sig=o=>Object.keys(o).sort().map(k=>k+":"+JSON.stringify(o[k],Object.keys(o[k]).sort())).join("|"); if(sig(q)!==sig(custom)){ custom=Object.assign({},q); saveLocal(); if(!S) render(); } }, ()=>{});
      if(!S) render();
    }catch(e){ this.mode="local"; this.setBadge("local"); }
  },
  queue(doc, key, val){ this.pend[doc][key]=val; clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(), 1200); },
  flush(){
    if(this.mode!=="cloud") return;
    const field = {progress:"qs", history:"att", custom:"qs"};
    for(const doc of ["progress","history","custom"]){
      const patch = this.pend[doc]; if(!Object.keys(patch).length) continue;
      this.pend[doc] = {};
      this.setBadge("saving");
      this.chain = this.chain.then(()=>this.refs[doc].update({[field[doc]]:patch})).then(()=>this.setBadge("cloud")).catch(()=>{ this.setBadge("cloud"); });
    }
  },
  replace(doc, body){ if(this.mode!=="cloud") return; this.setBadge("saving"); this.chain=this.chain.then(()=>this.refs[doc].set(body)).then(()=>this.setBadge("cloud")).catch(()=>this.setBadge("cloud")); }
};
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") Sync.flush(); });

function record(id, correct){
  const p = prog[id] || [0,0,0,0];
  const e = [p[0]+1, p[1]+(correct?1:0), correct?1:0, now()];
  prog[id] = e; Sync.queue("progress", id, e);
}
function addHistory(a){ const k="t"+a.ts; hist[k]=a; Sync.queue("history", k, a); saveLocal(); }

/* ============ selection ============ */
function poolFor(chs){ const set=new Set(chs); return allQ().filter(q=>set.has(+q.ch)); }
function prioritized(pool){
  return pool.map(q=>{ const p=prog[q.id]; return {q, s:p?p[0]:0, t:p?p[3]:0, r:Math.random()}; })
    .sort((a,b)=> a.s-b.s || a.t-b.t || a.r-b.r).map(x=>x.q);
}
function chCounts(){ const c={}; CHS.forEach(ch=>c[ch]=0); allQ().forEach(q=>c[q.ch]=(c[q.ch]||0)+1); return c; }
function pickExam(n){
  const counts = chCounts(); const avail = CHS.filter(ch=>counts[ch]>0);
  const alloc={}; avail.forEach(ch=>alloc[ch]=0);
  let left=n, open=avail.slice();
  while(left>0 && open.length){
    const share=Math.max(1,Math.floor(left/open.length));
    for(const ch of shuffle(open.slice())){ if(left<=0) break; const give=Math.min(share, counts[ch]-alloc[ch], left); alloc[ch]+=give; left-=give; }
    open = open.filter(ch=>alloc[ch]<counts[ch]);
  }
  let out=[]; for(const ch of avail){ out=out.concat(prioritized(poolFor([ch])).slice(0,alloc[ch])); }
  return shuffle(out);
}
function mistakes(){ return allQ().filter(q=>prog[q.id] && prog[q.id][2]===0); }

/* ============ sessions ============ */
const MODES = {
  mock:{label:"Mock Exam", feedback:"end"},
  sprint:{label:"Exam-Pace Sprint", feedback:"end"},
  quiz:{label:"Quick Quiz", feedback:"instant"},
  fix:{label:"Fix Mistakes", feedback:"instant"},
  drill:{label:"Chapter Drill", feedback:"instant"}
};
function startSession(mode, qs, limit){
  if(!qs.length) return;
  S = {mode, items:qs.map(q=>({id:q.id, order:shuffle([0,1,2,3]), pick:null, flag:false, checked:false})), i:0, start:now(), limit:limit||null, done:false, openAll:false};
  persistSession(); render(); ensureTick(); window.scrollTo(0,0);
}
function persistSession(){ if(S && !S.done) lsSet(LS_SESS, S); else lsDel(LS_SESS); }
function elapsed(){ return (now()-S.start)/1000; }
function remaining(){ return S.limit ? S.limit - elapsed() : null; }

let tick=null;
function ensureTick(){
  clearInterval(tick);
  if(!S || S.done) return;
  tick = setInterval(()=>{
    if(!S || S.done){ clearInterval(tick); return; }
    const t=$("#timer"); const rem=remaining();
    if(t){ if(rem!==null){ t.textContent=fmtT(rem); t.classList.toggle("warn", rem<=300 && rem>60); t.classList.toggle("crit", rem<=60); } else t.textContent=fmtT(elapsed()); }
    updatePace();
    if(rem!==null && rem<=0){ clearInterval(tick); finish(true); }
  }, 1000);
}
function updatePace(){
  const el=$("#pace"); if(!el || !S.limit) return;
  const answered=S.items.filter(it=>it.pick!==null).length;
  const target=Math.floor(elapsed()/PACE);
  const d=answered-target;
  el.innerHTML = `<span>${answered}/${S.items.length} answered · ${S.items.filter(i=>i.flag).length} flagged</span><span class="${d>=0?"ahead":"behind"}">${d>=0?"On pace":"Behind pace"} · target ${Math.min(target,S.items.length)}</span>`;
}

function finish(timeout){
  if(!S || S.done) return;
  S.done=true; S.end=now(); clearInterval(tick);
  const fb = MODES[S.mode].feedback;
  const ch={}; let c=0, n=0;
  S.items.forEach(it=>{
    const q=byId(it.id); if(!q) return;
    const ok = it.pick===0;
    if(fb==="end"){ record(it.id, ok); }
    else if(!it.checked && it.pick!==null){ record(it.id, ok); it.checked=true; }
    if(fb==="instant" && !it.checked) return; // unanswered quiz items don't count
    n++; if(ok) c++;
    const k=q.ch; ch[k]=ch[k]||[0,0]; ch[k][1]++; if(ok) ch[k][0]++;
  });
  S.result={c,n,timeout:!!timeout};
  if(!n){ saveLocal(); Sync.flush(); S=null; persistSession(); return go({v:"home"}); }
  if(n) addHistory({m:S.mode, ts:S.start, n, c, dur:Math.round((S.end-S.start)/1000), lim:S.limit||0, ch});
  saveLocal(); Sync.flush(); persistSession();
  S.view="results"; S.filter = (n-c)>0 ? "wrong" : "all";
  render(); window.scrollTo(0,0);
}

/* ============ rendering ============ */
function render(){
  layer.innerHTML="";
  document.body.classList.toggle("in-session", !!(S && !S.done));
  if(S && !S.done) return renderQuestion();
  if(S && S.done) return renderResults();
  if(route.v==="setup") return renderSetup(route.mode);
  if(route.v==="stats") return renderStats();
  if(route.v==="import") return renderImport();
  return renderHome();
}
let route={v:"home"};
function go(r){ route=r; S=null; persistSession(); render(); window.scrollTo(0,0); }
$("#brand").addEventListener("click", ()=>{ if(S && !S.done) return confirmLeave(); go({v:"home"}); });

function stats(){
  const counts=chCounts(); const per={};
  CHS.forEach(ch=>per[ch]={total:counts[ch]||0, seen:0, c:0, att:0});
  allQ().forEach(q=>{ const p=prog[q.id]; if(!p) return; const o=per[q.ch]; o.seen++; o.c+=p[1]; o.att+=p[0]; });
  let tot=0,seen=0,c=0,att=0; CHS.forEach(ch=>{tot+=per[ch].total;seen+=per[ch].seen;c+=per[ch].c;att+=per[ch].att;});
  return {per, tot, seen, c, att};
}
function accColor(a){ return a>=80?"var(--ok)":a>=60?"var(--amber)":"var(--bad)"; }
function pillCls(p){ return p>=80?"hi":p>=60?"mid":"lo"; }

function renderHome(){
  const st=stats(); const mis=mistakes().length; const unseen=st.tot-st.seen;
  const histArr=Object.values(hist).sort((a,b)=>b.ts-a.ts).slice(0,6);
  const mocks=Object.values(hist).filter(h=>h.m==="mock");
  const best=mocks.length?Math.max(...mocks.map(h=>pct(h.c,h.n))):null;
  const resumable = lsGet(LS_SESS);
  app.innerHTML = `
  <div class="home">
    ${resumable && !resumable.done ? `<div class="panel span2 row" style="justify-content:space-between">
      <div><div class="label">Session in progress</div><div style="margin-top:4px">${esc(MODES[resumable.mode]?.label||"Session")} · question ${resumable.i+1} of ${resumable.items.length}</div></div>
      <div class="row"><button class="btn ghost" data-act="discard">Discard</button><button class="btn primary" data-act="resume">Resume</button></div></div>`:""}
    <section class="panel bracket hero">
      <div class="label">Exam simulation · Chapters 1–9</div>
      <h1 style="margin-top:8px">Run the full <em>75-minute</em> mock exam</h1>
      <div class="spec">
        <div><b>50</b><span>Questions</span></div>
        <div><b>75:00</b><span>Time limit</span></div>
        <div><b>1:30</b><span>Per question</span></div>
        <div><b>1+3</b><span>Right · wrong</span></div>
      </div>
      <button class="btn primary wide" data-act="mock">Start mock exam</button>
      <div class="bankline">Bank: <b>${st.tot}</b> questions · <b>${unseen}</b> not yet seen · unseen questions are served first${best!==null?` · best mock <b>${best}%</b>`:""}</div>
    </section>

    <section class="stack">
      <div class="modes">
        <button class="mode" data-act="setup-quiz"><span class="k">INSTANT FEEDBACK</span><h3>Quick Quiz</h3><p>5–30 questions. See the answer and why after each one.</p><span class="count">${unseen} unseen</span></button>
        <button class="mode" data-act="setup-sprint"><span class="k">TIMED · 1:30 / Q</span><h3>Exam-Pace Sprint</h3><p>Short timed block in exam conditions. Review at the end.</p><span class="count">10 Q = 15:00</span></button>
        <button class="mode" data-act="setup-fix" ${mis?"":"disabled style='opacity:.5'"}><span class="k">MISTAKE REVIEW</span><h3>Fix Mistakes</h3><p>Re-run every question you last got wrong.</p><span class="count">${mis} to fix</span></button>
        <button class="mode" data-act="setup-drill"><span class="k">ONE CHAPTER</span><h3>Chapter Drill</h3><p>Work through a single chapter, unseen first.</p><span class="count">pick a chapter</span></button>
      </div>
      <div class="row">
        <button class="btn ghost" style="flex:1" data-act="stats">Progress & history</button>
