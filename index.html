], "w": ["Correct. The common sources are system call traces, audit (log file) records, file integrity checksums, and registry access.", "Not listed.", "Not listed.", "Not listed."], "r": "Ch 8 \u00b7 Data Sources and Sensors"}, {"id": "8-33", "ch": 8, "sec": "8.4", "q": "On UNIX and Linux systems, anomaly-based HIDSs typically use which data source, gathered via an OS hook?", "o": ["System calls", "Registry updates", "SNMP traps", "E-mail headers"], "w": ["Correct. System calls provide detailed information on process activity that can be classified as normal or anomalous.", "Registry is a Windows source, and that approach was not successful.", "Not stated.", "Not stated."], "r": "Ch 8 \u00b7 Anomaly-Based HIDSs"}, {"id": "8-34", "ch": 8, "sec": "8.4", "q": "What do the slides say about anomaly-based HIDSs on Windows systems traditionally?", "o": ["They weren't traditionally used; log- and registry-based attempts failed", "They were the most successful type of HIDS on any platform", "They used system call traces exclusively, just as on Linux", "They were mandated by Microsoft for all enterprise systems"], "w": ["Correct. This is what the slides state.", "Not true.", "Not stated.", "Not stated."], "r": "Ch 8 \u00b7 Anomaly-Based HIDSs"}, {"id": "8-35", "ch": 8, "sec": "8.4", "q": "Which is a disadvantage of using system calls for anomaly-based HIDS?", "o": ["They load the monitored system, and training takes time and computing resources", "They provide no useful information about process activity", "They cannot be gathered on Linux systems without a kernel rebuild", "They are more susceptible to intruder manipulation than audit logs"], "w": ["Correct. These are the two stated disadvantages.", "They provide detailed information.", "They are the main Linux source.", "Audit LOGS are the ones more susceptible to manipulation."], "r": "Ch 8 \u00b7 Anomaly-Based HIDSs"}, {"id": "8-36", "ch": 8, "sec": "8.4", "q": "Compared with system call trace approaches, audit (log) records as a HIDS data source:", "o": ["Have a lower detection rate and are more susceptible to intruder manipulation", "Have a higher detection rate and are harder for intruders to manipulate", "Cannot be manipulated by intruders, though their detection rate is lower", "Require no storage, since records are analyzed and then discarded"], "w": ["Correct. These are the stated disadvantages of audit records.", "They have a LOWER detection rate.", "They are MORE susceptible to manipulation.", "Not stated."], "r": "Ch 8 \u00b7 Anomaly-Based HIDSs"}, {"id": "8-37", "ch": 8, "sec": "8.4", "q": "A HIDS that uses a cryptographic checksum to check monitored files for changes from a known good baseline is most widely implemented as:", "o": ["Tripwire", "Snort", "Honeyd", "pam_passwdqc"], "w": ["Correct. Tripwire is very sensitive to changes in monitored files.", "Snort is a NIDS.", "Not the cited tool.", "pam_passwdqc is a password checker."], "r": "Ch 8 \u00b7 Anomaly-Based HIDSs"}, {"id": "8-38", "ch": 8, "sec": "8.4", "q": "Which is a disadvantage of file-integrity checking (e.g., Tripwire)?", "o": ["It cannot detect changes made to processes once they are running", "It is insensitive to file changes", "It requires no baseline", "It needs no protection for its database of file signatures or checksums"], "w": ["Correct. Other difficulties are choosing which files to monitor, getting a known good copy for the baseline, and protecting the database of file signatures.", "It is VERY sensitive to changes.", "It requires a known good baseline.", "The signature database must be protected."], "r": "Ch 8 \u00b7 Anomaly-Based HIDSs"}, {"id": "8-39", "ch": 8, "sec": "8.5", "q": "A network-based IDS examines traffic:", "o": ["Packet by packet in real or close to real time, at selected points on a network", "Only after the day's logs have been archived to a central server", "Only on the host's disk, by scanning stored files for patterns", "Only once per day, during a scheduled analysis window"], "w": ["Correct. It may examine network-, transport-, and/or application-level protocol activity.", "Not true.", "That's host-based.", "Not true."], "r": "Ch 8 \u00b7 Network-Based IDS (NIDS)"}, {"id": "8-40", "ch": 8, "sec": "8.5", "q": "A NIDS typically includes which components?", "o": ["Sensors, management servers, and management consoles", "A single host agent installed on each server it protects", "A firewall rule set that blocks traffic matching known attacks", "A honeypot that attracts attackers away from real systems"], "w": ["Correct. Traffic pattern analysis may be done at the sensor, the management server, or both.", "Not a NIDS.", "Not a NIDS.", "Not a NIDS."], "r": "Ch 8 \u00b7 Network-Based IDS (NIDS)"}, {"id": "8-41", "ch": 8, "sec": "8.5", "q": "According to the slides, which type of activity is best suited to ANOMALY detection rather than signature detection?", "o": ["Scanning", "Unexpected application services", "Policy violations", "Application layer reconnaissance"], "w": ["Correct. The slides list DoS attacks, scanning, and worms as suitable for anomaly detection.", "Unexpected application services are listed under SIGNATURE detection.", "Policy violations are listed under SIGNATURE detection.", "Application layer reconnaissance is listed under SIGNATURE detection."], "r": "Ch 8 \u00b7 Intrusion Detection Techniques"}, {"id": "8-42", "ch": 8, "sec": "8.5", "q": "Which is listed as suitable for SIGNATURE detection in a NIDS?", "o": ["Policy violations", "Worms", "Scanning", "Denial-of-service attacks"], "w": ["Correct. Signature detection suits application, transport, and network layer reconnaissance and attacks, unexpected application services, and policy violations.", "Worms are listed for anomaly detection.", "Scanning is listed for anomaly detection.", "DoS is listed for anomaly detection."], "r": "Ch 8 \u00b7 Intrusion Detection Techniques"}, {"id": "8-43", "ch": 8, "sec": "8.5", "q": "Stateful Protocol Analysis (SPA) is a subset of anomaly detection that differs from other anomaly techniques because it:", "o": ["Compares traffic to vendor-supplied profiles of benign protocol behavior", "Uses only signatures of known attacks against each protocol", "Requires very few resources compared with other anomaly techniques", "Inspects only host log files rather than network traffic"], "w": ["Correct. SPA tracks network, transport, and application protocol states. Its key disadvantage is high resource use.", "Not this.", "High resource use is its key disadvantage.", "It inspects network traffic."], "r": "Ch 8 \u00b7 Stateful Protocol Analysis (SPA)"}, {"id": "8-44", "ch": 8, "sec": "8.5", "q": "What is a key disadvantage of Stateful Protocol Analysis?", "o": ["The high resource use it requires", "It cannot track protocol states", "It only works on Windows", "It ignores application protocols"], "w": ["Correct. This is the stated key disadvantage.", "It DOES track states.", "Not stated.", "It does analyze application protocols."], "r": "Ch 8 \u00b7 Stateful Protocol Analysis (SPA)"}, {"id": "8-45", "ch": 8, "sec": "8.5", "q": "Which is typical information logged by a NIDS sensor?", "o": ["Timestamp, session ID, alert type, protocols, addresses, ports, and payload data", "The user's plaintext password and the name of the account it was used to log in to", "The MAC address of the sensor that saw the traffic", "The hash of every file transferred in the session"], "w": ["Correct. This is the list of typical logged information.", "Not logged.", "Too narrow.", "Not this."], "r": "Ch 8 \u00b7 Logging of Alerts"}, {"id": "8-46", "ch": 8, "sec": "8.6", "q": "A honeypot consisting of a software package that emulates particular IT services well enough for a realistic initial interaction, but does not execute full versions of those services, is a:", "o": ["Low-interaction honeypot", "High-interaction honeypot", "Bastion host", "Sandbox"], "w": ["Correct. It is a less realistic target, but often sufficient as a component of a distributed IDS to warn of imminent attack.", "A high-interaction honeypot is a real system with a full OS, services, and applications.", "A bastion host is a firewall platform.", "A sandbox is a malware analysis environment."], "r": "Ch 8 \u00b7 Honeypot Classifications"}, {"id": "8-47", "ch": 8, "sec": "8.6", "q": "A high-interaction honeypot:", "o": ["Is a real system with a full OS, services, and applications, instrumented and deployed where attackers can access it", "Only emulates particular IT services or systems well enough to provide a realistic initial interaction", "Requires fewer resources than a low-interaction honeypot", "Cannot be compromised, because it runs no real services"], "w": ["Correct. It is more realistic and may occupy an attacker for an extended period, but it needs significantly more resources, and if compromised it could be used to attack other systems.", "That's low-interaction.", "It requires MORE resources.", "If compromised, it could be used to attack others."], "r": "Ch 8 \u00b7 Honeypot Classifications"}, {"id": "8-48", "ch": 8, "sec": "8.6", "q": "What is a risk specific to high-interaction honeypots?", "o": ["If compromised, they could be used to initiate attacks on other systems", "They are too unrealistic to attract attackers for long", "They use almost no resources, so they are often forgotten", "They cannot record attacker activity in any detail"], "w": ["Correct. This is the stated risk.", "They are the MORE realistic type.", "They need MORE resources.", "They are instrumented to record activity."], "r": "Ch 8 \u00b7 Honeypot Classifications"}, {"id": "8-49", "ch": 8, "sec": "8.7", "q": "In Table 8.2 (Snort rule actions), which action generates an alert using the selected alert method and then logs the packet?", "o": ["alert", "log", "pass", "dynamic"], "w": ["Correct. This is the alert action.", "The log action only logs the packet.", "The pass action ignores the packet.", "A dynamic rule remains idle until activated, then acts as a log rule."], "r": "Ch 8 \u00b7 Table 8.2 Snort Rule Actions"}, {"id": "8-50", "ch": 8, "sec": "8.7", "q": "Which Snort rule action means 'ignore the packet'?", "o": ["pass", "drop", "sdrop", "log"], "w": ["Correct. This is the pass action.", "drop makes iptables drop the packet and log it.", "sdrop drops without logging.", "log logs the packet."], "r": "Ch 8 \u00b7 Table 8.2"}, {"id": "8-51", "ch": 8, "sec": "8.7", "q": "Which Snort rule action alerts and then turns on another dynamic rule?", "o": ["activate", "dynamic", "alert", "reject"], "w": ["Correct. This is the activate action.", "A dynamic rule waits until an activate rule turns it on.", "alert doesn't activate other rules.", "reject drops, logs, and sends a reset or unreachable message."], "r": "Ch 8 \u00b7 Table 8.2"}, {"id": "8-52", "ch": 8, "sec": "8.7", "q": "Which Snort rule action remains idle until activated by an activate rule, and then acts as a log rule?", "o": ["dynamic", "activate", "pass", "sdrop"], "w": ["Correct. This is the dynamic action.", "activate is the action that triggers a dynamic rule.", "pass ignores the packet.", "sdrop silently drops the packet."], "r": "Ch 8 \u00b7 Table 8.2"}, {"id": "8-53", "ch": 8, "sec": "8.7", "q": "Which Snort rule action makes iptables drop the packet, log it, and send a TCP reset (for TCP) or an ICMP port unreachable message (for UDP)?", "o": ["reject", "drop", "sdrop", "alert"], "w": ["Correct. This is the reject action.", "drop drops and logs but sends no message.", "sdrop drops without logging.", "alert doesn't drop packets."], "r": "Ch 8 \u00b7 Table 8.2"}, {"id": "8-54", "ch": 8, "sec": "8.7", "q": "Which Snort rule action makes iptables drop the packet but NOT log it?", "o": ["sdrop", "drop", "reject", "pass"], "w": ["Correct. sdrop is a silent drop.", "drop logs the packet.", "reject logs and responds.", "pass ignores without dropping."], "r": "Ch 8 \u00b7 Table 8.2"}, {"id": "8-55", "ch": 8, "sec": "8.2", "q": "Which statement correctly contrasts HIDS and NIDS?", "o": ["A HIDS monitors activity on a single host; a NIDS monitors traffic at selected points on a network", "A HIDS monitors traffic at selected points on a network; a NIDS monitors a single host", "Both only monitor firewall logs, at the host and network level respectively", "Neither can use anomaly detection; both rely on signature detection"], "w": ["Correct. This is the distinction.", "This is reversed.", "Not true.", "Both can use anomaly detection."], "r": "Ch 8 \u00b7 IDS overview"}, {"id": "8-58", "ch": 8, "sec": "8.1", "q": "The rise in attacks targeted at specific individuals and the IT systems they use emphasizes the need for what, and why?", "o": ["Defense-in-depth, since such attacks may bypass perimeter defenses", "Stronger firewalls, since such attacks always arrive from outside the network", "More NIDS sensors, since such attacks are easy to see in traffic", "Longer passwords, since such attacks rely on password guessing"], "w": ["Correct. Targeted attacks may be designed to bypass perimeter defenses such as firewalls and network-based IDSs, so layered defenses are needed.", "The point is that perimeter defenses such as firewalls can be bypassed, so a stronger firewall alone is not the answer.", "Network-based IDSs are named as one of the perimeter defenses these attacks may bypass.", "The chapter draws a broader lesson than password length: use defense-in-depth strategies."], "r": "\u00a78.1 Intruders"}, {"id": "8-60", "ch": 8, "sec": "8.1", "q": "Which activities does the chapter list as typical methods used by activists (hacktivists)?", "o": ["Website defacement, denial of service, and theft and distribution of data", "Identity theft, theft of financial credentials, and data ransoming", "Long-running covert espionage and sabotage for a government", "Discovering brand new categories of buffer overflow vulnerabilities in software"], "w": ["Correct. Activists aim to promote and publicize their cause, typically through these methods, causing negative publicity for or compromise of their targets.", "These are the financially motivated activities of cyber criminals.", "Covert espionage and sabotage over extended periods describes state-sponsored organizations.", "Discovering new vulnerability categories is associated with the 'Others' class and expert skill level."], "r": "\u00a78.1 Intruders \u00b7 Activists"}, {"id": "8-65", "ch": 8, "sec": "8.1", "q": "Against which attacks does the chapter say IDSs and IPSs can be reasonably effective?", "o": ["Known, less sophisticated attacks such as large-scale e-mail scams", "Targeted attacks by state-sponsored intruders that use new zero-day exploits", "Any attack that obscures its activity on the targeted system", "Supply-chain attacks that arrive in trusted software updates"], "w": ["Correct. They can be reasonably effective against known, less sophisticated attacks, such as those by activist groups or large-scale e-mail scams.", "They are likely less effective against sophisticated, targeted attacks, which more often use zero-day exploits.", "Attackers who better obscure their activities are the ones IDSs are less effective against.", "Supply-chain attacks are described as hard to prevent and detect."], "r": "\u00a78.1 Intruders"}, {"id": "8-66", "ch": 8, "sec": "8.1", "q": "In the common attack methodology, what characterizes the 'Target Acquisition and Information Gathering' step?", "o": ["Using publicly available information and network exploration tools to map target resources", "Exploiting a remote network vulnerability to get a first foothold on the target", "Using a local access vulnerability to increase the privileges that are available on the system", "Disabling or editing audit logs to remove the evidence of attack activity"], "w": ["Correct. The attacker identifies and characterizes the target systems using public information, technical and non-technical, and network exploration tools.", "Getting a first foothold is the Initial Access step.", "Raising privileges through a local access vulnerability is Privilege Escalation.", "Disabling or editing audit logs is Covering Tracks."], "r": "\u00a78.1 Intruder Behavior"}, {"id": "8-67", "ch": 8, "sec": "8.1", "q": "Privilege escalation is typically achieved by means of:", "o": ["A local access vulnerability", "A remote network vulnerability", "A drive-by-download attack", "A supply-chain attack"], "w": ["Correct. Privilege escalation covers actions taken on the system, typically via a local access vulnerability, to increase the attacker's privileges.", "Exploiting a remote network vulnerability is a typical route for Initial Access.", "Drive-by-download is a way malware is installed for Initial Access.", "A supply-chain attack on a software supplier is listed as a route for Initial Access."], "r": "\u00a78.1 Intruder Behavior"}, {"id": "8-68", "ch": 8, "sec": "8.1", "q": "In Table 8.1, mapping the network for accessible services using tools such as NMAP is an example of which step?", "o": ["Target acquisition and information gathering", "Initial access", "Privilege escalation", "Maintaining access"], "w": ["Correct. Network mapping, DNS lookups and WHOIS queries are all listed under target acquisition and information gathering.", "Initial access examples include guessing a CMS password or sending a spear-phishing e-mail.", "Privilege escalation examples include exploiting a vulnerable local application.", "Maintaining access examples include installing a remote administration tool or rootkit with a backdoor."], "r": "\u00a78.1 Intruder Behavior \u00b7 Table 8.1"}, {"id": "8-69", "ch": 8, "sec": "8.1", "q": "In Table 8.1, sending a spear-phishing e-mail with a link to a Web browser exploit to key people is an example of which step?", "o": ["Initial access", "Target acquisition and information gathering", "Information gathering or system exploit", "Covering tracks"], "w": ["Correct. It is listed under Initial Access, along with guessing a Web CMS password and exploiting a CMS plugin vulnerability.", "That step covers reconnaissance, such as exploring the corporate website and querying DNS and WHOIS.", "That step covers scanning files and transferring documents once on the system.", "Covering tracks covers hiding files with a rootkit and editing logfiles."], "r": "\u00a78.1 Intruder Behavior \u00b7 Table 8.1"}, {"id": "8-72", "ch": 8, "sec": "8.1", "q": "In Table 8.1, installing a remote administration tool or a rootkit with a backdoor for later access belongs to which step?", "o": ["Maintaining access", "Covering tracks", "Initial access", "Privilege escalation"], "w": ["Correct. Maintaining access also lists using the administrator password to access the network later and disabling antivirus or IDS programs.", "Covering tracks uses a rootkit to hide installed files, but the backdoor for later access is listed under maintaining access.", "Initial access is the first entry to the system.", "Privilege escalation is about raising privileges, not keeping access."], "r": "\u00a78.1 Intruder Behavior \u00b7 Table 8.1"}, {"id": "8-77", "ch": 8, "sec": "8.1", "q": "[SYMA21a] defines a software supply chain attack as:", "o": ["Inserting a Trojan into an otherwise legitimate software package at the regular distribution place", "Flooding a software vendor's update servers so that its customers cannot download the latest patches", "Guessing the credentials of a vendor's support staff to reach customer networks", "Posing as a trusted supplier by e-mail to redirect a customer's payments"], "w": ["Correct. This can be at the creation phase at the vendor, at a third-party storage location, or by redirection.", "That would be a denial-of-service attack on the vendor, not the definition given.", "Credential guessing is a route for initial access, not the definition of a supply chain attack.", "Impersonating a supplier by e-mail describes business e-mail compromise."], "r": "\u00a78.1 Intruder Behavior"}, {"id": "8-78", "ch": 8, "sec": "8.1", "q": "Why are supply-chain attacks described as hard to prevent and detect?", "o": ["They exploit the trust between vendors and customers and automatic update mechanisms", "They always use zero-day exploits that no signature-based IDS can recognize", "They target only small businesses, which tend to have less sophisticated IT security systems", "They rely on legitimate-looking e-mails that contain no links or attachments"], "w": ["Correct. They exploit the trust relationship between vendors and customers and the automatic update mechanisms the products use.", "The chapter does not say they always use zero-day exploits; the reason given is the trust relationship.", "Small and medium businesses are named as common targets of business e-mail compromise.", "Legitimate-looking e-mails without malicious links describes business e-mail compromise."], "r": "\u00a78.1 Intruder Behavior"}, {"id": "8-82", "ch": 8, "sec": "8.1", "q": "Why can business e-mail compromise (BEC) e-mails often evade controls such as anti-virus programs and spam filters?", "o": ["They often appear legitimate and rarely rely on malicious links or attachments", "They are encrypted end to end, so their content cannot be scanned at all", "They are sent in very small numbers, well below the threshold that spam filters use", "They come from addresses that the business has never seen before"], "w": ["Correct. Because they look legitimate and rarely carry malicious links or attachments, security and technical controls often miss them.", "Encryption is not the reason given.", "Message volume is not the reason given.", "They come from a compromised, familiar account, which is why they look legitimate."], "r": "\u00a78.1 Intruder Behavior"}, {"id": "8-84", "ch": 8, "sec": "8.2", "q": "How does the chapter define a security intrusion?", "o": ["An unauthorized act of bypassing the security mechanisms of a system", "A function that gathers and analyzes information to find possible attacks", "A decoy system designed to lure an attacker away from critical systems", "An alert raised when authorized users are identified as intruders"], "w": ["Correct. A security intrusion is the unauthorized act of bypassing the security mechanisms of a system.", "That describes intrusion detection, the function that looks for intrusions.", "That describes a honeypot.", "That describes a false positive."], "r": "\u00a78.2 Intrusion Detection"}, {"id": "8-88", "ch": 8, "sec": "8.2", "q": "Which is one of the three considerations the chapter gives as motivating interest in intrusion detection?", "o": ["An effective IDS can serve as a deterrent, acting to prevent intrusions", "An IDS removes the need for authentication, access control, and firewalls", "An IDS guarantees that false alarms will not occur", "An IDS encrypts sensitive data to keep it from intruders"], "w": ["Correct. The others are that quick detection limits damage, and that detection collects information to strengthen prevention measures.", "Authentication, access control and firewalls all still play a role; intrusion detection is another line of defense.", "False alarms are an inherent problem, as the base-rate fallacy shows.", "Encryption is a separate part of a defense-in-depth strategy."], "r": "\u00a78.2 Basic Principles"}, {"id": "8-89", "ch": 8, "sec": "8.2", "q": "Intrusion detection is based on which assumption?", "o": ["Intruder behavior differs from legitimate user behavior in ways that can be quantified", "Intruder behavior never overlaps in any way with the normal behavior of an authorized user", "Every intruder uses tools for which a signature already exists", "Legitimate users never act in an unauthorized fashion"], "w": ["Correct. The assumption is a quantifiable difference, though some overlap between the two must be expected.", "The chapter says we must expect some overlap between the two.", "Zero-day attacks have no signatures, so this cannot be assumed.", "An inside attacker is exactly a legitimate user acting in an unauthorized fashion."], "r": "\u00a78.2 Basic Principles"}, {"id": "8-90", "ch": 8, "sec": "8.2", "q": "In terms of Figure 8.1, what is the result of a loose interpretation of intruder behavior?", "o": ["More intruders are caught, but there are more false positives", "Fewer intruders are caught, but there are fewer false alarms", "More intruders are caught, and there are fewer false positives", "Fewer intruders are caught, and there are more false negatives"], "w": ["Correct. A loose interpretation catches more intruders but also identifies more authorized users as intruders.", "Fewer false alarms at the cost of missed intruders is the result of a tight interpretation.", "Because the behaviors overlap, catching more intruders brings more false positives, not fewer.", "More false negatives is the result of a tight interpretation."], "r": "\u00a78.2 Basic Principles \u00b7 Figure 8.1"}, {"id": "8-91", "ch": 8, "sec": "8.2", "q": "In the context of an IDS, what is a false negative?", "o": ["An intruder who is not identified as an intruder", "An authorized user who is identified as an intruder", "An alert that is raised when no attack is under way", "An attack that is detected after damage is done"], "w": ["Correct. Limiting false positives by a tight interpretation of intruder behavior leads to more false negatives: intruders not identified as intruders.", "That is a false positive.", "That is a false alarm, another name for a false positive.", "A late detection is still a detection, not a false negative."], "r": "\u00a78.2 Basic Principles"}, {"id": "8-92", "ch": 8, "sec": "8.2", "q": "How does the chapter define the detection rate of an IDS?", "o": ["The ratio of detected attacks to total attacks", "The ratio of false alarms to total alerts raised", "The ratio of incorrectly classified to total normal usage", "The ratio of intrusions to legitimate uses of the system"], "w": ["Correct. Ideally an IDS has a high detection rate, the ratio of detected to total attacks, while minimizing the false alarm rate.", "This is not the definition given for either rate.", "That is the definition of the false alarm rate.", "That relationship is what drives the base-rate fallacy, not the detection rate."], "r": "\u00a78.2 Basic Principles"}, {"id": "8-93", "ch": 8, "sec": "8.2", "q": "What did Anderson's early study conclude about detecting an inside attacker, a legitimate user acting in an unauthorized fashion?", "o": ["It is harder, since abnormal and normal behavior may differ only slightly", "It is easier, since insiders have a long history of observed behavior", "It is impossible, since insiders are authorized for everything that they do", "It is unnecessary, since outside attackers cause most of the damage"], "w": ["Correct. He concluded such violations would be undetectable solely by searching for anomalous behavior, but might be detected by defining conditions that suggest unauthorized use.", "Past history helps separate outsiders from legitimate users; for insiders the distinction may be small.", "He suggested insider behavior might still be detectable by intelligent definition of suspicious conditions.", "The study does not dismiss insider detection as unnecessary."], "r": "\u00a78.2 Basic Principles"}, {"id": "8-94", "ch": 8, "sec": "8.2", "q": "What is the base-rate fallacy as it applies to intrusion detection?", "o": ["If intrusions are rare compared to legitimate uses, the false alarm rate will be high unless the test is extremely discriminating", "If intrusions are common compared to legitimate uses, the detection rate will be low unless the signatures are very large", "If the IDS is trained only on legitimate data, it cannot recognize attacks that were not present in the training phase", "If the IDS runs on a single host, it cannot correlate events seen by sensors that are elsewhere on the network"], "w": ["Correct. Because of the probabilities involved, it is very hard to get a high rate of detections with a low rate of false alarms.", "The fallacy concerns rare intrusions and false alarms, not common intrusions and signature size.", "That is a limitation of anomaly detection training, not the base-rate fallacy.", "That is a motivation for distributed IDSs, not the base-rate fallacy."], "r": "\u00a78.2 The Base-Rate Fallacy"}, {"id": "8-96", "ch": 8, "sec": "8.2", "q": "Among the desirable IDS requirements, what does 'resist subversion' mean?", "o": ["The IDS must be able to monitor itself and detect if an attacker has modified it", "The IDS must be able to recover from system crashes and reinitializations on its own", "The IDS must be able to be reconfigured without having to be restarted", "The IDS must keep working in part when some of its components stop"], "w": ["Correct. Resisting subversion means the IDS can monitor itself and detect if it has been modified by an attacker.", "Recovering from crashes and reinitializations is fault tolerance.", "Reconfiguring without a restart is dynamic reconfiguration.", "Affecting the rest as little as possible when parts stop is graceful degradation."], "r": "\u00a78.2 Requirements"}, {"id": "8-99", "ch": 8, "sec": "8.3", "q": "How do anomaly approaches and signature or heuristic approaches differ in what they define?", "o": ["Anomaly approaches define normal behavior; signature approaches define malicious behavior", "Anomaly approaches define malicious behavior; signature approaches define normal behavior", "Both define normal behavior, but signature approaches use a larger set of rules", "Both define malicious behavior, but anomaly approaches update more often"], "w": ["Correct. Anomaly approaches define normal, or expected, behavior in order to identify what is not; signature or heuristic approaches directly define malicious or unauthorized behavior.", "This reverses the two approaches.", "Signature approaches define malicious behavior, not normal behavior.", "Anomaly approaches start from known good behavior, not malicious behavior."], "r": "\u00a78.3 Analysis Approaches"}, {"id": "8-100", "ch": 8, "sec": "8.3", "q": "Why is only anomaly detection able to detect unknown, zero-day attacks?", "o": ["It starts with known good behavior and identifies anomalies to it", "It compares traffic against the largest collection of signatures", "It uses rules written by knowledgeable security personnel", "It inspects the payload of every packet instead of the header"], "w": ["Correct. It does not need prior knowledge of the attack, only a model of known good behavior.", "Signature matching can only identify known attacks, however large the collection.", "Rules written by personnel describe known penetrations or weaknesses.", "Payload inspection is not what gives anomaly detection this ability."], "r": "\u00a78.3 Analysis Approaches"}, {"id": "8-101", "ch": 8, "sec": "8.3", "q": "Given its ability to detect zero-day attacks, why is anomaly detection not simply the preferred approach?", "o": ["It is hard to collect and analyze the data required, and false alarms are high", "It can only run on UNIX and Linux systems, and cannot be used on Windows systems", "It needs a signature for each attack, and these take effort to create", "It cannot be used in a network-based IDS, only in a host-based IDS"], "w": ["Correct. It would clearly be preferred were it not for the difficulty of collecting and analyzing the data and the high level of false alarms.", "Windows has been harder for anomaly HIDSs, but that is not the general reason given.", "Needing signatures is the drawback of signature detection.", "Anomaly detection is used in NIDSs; commercial anomaly NIDS products exist."], "r": "\u00a78.3 Analysis Approaches"}, {"id": "8-104", "ch": 8, "sec": "8.3", "q": "In statistical anomaly detection, what distinguishes multivariate models from the earliest univariate models?", "o": ["They consider correlations between the metrics", "They treat each metric as an independent random variable", "They use the order and time between observed events", "They are developed manually by human experts"], "w": ["Correct. Multivariate models considered correlations between metrics and gave better levels of discrimination.", "That describes univariate models, which were too crude to identify intruder behavior effectively.", "That describes time-series models.", "Manual development with human experts describes knowledge-based approaches."], "r": "\u00a78.3 Anomaly Detection"}, {"id": "8-105", "ch": 8, "sec": "8.3", "q": "Which are listed as advantages of statistical approaches to anomaly detection?", "o": ["Relative simplicity, low computation cost, and no assumptions about expected behavior", "Robustness, flexibility, and rules that can be described with formal tools and languages", "Flexibility, adaptability, and capturing interdependencies between metrics", "Low cost in time and resource use, and wide acceptance in products"], "w": ["Correct. Their disadvantages are the difficulty of selecting suitable metrics and the fact that not all behaviors can be modeled this way.", "Robustness and flexibility are the advantages of knowledge-based approaches.", "These are the advantages of machine-learning approaches.", "These are the advantages of signature approaches."], "r": "\u00a78.3 Anomaly Detection"}, {"id": "8-106", "ch": 8, "sec": "8.3", "q": "What is the main disadvantage of knowledge-based approaches to anomaly detection?", "o": ["The difficulty and time needed to develop high-quality knowledge, with human experts", "The significant time and computing resources needed to train the model", "The difficulty of selecting metrics that balance false positives against false negatives", "The inability to describe the rules with a finite-state machine"], "w": ["Correct. Developing high-quality knowledge from the data is difficult and slow, and needs human experts to assist.", "That is the key disadvantage of machine-learning approaches.", "That is a disadvantage of statistical approaches.", "Formal tools such as a finite-state machine may be used to describe the rules."], "r": "\u00a78.3 Anomaly Detection"}, {"id": "8-107", "ch": 8, "sec": "8.3", "q": "Which machine-learning approach to anomaly detection develops a model with sets of states, some possibly hidden, interconnected by transition probabilities?", "o": ["Markov models", "Bayesian networks", "Neural networks", "Genetic algorithms"], "w": ["Correct. Markov models use states, some possibly hidden, linked by transition probabilities.", "Bayesian networks encode probabilistic relationships among observed metrics.", "Neural networks simulate human brain operation with neurons and synapses.", "Genetic algorithms use techniques inspired by evolutionary biology."], "r": "\u00a78.3 Anomaly Detection"}, {"id": "8-110", "ch": 8, "sec": "8.3", "q": "Which are listed as disadvantages of machine-learning approaches to anomaly detection?", "o": ["Dependence on assumptions about accepted behavior, a high false alarm rate, and high resource cost", "Too crude a model, since each observed metric is treated as an independent random variable on its own", "The need for human experts to write and maintain the classification rules by hand", "An inability to capture interdependencies between the observed metrics"], "w": ["Correct. Their advantages are flexibility, adaptability, and the ability to capture interdependencies between metrics.", "That criticism applies to the earliest univariate statistical models.", "Hand-developed rules and human experts describe knowledge-based approaches.", "Capturing interdependencies between metrics is listed as an advantage of machine learning."], "r": "\u00a78.3 Anomaly Detection"}, {"id": "8-111", "ch": 8, "sec": "8.3", "q": "What key limitation of anomaly detection approaches used by IDSs, particularly machine-learning ones, does the chapter identify?", "o": ["They are generally only trained with legitimate data", "They are generally only trained with attack data", "They cannot be retrained once a model is generated", "They cannot process data from more than one sensor"], "w": ["Correct. The lack of anomalous training data, given the desire to detect currently unknown future attacks, limits the effectiveness of some techniques.", "The limitation is the reverse: anomalous training data are lacking.", "The model may be evolved over time through continuous monitoring.", "The data are parameterized into standard metrics so that varied sources can be analyzed."], "r": "\u00a78.3 Anomaly Detection"}, {"id": "8-112", "ch": 8, "sec": "8.3", "q": "Which are listed as advantages of the signature approach?", "o": ["Relatively low cost in time and resource use, and wide acceptance", "The ability to detect zero-day attacks without any prior knowledge of them", "No effort needed to keep up with newly identified malware", "No false alarms, however small the signatures are made"], "w": ["Correct. The approach is widely used in anti-virus products, network traffic scanning proxies, and NIDSs.", "Inability to detect zero-day attacks for which no signatures exist is a disadvantage of the approach.", "Significant effort is needed to constantly identify and review new malware to create signatures.", "Signatures need to be large enough to minimize the false alarm rate."], "r": "\u00a78.3 Signature or Heuristic Detection"}, {"id": "8-115", "ch": 8, "sec": "8.4", "q": "What does the chapter give as the primary benefit of a HIDS?", "o": ["It can detect both external and internal intrusions", "It can examine traffic for many hosts from one sensor", "It can halt every attack before any damage is done", "It can operate without loading the monitored system"], "w": ["Correct. Detecting both external and internal intrusions is something not possible with network-based IDSs or firewalls.", "Watching traffic to many hosts from one point is what a NIDS does.", "In some cases an IDS can halt an attack, but the main purpose is to detect, log, and alert.", "Gathering and classifying data such as system call traces imposes a moderate load on the system."], "r": "\u00a78.4 Host-Based Intrusion Detection"}, {"id": "8-116", "ch": 8, "sec": "8.4", "q": "Why are system call traces problematic as a HIDS data source on Windows systems?", "o": ["The extensive use of DLLs obscures which processes use specific system calls", "Windows systems do not use system calls at all to reach core kernel functions", "Windows audit modules cannot be attached to a running process", "The registry already records every system call a process makes"], "w": ["Correct. DLLs act as an intermediary between process requests and the system call interface, which hinders use of the traces.", "Windows does use system calls; the issue is the DLL layer in between.", "The reason given is the DLL layer, not a limit on audit modules.", "Registry access is a separate data source, with limited recorded success."], "r": "\u00a78.4 Data Sources and Sensors"}, {"id": "8-117", "ch": 8, "sec": "8.4", "q": "What is the advantage of using audit (log file) records as a HIDS data source?", "o": ["No additional collection software is needed", "Intruders are unable to manipulate the records", "The records always hold the information needed", "They give the highest reported detection rate"], "w": ["Correct. Most modern operating systems include accounting software that already collects information on user activity.", "Intruders may attempt to manipulate these records to hide their actions.", "The records may not contain the needed information, or not in a convenient form.", "Audit-record approaches have a lower detection rate than system call trace approaches."], "r": "\u00a78.4 Data Sources and Sensors"}, {"id": "8-120", "ch": 8, "sec": "8.4", "q": "The original work by Forrest et al. on system call traces introduced which algorithm, based on artificial immune system approaches?", "o": ["Sequence Time-Delay Embedding (STIDE)", "Statistical Packet Anomaly Detection Engine (SPADE)", "Extreme Learning Machines (ELM)", "Stateful Protocol Analysis (SPA)"], "w": ["Correct. STIDE compares observed sequences of system calls with sequences from the training phase to obtain a mismatch ratio.", "SPADE is an anomaly NIDS engine available as a plug-in for Snort.", "ELM is one of the later alternatives used to classify system call traces.", "SPA compares network traffic against vendor-supplied profiles of benign protocol traffic."], "r": "\u00a78.4 Anomaly HIDSs"}, {"id": "8-123", "ch": 8, "sec": "8.4", "q": "What new data source does [CREE13] report for anomaly-based HIDSs on Windows, with results comparable to Linux system call trace HIDSs?", "o": ["Traces of key DLL function calls", "Windows registry file updates", "Audit log entries from the event log", "Cryptographic checksums of DLL files"], "w": ["Correct. All the distinct functions within these DLLs, numbering in the thousands, are monitored.", "Registry file updates were tried earlier, but the approach was not very successful.", "Audit log entries were tried earlier, but the approach was not very successful.", "Checksums detect file changes; they are not the new data source described."], "r": "\u00a78.4 Anomaly HIDSs"}, {"id": "8-127", "ch": 8, "sec": "8.4", "q": "Besides being unable to see changes to running processes, which difficulty of file integrity checking does the chapter list?", "o": ["Determining which files to monitor, since many files change in an operational system", "Collecting system call traces without imposing too heavy a load on the monitored system", "Finding experts to write heuristic rules for each operating system", "Obtaining signatures quickly enough for newly released malware"], "w": ["Correct. Other difficulties are having a known good copy of each monitored file and protecting the database of file signatures.", "System call collection is a concern for anomaly HIDSs based on traces.", "Writing heuristic rules concerns rule-based identification.", "Keeping signatures current concerns signature-based products such as anti-virus."], "r": "\u00a78.4 Anomaly HIDSs"}, {"id": "8-130", "ch": 8, "sec": "8.4", "q": "In a distributed IDS, why is integrity required for the sensor data transmitted across the network?", "o": ["To prevent an intruder from masking their activities by altering the audit information", "To prevent the central manager from becoming a bottleneck for all of the incoming reports", "To ensure that the transmitted audit information cannot be read by outsiders", "To ensure that different sensor data formats can be reformatted consistently"], "w": ["Correct. Integrity stops an intruder altering the transmitted audit information to hide what they did.", "A bottleneck is a concern of the centralized architecture, not of integrity.", "Keeping the information from being read is confidentiality, required because the data could be valuable.", "Handling different formats is a separate design issue."], "r": "\u00a78.4 Distributed HIDSs"}, {"id": "8-131", "ch": 8, "sec": "8.4", "q": "What is the trade-off of a centralized architecture for a distributed IDS?", "o": ["It eases correlation of reports but creates a bottleneck and single point of failure", "It removes the single point of failure but makes correlation of incoming reports harder", "It reduces the data sent across the network but needs more analysis centers", "It avoids the need for integrity but makes the sensor data formats differ"], "w": ["Correct. A single central point of collection and analysis eases correlating incoming reports, at the cost of a potential bottleneck and single point of failure.", "That describes the decentralized architecture, whose centers must coordinate and exchange information.", "A centralized design has one analysis point, not more.", "Architecture choice does not remove the need for integrity."], "r": "\u00a78.4 Distributed HIDSs"}, {"id": "8-132", "ch": 8, "sec": "8.4", "q": "The distributed IDS developed at the University of California at Davis consists of which three main components?", "o": ["Host agent module, LAN monitor agent module, and central manager module", "Packet decoder, detection engine, and logger and alerter modules", "Sensor module, management server, and management console", "Data source, analyzer module, and operator and administrator"], "w": ["Correct. Host agents and the LAN monitor agent report to the central manager, which correlates the reports.", "Those are components of Snort.", "Those are the parts of a typical NIDS facility.", "Those come from the intrusion detection message exchange model."], "r": "\u00a78.4 Distributed HIDSs \u00b7 Figure 8.2"}, {"id": "8-137", "ch": 8, "sec": "8.5", "q": "How has the increasing use of encryption affected network-based IDSs?", "o": ["They have lost access to significant content, hindering their ability to function well", "They can now verify the integrity of every packet, which improves their detection rate", "They no longer need signatures, since encrypted traffic cannot carry malware", "They must be placed inline, since passive sensors cannot see encrypted traffic"], "w": ["Correct. So while NIDSs have an important role to play, they can only form part of the solution.", "Encryption hides content from the NIDS; it does not improve detection.", "Encrypted traffic can still carry malicious content the NIDS cannot inspect.", "Placement does not restore access to encrypted content."], "r": "\u00a78.5 Network-Based Intrusion Detection"}, {"id": "8-139", "ch": 8, "sec": "8.5", "q": "What is the primary motivation for using inline NIDS sensors?", "o": ["To enable them to block an attack when one is detected", "To avoid adding an extra step that contributes to packet delay", "To let the sensor work without any IP address configured", "To monitor wireless protocol traffic as well as wired traffic"], "w": ["Correct. In this case the device performs both intrusion detection and intrusion prevention functions.", "Avoiding extra packet delay is the advantage of a passive sensor.", "A monitoring interface without an IP address is a feature of the passive configuration.", "Only wireless sensors can gather and analyze wireless protocol traffic."], "r": "\u00a78.5 Types of Network Sensors"}, {"id": "8-140", "ch": 8, "sec": "8.5", "q": "Why is a passive sensor more efficient than an inline sensor from the point of view of traffic flow?", "o": ["It adds no extra handling step that contributes to packet delay", "It examines only packet headers and skips the payload", "It forwards only the traffic that matches no signature", "It shares its processing load with the firewall device"], "w": ["Correct. A passive sensor monitors a copy of the traffic; the actual traffic does not pass through the device.", "The difference is where the sensor sits, not how much of each packet it examines.", "A passive sensor does not forward traffic at all.", "Combining sensor logic with a firewall is one way to build an inline sensor."], "r": "\u00a78.5 Types of Network Sensors"}, {"id": "8-143", "ch": 8, "sec": "8.5", "q": "Which is an advantage of placing a NIDS sensor just inside the external firewall (location 1 in Figure 8.5)?", "o": ["It highlights problems with the network firewall policy or performance", "It documents every attack that originates on the Internet, unfiltered", "It detects unauthorized activity by authorized users on internal servers", "It focuses limited resources on the personnel and financial networks"], "w": ["Correct. It also sees attacks that penetrate the perimeter, attacks on the Web or ftp server, and outgoing traffic from a compromised server.", "Seeing all traffic unfiltered is the feature of location 2, outside the firewall.", "That is a benefit of location 3, on the major backbone networks.", "That is a benefit of location 4, protecting critical subsystems."], "r": "\u00a78.5 NIDS Sensor Deployment \u00b7 Figure 8.5"}, {"id": "8-144", "ch": 8, "sec": "8.5", "q": "What is noted about a NIDS sensor placed between the external firewall and the Internet (location 2 in Figure 8.5)?", "o": ["It has a higher processing burden than a sensor located elsewhere on the site network", "It can be tuned to specific protocols and attack types to reduce its processing burden", "It sees only the traffic that the external firewall has allowed through", "It is the best location for detecting attacks that originate internally"], "w": ["Correct. It monitors all network traffic unfiltered, documenting the number and types of attacks originating on the Internet.", "Tuning to specific protocols applies to sensors at locations 3 and 4.", "That describes a sensor just inside the firewall, location 1.", "Internal attacks are best seen at locations 3 and 4."], "r": "\u00a78.5 NIDS Sensor Deployment \u00b7 Figure 8.5"}, {"id": "8-145", "ch": 8, "sec": "8.5", "q": "Which benefit does a NIDS sensor protecting the major backbone networks (location 3 in Figure 8.5) provide?", "o": ["It detects unauthorized activity by authorized users inside the security perimeter", "It documents the number of Internet attacks before the external firewall filters them", "It shows whether the external firewall policy is letting attacks through", "It sees the attacks that are aimed at the public Web and mail servers"], "w": ["Correct. It also monitors a large amount of the network's traffic, so it can monitor for both internal and external attacks.", "That is the role of a sensor at location 2.", "That is a benefit of a sensor at location 1.", "That is a benefit of a sensor at location 1."], "r": "\u00a78.5 NIDS Sensor Deployment \u00b7 Figure 8.5"}, {"id": "8-149", "ch": 8, "sec": "8.5", "q": "How can anomaly detection reveal worms spreading among hosts, according to the chapter?", "o": ["Hosts that do not normally communicate start to, and use ports they normally do not", "Hosts report the worm's signature to the NIDS as soon as they are infected", "Hosts stop sending any traffic at all once the worm has disabled their network stack", "Hosts retransmit every packet twice, doubling the load seen by the sensor"], "w": ["Correct. Some worms also propagate quickly using large amounts of bandwidth, and many perform scanning.", "Matching a known signature would be signature detection, and hosts do not self-report.", "Worms generate unusual traffic rather than silence.", "Nothing like this is described."], "r": "\u00a78.5 Intrusion Detection Techniques \u00b7 Anomaly Detection"}, {"id": "8-152", "ch": 8, "sec": "8.6", "q": "Which two key problems have always confronted systems such as IDSs, firewalls, and virus and worm detectors?", "o": ["They may not recognize new threats, and are hard to update fast enough for quick attacks", "They cannot log events, and cannot send their alerts to a central management console at all", "They use too little memory, and run on too few of the hosts in a network", "They depend on encryption, and fail whenever traffic is sent in the clear"], "w": ["Correct. The tools may not recognize new threats or radical modifications of existing ones, and it is difficult to update schemes rapidly enough.", "Logging and alerting are standard functions of these systems.", "Resource use is not one of the two problems named.", "Encryption hinders these tools; they do not depend on it."], "r": "\u00a78.6 Distributed or Hybrid Intrusion Detection"}, {"id": "8-155", "ch": 8, "sec": "8.6", "q": "In an adaptive, cooperative intrusion detection system, how does a local node share its suspicion of an attack?", "o": ["With a peer-to-peer 'gossip' protocol, as a probability that the network is under attack", "With an IDXP message, as a signed copy of all the audit records that it has gathered so far", "With a broadcast to all hosts, as an instruction to disconnect from the network", "With an e-mail to the operator, as a request to confirm the alert by hand"], "w": ["Correct. If a machine receives enough of these messages that a threshold is exceeded, it assumes an attack is under way and responds.", "IDXP is the exchange protocol from the IETF working group, not the gossip mechanism.", "Disconnecting on local evidence alone risks a false positive.", "The approach is automated among peers."], "r": "\u00a78.6 Distributed or Hybrid Intrusion Detection"}, {"id": "8-159", "ch": 8, "sec": "8.6", "q": "In the autonomic enterprise security architecture, what are DDI events?", "o": ["Alerts generated when the gossip traffic lets a platform conclude that an attack is under way", "Events collected by intermediate points such as firewalls and summarized for the central system", "Events from trusted, self-defending platforms that correlate distributed information", "Policies sent by the central system that adjust the timing of collaborative messages"], "w": ["Correct. DDI stands for distributed detection and inference.", "Those are summary events.", "Those are PEP events, from policy enforcement points.", "Those are collaborative policies, an output of the central system, not an input event."], "r": "\u00a78.6 Distributed or Hybrid Intrusion Detection \u00b7 Figure 8.6"}, {"id": "8-162", "ch": 8, "sec": "8.7", "q": "RFC 4765 describes a data model for information exported by intrusion detection systems, with an implementation in XML. What is it called?", "o": ["The Intrusion Detection Message Exchange Format (IDMEF)", "The Intrusion Detection Exchange Protocol (IDXP)", "The Host Audit Record (HAR) format", "The Security Information and Event Management (SIEM) format"], "w": ["Correct. RFC 4766 gives the requirements for IDMEF, and RFC 4765 describes the data model itself.", "IDXP, in RFC 4767, is the application-level protocol for exchanging the data.", "The HAR is the standardized record format in the UC Davis distributed IDS.", "SIEM is a category of software, not this data model."], "r": "\u00a78.7 Intrusion Detection Exchange Format"}, {"id": "8-163", "ch": 8, "sec": "8.7", "q": "What does the Intrusion Detection Exchange Protocol (IDXP) support?", "o": ["Mutual authentication, integrity, and confidentiality over a connection-oriented protocol", "Anomaly detection, signature matching, and stateful protocol analysis of all network traffic", "Packet capture, protocol decoding, and logging in a compact binary format", "Sensor configuration, data consolidation, and reporting to the operator"], "w": ["Correct. IDXP is an application-level protocol for exchanging data between intrusion detection entities.", "Those are detection techniques, not protocol features.", "Those are functions of Snort components.", "Those are management functions of the manager component."], "r": "\u00a78.7 Intrusion Detection Exchange Format"}, {"id": "8-164", "ch": 8, "sec": "8.7", "q": "In the intrusion detection message exchange model, who is the 'operator'?", "o": ["The human who is the primary user of the IDS manager", "The human who sets the security policy of the organization", "The component that analyzes the data collected by the sensor", "The component that collects data from the data source"], "w": ["Correct. The operator often monitors the output of the IDS and initiates or recommends further action.", "That is the administrator, who also decides on deploying and configuring the IDS.", "That is the analyzer.", "That is the sensor."], "r": "\u00a78.7 Intrusion Detection Exchange Format \u00b7 Figure 8.7"}, {"id": "8-165", "ch": 8, "sec": "8.7", "q": "In the message exchange model of Figure 8.7, what is the sequence when suspicious activity is found?", "o": ["Sensor sends an event to the analyzer, which sends an alert to the manager, which notifies the operator", "Analyzer sends an event to the sensor, which sends an alert to the operator, who notifies the manager", "Manager sends an alert to the sensor, which sends an event to the administrator, who notifies the analyzer", "Operator sends a notification to the manager, which sends an event to the analyzer and then the sensor"], "w": ["Correct. An event characterizes activity within a period of time; if it is of interest, the analyzer sends an alert, and the manager issues a notification.", "The sensor reports to the analyzer, not the other way round.", "The manager receives alerts; it does not start the chain.", "The chain starts at the sensor, not the operator."], "r": "\u00a78.7 Intrusion Detection Exchange Format \u00b7 Figure 8.7"}, {"id": "8-167", "ch": 8, "sec": "8.8", "q": "Which of the following is one of the things honeypots are designed to do?", "o": ["Encourage the attacker to stay long enough for administrators to respond", "Block the attacker's packets at the perimeter before they can be processed", "Patch the vulnerable application that the attacker is trying to exploit", "Encrypt critical data so that the attacker cannot read what is taken"], "w": ["Correct. They are also designed to divert an attacker from critical systems and to collect information about the attacker's activity.", "Blocking is a firewall or IPS function; honeypots let attacks seem to succeed.", "Honeypots do not patch applications.", "Honeypots hold fabricated information; they do not encrypt real data."], "r": "\u00a78.8 Honeypots"}, {"id": "8-168", "ch": 8, "sec": "8.8", "q": "Why is any access to a honeypot considered suspect?", "o": ["It holds fabricated information that a legitimate user of the system would not access", "It is protected by a firewall rule that only the system administrators are able to pass", "It runs a signature-based IDS that has already matched the user's traffic", "It is located outside the network, where no legitimate users are found"], "w": ["Correct. The honeypot is a resource with no production value, so there is no legitimate reason to interact with it.", "No such firewall rule is the reason.", "The suspicion comes from the honeypot having no legitimate use, not from signature matching.", "Honeypots can be deployed outside, in the DMZ, or fully inside the network."], "r": "\u00a78.8 Honeypots"}, {"id": "8-171", "ch": 8, "sec": "8.8", "q": "What is an advantage of a honeypot placed outside the external firewall (location 1 in Figure 8.8)?", "o": ["It does not increase the risk for the internal network", "It can catch attacks that originate from internal users", "It detects a firewall that forwards impermissible traffic", "It needs the firewall to open extra traffic to reach it"], "w": ["Correct. It tracks attempts to connect to unused IP addresses, and reduces alerts from the firewall and internal IDS sensors.", "It has little or no ability to trap internal attackers.", "Detecting a misconfigured firewall is an advantage of a fully internal honeypot.", "Opening up the firewall is a difficulty of the DMZ and internal locations."], "r": "\u00a78.8 Honeypots \u00b7 Figure 8.8"}, {"id": "8-173", "ch": 8, "sec": "8.8", "q": "What is the most serious disadvantage of a fully internal honeypot (location 3 in Figure 8.8)?", "o": ["If it is compromised, it can attack other internal systems", "It cannot catch attacks that are made by internal users", "It attracts so many attacks that firewall alerts increase", "It is unable to detect a firewall that is misconfigured"], "w": ["Correct. Further traffic from the Internet to the attacker is not blocked, because it is regarded as traffic to the honeypot only.", "Catching internal attacks is its most important advantage.", "Reducing alerts is a feature of the external location, and this is not a listed problem.", "It can detect a misconfigured firewall that forwards impermissible traffic."], "r": "\u00a78.8 Honeypots \u00b7 Figure 8.8"}, {"id": "8-174", "ch": 8, "sec": "8.8", "q": "What are honeyfiles?", "o": ["Bait documents with realistic, enticing names that legitimate users should not access", "Log files in which a honeypot records each of the attacker's commands", "Signature files that a honeypot uses to recognize known attack tools", "Configuration files that define which IT services a low-interaction honeypot will emulate"], "w": ["Correct. They emulate legitimate documents, and any access of them is assumed to be suspicious.", "Honeyfiles are bait, not logs.", "Honeyfiles are bait, not signatures.", "Honeyfiles are bait, not configuration."], "r": "\u00a78.8 Honeypots"}, {"id": "8-176", "ch": 8, "sec": "8.9", "q": "A Snort installation consists of which four logical components?", "o": ["Packet decoder, detection engine, logger, and alerter", "Sensor, analyzer, manager, and user interface", "Host agent, LAN monitor, central manager, and filter", "Action, protocol, direction, and options"], "w": ["Correct. These are the four components shown in Figure 8.9.", "These are terms for IDS components in general, not Snort's four.", "These belong to the UC Davis distributed IDS.", "These are parts of a Snort rule, not of the installation."], "r": "\u00a78.9 Snort Architecture \u00b7 Figure 8.9"}, {"id": "8-178", "ch": 8, "sec": "8.9", "q": "In Snort's detection engine, what happens when a packet is checked against the rules?", "o": ["The first rule that matches triggers its action; if none matches, the packet is discarded", "Every rule that matches triggers its action; if none matches, an alert is generated", "The last rule that matches triggers its action; if none matches, the packet is simply logged", "The longest rule that matches triggers its action; if none matches, it is rejected"], "w": ["Correct. The first rule that matches the decoded packet triggers the action specified by that rule.", "Only the first matching rule triggers, and no match means the engine discards the packet.", "It is the first match, not the last.", "Rule length is not the criterion."], "r": "\u00a78.9 Snort Architecture"}, {"id": "8-180", "ch": 8, "sec": "8.9", "q": "Each Snort rule consists of:", "o": ["A fixed header and zero or more options", "A fixed header and exactly one option", "A variable header and a fixed footer", "One or more headers and a signature"], "w": ["Correct. The header holds action, protocol, source address and port, direction, and destination address and port.", "There may be zero or more options, not exactly one.", "The header is fixed, and there is no footer.", "There is one header per rule."], "r": "\u00a78.9 Snort Rules \u00b7 Figure 8.10"}, {"id": "8-181", "ch": 8, "sec": "8.9", "q": "Which Snort rule actions are only available in inline mode?", "o": ["drop, reject, and sdrop", "alert, log, and pass", "activate and dynamic", "log, drop, and pass"], "w": ["Correct. These last three actions in Table 8.2 make iptables drop the packet, so they need Snort to be inline.", "These actions work in passive mode.", "These actions work together in passive mode: one turns on the other.", "Only drop in this list needs inline mode."], "r": "\u00a78.9 Snort Rules \u00b7 Table 8.2"}, {"id": "8-185", "ch": 8, "sec": "8.9", "q": "Which category of Snort rule options provides information about the rule but has no effect during detection?", "o": ["Meta-data", "Payload", "Non-payload", "Post-detection"], "w": ["Correct. Examples are msg, reference, and classtype.", "Payload options look for data inside the packet payload.", "Non-payload options look for non-payload data.", "Post-detection options are rule-specific triggers that happen after a rule has matched."], "r": "\u00a78.9 Snort Rules \u00b7 Table 8.3"}, {"id": "8-186", "ch": 8, "sec": "8.9", "q": "In Table 8.3, what does the Snort rule option 'content' do?", "o": ["Performs a case-sensitive search for specific content in the packet payload", "Defines the message to be sent when a packet generates an event", "Tests the packet payload size in order to check for abnormally sized packets", "Logs the packets that match the rule to the specified filename"], "w": ["Correct. It is a payload option; depth, offset, and nocase modify the previous content keyword.", "That is msg.", "That is dsize.", "That is logto."], "r": "\u00a78.9 Snort Rules \u00b7 Table 8.3"}, {"id": "8-191", "ch": 8, "sec": "8.9", "q": "The chapter's example Snort rule uses 'flags: SF, 12'. What does it check for?", "o": ["That just the SYN and FIN bits are set, ignoring reserved bits 1 and 2", "That the SYN bit is set and the packet is at least 12 bytes in total size", "That the session has been established for more than 12 seconds", "That the source and FIN fields both hold the value 12 in the header"], "w": ["Correct. This detects a type of attack at the TCP level known as a SYN-FIN attack, classed as attempted-recon.", "The 12 refers to reserved bits 1 and 2, not a size.", "The 12 is not a time value.", "SF stands for the SYN and FIN flag bits."], "r": "\u00a78.9 Snort Rules"}, {"id": "9-01", "ch": 9, "sec": "9.1", "q": "A firewall is inserted between the premises network and the Internet primarily to:", "o": ["Establish a controlled link: a single choke point for security and auditing", "Increase the bandwidth available between the premises network and the Internet", "Replace the security software on each internal host with a single device", "Encrypt all data stored on the premises network"], "w": ["Correct. It insulates internal systems from external networks.", "Firewalls don't increase bandwidth.", "Firewalls complement host security; they don't replace it.", "Not a firewall function."], "r": "Ch 9 \u00b7 The Need for Firewalls"}, {"id": "9-02", "ch": 9, "sec": "9.2", "q": "Which is NOT one of the three firewall design goals?", "o": ["The firewall must decrypt all traffic for inspection", "All traffic from inside to outside, and vice versa, must pass through the firewall", "Only authorized traffic, as defined by the local security policy, will be allowed to pass", "The firewall itself is immune to penetration"], "w": ["Correct. Decrypting all traffic is not a design goal.", "All traffic passing through the firewall IS one of the three design goals.", "Allowing only policy-authorized traffic IS one of the three design goals.", "The firewall being immune to penetration IS one of the three design goals."], "r": "Ch 9 \u00b7 Firewall Characteristics"}, {"id": "9-03", "ch": 9, "sec": "9.2", "q": "From what should a firewall access policy be developed?", "o": ["The organization's security risk assessment and policy, refined into filter elements", "The vendor's default configuration, adjusted only when problems arise", "The preferences of users about which applications they want to reach", "The ISP's routing table for the organization's address ranges"], "w": ["Correct. The policy lists the authorized traffic types: address ranges, protocols, applications, and content types.", "Not the stated basis.", "Not the stated basis.", "Not the stated basis."], "r": "Ch 9 \u00b7 Firewall Access Policy"}, {"id": "9-04", "ch": 9, "sec": "9.2", "q": "Filtering traffic on IP address and protocol values is typically used by which firewall types?", "o": ["Packet filter and stateful inspection firewalls", "Application-level gateways only, which relay specific application protocols", "Circuit-level gateways only, which relay TCP segments between connections", "Personal firewalls only, which run on individual workstations"], "w": ["Correct. This filtering is typically used to limit access to specific services.", "Application-level gateways filter on APPLICATION PROTOCOL.", "Not the stated type.", "Not the stated type."], "r": "Ch 9 \u00b7 Firewall Filter Characteristics"}, {"id": "9-05", "ch": 9, "sec": "9.2", "q": "A firewall policy that controls access based on the time of request, rate of requests, or other activity patterns filters on:", "o": ["Network activity", "User identity", "Application protocol", "IP address and protocol values"], "w": ["Correct. This is network activity filtering.", "User identity filtering is for inside users who authenticate with secure technology.", "Application protocol filtering is used by application-level gateways.", "Address and protocol filtering is used by packet filters."], "r": "Ch 9 \u00b7 Firewall Filter Characteristics"}, {"id": "9-06", "ch": 9, "sec": "9.2", "q": "Which is listed as a firewall CAPABILITY?", "o": ["It can serve as the platform for IPsec", "It protects against attacks that bypass the firewall", "It fully protects against internal threats", "It prevents infected laptops from being used internally"], "w": ["Correct. Firewalls also define a single choke point, provide a location for monitoring security events, and host several non-security Internet functions.", "This is a LIMITATION: attacks that bypass the firewall aren't stopped.", "This is a LIMITATION: firewalls may not fully protect against internal threats.", "This is a LIMITATION: devices infected outside can be brought inside."], "r": "Ch 9 \u00b7 Firewall Capabilities and Limits"}, {"id": "9-07", "ch": 9, "sec": "9.2", "q": "Which is a LIMITATION of firewalls?", "o": ["An improperly secured wireless LAN can be accessed from outside the organization", "They define a single choke point that all traffic must pass through", "They provide a location for monitoring security-related events", "They can host several Internet functions that are not security related"], "w": ["Correct. Wireless access can bypass the perimeter.", "This is a capability.", "This is a capability.", "This is a capability."], "r": "Ch 9 \u00b7 Firewall Capabilities and Limits"}, {"id": "9-08", "ch": 9, "sec": "9.3", "q": "A packet filtering firewall:", "o": ["Applies rules from IP and TCP header fields to forward or discard each packet", "Relays application-level traffic after authenticating each user", "Sets up two TCP connections and relays segments between them", "Reassembles application payloads for deep content inspection"], "w": ["Correct. This is a packet filtering firewall.", "That's an application-level gateway.", "That's a circuit-level gateway.", "Not a basic packet filter."], "r": "Ch 9 \u00b7 Packet Filtering Firewall"}, {"id": "9-09", "ch": 9, "sec": "9.3", "q": "Packet filtering rules are based on information in the network packet. Which is NOT among them?", "o": ["The user's password", "Source IP address", "Source and destination transport-level address (port)", "IP protocol field"], "w": ["Correct. Packet filters don't see user credentials. The listed fields are source IP, destination IP, source and destination transport-level address, IP protocol field, and interface.", "Source IP address IS one of the listed fields.", "Transport-level addresses (ports) ARE among the listed fields.", "The IP protocol field IS one of the listed fields."], "r": "Ch 9 \u00b7 Packet Filtering Firewall"}, {"id": "9-10", "ch": 9, "sec": "9.3", "q": "Which default packet-filter policy is described as more conservative, controlled, and visible to users?", "o": ["Discard: prohibit unless expressly permitted", "Forward: permit unless expressly prohibited", "Log only", "Pass all"], "w": ["Correct. This relates to fail-safe defaults (Ch 1).", "Forward is easier to manage and use but less secure.", "Not a listed default policy.", "Not a listed default policy."], "r": "Ch 9 \u00b7 Packet Filtering Firewall"}, {"id": "9-11", "ch": 9, "sec": "9.3", "q": "The 'forward' default policy (permit unless expressly prohibited) is:", "o": ["Easier to manage and use, but less secure", "More secure and more conservative", "Required by all standards", "Identical to discard"], "w": ["Correct. This is the forward policy's trade-off.", "That's the discard policy.", "Not stated.", "They're opposites."], "r": "Ch 9 \u00b7 Packet Filtering Firewall"}, {"id": "9-12", "ch": 9, "sec": "9.3", "q": "In Table 9.1, rule 1 permits inbound TCP from external to internal destination port 25. What service does this allow?", "o": ["Inbound SMTP (e-mail) to internal hosts", "Inbound Web (HTTP) to internal servers", "Outbound DNS", "All traffic"], "w": ["Correct. Port 25 is SMTP.", "HTTP is port 80.", "Rule 1 is inbound TCP, not outbound DNS.", "Rule 5 is the catch-all, and it denies."], "r": "Ch 9 \u00b7 Table 9.1"}, {"id": "9-13", "ch": 9, "sec": "9.3", "q": "In Table 9.1, what does rule 5 (Either, Any, Any, Any, Any, Deny) implement?", "o": ["A default discard policy: anything not matched by earlier rules is denied", "A default forward policy: anything not matched is permitted", "Logging of all traffic that reaches the firewall", "Permitting all outbound traffic from internal hosts"], "w": ["Correct. This is the explicit default-deny rule.", "It denies.", "Not logging.", "It denies."], "r": "Ch 9 \u00b7 Table 9.1"}, {"id": "9-14", "ch": 9, "sec": "9.3", "q": "Which is an ADVANTAGE of packet filter firewalls?", "o": ["Simplicity, and they are typically transparent to users and very fast", "Advanced user authentication for each connection", "Extensive logging of application-level activity", "Prevention of attacks on application-specific vulnerabilities"], "w": ["Correct. These are the stated advantages.", "This is a weakness: they do NOT support advanced user authentication.", "This is a weakness: they have LIMITED logging functionality.", "This is a weakness: they CANNOT prevent application-specific attacks."], "r": "Ch 9 \u00b7 Packet Filter Advantages and Weaknesses"}, {"id": "9-15", "ch": 9, "sec": "9.3", "q": "Which is a WEAKNESS of packet filter firewalls?", "o": ["They are vulnerable to TCP/IP protocol bugs, and misconfiguration causes breaches", "They are slow, because every packet must be relayed by a proxy", "They are not transparent to users, who must configure each application", "They require proxy code for each application they support"], "w": ["Correct. Other weaknesses are no defense against application-specific vulnerabilities, limited logging, and no advanced user authentication.", "They are very fast.", "They are typically transparent.", "Proxy code per application is an application-level gateway trait."], "r": "Ch 9 \u00b7 Packet Filter Advantages and Weaknesses"}, {"id": "9-16", "ch": 9, "sec": "9.4", "q": "A stateful inspection firewall tightens rules for TCP traffic by:", "o": ["Keeping a directory of outbound connections and admitting only matching replies", "Relaying all of the application data through a proxy for each protocol it permits", "Blocking all TCP traffic to high-numbered ports from outside", "Requiring user authentication for every incoming packet"], "w": ["Correct. It also tracks TCP sequence numbers and inspects data for protocols such as FTP, IM, and SIPS commands.", "That's an application-level gateway.", "Not true.", "Not true."], "r": "Ch 9 \u00b7 Stateful Inspection Firewall"}, {"id": "9-17", "ch": 9, "sec": "9.4", "q": "Why does a stateful inspection firewall keep track of TCP sequence numbers?", "o": ["To prevent attacks that depend on the sequence number", "To speed up routing of packets within established connections", "To assign IP addresses to internal hosts as connections open", "To encrypt traffic on established TCP connections"], "w": ["Correct. This is the stated reason.", "Not the reason.", "Not the reason.", "Not the reason."], "r": "Ch 9 \u00b7 Stateful Inspection Firewall"}, {"id": "9-18", "ch": 9, "sec": "9.4", "q": "Table 9.2 is an example of what?", "o": ["A stateful firewall's connection state table", "A packet filter rule set listing permitted and denied services", "A Snort rule set listing alert and drop actions", "An access control list for files on a server"], "w": ["Correct. Each entry records the source and destination addresses and ports and the connection state.", "That's Table 9.1.", "That's Table 8.2.", "That's Ch 4."], "r": "Ch 9 \u00b7 Table 9.2"}, {"id": "9-19", "ch": 9, "sec": "9.5", "q": "An application-level gateway is also called a(n):", "o": ["Application proxy", "Circuit-level proxy", "Screening router", "Bastion host"], "w": ["Correct. It acts as a relay of application-level traffic.", "A circuit-level proxy is a different gateway type.", "A screening router is a topology with a packet filter.", "A bastion host is the platform a gateway runs on."], "r": "Ch 9 \u00b7 Application-Level Gateway"}, {"id": "9-20", "ch": 9, "sec": "9.5", "q": "How does an application-level gateway operate?", "o": ["It authenticates the user, then relays application traffic to the remote host", "It filters packets solely on the information in IP and TCP headers", "It relays TCP segments between two connections without examining contents", "It only logs application traffic for later analysis by administrators"], "w": ["Correct. It must have proxy code for each application.", "That's a packet filter.", "That's a circuit-level gateway.", "Not this."], "r": "Ch 9 \u00b7 Application-Level Gateway"}, {"id": "9-21", "ch": 9, "sec": "9.5", "q": "Compared to packet filters, application-level gateways:", "o": ["Tend to be more secure, but add processing overhead on each connection", "Are less secure but faster, since they examine less of each packet", "Need no proxy code, since they work for any application protocol", "Cannot authenticate users, since they operate below the application"], "w": ["Correct. This is the stated trade-off.", "It's the reverse.", "They need proxy code for each application.", "They authenticate users."], "r": "Ch 9 \u00b7 Application-Level Gateway"}, {"id": "9-22", "ch": 9, "sec": "9.5", "q": "An application-level gateway may restrict which application features are supported because:", "o": ["It needs proxy code per application, which can limit features", "It has no knowledge of the applications whose traffic it relays", "It operates only at the IP layer, below the application features", "It is a hardware device that cannot be updated for new features"], "w": ["Correct. The proxy code for each application can restrict features.", "It does know the application.", "It operates at the application level.", "Not the reason."], "r": "Ch 9 \u00b7 Application-Level Gateway"}, {"id": "9-23", "ch": 9, "sec": "9.6", "q": "A circuit-level gateway:", "o": ["Sets up two TCP connections and relays segments without examining contents", "Inspects application payloads in detail for each supported protocol", "Filters packets on IP and TCP headers only, without setting up connections", "Is a type of honeypot that relays attacker traffic for analysis"], "w": ["Correct. Its security function consists of determining which connections will be allowed.", "That's an application-level gateway.", "That's a packet filter.", "Not related."], "r": "Ch 9 \u00b7 Circuit-Level Gateway"}, {"id": "9-24", "ch": 9, "sec": "9.6", "q": "When is a circuit-level gateway typically used?", "o": ["When inside users are trusted, typically for outbound connections", "When no inside users are trusted, so every connection must be inspected", "Only for inbound e-mail delivered to internal mail servers", "Only on personal computers that connect directly to the Internet"], "w": ["Correct. This is the typical use.", "It's the opposite.", "Not stated.", "Not stated."], "r": "Ch 9 \u00b7 Circuit-Level Gateway"}, {"id": "9-25", "ch": 9, "sec": "9.6", "q": "What does the security function of a circuit-level gateway consist of?", "o": ["Determining which connections will be allowed", "Scanning payloads for malware", "Authenticating every packet with a MAC", "Rewriting application data"], "w": ["Correct. This is its security function.", "It doesn't examine contents.", "Not stated.", "Not stated."], "r": "Ch 9 \u00b7 Circuit-Level Gateway"}, {"id": "9-26", "ch": 9, "sec": "9.7", "q": "A system identified as a critical strong point in the network's security, serving as the platform for application-level or circuit-level gateways, is a:", "o": ["Bastion host", "Honeypot", "Screening router", "Personal firewall"], "w": ["Correct. This is a bastion host.", "A honeypot is a decoy.", "A screening router is a single router with packet filtering.", "A personal firewall protects one PC."], "r": "Ch 9 \u00b7 Bastion Hosts"}, {"id": "9-27", "ch": 9, "sec": "9.7", "q": "Which is a common characteristic of a bastion host?", "o": ["Each proxy is small, simple, checked for security, independent, and non-privileged", "It runs every available service so that
